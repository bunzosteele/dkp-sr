function ivSelect(level, v) {
  if (level === 'raid') _iv = { raid: v, boss: Object.keys(glossary.raids[v] || {})[0] || '', item: '' };
  else if (level === 'boss') { _iv.boss = v; _iv.item = ''; }
  else _iv.item = v;
  _urlSetParam('item', _iv.item);
  renderItemsPanel();
  if (level === 'item' && window.innerWidth < 900) document.getElementById('ivDetail')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
// Jump straight to an item (search, links): open the raid/boss it drops from
function ivOpenItem(key) {
  if (!glossary.items[key]) return;
  const src = itemSources(key).find(s => s.raid === _iv.raid) || itemSources(key)[0];
  if (src) { _iv.raid = src.raid; _iv.boss = src.boss; }
  ivSelect('item', key);
}

// Everyone whose next roll on this item is boosted, highest roll first
function blpHoldersFor(itemKey) {
  if (!srRules.blp.enabled) return [];
  return Object.entries(derived().blp.losses).map(([pk, m]) => ({ pk, losses: m[itemKey] || 0 })).filter(x => x.losses > 0)
    .map(x => ({ ...x, name: rosterPlayer(x.pk)?.name || x.pk, roll: rollMax(x.losses) }))
    .sort((a, b) => b.roll - a.roll || a.name.localeCompare(b.name));
}
// One row per raid where the item was reserved or handed out, newest first
function itemHistory(itemKey) {
  const { before, outcome } = derived().blp;
  const rows = [];
  for (const r of sortedRaids()) {
    const res = raidReserves(r);
    const reservers = Object.entries(res).filter(([, m]) => m[itemKey]).map(([pk, m]) => {
      const name = rosterPlayer(pk)?.name || r.softres.map(s => effectiveReserves(s)[pk]?.name).find(Boolean) || pk;
      const losses = before[r.id]?.[pk]?.[itemKey] || 0;
      return { pk, name, count: m[itemKey], roll: rollFor(r, pk, itemKey).max, outcome: outcome[r.id]?.[pk]?.[itemKey] || (r.status === 'active' ? 'pending' : 'nodrop') };
    }).sort((a, b) => b.roll - a.roll || a.name.localeCompare(b.name));
    const loot = r.loot.filter(l => l.itemKey === itemKey);
    if (reservers.length || loot.length) rows.push({ raid: r, reservers, loot });
  }
  return rows.reverse();
}

function renderItemsPanel() {
  const panel = document.getElementById('itemsPanel'); if (!panel) return;
  const raids = Object.keys(glossary.raids);
  if (!raids.length) { panel.innerHTML = '<div class="empty"><div class="icon">⚔</div><div>No items yet.</div></div>'; return; }
  if (_iv.item && !glossary.items[_iv.item]) _iv.item = '';
  if (_iv.item && !(glossary.raids[_iv.raid]?.[_iv.boss] || []).includes(_iv.item)) {
    const src = itemSources(_iv.item)[0]; if (src) { _iv.raid = src.raid; _iv.boss = src.boss; }
  }
  if (!raids.includes(_iv.raid)) _iv = { raid: raids[0], boss: '', item: _iv.item };
  const bosses = Object.keys(glossary.raids[_iv.raid] || {});
  if (!bosses.includes(_iv.boss)) _iv.boss = bosses[0] || '';
  const bossItems = glossary.raids[_iv.raid]?.[_iv.boss] || [];

  // Badges for the item list: how many raiders hold BLP on it, and how often it's dropped
  const blpCount = {}, dropped = {};
  for (const m of Object.values(derived().blp.losses)) for (const [k, n] of Object.entries(m)) if (n > 0) blpCount[k] = (blpCount[k] || 0) + 1;
  for (const r of raidsData.raids) for (const l of r.loot) dropped[l.itemKey] = (dropped[l.itemKey] || 0) + 1;
  const srCount = {}; // every SR ever placed on the item (double reserves count twice)
  for (const r of raidsData.raids) for (const m of Object.values(raidReserves(r))) for (const [k, n] of Object.entries(m)) srCount[k] = (srCount[k] || 0) + n;
  const items = _ivSort === 'table' ? bossItems
    : [...bossItems].sort((a, b) => (_ivSort === 'srs' ? (srCount[b] || 0) - (srCount[a] || 0) : 0) || itemName(a).localeCompare(itemName(b)));
  const opt = (vals, cur) => vals.map(x => `<option value="${escHtml(x)}" ${x === cur ? 'selected' : ''}>${escHtml(x)}</option>`).join('');

  panel.innerHTML = `
    <div class="iv-top">
      <div class="loot-select-group" style="flex:1.3;position:relative;"><label class="loot-select-label">Search all items</label><div id="ivSearch" style="position:relative;"></div></div>
      <div class="loot-select-group"><label class="loot-select-label">Raid</label>
        <select class="loot-select" onchange="ivSelect('raid', this.value)">${opt(raids, _iv.raid)}</select></div>
      <div class="loot-select-group"><label class="loot-select-label">Boss</label>
        <select class="loot-select" onchange="ivSelect('boss', this.value)">${opt(bosses, _iv.boss)}</select></div>
    </div>
    <div class="iv-grid">
      <div class="iv-col">
      <div class="iv-sort"><span>Sort</span>${[['srs', 'Most reserved'], ['table', 'Loot table'], ['name', 'A–Z']].map(([v, l]) =>
        `<button class="${_ivSort === v ? 'on' : ''}" onclick="_ivSort='${v}';renderItemsPanel()">${l}</button>`).join('')}</div>
      <div class="iv-list">${items.length ? items.map(k => {
        const it = glossary.items[k] || {};
        return `<div class="iv-row${k === _iv.item ? ' selected' : ''}" onclick="ivSelect('item','${jsAttr(k)}')">
          ${itemIconSmall(k)}<span class="iv-row-name">${escHtml(itemName(k))}${it.slot ? `<span class="iv-row-slot">${escHtml(it.slot)}</span>` : ''}</span>
          ${blpCount[k] ? `<span class="iv-badge blp" title="${blpCount[k]} raider${blpCount[k] === 1 ? ' has' : 's have'} bad luck protection on this item">▲ ${blpCount[k]}</span>` : ''}
          ${srCount[k] ? `<span class="iv-badge sr" title="${srCount[k]} SR${srCount[k] === 1 ? '' : 's'} placed on this item">★ ${srCount[k]}</span>` : ''}
          ${dropped[k] ? `<span class="iv-badge" title="Dropped ${dropped[k]}×">${dropped[k]}×</span>` : ''}</div>`;
      }).join('') : '<div class="gl-empty">No items for this boss.</div>'}</div></div>
      <div class="iv-detail" id="ivDetail">${_iv.item ? itemDetailHtml(_iv.item) : '<p class="gl-empty">Pick an item to see its SR history and who has bad luck protection on it.</p>'}</div>
    </div>`;

  const vals = Object.entries(glossary.items).map(([k, it]) => ({ value: k, label: it.name })).sort((a, b) => a.label.localeCompare(b.label));
  buildAutocomplete({ container: document.getElementById('ivSearch'), inputId: 'ivSearchIn', placeholder: 'Item name…', items: vals,
    renderOption: v => `<span style="display:inline-flex;align-items:center;gap:8px;">${itemIconSmall(v.value)}${escHtml(v.label)}</span>`,
    onSelect: v => ivOpenItem(v.value) });
  refreshWowhead(100);
}

function itemDetailHtml(key) {
  const it = glossary.items[key] || { eligibleClasses: [] };
  const classes = it.eligibleClasses || [];
  const srcs = itemSources(key);
  const hist = itemHistory(key);
  const holders = blpHoldersFor(key);
  const drops = hist.reduce((a, h) => a + h.loot.length, 0);
  const srWins = hist.reduce((a, h) => a + h.loot.filter(l => l.sr).length, 0);
  const reserves = hist.reduce((a, h) => a + h.reservers.reduce((x, r) => x + r.count, 0), 0);

  const blpHtml = !srRules.blp.enabled ? '<div class="gl-empty">Bad luck protection is turned off in the SR rules.</div>'
    : holders.length ? `<div class="iv-blp">${holders.map(h => `<div class="iv-blp-row">
        <span class="iv-blp-name">${playerNameHtml(h.name)}</span>
        <span class="blp-boost">/roll 1–${h.roll}</span>
        <span class="iv-dim">lost ${h.losses} SR roll${h.losses === 1 ? '' : 's'}</span></div>`).join('')}</div>`
    : '<div class="gl-empty">No one has bad luck protection on this item.</div>';

  const histHtml = hist.length ? `<div style="overflow-x:auto;"><table class="mini-table iv-hist"><thead><tr><th>Raid</th><th>Reserved by</th><th>Went to</th></tr></thead><tbody>${hist.map(h => `<tr>
      <td class="iv-when"><a onclick="openRaid('${h.raid.id}')">${fmtShort(h.raid.date)}</a><span class="iv-dim">${escHtml(h.raid.name)}${h.raid.optional ? ' · optional' : ''}${h.raid.status === 'active' ? ' · <span style="color:var(--gold);">active</span>' : ''}</span></td>
      <td>${h.reservers.length ? `<div class="iv-res">${h.reservers.map(r => {
          const [lab, col] = OUTCOME_LABEL[r.outcome] || [r.outcome, 'var(--text-dim)'];
          return `<span class="iv-res-chip">${playerNameHtml(r.name)}${r.count > 1 ? ` <span class="sr-multi">×${r.count}</span>` : ''}
            <span class="${r.roll > 100 ? 'blp-boost' : 'iv-dim'}">1–${r.roll}</span> <span style="color:${col};">${lab}</span></span>`;
        }).join('')}</div>` : '<span class="iv-dim">—</span>'}</td>
      <td>${h.loot.length ? h.loot.map(l => `<div>${playerNameHtml(l.recipient)} <span class="iv-tag ${l.sr ? 'sr' : ''}">${l.sr ? 'SR' : 'MS &gt; OS'}</span></div>`).join('')
        : `<span class="iv-dim">${h.raid.status === 'active' ? 'not yet' : 'didn\'t drop'}</span>`}</td>
    </tr>`).join('')}</tbody></table></div>`
    : '<div class="gl-empty">No one has reserved or received this item yet.</div>';

  return `<div class="iv-head">
      <div class="iv-title">${itemLinkHtml(key)}</div>
      <div class="iv-sub">${classes.length ? classes.map(c => `<span style="color:${CLASS_COLORS[c]};">${c}</span>`).join(' · ') : 'All classes'}${it.slot ? ` · ${escHtml(it.slot)}` : ''}${it.armorType ? ` · ${escHtml(it.armorType)}` : ''}</div>
      <div class="iv-sub iv-dim">Drops from ${srcs.map(s => `${escHtml(s.raid)} → ${escHtml(s.boss)}`).join(', ') || '—'}</div>
      ${it.notes ? `<div class="iv-sub iv-dim" style="font-style:italic;">${escHtml(it.notes)}</div>` : ''}
    </div>
    <div class="iv-stats">
      <div><b>${reserves}</b><span>SR${reserves === 1 ? '' : 's'} placed</span></div>
      <div><b>${drops}</b><span>dropped</span></div>
      <div><b>${srWins}</b><span>won via SR</span></div>
      <div><b>${holders.length}</b><span>with BLP</span></div>
    </div>
    <div class="expand-section-title">Bad Luck Protection</div>
    ${blpHtml}
    <div class="expand-section-title" style="margin-top:18px;">SR History</div>
    ${histHtml}`;
}

// ═════════════════════════════════════════════════════════════════════════════
// Roster page: AKAs (in each raider's dropdown) + the unrecognised-names inbox (bottom)
// Every name seen in softres sheets, Warcraft Logs, the loot log and Gargul exports that doesn't
// resolve to a raider lands in the inbox. Assigning it adds an AKA to that raider, which is
// retroactive: past reserves, attendance and loot are re-attributed, so each change is
// previewed (SR balances, raids, loot, bad luck items) before it's saved.
// ═════════════════════════════════════════════════════════════════════════════
let _rd = { focus: '', creating: '' };
const RD_SOURCE_LABEL = { softres: 'Softres', wcl: 'Warcraft Logs', loot: 'Loot log', gargul: 'Gargul export', raidhelper: 'Raid-Helper' };

function openRaidersInbox(name) {
  _rd.focus = normalizeName(baseName(name || ''));
  setGrouping('roster');
}
function notOnRosterTag(name) {
  if (!writeToken) return '';
  return ` <a class="tag-warn rd-link" onclick="event.stopPropagation();openRaidersInbox('${jsAttr(name)}')" title="Sort it out on the Roster page">not on roster</a>`;
}

function updateRaidersBadge() {
  const n = writeToken ? unrecognizedNames().length : 0;
  const set = (el, cls) => {
    if (!el) return;
    let b = el.querySelector('.' + cls);
    if (!n) { b?.remove(); return; }
    if (!b) { b = document.createElement('span'); b.className = 'nav-count ' + cls; el.appendChild(b); }
    b.textContent = n; b.title = `${n} unrecognised name${n === 1 ? '' : 's'}`;
  };
  set(document.getElementById('navDdGuildMgmtBtn'), 'rd-badge-btn');
  set(document.querySelector('#navDdGuildMgmtMenu [data-mode="roster"]'), 'rd-badge-item');
}

// "Also known as" block for a raider's dropdown on the Roster page
function akaEditorHtml(key) {
  const p = rosterPlayer(key); if (!p) return '';
  const akas = (p.aliases || []).map(aliasValue).filter(Boolean);
  return `<div class="expand-section-title" style="margin-top:14px;">Also known as</div>
    <div class="rd-aliases">
      ${akas.map((v, i) => `<span class="rd-alias" title="${isDiscordId(v) ? 'Discord ID' : 'Matches this name on softres, Warcraft Logs, the loot log and Gargul (realm suffixes ignored)'}">${isDiscordId(v) ? '<span class="rd-alias-type">Discord</span>' : ''}${escHtml(v)}<button class="x-btn" onclick="event.stopPropagation();rdRemoveAlias('${key}',${i})" title="Remove">✕</button></span>`).join('')}
      <span class="rd-add-alias"><input id="rdAv_${key}" class="gl-input" placeholder="Alt, spelling or Discord ID" onclick="event.stopPropagation()" onkeydown="if(event.key==='Enter')rdAddAlias('${key}')"><button class="ghost-btn" onclick="event.stopPropagation();rdAddAlias('${key}')">Add</button></span>
    </div>`;
}

// Inbox card at the bottom of the Roster page
function raidersInboxHtml() {
  const inbox = unrecognizedNames();
  const ignored = rosterData.excluded || [];
  if (!inbox.length && !ignored.length) return '';
  const roleSel = (id, cur) => `<select id="${id}" class="roster-edit-sel" onchange="rdRoleChanged('${id}')">${ROLE_ORDER.map(r => `<option ${r === cur ? 'selected' : ''}>${r}</option>`).join('')}</select>`;
  const clsSel = (id, role, cur) => `<select id="${id}" class="roster-edit-sel">${(ROLE_CLASSES[role] || CLASSES).map(c => `<option ${c === cur ? 'selected' : ''}>${c}</option>`).join('')}</select>`;
  const seenHtml = e => Object.entries(e.seen).map(([src, raids]) => `<span class="rd-seen">${RD_SOURCE_LABEL[src] || src} · ${raids.size} raid${raids.size === 1 ? '' : 's'}</span>`).join('');
  const rows = inbox.map(e => `<tr id="rdi_${e.key}" class="${_rd.focus === e.key ? 'rd-focus' : ''}">
      <td class="rd-name">${escHtml(e.name)}</td>
      <td><div class="rd-seen-list">${seenHtml(e)}</div></td>
      <td><div class="rd-actions">
        ${e.suggest.map(k => `<button class="small-gold-btn" onclick="rdAssign('${e.key}','${k}')" title="Add “${escHtml(e.name)}” as an AKA of ${escHtml(rosterPlayer(k)?.name || k)}">→ ${escHtml(rosterPlayer(k)?.name || k)}</button>`).join('')}
        <span class="rd-assign"><span id="rdAc_${e.key}" class="rd-ac"></span><button class="ghost-btn" onclick="rdAssign('${e.key}')">Assign</button></span>
        <button class="ghost-btn" onclick="_rd.creating=_rd.creating==='${e.key}'?'':'${e.key}';renderRosterPanel()">New raider…</button>
        <button class="ghost-btn" onclick="rdIgnore('${e.key}')" title="Not a raider (a pug, a typo…) — stop listing it">Ignore</button>
      </div></td></tr>
      ${_rd.creating === e.key ? `<tr class="rd-create"><td colspan="3"><div class="rd-create-row">
        <input id="rdcName" class="gl-input" value="${escHtml(e.name)}" placeholder="Raider name (First Last)" style="width:220px;">
        ${roleSel('rdcRole', e.role || 'Ranged DPS')}${clsSel('rdcClass', e.role || 'Ranged DPS', e.cls)}
        <label class="chk"><input type="checkbox" id="rdcAlt"> Alt</label>
        <button class="small-gold-btn" onclick="rdCreate('${e.key}')">CREATE</button>
        <span class="iv-dim">If the name differs, “${escHtml(e.name)}” is kept as an AKA.</span></div></td></tr>` : ''}`).join('');
  return `<div class="sheet-card rd-inbox" id="rdInbox">
    <div class="gl-col-title">Unrecognised names ${inbox.length ? `<span class="nav-count">${inbox.length}</span>` : ''}</div>
    <div class="iv-dim" style="margin-bottom:8px;">From softres sheets, Warcraft Logs, the loot log, Gargul exports and Raid-Helper. Assigning a name adds it to that raider's AKAs for every raid, past ones included — you'll see what changes before it's saved.</div>
    ${inbox.length ? `<div style="overflow-x:auto;"><table class="mini-table rd-table"><tbody>${rows}</tbody></table></div>` : '<div class="gl-empty">Every name matches a raider.</div>'}
    ${ignored.length ? `<details class="rd-ignored"><summary class="subtle-link">Ignored names (${ignored.length})</summary><div class="rd-aliases" style="margin-top:8px;">
      ${ignored.map((n, i) => `<span class="rd-alias">${escHtml(n)}<button class="x-btn" onclick="rdUnignore(${i})" title="Stop ignoring">↩</button></span>`).join('')}</div></details>` : ''}
  </div>`;
}
// Called after the Roster page is drawn: autocompletes + scroll to a focused name
function wireRaidersInbox() {
  for (const e of unrecognizedNames()) {
    const c = document.getElementById('rdAc_' + e.key);
    if (c) buildAutocomplete({ container: c, inputId: 'rdAcIn_' + e.key, placeholder: 'Raider…', items: rosterData.players.map(p => ({ value: normalizeName(p.name), label: p.name })).sort((a, b) => a.label.localeCompare(b.label)), renderOption: v => playerNameHtml(v.label) });
  }
  if (_rd.focus) {
    const row = document.getElementById('rdi_' + _rd.focus) || document.getElementById('rdInbox');
    if (row) requestAnimationFrame(() => row.scrollIntoView({ block: 'center', behavior: 'smooth' }));
    _rd.focus = '';
  }
}
function rdRoleChanged(id) {
  const role = document.getElementById(id)?.value;
  const el = document.getElementById(id.replace('Role', 'Class')); if (!el) return;
  const cur = el.value;
  el.innerHTML = (ROLE_CLASSES[role] || CLASSES).map(c => `<option ${c === cur ? 'selected' : ''}>${c}</option>`).join('');
}

// Apply a roster change after showing what it does to past raids. Returns true if saved.
async function _rdCommit(mutate, what, reopen) {
  let lines;
  try { lines = previewRosterChange(mutate); } catch (e) { flash(e.message, 'error'); return false; }
  if (lines.length && !confirm(`${what}\n\nThis changes past raids:\n• ${lines.join('\n• ')}\n\nSave?`)) return false;
  mutate();
  rebuildClassMap();
  await saveRosterToGitHub();
  refreshAll();
  if (reopen) _reopenRosterRow(reopen);
  flash(lines.length ? `${what} — ${lines.length} raider${lines.length === 1 ? '' : 's'} updated` : what);
  return true;
}
// Redrawing the Roster page closes dropdowns; reopen the raider being edited
function _reopenRosterRow(name) {
  if (groupingMode !== 'roster') return;
  const td = [...document.querySelectorAll('#rosterPanel td.player-name')].find(t => t.getAttribute('onclick')?.includes(`'${jsAttr(name)}'`));
  if (td) { td.click(); requestAnimationFrame(() => document.getElementById('rdAv_' + normalizeName(name))?.focus()); }
}
function _rdEntry(key) { return unrecognizedNames().find(e => e.key === key); }
function _addAlias(p, value) {
  const v = String(value).trim();
  p.aliases = (p.aliases || []).map(aliasValue).filter(Boolean);
  const same = a => isDiscordId(v) ? a === v : normalizeName(baseName(a)) === normalizeName(baseName(v));
  if (!p.aliases.some(same)) p.aliases.push(v);
}

async function rdAssign(nameKey, playerKey) {
  const e = _rdEntry(nameKey); if (!e) return;
  playerKey ||= document.getElementById('rdAcIn_' + nameKey)?.dataset.value;
  if (!playerKey || !rosterPlayer(playerKey)) { flash('Pick a raider from the list first.', 'error'); return; }
  const who = rosterPlayer(playerKey).name;
  await _rdCommit(() => { const p = rosterPlayer(playerKey); _addAlias(p, e.name); for (const id of e.discordIds || []) _addAlias(p, id); }, `“${e.name}” is now an AKA of ${who}${e.discordIds?.size ? ' (with their Discord ID)' : ''}`);
}
async function rdCreate(nameKey) {
  const e = _rdEntry(nameKey); if (!e) return;
  const name = document.getElementById('rdcName')?.value.trim(), role = document.getElementById('rdcRole')?.value, cls = document.getElementById('rdcClass')?.value;
  const isAlt = !!document.getElementById('rdcAlt')?.checked;
  if (!name || !role || !cls) { flash('Name, role and class are needed.', 'error'); return; }
  if (rosterPlayer(normalizeName(name))) { flash(`${name} is already a raider — assign the name to them instead.`, 'error'); return; }
  const ok = await _rdCommit(() => {
    const p = { name, role, class: cls, isAlt, addedAt: todayMST(), aliases: [] };
    if (normalizeName(baseName(e.name)) !== normalizeName(name)) _addAlias(p, e.name);
    for (const id of e.discordIds || []) _addAlias(p, id);
    rosterData.players.push(p);
  }, `Added raider ${name}`);
  if (ok) _rd.creating = '';
}
async function rdIgnore(nameKey) {
  const e = _rdEntry(nameKey); if (!e) return;
  rosterData.excluded ||= [];
  if (!rosterData.excluded.includes(e.name)) rosterData.excluded.push(e.name);
  for (const id of e.discordIds || []) if (!rosterData.excluded.includes(id)) rosterData.excluded.push(id);
  await saveRosterToGitHub(); refreshAll();
}
async function rdUnignore(i) {
  rosterData.excluded?.splice(i, 1);
  await saveRosterToGitHub(); refreshAll();
}
async function rdAddAlias(playerKey) {
  const p = rosterPlayer(playerKey); if (!p) return;
  const value = document.getElementById('rdAv_' + playerKey)?.value.trim();
  if (!value) return;
  if (!isDiscordId(value)) {
    const owner = rosterPlayer(normalizeName(baseName(value)));
    if (owner && owner !== p) { flash(`${value} is another raider's name.`, 'error'); return; }
  }
  const nv = isDiscordId(value) ? value : normalizeName(baseName(value));
  const taken = rosterData.players.find(o => o !== p && (o.aliases || []).map(aliasValue).some(a => (isDiscordId(a) ? a : normalizeName(baseName(a))) === nv));
  if (taken) { flash(`${value} is already an AKA of ${taken.name}.`, 'error'); return; }
  await _rdCommit(() => _addAlias(rosterPlayer(playerKey), value), `${p.name} is also known as “${value}”`, p.name);
}
async function rdRemoveAlias(playerKey, i) {
  const p = rosterPlayer(playerKey), v = aliasValue(p?.aliases?.[i]); if (!v) return;
  await _rdCommit(() => rosterPlayer(playerKey).aliases.splice(i, 1), `Removed “${v}” from ${p.name}`, p.name);
}

// ═════════════════════════════════════════════════════════════════════════════
// Consumables: rules (per Class + Role), scoring from Warcraft Logs, the raid Consumes tab
// (officers), the Consumable Rules page, and the automatic log sync.
//
// consume-rules.json = { combos: { 'Warrior|Tanks': { groups: [{ id, name, ids: [abilityId|'we:…'] }] } } }
// A group is met on a boss fight when the raider had ANY of its buffs during that fight.
// Score = average over the combo's groups of "% of the raider's boss kills where the group was met"
// (all of their boss fights if the night had no kills). No rules for the combo → 100%.
// Officers can overwrite a raider's final score per raid: raid.consumeOverrides = { key: pct }.
// ═════════════════════════════════════════════════════════════════════════════

let consumeRules = { combos: {} };
const _consMemo = new Map();
const comboKey = (cls, role) => `${cls}|${role}`;

async function loadConsumeRulesFromRepo() {
  try {
    const d = await fetchFromWorker('consume-rules.json');
    if (d && d.combos) consumeRules = d;
  } catch (e) { addError('consume-rules.json', e.message); }
}
async function saveConsumeRules() {
  invalidateDerived();
  try { await saveJsonToGitHub('consume-rules.json', consumeRules); }
  catch (e) { handleSaveError(e, 'consume-rules.json'); throw e; }
}
function consumableRuleIds() {
  const s = new Set();
  for (const c of Object.values(consumeRules.combos || {})) for (const g of c.groups || []) for (const id of g.ids || []) s.add(String(id));
  return s;
}
function consumeGroupsFor(key) {
  const p = rosterPlayer(key);
  return p ? consumeRules.combos?.[comboKey(p.class, p.role)]?.groups || [] : [];
}
// Every buff name seen in any stored log (plus the built-in list), id → name
function consumableCatalog() {
  if (_consMemo.has('catalog')) return _consMemo.get('catalog');
  const out = { ...WCL_CONSUMABLES };
  for (const r of raidsData.raids) Object.assign(out, r.wcl?.abilities || {});
  _consMemo.set('catalog', out);
  return out;
}

function _killMask(raid) {
  const f = raid.wcl?.fights || [];
  let m = 0; f.forEach((x, i) => { if (x.kill) m += 2 ** i; });
  return m || (2 ** f.length - 1);
}
// { pct, groups: [{ name, pct }], noRules?, manual?, auto? } — or null when they aren't in the log
function consumeScore(raid, key) {
  const mk = 'cs|' + raid.id + '|' + key;
  if (_consMemo.has(mk)) return _consMemo.get(mk);
  let res = null;
  const p = raidWclPlayer(raid, key), groups = consumeGroupsFor(key).filter(g => g.ids?.length);
  if (p && !groups.length) res = { pct: 100, groups: [], noRules: true };
  else if (p) {
    const denom = _and(p.f, _killMask(raid)) || p.f, n = _bits(denom);
    if (n) {
      const gs = groups.map(g => {
        let m = 0; for (const id of g.ids) m = _or(m, p.b[id] || 0);
        return { name: g.name, pct: Math.round(100 * _bits(_and(m, denom)) / n) };
      });
      res = { pct: Math.round(gs.reduce((a, g) => a + g.pct, 0) / gs.length), groups: gs, fights: n };
    } else res = { pct: 100, groups: [], noBoss: true }; // in the log but no boss fights: nothing to hold them to
  }
  const ov = raid.consumeOverrides?.[key];
  if (p && ov !== undefined && ov !== null) res = { ...res, auto: res?.pct ?? null, pct: ov, manual: true };
  _consMemo.set(mk, res);
  return res;
}
// Officers: overwrite (or clear, with '') a raider's consumes score for one raid
let _consEdit = null;
function editConsumeScore(raidId, key) { _consEdit = key; renderRaidsPanel(); setTimeout(() => document.getElementById('consOvr')?.focus(), 0); }
async function setConsumeScore(raidId, key, value) {
  const raid = getRaid(raidId); _consEdit = null;
  const v = String(value ?? '').trim();
  if (v === '') { if (raid.consumeOverrides) delete raid.consumeOverrides[key]; }
  else { const n = Math.round(+v); if (!Number.isFinite(n) || n < 0 || n > 100) { flash('Enter a score from 0 to 100', 'error'); renderRaidsPanel(); return; }
    (raid.consumeOverrides ||= {})[key] = n; }
  await saveRaids().catch(() => {});
  refreshAll();
}
// { date: pct } for the overview dots and averages
function rawBuffScoresByDate(playerName) {
  const k = normalizeName(playerName), mk = 'bd|' + k;
  if (_consMemo.has(mk)) return _consMemo.get(mk);
  const out = {};
  for (const r of raidsData.raids) { const s = consumeScore(r, k); if (s) out[r.date] = s.pct; }
  _consMemo.set(mk, out);

// What each Class + Role actually used in recent logs: { combo: [{ id, name, users, avg }] }
function consumeUsageByCombo(maxRaids = 8) {
  if (_consMemo.has('usage')) return _consMemo.get('usage');
  const raids = sortedRaids().filter(r => Object.keys(r.wcl?.players || {}).length).slice(-maxRaids);
  const acc = {}, seen = {};
  for (const r of raids) for (const p of Object.values(r.wcl.players)) {
    const k = resolveRosterKey(p.name), rp = k && rosterPlayer(k); if (!rp || !_bits(p.f)) continue;
    const ck = comboKey(rp.class, rp.role);
    (seen[ck] ||= new Set()).add(k);
    for (const id of Object.keys(p.b)) {
      const a = ((acc[ck] ||= {})[id] ||= { users: new Set(), pcts: [] });
      a.users.add(k); a.pcts.push(wclBuffPct(p, id));
    }
  }
  const cat = consumableCatalog(), out = {};
  for (const [ck, ids] of Object.entries(acc)) out[ck] = Object.entries(ids).map(([id, a]) => ({ id, name: wclAbilityName(id, { wcl: { abilities: cat } }),
    users: a.users.size, of: seen[ck].size, avg: Math.round(a.pcts.reduce((x, y) => x + y, 0) / a.pcts.length) }))
    .sort((a, b) => b.users - a.users || b.avg - a.avg || a.name.localeCompare(b.name));
  _consMemo.set('usage', out);
  return out;
}

// ── Gear on the newest log (replaces the CLA gear listing) ──
function rebuildGearListing() {
  gearListingByPlayer = {};
  const newest = sortedRaids().filter(r => Object.values(r.wcl?.players || {}).some(p => p.g)).pop();
  for (const p of Object.values(newest?.wcl?.players || {})) {
    const k = resolveRosterKey(p.name); if (!k || !p.g) continue;
    gearListingByPlayer[k] = { slots: Object.fromEntries(Object.entries(p.g).map(([sl, id]) => [sl, 'id:' + id])) };
  }
}

// ── Automatic sync (officers) ──
// Past raids without a log yet (last 30 days), raids whose log may still have been uploading,
// and nights where nothing was found — retried every 30 minutes for a week.
function _wclDue(r) {
  if (r.wcl?.demo || r.status !== 'past') return false;
  if (!WCL_GUILD?.name && !r.wcl?.manual) return false;
  const age = Date.now() - new Date(r.date + 'T12:00:00').getTime(), DAY = 864e5;
  const last = new Date(r.wcl?.errorAt || r.wcl?.syncedAt || 0).getTime(), stale = Date.now() - last > 30 * 60e3;
  if (!r.wcl) return age < 30 * DAY;
  if (r.wcl.none || r.wcl.error) return stale && age < 7 * DAY;
  if (r.wcl.manual) return false;
  const ended = new Date(r.endedAt || r.date + 'T12:00:00').getTime();
  return stale && last - ended < 6 * 3600e3 && age < 7 * DAY; // last read soon after the raid → read once more
}
async function wclAutoSync() {
  if (!writeToken || !CF_WORKER_URL) return false;
  const due = pastRaids().filter(_wclDue).slice(-4);
  let changed = false;
  for (const r of due) {
    try { await syncWcl(r); changed = true; }
    catch (e) { changed = true; fetchErrors.push({ source: `Warcraft Logs (${r.name}, ${r.date})`, message: e.message, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }); }
  }
  return changed;
}
async function refreshWcl(raidId, refs) {
  const raid = getRaid(raidId);
  flash('Reading Warcraft Logs…', 'loading');
  try {
    await syncWcl(raid, refs);
    await saveRaids().catch(() => {});
    const n = Object.keys(raid.wcl.players).length;
    flash(raid.wcl.none ? 'No Warcraft Logs report found for this night yet' : `Warcraft Logs read — ${n} in the log`, raid.wcl.none ? 'loading' : 'success');
  } catch (e) { await saveRaids().catch(() => {}); flash('Warcraft Logs: ' + e.message, 'error'); }
  rebuildGearListing(); refreshAll();
}
function useWclLink(raidId, inputId) {
  const raw = document.getElementById(inputId)?.value || '';
  const refs = raw.split(/[\s,]+/).filter(Boolean).map(wclParseUrl);
  if (!refs.length || refs.some(x => !x)) return flash('Paste Warcraft Logs report links (…warcraftlogs.com/reports/…)', 'error');
  refreshWcl(raidId, refs);
}
async function useWclAutomatic(raidId) {
  const raid = getRaid(raidId);
  if (raid.wcl) raid.wcl.manual = false;
  if (!WCL_GUILD?.name) { flash('Set wcl_guild_name in config.json to match logs automatically', 'error'); return; }
  raid.wcl = null;
  await refreshWcl(raidId);
}

// One line in the raid header: which log(s) the raid uses
function wclLineHtml(raid) {
  const w = raid.wcl;
  if (!w && (raid.status === 'active' || !writeToken)) return '';
  const reps = w?.reports || [], n = Object.keys(w?.players || {}).length;
  const refresh = writeToken && !w?.demo ? `<button class="ghost-btn write-gated-hide" onclick="refreshWcl('${raid.id}')" title="Read the log again">↻</button>` : '';
  let body;
  if (!w) body = '<span class="iv-dim">not read yet</span>';
  else if (w.error && !reps.length) body = `<span style="color:${C5};" title="${escHtml(w.error)}">⚠ couldn't read the log</span>`;
  else if (!reps.length) body = '<span class="iv-dim">no report found for this night yet</span>';
  else body = reps.map(r => w.demo ? `<span class="rh-link">${escHtml(r.title)}</span>` : `<a class="rh-link" href="${escHtml(wclReportUrl(r))}" target="_blank" rel="noopener">${escHtml(r.title || r.code)} ↗</a>`).join(' + ')
    + ` <span class="rh-counts">${n} in the log</span>`;
  const how = w?.demo ? 'demo log' : w?.manual ? 'report pasted by hand' : w ? 'matched automatically' : '';
  return `<div class="rh-line"><span class="wcl-tag">Warcraft Logs</span> ${body}
    ${how ? `<span class="iv-dim">${how}${w?.syncedAt && !w.demo ? ` · read ${fmtAgo(w.syncedAt)}` : ''}${w?.error && reps.length ? ` · <span style="color:${C5};" title="${escHtml(w.error)}">last read failed</span>` : ''}</span>` : ''}
    ${refresh}${writeToken ? `<a class="subtle-link" onclick="setRaidSub('consumes')">consumes →</a>` : ''}</div>`;
}

      <input id="wclLink" class="gl-input" placeholder="Use a specific Warcraft Logs report — paste its link (several: separate with spaces)" value="${w?.manual ? escHtml((w.reports || []).map(wclReportUrl).join(' ')) : ''}">

  if (!w || !Object.keys(w.players || {}).length) {
    el.innerHTML = `<div class="gl-empty">${raid.status === 'active' ? 'The log is read when the raid ends.' : w?.error ? `Couldn't read the log: ${escHtml(w.error)}` : w ? 'No Warcraft Logs report found for this night yet — it is checked again automatically, or paste the link below.' : 'Not read yet.'}</div>${w?.demo ? '' : override}`;

    .map(x => ({ ...x, score: x.rp ? consumeScore(raid, x.key) : null }))
    .sort((a, b) => (!!b.rp - !!a.rp) || ((a.score?.pct ?? 101) - (b.score?.pct ?? 101)) || a.p.name.localeCompare(b.p.name));
  const pctCls = v => v >= srRules.buff.threshold ? 'ok' : v >= srRules.buff.threshold - 25 ? 'mid' : 'low';
  const scoreCell = (key, rp, score) => {
    if (!rp || !score) return '<span class="iv-dim">—</span>';
    if (_consEdit === key) return `<input id="consOvr" type="number" min="0" max="100" class="gl-input cons-ovr" value="${score.pct}"
        onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){_consEdit=null;renderRaidsPanel();}" onblur="setConsumeScore('${raid.id}','${key}',this.value)"><span class="iv-dim">%</span>`;
    return `<b class="cons-pct ${pctCls(score.pct)}">${score.pct}%</b>
      <button class="x-btn write-gated-hide" onclick="editConsumeScore('${raid.id}','${key}')" title="Overwrite this score">✎</button>
      ${score.manual ? `<div class="cons-sub iv-dim">set by hand${score.auto != null ? ` · was ${score.auto}%` : ''} <button class="x-btn" onclick="setConsumeScore('${raid.id}','${key}','')" title="Back to the calculated score">↺</button></div>` : ''}`;
  };
  const row = ({ p, key, rp, score }) => {
    const mine = rp ? ruleIds(key) : new Set();
    const det = Object.keys(p.b).filter(id => id !== WCL_WE_ANY || !Object.keys(p.b).some(x => x.startsWith('we:') && x !== WCL_WE_ANY))
      .map(id => ({ id, pct: wclBuffPct(p, id) })).sort((a, b) => mine.has(b.id) - mine.has(a.id) || b.pct - a.pct);
    return `<tr class="${rp ? '' : 'cons-unknown'}${key && key === _raidView.focus ? ' cons-focus' : ''}" data-key="${escHtml(key || '')}">
      <td>${rp ? playerNameHtml(rp.name) : `${escHtml(p.name)} <a class="subtle-link" onclick="openRaidersInbox('${jsAttr(p.name)}')">not on roster</a>`}<div class="iv-dim cons-sub">${escHtml(rp ? `${rp.class} · ${rp.role}` : p.cls)} · ${_bits(p.f)} boss fight${_bits(p.f) === 1 ? '' : 's'}</div></td>
      <td class="cons-score">${scoreCell(key, rp, score)}</td>
      <td>${score?.groups.length ? score.groups.map(g => `<span class="cons-grp ${pctCls(g.pct)}">${escHtml(g.name)} ${g.pct}%</span>`).join('')
        : rp && score?.noRules ? `<span class="iv-dim">no requirements · </span><a class="subtle-link" onclick="openConsumeRules('${jsAttr(comboKey(rp.class, rp.role))}')">set rules for ${escHtml(rp.class)} · ${escHtml(rp.role)}</a>`
        : score?.noBoss ? '<span class="iv-dim">no boss fights</span>' : ''}</td>
      <td class="cons-det">${det.map(d => `<span class="cons-chip${mine.has(d.id) ? ' req' : ''}" title="${escHtml(String(d.id))}">${escHtml(wclAbilityName(d.id, cat))} <b>${d.pct}%</b></span>`).join('') || '<span class="iv-dim">nothing detected</span>'}</td>
    </tr>`;
  };
  el.innerHTML = `
    <div class="cons-head">
      <span>Score = average of the raider's consumable groups, each the % of their boss kills where they had at least one item from the group${kills ? '' : ' (no kills this night, so every boss pull counts)'}; 100% when their class and role has no requirements. ✎ overwrites a score for this raid. At or above <b>${srRules.buff.threshold}%</b> earns the consumes bonus${srRules.buff.enabled ? '' : ' (turned off in SR Rules)'}.</span>
      <a class="subtle-link" onclick="openConsumeRules()">Consumable Rules →</a>
    </div>
    <div class="cons-note iv-dim">Detected: % of their boss fights with that buff at any point. A buff taken before logging started and still running when it ended leaves no trace in the log — start logging before people buff.</div>
    <div style="overflow-x:auto;"><table class="mini-table cons-table"><thead><tr><th>Raider</th><th>Score</th><th>Groups</th><th>Detected</th></tr></thead>
      <tbody>${rows.map(row).join('')}</tbody></table></div>
    ${w.demo ? '' : override}`;
}

function renderConsumesPanel() {
  const panel = document.getElementById('consumesPanel'); if (!panel) return;
  if (!_crDraft) _crDraft = JSON.parse(JSON.stringify(consumeRules.combos ? consumeRules : { combos: {} }));
  const usage = consumeUsageByCombo(), cat = consumableCatalog();
  const raiders = {};
  for (const p of rosterData.players) if (!rosterData.excluded?.includes(p.name) && p.class && p.role) (raiders[comboKey(p.class, p.role)] ||= []).push(p.name);
  const combos = [...new Set([...Object.keys(raiders), ...Object.keys(_crDraft.combos)])]
    .sort((a, b) => ROLE_ORDER.indexOf(a.split('|')[1]) - ROLE_ORDER.indexOf(b.split('|')[1]) || a.localeCompare(b));

    const [cls, role] = ck.split('|'), c = _crDraft.combos[ck] || { groups: [] }, u = usage[ck] || [];
    const others = Object.entries(cat).filter(([id]) => !u.some(x => x.id === id)).sort((a, b) => a[1].localeCompare(b[1]));
    const addSel = gi => `<select class="gl-input cr-add" onchange="crAddBuff('${jsAttr(ck)}',${gi},this.value)"><option value="">+ add a consumable…</option>

    ${combos.map(comboHtml).join('') || '<div class="gl-empty">No raiders on the roster yet.</div>'}
    <div style="display:flex;gap:8px;margin-top:18px;" class="write-gated-hide">

function _crc(ck) { return (_crDraft.combos[ck] ||= { groups: [] }); }
function _crChanged(ck) { _crOpen = ck; renderConsumesPanel(); document.getElementById('crSave')?.classList.add('gloss-btn-ready'); }
function crAddGroup(ck) { _crc(ck).groups.push({ id: _uid('g_'), name: 'New group', ids: [] }); _crChanged(ck); }
function crRemoveGroup(ck, gi) { _crc(ck).groups.splice(gi, 1); _crChanged(ck); }
function crRenameGroup(ck, gi, v) { _crc(ck).groups[gi].name = v; document.getElementById('crSave')?.classList.add('gloss-btn-ready'); }
function crAddBuff(ck, gi, id) { if (!id) return; const g = _crc(ck).groups[gi]; if (!g.ids.map(String).includes(String(id))) g.ids.push(/^\d+$/.test(id) ? +id : id); _crChanged(ck); }
function crRemoveBuff(ck, gi, ii) { _crc(ck).groups[gi].ids.splice(ii, 1); _crChanged(ck); }
function crCopyFrom(ck, from) { if (!from) return; _crDraft.combos[ck] = JSON.parse(JSON.stringify(_crDraft.combos[from])); _crDraft.combos[ck].groups.forEach(g => { g.id = _uid('g_'); }); _crChanged(ck); }
async function crSave() {
  for (const c of Object.values(_crDraft.combos)) c.groups = c.groups.filter(g => g.ids.length).map(g => ({ ...g, name: g.name.trim() || 'Group' }));
  for (const [k, c] of Object.entries(_crDraft.combos)) if (!c.groups.length) delete _crDraft.combos[k];
  consumeRules = JSON.parse(JSON.stringify(_crDraft));
  try { await saveConsumeRules(); flash('Consumable rules saved', 'success'); } catch (_) { /* handled */ }
  _crDraft = null; refreshAll();
}

async function _putWf(filename, data) {
  const res = await fetch(`${_workerBase()}/${_kvKey(filename)}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Token': writeToken },
    body: JSON.stringify(data, null, 2),
  });
  if (!res.ok) throw new Error(`write ${_kvKey(filename)}: HTTP ${res.status} ${(await res.text()).slice(0, 200)}`);
}

function _raidArg(x) {

  const r = getRaid(x) || raidsData.raids.find(r => r.name.toLowerCase().includes(String(x).toLowerCase()));
  if (!r) throw new Error(`No raid matching "${x}" — try wfDebug.raids()`);
  return r;
}
function _playerArg(x) {
  const k = normalizeName(x || '');
  const p = rosterPlayer(k) || rosterData.players.find(p => normalizeName(p.name).startsWith(k));

// A plausible Molten Core loadout for a class/role: best armor type they can wear in every
// armor slot, two rings, two trinkets, and a role-appropriate weapon set. Items the raider
// actually won in the demo take priority for their slot.
const DEMO_ARMOR_PREF = { Warrior: ['Plate','Mail','Leather','Cloth'], Paladin: ['Plate','Mail','Leather','Cloth'], Hunter: ['Mail','Leather','Cloth'],
  Shaman: ['Mail','Leather','Cloth'], Rogue: ['Leather','Cloth'], Druid: ['Leather','Cloth'], Mage: ['Cloth'], Priest: ['Cloth'], Warlock: ['Cloth'] };
const DEMO_WEAPONS = { // [main, off-hand?] and ranged options, by class+role (Wowhead IDs from MC)
  caster:   { sets: [[18842], [17103, 19142], [18878, 19142]], ranged: [17077] },
  healer:   { sets: [[17105, 19142], [18842]], ranged: [17077] },
  palheal:  { sets: [[17105, 17106]], ranged: [] },
  shamheal: { sets: [[17105, 17106]], ranged: [] },
  tank:     { sets: [[18832, 17066], [18805, 17106]], ranged: [17069, 17072] },
  paltank:  { sets: [[18832, 17066]], ranged: [] },
  bear:     { sets: [[17073], [18842]], ranged: [] },
  melee:    { sets: [[17076], [17104], [18822], [17074]], ranged: [17069, 17072] },
  rogue:    { sets: [[18832, 18805], [17071, 18816], [18203, 18832]], ranged: [17069, 17072] },
  hunter:   { sets: [[17074], [18822], [17104]], ranged: [17069, 17072] },
  enh:      { sets: [[17073], [17104]], ranged: [] },
  ret:      { sets: [[17076], [17073]], ranged: [] },
};
function demoWeaponKind(p) {
  const c = p.class, r = p.role;
  if (c === 'Rogue') return 'rogue';
  if (c === 'Hunter') return 'hunter';
  if (c === 'Paladin') return r === 'Healers' ? 'palheal' : r === 'Tanks' ? 'paltank' : 'ret';
  if (c === 'Shaman') return r === 'Healers' ? 'shamheal' : r === 'Physical DPS' ? 'enh' : 'caster';
  if (c === 'Druid') return r === 'Healers' ? 'healer' : r === 'Ranged DPS' ? 'caster' : 'bear';
  if (c === 'Warrior') return r === 'Tanks' ? 'tank' : 'melee';
  if (c === 'Priest') return r === 'Healers' ? 'healer' : 'caster';
  return 'caster';
}
function demoGearFor(p, wonKeys) {
  const mcKeys = [...new Set(Object.values(glossary.raids['Molten Core'] || {}).flat())];
  const canWear = k => { const e = glossary.items[k]?.eligibleClasses || []; return !e.length || e.includes(p.class); };
  const h = [...normalizeName(p.name)].reduce((a, ch) => a * 31 + ch.charCodeAt(0) >>> 0, 7); // stable per player
  const choose = list => list.length ? list[h % list.length] : null;
  const pref = DEMO_ARMOR_PREF[p.class] || ['Cloth'];
  const out = {};
  const ARMOR = { Head: 'Head', Neck: 'Neck', Shoulder: 'Shoulders', Back: 'Cloak', Chest: 'Chest', Wrist: 'Bracers', Hands: 'Hands', Waist: 'Waist', Legs: 'Legs', Feet: 'Feet' };
  for (const [slot, gearSlot] of Object.entries(ARMOR)) {
    const cands = mcKeys.filter(k => glossary.items[k].slot === slot && canWear(k));
    const mine = wonKeys.filter(k => cands.includes(k));
    let pickK = mine[mine.length - 1];
    if (!pickK) for (const t of [...pref, '']) { const c = cands.filter(k => (glossary.items[k].armorType || '') === t); if (c.length) { pickK = choose(c); break; } }
    if (!pickK) pickK = choose(cands);
    if (pickK) out[gearSlot] = pickK;
  }
  for (const [slot, a, b] of [['Finger', 'Ring1', 'Ring2'], ['Trinket', 'Trinket1', 'Trinket2']]) {
    const cands = mcKeys.filter(k => glossary.items[k].slot === slot && canWear(k));
    const mine = wonKeys.filter(k => cands.includes(k));
    const picked = [...new Set([...mine.reverse(), choose(cands), cands[(h + 1) % Math.max(1, cands.length)]].filter(Boolean))].slice(0, 2);
    if (picked[0]) out[a] = picked[0];
    if (picked[1]) out[b] = picked[1];
  }
  const w = DEMO_WEAPONS[demoWeaponKind(p)];
  const set = choose(w.sets) || [];
  if (set[0]) out['Weapon'] = 'id:' + set[0];
  if (set[1]) out['Off-Hand'] = 'id:' + set[1];
  const rng = choose(w.ranged); if (rng) out['Wand/Idol/Relic etc.'] = 'id:' + rng;
  return out;
}

const demoSpecFor = p => DEMO_SPEC[p.class]?.[p.role] || Object.values(DEMO_SPEC[p.class] || { x: 0 })[0];

// ─────────────────────────────────────────────────────────────────────────────
// Demo data comes from ONE frozen fixture (DEMO_FIXTURE, parts/demo_fixture.js).
// The same fixture was used once to seed softres.it sheets, so the dashboard's demo raids
// point at real softres sheets with matching reserves (bad luck protection is the
// dashboard's own, from the loot log). Regenerating the demo never touches softres —
// it just re-applies the fixture.
// ─────────────────────────────────────────────────────────────────────────────

// Real raider names/classes/roles from the LC dashboard (read-only, un-prefixed keys), with each
// raider's attendance odds from their real recent LC attendance. Raiders who stopped coming → inactive.
async function demoLcBase() {
  try {
    const [lRoster, lAtt] = await Promise.all(['roster.json', 'attendance.json'].map(k => fetch(`${_workerBase()}/${k}`, { cache: 'no-store' }).then(r => r.ok ? r.json() : null)));
    const recent = [...(lAtt?.raids || [])].sort((a, b) => a.date.localeCompare(b.date)).slice(-10);
    const present = (k, r) => lAtt.overrides?.[k]?.[r.date] ?? !!r.players?.[k];
    let base = (lRoster?.players || []).filter(p => p.name && p.role && p.class && !p.isAlt).map(p => {
      const k = normalizeName(p.name), n = recent.filter(r => present(k, r)).length;
      return { name: p.name, role: p.role, cls: p.class, rel: recent.length ? n / recent.length : 0.8 };
    });
    const gone = base.filter(p => p.rel === 0).slice(0, 2);
    base = base.filter(p => p.rel > 0).sort((a, b) => b.rel - a.rel).slice(0, 25);
    return { base, gone };
  } catch (e) { console.warn('Demo: could not read the LC roster —', e.message); return { base: [], gone: [] }; }
}

// Build a NEW fixture (developer use only — the softres series was seeded from the frozen
// one, so a new fixture won't match it). base/gone: [{ name, role, cls, rel }] from the LC roster.
function buildDemoFixture({ base = [], gone = [], seed: seedIn = 20261006 } = {}) {
  let seed = seedIn; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const SURNAMES = ['Ashenvale','Brightblade','Stormwind','Thornhollow','Dawnforge','Ironbrand','Mistwalker','Frostmantle',
    'Emberheart','Grimshade','Silverleaf','Duskwhisper','Oakenshield','Ravencrest','Sunstrider','Gravemoor','Highpeak',
    'Wolfsbane','Starfall','Blackthorn','Stonehelm','Windrunner','Shadowmere','Goldmane','Nightbloom','Fjördmark','Kælgrim','Æstrand'];
  if (base.length < 10) base = [['Stonewall','Tanks','Warrior'],['Barkskin','Tanks','Druid'],['Aegis','Tanks','Paladin'],['Cleaver','Physical DPS','Warrior'],['Shiv','Physical DPS','Rogue'],
      ['Nightstep','Physical DPS','Rogue'],['Windfury','Physical DPS','Shaman'],['Claw','Physical DPS','Druid'],['Frostnova','Ranged DPS','Mage'],['Pyrelight','Ranged DPS','Mage'],
      ['Hexweaver','Ranged DPS','Warlock'],['Doomcall','Ranged DPS','Warlock'],['Deadeye','Ranged DPS','Hunter'],['Moonfire','Ranged DPS','Druid'],['Lightwell','Healers','Priest'],
      ['Mendwell','Healers','Priest'],['Chainheal','Healers','Shaman'],['Hollow','Healers','Paladin']].map(([name, role, cls]) => ({ name, role, cls, rel: 0.7 + rnd() * 0.3 }));
  if (gone.length < 2) gone = [...gone, ...[['Driftwood','Ranged DPS','Hunter'], ['Lapsed','Healers','Druid']].slice(0, 2 - gone.length).map(([name, role, cls]) => ({ name, role, cls, rel: 0 }))];
  const nActive = base.length, all = [...base, ...gone], used = new Set();
  const players = all.map(b => {
    let sur; do { sur = pick(SURNAMES); } while (used.has(sur) && used.size < SURNAMES.length); used.add(sur);
    const p = { name: `${b.name.slice(0, 12)} ${sur.slice(0, 12)}`, role: b.role, class: b.cls };
    return { ...p, spec: demoSpecFor(p) };
  });
  const reliab = all.map((b, i) => i >= nActive ? 0.9 : Math.max(0.4, Math.min(0.98, b.rel)));
  const stopAfter = all.map((b, i) => i >= nActive ? 2 : 99); // inactive raiders stop after the 2nd demo raid
  players[Math.min(8, players.length - 1)].srAdjustments = [{ date: '2026-08-20', delta: 2, note: 'Demo: carried over from a previous guild' }];

  _demoGlossaryMC();
  // The softres demo sheets are Classic Alliance raids, where Horde-only gear (Shaman tier) can't be
  // reserved — keep it out of the demo entirely so the dashboard and softres always match.
  const HORDE_ONLY = new Set([16837, 16838, 16839, 16840, 16841, 16842, 16843, 16844, 16946].map(id => 'id:' + id));
  const bosses = DEMO_MC_INSTANCE.boss_order;
  const bossItems = Object.fromEntries(Object.entries(glossary.raids['Molten Core']).map(([b, l]) => [b, l.filter(k => !HORDE_ONLY.has(k))]));
  const elig = (k, cls) => { const e = glossary.items[k].eligibleClasses; return !e.length || e.includes(cls); };
  const bossPool = cls => [...new Set(bosses.flatMap(b => bossItems[b] || []))].filter(k => elig(k, cls));

  // 5 weekly raids ending on the most recent Tuesday before the fixture was built
  const d0 = new Date(todayMST() + 'T19:00:00Z');
  const lastTue = new Date(d0); lastTue.setUTCDate(d0.getUTCDate() - ((d0.getUTCDay() + 5) % 7 || 7));
  const dates = []; for (let i = 4; i >= 0; i--) { const d = new Date(lastTue); d.setUTCDate(lastTue.getUTCDate() - i * 7); dates.push(d.toISOString().slice(0, 10)); }

  const budget = {}, wants = {}, owned = {};
  players.slice(0, 4).forEach(p => { wants[p.name] = ['id:17063']; }); // a few raiders chase Band of Accuria → BLP shows up
  const raids = dates.map((date, i) => {
    const optional = i === 2, noCla = i === 3;
    const present = players.filter((p, j) => i < stopAfter[j] && rnd() < (optional ? reliab[j] - 0.25 : reliab[j])).map(p => p.name);
    // Reserves: raiders keep reserving what they chase until they win it. One no-show reserves too.
    const absentReserver = players.find((p, j) => !present.includes(p.name) && i < stopAfter[j]);
    const reserving = [...players.filter(p => present.includes(p.name)), ...(absentReserver ? [absentReserver] : [])];
    const reserves = reserving.map(p => {
      const here = present.includes(p.name);
      budget[p.name] = (budget[p.name] || 0) + (here ? 1 : 0);
      const n = Math.max(1, Math.min(budget[p.name], 2));
      const want = (wants[p.name] ||= []);
      const pool = bossPool(p.class).filter(x => !want.includes(x) && !owned[p.name]?.has(x));
      while (want.length < n && pool.length) want.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
      const items = want.slice(0, n).map(x => +x.slice(3));
      if (here) budget[p.name] -= items.length;
      return { name: p.name, items };
    });
    // Loot: 2 per boss, 3 from Ragnaros. A reserved item drops about half the time. Unusable drops are disenchanted.
    const reservedBy = {};
    for (const r of reserves) if (present.includes(r.name)) for (const id of new Set(r.items)) (reservedBy['id:' + id] ||= []).push(r.name);
    const loot = [];
    bosses.forEach((boss, bi) => {
      const table = [...(bossItems[boss] || [])];
      for (let d = 0; d < (bi === bosses.length - 1 ? 3 : 2) && table.length; d++) {
        const reservedHere = table.filter(x => reservedBy[x]);
        const ik = reservedHere.length && rnd() < 0.5 ? pick(reservedHere) : pick(table);
        table.splice(table.indexOf(ik), 1);
        const srCands = (reservedBy[ik] || []).filter(n => !owned[n]?.has(ik));
        let to = null, sr = false;
        if (srCands.length) { to = pick(srCands); sr = true; }
        else { const cands = players.filter(p => present.includes(p.name) && elig(ik, p.class) && !owned[p.name]?.has(ik)); if (cands.length && rnd() < 0.85) to = pick(cands).name; }
        loot.push({ item: +ik.slice(3), to: to || '||de||', sr, boss });
        if (to) { (owned[to] ||= new Set()).add(ik); if (wants[to]) wants[to] = wants[to].filter(x => x !== ik); }
      }
    });
    // `cla` (legacy fixture field) = this night has a log; raid 4 has none → attendance falls back to the reserves
    let cla = null;
    if (!noCla) { cla = {}; for (const n of present) { const e = rnd() < 0.8 ? 100 : 50, f = rnd() < 0.8 ? 100 : 0, w = rnd() < 0.6 ? 100 : 0; cla[n] = [e, f, w, rnd() < 0.5 ? 100 : 0]; } }
    return { key: 'r' + (i + 1), name: optional ? 'Molten Core (optional reclear)' : 'Molten Core', date, optional, present, reserves, loot, cla };
  });
  // The latest raid shows the reserve warnings: an over-reserver (3 on a 3-limit sheet with fewer SRs), a double reserve, and a pug.
  {
    const last = raids[raids.length - 1];
    const ranged = players.find(p => p.role === 'Ranged DPS' && last.reserves.some(r => r.name === p.name));
    const melee = players.find(p => p.role === 'Physical DPS' && p !== ranged && last.reserves.some(r => r.name === p.name));
    const o = ranged && last.reserves.find(r => r.name === ranged.name);
    if (o) { const pool = bossPool(ranged.class).filter(x => !o.items.includes(+x.slice(3)) && !owned[ranged.name]?.has(x)); while (o.items.length < 3 && pool.length) o.items.push(+pool.splice(Math.floor(rnd() * pool.length), 1)[0].slice(3)); }
    const d = melee && last.reserves.find(r => r.name === melee.name); if (d) d.items = [d.items[0], d.items[0]];
    last.reserves.push({ name: 'Pugwalker', items: [17063] });
  }
  // The next raid's sheet (open, unverified): everyone active reserves what they still want.
  const open = { key: 'open', name: 'Molten Core', reserves: players.slice(0, nActive).filter((p, j) => reliab[j] > 0.55).map(p => {
    const want = (wants[p.name] || []).filter(x => !owned[p.name]?.has(x));
    const pool = bossPool(p.class).filter(x => !want.includes(x) && !owned[p.name]?.has(x));
    while (want.length < 2 && pool.length) want.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
    return { name: p.name, items: want.slice(0, 2).map(x => +x.slice(3)) };
  }) };
  return { version: 1, builtAt: new Date().toISOString(), seriesName: 'WF demo', instance: 'Molten Core (Classic)', players, raids, open, softres: { seriesId: null, sheets: {} } };
}

function _demoGlossaryMC() {
  glossary = { raids: {}, items: {}, imported: {} };

  for (const [id, [type, icon]] of Object.entries(DEMO_MC_WOWHEAD)) applyWowheadInfo('id:' + id, { type, icon, classes: [] });
  rebuildItemIcons();

const DEMO_BUNZIE = { name: 'Bunzie Ashveil', role: 'Healers', class: 'Priest' };
function addDemoBunzie(fx, players, raids) {
  if (players.some(p => normalizeName(p.name) === normalizeName(DEMO_BUNZIE.name))) return null;
  players.push({ ...DEMO_BUNZIE, isAlt: false });
  const key = normalizeName(DEMO_BUNZIE.name), first = DEMO_BUNZIE.name.split(' ')[0];
  const shared = (fx.open?.reserves.find(r => r.name.startsWith('Bunzypoo'))?.items || [17082]).map(Number)[0];
  // His "chase" item: whatever priest-usable item dropped most often, so he's lost it several times
  const drops = {};
  for (const r of fx.raids) for (const l of r.loot) if (l.to !== '||de||' && +l.item !== shared) drops[+l.item] = (drops[+l.item] || 0) + 1;
  const usable = id => { const c = glossary.items['id:' + id]?.eligibleClasses || []; return !c.length || c.includes(DEMO_BUNZIE.class); };
  const chase = +Object.entries(drops).filter(([id]) => usable(id)).sort((a, b) => b[1] - a[1])[0][0];
  fx.raids.forEach((r, i) => {
    const raid = raids[i];
    raid.softres[0].edits[key] = { name: first, items: [chase] };
    if (r.cla) demoWclAdd(raid, DEMO_BUNZIE, 1); // never misses a consumable
  });
  // Tonight: double reserve on the chase item (big bonus) + the item Bunzypoo reserved (no bonus for Bunzie)
  return open => { if (open) open.softres[0].edits[key] = { name: first, items: [chase, chase, shared] }; };
}

// A stored Raid-Helper copy for tonight's demo raid (never synced — demo: true): the sign-up
// mix Phase 2/3 need — confirmed, unconfirmed, cancelled, bench, late, an absence, Discord
// nicknames ("Bunz", "Main/Alt") and one sign-up that isn't a raider yet.
function demoRaidHelper(fx, players, raid) {
  const id = n => String(100000000000000000n + BigInt([...n].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 899999999999999, 7)));
  const rhRole = { Tanks: 'Tanks', 'Physical DPS': 'Melee', 'Ranged DPS': 'Ranged', Healers: 'Healers' };
  const spec = p => p.role === 'Tanks' ? { className: 'Tank', specName: p.class === 'Paladin' ? 'Protection1' : p.class === 'Druid' ? 'Guardian' : 'Protection' }
    : { className: p.class, specName: ({ Warrior: 'Fury', Paladin: p.role === 'Healers' ? 'Holy' : 'Retribution', Hunter: 'Marksmanship', Rogue: 'Combat', Priest: p.role === 'Healers' ? 'Holy' : 'Shadow',
        Shaman: p.role === 'Healers' ? 'Restoration' : p.role === 'Ranged DPS' ? 'Elemental' : 'Enhancement', Mage: 'Fire', Warlock: 'Destruction', Druid: p.role === 'Healers' ? 'Restoration' : p.role === 'Ranged DPS' ? 'Balance' : 'Feral' })[p.class] || '' };
  const byName = n => players.find(p => p.name === n);
  const reservers = fx.open.reserves.map(r => byName(r.name)).filter(Boolean);
  const nick = p => p.name.startsWith('Bunzypoo') ? 'Bunz' : p.name.startsWith('Bunzie') ? 'Bunzie/Bunziealt' : p.name.split(' ')[0];
  const t0 = Math.floor(Date.now() / 1000) - 3 * 86400;
  const signUps = [], slots = [];
  const sign = (p, i, cls = null) => {
    const s = spec(p);
    signUps.push({ name: nick(p), userId: id(p.name), className: cls || s.className, specName: cls ? '' : s.specName, roleName: cls ? '' : rhRole[p.role], status: 'primary', entryTime: t0 + i * 3700, position: i + 1 });
  };
  const slot = (p, i, isConfirmed) => { const s = spec(p); slots.push({ name: nick(p), userId: id(p.name), groupNumber: Math.floor(slots.length / 5) + 1, slotNumber: slots.length % 5 + 1, className: s.className, specName: s.specName, color: '', isConfirmed }); };
  const bunzie = byName(DEMO_BUNZIE.name);
  const everyone = [...reservers, ...(bunzie && !reservers.includes(bunzie) ? [bunzie] : [])];
  everyone.forEach((p, i) => {
    if (i === 4) { sign(p, i, 'Bench'); return; }                       // benched
    sign(p, i, i === 5 ? 'Late' : null);
    slot(p, i, i === 2 ? 'unconfirmed' : i === 3 ? 'cancelled' : 'confirmed');
  });
  const absent = players.find(p => !everyone.includes(p) && !p.isAlt);
  if (absent) sign(absent, everyone.length, 'Absence');
  const noRes = players.find(p => !everyone.includes(p) && p !== absent && !p.isAlt);
  if (noRes) { sign(noRes, everyone.length + 1); slot(noRes, everyone.length + 1, 'confirmed'); }  // signed up, never reserved
  signUps.push({ name: 'Tinkerbelle', userId: id('Tinkerbelle'), className: 'Priest', specName: 'Holy', roleName: 'Healers', status: 'primary', entryTime: t0 + 99000, position: signUps.length + 1 });
  raid.raidHelper = { eventId: '1550000000000000001', url: 'https://raid-helper.xyz/raidplan/1550000000000000001', demo: true,
    event: { title: 'Molten Core', displayTitle: 'Molten Core', date: raid.date, time: '19:30', startTime: null, endTime: null, description: 'Weekly MC — SR on softres.', leaderName: 'Bunz',
      softresId: raid.softres[0]?.code || null, channelName: 'raid-signups', lastUpdated: t0 },
    signUps, comp: { slots, groups: Array.from({ length: 8 }, (_, i) => ({ name: `Group ${i + 1}`, position: i + 1 })) }, syncedAt: new Date().toISOString(), syncError: null };
}

  'Rogue|Physical DPS': { groups: [{ id: 'g1', name: 'Mongoose', ids: [17538] }, { id: 'g2', name: 'Food or firewater', ids: [18192, 17038, 18125] }, { id: 'g3', name: 'Poison or stone', ids: ['we:any'] }] },
  'Hunter|Ranged DPS': { groups: [{ id: 'g1', name: 'Mongoose', ids: [17538] }, { id: 'g2', name: 'Food', ids: [18192, 18125] }] },
  'Mage|Ranged DPS': { groups: [{ id: 'g1', name: 'Arcane elixir or flask', ids: [17539, 11390, 17628] }, { id: 'g2', name: 'Firepower or Frost Power', ids: [26276, 7844, 21920] }, { id: 'g3', name: 'Wizard oil', ids: ['we:2628'] }] },
  'Warlock|Ranged DPS': { groups: [{ id: 'g1', name: 'Arcane elixir or flask', ids: [17539, 11390, 17628] }, { id: 'g2', name: 'Shadow Power', ids: [11474] }, { id: 'g3', name: 'Wizard oil', ids: ['we:2628'] }] },
  'Priest|Healers': { groups: [{ id: 'g1', name: 'Mana regen', ids: [18194, 24363, 17627] }, { id: 'g2', name: 'Mana oil', ids: ['we:2629'] }] },
  'Paladin|Healers': { groups: [{ id: 'g1', name: 'Mana regen', ids: [18194, 24363, 17627] }, { id: 'g2', name: 'Mana oil', ids: ['we:2629'] }] },
  'Druid|Healers': { groups: [{ id: 'g1', name: 'Mana regen', ids: [18194, 24363, 17627] }, { id: 'g2', name: 'Mana oil', ids: ['we:2629'] }] },
  'Shaman|Healers': { groups: [{ id: 'g1', name: 'Mana regen', ids: [18194, 24363, 17627] }, { id: 'g2', name: 'Mana oil', ids: ['we:2629'] }] },
} };
function _demoHash(str) { return [...str].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7); }
function _demoRng(seed) { let x = seed || 1; return () => { x = (x * 1103515245 + 12345) >>> 0; return (x >>> 8) / 16777216; }; }
// A raid's fake log: everyone present, each boss a kill (a Ragnaros wipe some weeks)
function demoWclFor(raid, idx) {
  const rnd = _demoRng(_demoHash(raid.date));
  const fights = DEMO_MC_BOSSES.map(name => ({ name, kill: true, report: 'demo' }));
  if (idx % 2) fights.splice(fights.length - 1, 0, { name: 'Ragnaros', kill: false, report: 'demo' });
  const code = 'Demo' + raid.date.replace(/-/g, '') + 'MCxx'.slice(0, 4);
  raid.wcl = { demo: true, reports: [{ code, site: 'vanilla', title: 'Molten Core', zone: 'Molten Core' }], fights, players: {}, abilities: {}, syncedAt: raid.endedAt, _rnd: rnd };
  return raid.wcl;
}
// Add one raider to a raid's fake log. diligence 0..1 (default: stable per raider)
function demoWclAdd(raid, p, diligence) {
  const w = raid.wcl; if (!w) return;
  const name = p.name.split(' ')[0], k = normalizeName(name), rnd = _demoRng(_demoHash(raid.date + p.name));
  const d = diligence ?? 0.55 + 0.45 * ((_demoHash(p.name) % 1000) / 1000);
  const n = w.fights.length, all = 2 ** n - 1;
  const late = diligence === undefined && rnd() < 0.06 ? 2 : 0; // the odd late arrival misses the first bosses
  const f = all - (2 ** late - 1);
  const pl = (w.players[k] = { name, cls: p.class, f, b: {} });
  for (const [id, use, cov] of DEMO_CONSUME_PROFILES[comboKey(p.class, p.role)] || [[3593, .5, .85]]) {
    if (rnd() > use * (0.7 + 0.3 * d) + (diligence === 1 ? 1 : 0)) continue;
    let m = 0; for (let i = 0; i < n; i++) if (((f / 2 ** i) | 0) % 2 && rnd() < Math.min(1, cov * (0.8 + 0.25 * d) + (diligence === 1 ? 1 : 0))) m += 2 ** i;
    if (!m) continue;
    pl.b[id] = m;
    w.abilities[id] = String(id).startsWith('we:') ? wclAbilityName(id) : DEMO_BUFF_NAMES[id] || `Buff #${id}`;
    if (String(id).startsWith('we:')) { pl.b[WCL_WE_ANY] = _or(pl.b[WCL_WE_ANY] || 0, m); w.abilities[WCL_WE_ANY] = wclAbilityName(WCL_WE_ANY); }
  }
  return pl;
}

// Write the fixture into this dashboard's storage (roster, raids, fake logs, glossary, rules). Never calls softres.
async function applyDemoFixture(fx) {
  _demoGlossaryMC();
  const sheets = fx.softres?.sheets || {};
  const sheetFor = (r, at) => sheets[r.key]
    // Linked to the real softres sheet: same character names softres holds (first word, 12 chars).
    // syncedAt is left empty so the first officer page load pulls bonuses + verified results.
    ? { id: _uid('s_'), code: sheets[r.key], url: `https://softres.it/raid/${sheets[r.key]}`, instances: [{ slug: 'mc', name: 'Molten Core' }], reserveLimit: 3, reserves: r.reserves.map(x => ({ name: x.name.split(' ')[0], spec: null, items: [...x.items], note: '' })), edits: {} }
    : { id: _uid('s_'), code: 'DEMO-' + r.key, url: '', demo: true, instances: [{ slug: 'mc', name: 'Molten Core' }], reserveLimit: 3, reserves: r.reserves.map(x => ({ name: x.name, spec: null, items: [...x.items], note: '' })), edits: {}, syncedAt: at };
  const players = fx.players.map(p => ({ name: p.name, role: p.role, class: p.class, isAlt: false, ...(p.srAdjustments ? { srAdjustments: p.srAdjustments } : {}) }));
  const raids = [];
  const byName = new Map(players.map(p => [p.name, p]));
  for (const r of fx.raids) {
    const raid = normalizeRaid({ name: r.name, date: r.date, optional: r.optional, status: 'past', createdAt: r.date + 'T01:00:00Z', endedAt: r.date + 'T06:00:00Z',
      softres: [sheetFor(r, r.date + 'T02:00:00Z')], loot: [] });
    for (const l of r.loot) if (l.to !== '||de||') raid.loot.push({ id: _uid('l_'), itemKey: 'id:' + l.item, name: itemName('id:' + l.item), recipient: l.to, sr: l.sr, at: r.date + 'T04:00:00Z' });
    // A fake Warcraft Logs report for each night (the 4th has none → attendance falls back to reserves)
    if (r.cla) { demoWclFor(raid, raids.length); for (const n of r.present) if (byName.get(n)) demoWclAdd(raid, byName.get(n)); }
    else raid.wcl = { demo: true, none: true, reports: [], fights: [], players: {}, abilities: {}, syncedAt: raid.endedAt };
    raids.push(raid);
  }
  // In-game test characters. Bunzypoo is in the fixture; Bunzie is added here, dashboard-only (his
  // reserves are hand edits on the sheets, so softres is untouched). Tonight Bunzie double-reserves an
  // item he has lost several times and also reserves Bunzypoo's item, where only Bunzypoo has a bonus —
  // so a Gargul import from the dashboard shows per-item bonuses on both characters.
  const bunzieTonight = addDemoBunzie(fx, players, raids);
  // Unrecognised names for the Roster inbox: Bunzie's alt and a pug showed up in the last log
  const lastClaFx = [...fx.raids].reverse().find(r => r.cla);
  if (lastClaFx) {
    const raid = raids[fx.raids.indexOf(lastClaFx)];
    demoWclAdd(raid, { name: 'Bunziealt', class: 'Mage', role: 'Ranged DPS' });
    demoWclAdd(raid, { name: 'Randompug', class: 'Warrior', role: 'Physical DPS' });
  }
  // A benched raider on the latest logged raid: missing from the log, marked bench by hand
  if (lastClaFx) {
    const raid = raids[fx.raids.indexOf(lastClaFx)], inCla = new Set(lastClaFx.present.map(normalizeName));
    const prev = fx.raids[fx.raids.indexOf(lastClaFx) - 1];
    const b = players.find(p => !inCla.has(normalizeName(p.name)) && prev?.present.includes(p.name));
    if (b) raid.attendance.overrides[normalizeName(b.name)] = 'bench';
  }
  // The latest raid gets a Gargul post-raid export with one MS > OS award the loot master forgot
  // to log (an item nobody reserved, so leaving it out doesn't change anyone's bad luck protection).
  const lastFx = fx.raids[fx.raids.length - 1], lastRaid = raids[raids.length - 1];
  if (lastFx && lastRaid) {
    const reserved = new Set([...lastFx.reserves.flatMap(x => x.items), ...Object.values(lastRaid.softres[0].edits).flatMap(e => e.items)].map(Number));
    const forgot = [...lastFx.loot].reverse().find(l => !l.sr && l.to !== '||de||' && !reserved.has(+l.item));
    if (forgot) {
      const j = lastRaid.loot.findIndex(l => l.itemKey === 'id:' + forgot.item && l.recipient === forgot.to);
      if (j >= 0) lastRaid.loot.splice(j, 1);
    }
    const t0 = Math.floor(new Date(lastFx.date + 'T04:00:00Z').getTime() / 1000);
    lastRaid.gargul = { exportId: `wf-${lastRaid.id}-${t0}`, checksumOk: true, importedAt: lastFx.date + 'T06:30:00Z', ignored: [],
      awards: lastFx.loot.map((l, i) => ({ itemId: +l.item, to: l.to === '||de||' ? '||de||' : l.to.split(' ')[0] + '-Dreamscythe', by: 'Bunzypoo-Dreamscythe',
        at: t0 + i * 90, received: true, bonusLoot: false, de: l.to === '||de||', rolls: [] })) };
  }
  // Current gear on the latest log: Molten Core pieces, what they won first
  if (lastClaFx) {
    const raid = raids[fx.raids.indexOf(lastClaFx)];
    const won = {}; for (const r of raids) for (const l of r.loot) (won[lootKey(l)] ||= []).push(l.itemKey);
    for (const p of players) {
      const wp = raid.wcl.players[normalizeName(p.name.split(' ')[0])]; if (!wp) continue;
      wp.g = Object.fromEntries(Object.entries(demoGearFor(p, won[normalizeName(p.name)] || [])).map(([sl, key]) => [sl, +String(key).replace('id:', '')]).filter(([, id]) => id));
    }
  }
  for (const r of raids) delete r.wcl?._rnd;
  // The open sheet becomes today's active raid
  if (fx.open) raids.push(normalizeRaid({ name: fx.open.name, date: todayMST(), optional: false, status: 'active', createdAt: new Date().toISOString(), softres: [sheetFor(fx.open, new Date().toISOString())], loot: [] }));
  if (fx.open) bunzieTonight?.(raids[raids.length - 1]);
  if (fx.open) demoRaidHelper(fx, players, raids[raids.length - 1]);
  await _putWf('roster.json', { players, excluded: [] });
  await _putWf('glossary.json', glossary);
  await _putWf('sr-rules.json', DEFAULT_SR_RULES);
  await _putWf('consume-rules.json', DEMO_CONSUME_RULES);
  await _putWf('raids.json', { raids });
  return { players: players.length, raids: raids.length, linked: Object.keys(sheets).length };
}

async function generateDemoData({ overwrite = false } = {}) {
  if (!writeToken) { console.error('Save the write token first.'); return; }
  if (!CF_WORKER_URL) { console.error('cf_worker_url is not set — config.json is missing or unreadable (see the warning above). Nothing was written.'); return; }
  if ((rosterData.players.length || raidsData.raids.length) && !overwrite) {
    console.error('There is already data here. Use generateDemoData({ overwrite: true }) to replace it (or wipeAllData first).'); return;
  }
  if (typeof DEMO_FIXTURE === 'undefined') { console.error('No demo fixture in this build.'); return; }
  if (!confirm(`Replace the data under "${KV_PREFIX}" with demo data?`)) return;
  const r = await applyDemoFixture(DEMO_FIXTURE);
  console.log(`Demo data written: ${r.players} raiders, ${r.raids} raids (${r.linked} linked to softres sheets). Reloading…`);
  setTimeout(() => location.reload(), 600);
}
window.generateDemoData = generateDemoData;


// ═════════════════════════════════════════════════════════════════════════════
// Load pipeline
// ═════════════════════════════════════════════════════════════════════════════
async function fetchData(opts = {}) {
  fetchErrors.length = 0;
  resetProxyBreaker();
  setStatus('Summoning the scrolls...', 'loading');
  try {
    rebuildGearListing();
    refreshAll();
    const stamp = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const done = () => fetchErrors.length
      ? setStatus(`Updated at ${stamp()} — <span style="cursor:pointer;text-decoration:underline;" onclick="showErrors()">⚠ ${fetchErrors.length} warning(s) (click to view)</span>`, 'loading')
      : setStatus(`Updated at ${stamp()}`, 'success');
    done();
    // Officers pull fresh softres data for active raids, plus past raids with a sheet that was
    // never synced (fetched once, then left alone). Read-only visitors never hit softres.
    const toSync = [...activeRaids().filter(r => r.softres.some(s => !s.demo)),
      ...pastRaids().filter(r => r.softres.some(s => !s.demo && !s.syncedAt)).slice(-8)];
    const rhSync = activeRaids().filter(r => r.raidHelper?.eventId && !r.raidHelper.demo);
    if (!opts.skipSoftres && writeToken && rhSync.length) {
      let changed = false;
      for (const r of rhSync) { try { changed = (await syncRaidHelper(r)).changed || changed; } catch (e) { changed = true; fetchErrors.push({ source: `Raid-Helper (${r.name})`, message: e.message, time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) }); } }
      if (changed) { await saveRaids().catch(() => {}); refreshAll(); }
    }
    // Officers read Warcraft Logs for recently ended raids (attendance + consumables)
    if (!opts.skipSoftres && writeToken) {
      if (await wclAutoSync()) { await saveRaids().catch(() => {}); rebuildGearListing(); refreshAll(); done(); }
    }
    if (!opts.skipSoftres && writeToken && toSync.length) {
      setStatus('Syncing softres…', 'loading');
      await syncSoftres(toSync);
      refreshAll();
      done();
    }
  } catch(e) {
    console.error(e);
    setStatus(`Failed to load data — ${e?.message}`, 'error');
    showErrors();
  }
}

(async () => {
  try {
    const raw = await fetch('./config.json?t=' + Date.now()).then(r => r.text());
    let cfg;
    try { cfg = JSON.parse(raw); }
    catch (e) { // forgive the classic hand-edit slip: a comma before } or ]
      cfg = JSON.parse(raw.replace(/,(\s*[}\]])/g, '$1'));
      addError('config.json', 'config.json has a stray comma (' + e.message + ') — it was read anyway, but please fix the file.');
    }
    if (cfg.cf_worker_url)  CF_WORKER_URL  = cfg.cf_worker_url.trim().replace(/\/+$/, '');
    if (cfg.kv_prefix != null) KV_PREFIX   = String(cfg.kv_prefix);
    if (cfg.cors_api_key)   CORS_API_KEY   = cfg.cors_api_key.trim();
    if (cfg.guild_name)     GUILD_NAME     = cfg.guild_name;
    if (cfg.guild_subtitle) GUILD_SUBTITLE = cfg.guild_subtitle;
    if (cfg.page_title)     PAGE_TITLE     = cfg.page_title;
    // wowhead_branch / wowhead_data_env pick the Wowhead database for links, tooltips and armor-type
    // detection. Classic Era ("classic" / 4) for now — change both when WoW Forever gets its own.
    if (cfg.wowhead_branch) WOWHEAD_BRANCH = cfg.wowhead_branch;
    if (cfg.wowhead_data_env) WOWHEAD_DATA_ENV = +cfg.wowhead_data_env;
    // Warcraft Logs: which section (vanilla / fresh / classic …) and the guild whose uploads are
    // matched to raids automatically. Reports pasted by hand carry their own section.
    if (cfg.wcl_site) WCL_SITE = String(cfg.wcl_site).trim();
    if (cfg.wcl_guild_name) WCL_GUILD = { name: cfg.wcl_guild_name, server: cfg.wcl_guild_server || '', region: cfg.wcl_guild_region || 'us' };
    if (cfg.raidhelper_server_id) RH_SERVER_ID = String(cfg.raidhelper_server_id).trim();
    if (cfg.demo_announce_channel) DEMO_ANNOUNCE_CHANNEL = String(cfg.demo_announce_channel).trim();
    if (cfg.sr) console.info('config.json "sr" is ignored — SR rules now live on the SR Rules page.');
  } catch(e) {
    console.warn('config.json not found or invalid — using defaults:', e.message);
  }
  if (!KV_PREFIX) { console.error('kv_prefix is empty — refusing to share keys with the LC dashboard. Using "wf/".'); KV_PREFIX = 'wf/'; }
  document.title = PAGE_TITLE;
  const h1 = document.querySelector('header h1'), sub = document.querySelector('header .subtitle');
  if (h1) h1.textContent = GUILD_NAME;
  if (sub) sub.textContent = GUILD_SUBTITLE;
  if (!CF_WORKER_URL) addError('config.json', 'Missing "cf_worker_url" — softres, Raid-Helper and Warcraft Logs need it.');
  boot();
})();

async function boot() {
  updateAuthState();
  await Promise.all([loadRosterFromRepo(), loadGlossaryFromRepo(), loadRulesFromRepo(), loadConsumeRulesFromRepo(), loadRaidsFromRepo()]);
  _raidView.raidId = _urlGetParam('raid');
  _raidView.sub = _urlGetParam('sub') || 'loot';
  const tab = _urlGetParam('tab');
  if (tab) { groupingMode = tab; }
  if (tab === 'items' && _urlGetParam('item')) _iv.item = _urlGetParam('item');
  await fetchData();
  setGrouping(_raidView.raidId && !tab ? 'raids' : (tab || 'role'));
  if (_raidView.raidId) { _urlSetParam('raid', _raidView.raidId); }
  if (writeToken && typeof wipeAllData === 'function' && !window._wfWipeWarned) {
    window._wfWipeWarned = true;
    console.warn('%c⚠ wipeAllData() is still present in this build — remove it before go-live (search for "TODO BEFORE GO-LIVE").', 'color:#e07830;font-weight:bold;');
  }
  console.info('WF dashboard loaded. Type wfDebug.help() for debugging tools.');
}
