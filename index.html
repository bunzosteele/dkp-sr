<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<meta name="theme-color" content="#071421">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WF Loot</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --gold-dim: #7a5f28;
    --bg: #0a0a0a;
    --bg2: #111111;
    --bg3: #191919;
    --border: #2a2a22;
    --text: #e8e4dc;
    --text-dim: #a8a89a;
    --red: #c94c4c;
    --green: #4caa6e;
    /* Width of the main content column. Was 960px; +10% for the wider tables. */
    --content-width: 1056px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 18px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Parchment texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(var(--accent-rgb),0.03) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(var(--accent-rgb),0.02) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    /* Widened from 960px to 1056px (+10%) to give the wide tables more room —
       the attendance cell in particular grew by ~24px when the perfect-attendance
       star slot was added. Single knob: change --content-width to retune. */
    max-width: var(--content-width, 1056px);
    margin: 0 auto;
    padding: 40px 24px 80px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    text-align: center;
    padding: 48px 0 20px;
    position: relative;
  }

  header::after {
    content: '';
    display: block;
    width: 320px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 24px auto 0;
  }

  .guild-name {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.4em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 0.05em;
    line-height: 1.1;
    text-shadow: 0 0 40px rgba(var(--accent-rgb),0.3);
  }

  .subtitle {
    margin-top: 10px;
    color: var(--text-dim);
    font-style: italic;
    font-size: 20px;
    letter-spacing: 0.08em;
  }

  /* Dot legend */
  .dot-legend {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin: 16px 0 0;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: inline-block;
    flex-shrink: 0;
  }

  /* Grouping buttons */
  .group-btns {
    display: flex;
    gap: 4px;
  }

  .nav-segments {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin: 4px auto 0;
  }

  .nav-segment {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .nav-segment-label {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-dim);
    font-weight: 700;
  }

  .nav-dropdown {
    position: relative;
    display: inline-block;
  }

  .nav-dropdown-btn {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 9px 18px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .nav-dropdown-btn:hover,
  .nav-dropdown-btn.open {
    border-color: var(--gold-dim);
    color: var(--gold);
  }

  .nav-dropdown-btn.has-active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(var(--accent-rgb),0.08);
  }

  .nav-dropdown-btn .nav-dd-arrow {
    font-size: 11px;
    opacity: 0.6;
    transition: transform 0.15s;
  }

  .nav-dropdown-btn.open .nav-dd-arrow {
    transform: rotate(180deg);
  }

  .nav-dropdown-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 4px;
    display: none;
    flex-direction: column;
    z-index: 200;
    min-width: 100%;
    overflow: hidden;
  }

  .nav-dropdown-menu.open {
    display: flex;
  }

  .nav-dropdown-menu .group-btn {
    border: none;
    border-bottom: 1px solid var(--border);
    border-radius: 0;
    text-align: left;
    padding: 9px 18px;
    white-space: nowrap;
  }

  .nav-dropdown-menu .group-btn:last-child {
    border-bottom: none;
  }

  .nav-dropdown-menu .group-btn:hover {
    border-color: transparent;
    background: rgba(var(--accent-rgb),0.08);
    color: var(--gold);
  }

  .nav-segment-btns {
    display: flex;
    gap: 4px;
    justify-content: center;
  }

  .group-btn.group-btn-large {
    font-size: 15px;
    padding: 10px 28px;
    letter-spacing: 0.15em;
  }

  .group-btn {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
  }

  .group-btn:hover {
    border-color: var(--gold-dim);
    color: var(--gold);
  }

  .group-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(var(--accent-rgb),0.08);
  }

  .role-icon {
    font-size: 13px;
    opacity: 0.75;
    margin-left: 3px;
    cursor: default;
  }

  .role-subtitle {
    font-family: 'Crimson Pro', serif;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    text-transform: none;
  }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--gold-dim);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
    flex-shrink: 0;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 10px 24px;
    border: 1px solid var(--gold-dim);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--gold);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.2s;
    z-index: -1;
  }

  .btn:hover {
    color: var(--bg);
    border-color: var(--gold);
  }

  .btn:hover::before { transform: scaleX(1); }

  .btn.primary {
    background: var(--gold);
    color: var(--bg);
    border-color: var(--gold);
  }

  .btn.primary:hover { background: var(--gold-light); border-color: var(--gold-light); }
  .btn.primary::before { display: none; }

  .status {
    font-style: italic;
    color: var(--text-dim);
    font-size: 16px;
    margin-left: auto;
  }

  .status.loading { color: var(--gold-dim); }
  .status.error { color: var(--red); }
  .status.success { color: var(--green); }

  /* Role sections */
  .role-section {
    margin-bottom: 48px;
    animation: fadeIn 0.4s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .role-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }

  .role-title {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .role-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--gold-dim), transparent);
  }

  .role-toggle {
    font-size: 13px;
    color: var(--gold-dim);
    margin-left: 6px;
  }

  .role-header:hover .role-count { color: var(--gold); }
  .role-header:hover .role-toggle { color: var(--gold); }

  .role-count {
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  /* Table */
  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  thead th:not(:first-child) { text-align: right; }
  thead th[data-col] { cursor: pointer; user-select: none; white-space: nowrap; }
  thead th[data-col]:hover { color: var(--gold); }
  .sort-arrow { color: var(--gold-dim); font-size: 12px; }
  td.points-cell, td.consumes-cell { text-align: center !important; }
  td.att-count { text-align: right !important; font-family: 'Cinzel', serif; font-size: 15px; color: var(--text-dim); }
  td:has(.raid-dots), td:has(.raid-dot), td:has(.raid-star) { text-align: center !important; }

  tbody tr {
    border-bottom: 1px solid rgba(var(--line-rgb),0.6);
    transition: background 0.15s;
  }

  tbody tr:hover { background: rgba(var(--accent-rgb),0.04); }

  tbody tr.na-row { opacity: 0.45; }

  td {
    padding: 10px 12px;
    font-size: 17px;
  }

  td:not(:first-child) { text-align: right; }

  .player-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 400;
    color: var(--text);
    letter-spacing: 0.02em;
    min-width: 16ch;
    width: 16ch;
  }

  .raids-num {
    color: var(--text-dim);
    font-size: 16px;
  }

  .window-num {
    color: var(--text-dim);
    font-size: 16px;
  }

  /* Attendance bar cell */
  .att-cell {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
  }

  .att-pct {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    font-weight: 700;
    min-width: 52px;
    text-align: right;
  }

  /* Perfect-attendance flair: 20+ raids and never missed one. Renders INSIDE .att-pct
     in place of the "100%" text, so it occupies the existing column and adds no width —
     the bar and every other row's percentage stay exactly where they were. Display only:
     sorting reads p.pct / p.attended from the data, never this text. */
  .att-star {
    font-size: 17px;
    line-height: 1;
    color: #f0c419;
    filter: drop-shadow(0 0 4px rgba(240,196,25,0.55));
    cursor: default;
  }

  .att-pct.high { color: #8abf50; }
  .att-pct.mid { color: #d4c84a; }
  .att-pct.low { color: #c94c4c; }
  .att-pct.exact100 { color: #4caa6e; }
  .att-bar-fill.exact100 { background: #4caa6e; }
  .att-bar-fill.high { background: #8abf50; }
  .att-bar-fill.mid { background: #d4c84a; }
  .att-bar-fill.low { background: #c94c4c; }
  .att-pct.na { color: var(--text-dim); font-weight: 400; font-family: 'Crimson Pro', serif; font-style: italic; }

  .att-bar-bg {
    width: 80px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .att-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.6s ease;
  }



  /* Summary footer */
  .summary {
    margin-top: 48px;
    padding: 24px;
    border: 1px solid var(--border);
    background: var(--bg2);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    text-align: center;
    align-items: start;
  }

  .summary-item label {
    display: block;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
    min-height: 2.4em;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .summary-item .val {
    font-family: 'Cinzel', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--gold);
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 80px 24px;
    color: var(--text-dim);
    font-style: italic;
  }

  .empty .icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.3;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 0 0 36px;
  }

  /* Points highlighting */
  .points-cell {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    font-weight: 700;
    text-align: right;
    color: var(--text-dim);
  }

  .pts-top .points-cell,
  .points-cell.pts-top {
    color: #e05555;
    text-shadow: 0 0 12px rgba(220,80,80,0.5);
  }

  .pts-bottom .points-cell,
  .points-cell.pts-bottom {
    color: #4caa6e;
    text-shadow: 0 0 12px rgba(76,170,110,0.4);
  }

  tr.pts-top {
    background: rgba(200, 60, 60, 0.06);
  }

  tr.pts-bottom {
    background: rgba(76, 170, 110, 0.06);
  }

  /* Priority column */
  .priority-cell {
    text-align: center !important;
  }

  .priority-score {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    font-weight: 700;
    cursor: default;
  }

  /* Gear issue flag */
  .gear-flag-cell {
    width: 20px;
    text-align: center;
    padding: 10px 4px;
  }

  .gear-flag {
    color: #e07830;
    font-size: 15px;
    cursor: default;
    filter: drop-shadow(0 0 4px rgba(224,120,48,0.6));
  }

  /* Consumes column */
  .consumes-cell {
    text-align: right;
  }

  /* Inactive players */
  .inactive-row {
    opacity: 0.4;
    filter: grayscale(0.4);
  }

  .inactive-badge {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 2px 6px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* Loot expansion */
  .loot-arrow {
    font-size: 13px;
    color: var(--gold-dim);
    transition: transform 0.2s;
    margin-left: 4px;
  }

  .player-name:hover .loot-arrow { color: var(--gold); }

  .loot-row {
    animation: fadeIn 0.2s ease both;
  }

  .loot-cell {
    padding: 10px 16px 14px 24px !important;
    background: var(--bg2);
    border-bottom: 1px solid var(--border) !important;
  }

  .loot-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .loot-item {
    font-size: 16px;
    color: var(--gold-light);
    background: rgba(var(--accent-rgb),0.07);
    border: 1px solid var(--gold-dim);
    padding: 3px 10px;
    white-space: nowrap;
    text-decoration: none;
    display: inline-block;
    transition: background 0.15s, color 0.15s;
  }

  a.loot-item:hover {
    background: rgba(var(--accent-rgb),0.18);
    color: #fff;
    border-color: var(--gold);
  }

  .expand-section-title {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 8px;
  }

  /* Raw accumulated loot value beside the "Loot Received" heading — the Loot Score
     numerator before the raids-attended divisor. Brighter than the heading so the
     number reads as data rather than as part of the label. */
  .raw-loot-total {
    color: var(--text-dim);
    letter-spacing: 0.08em;
    font-weight: 700;
    cursor: help;
  }

  .cla-entry-label {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    margin-bottom: 6px;
    margin-top: 4px;
  }

  .loot-item.gear-issue {
    color: #e09050;
    border-color: #7a4a20;
    background: rgba(200,120,60,0.07);
  }

  .buff-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 4px;
  }

  .buff-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4px 10px;
    border: 1px solid var(--border);
    font-size: 13px;
    min-width: 70px;
  }

  .buff-label {
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
    text-align: center;
  }

  .buff-val {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
  }

  .buff-ok { border-color: #2a5a3a; background: rgba(76,170,110,0.06); }
  .buff-ok .buff-val { color: var(--green); }
  .buff-missing { border-color: #5a2a2a; background: rgba(200,80,80,0.06); }
  .buff-missing .buff-val { color: var(--red); }
  .buff-partial { border-color: #5a4a20; background: rgba(200,160,60,0.06); }
  .buff-partial .buff-val { color: var(--gold); }

  .no-loot {
    color: var(--text-dim);
    font-size: 16px;
  }

  /* Dot indicators for raid dates */
  .raid-dots {
    display: inline-flex;
    gap: 4px;
    justify-content: center;
    flex-wrap: nowrap;
  }

  .raid-dot {
    width: 8px;
    height: 8px;
    min-width: 8px;
    border-radius: 50%;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .raid-dot.present { background: var(--green); border-color: var(--green); }

  .raid-star {
    font-size: 16px;
    width: 8px;
    height: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    vertical-align: middle;
    overflow: visible;
    position: relative;
    top: -1px;
    color: #4caa6e;
    cursor: default;
    filter: drop-shadow(0 0 3px currentColor);
  }
  .raid-dot.absent { background: transparent; }
  .raid-dot.inactive { background: transparent; border-color: transparent; }

  /* CLA Manager */
  .cla-manager {
    border: 1px solid var(--border);
    background: var(--bg2);
    margin-bottom: 24px;
  }

  .cla-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }

  .cla-header:hover { background: rgba(var(--accent-rgb),0.04); }

  .cla-title {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .cla-count {
    font-size: 14px;
    color: var(--text-dim);
    margin-left: 4px;
  }

  .cla-toggle {
    margin-left: auto;
    color: var(--gold-dim);
    font-size: 14px;
  }

  .cla-body {
    border-top: 1px solid var(--border);
    padding: 16px;
  }

  .cla-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 16px;
  }

  .cla-row-label {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    color: var(--gold);
    min-width: 60px;
  }

  .cla-row-url {
    color: var(--text-dim);
    font-size: 14px;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cla-row-gids {
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .cla-remove {

    #glValueInput::-webkit-outer-spin-button,

  @media (max-width: 768px) {

    .container {
      padding: 20px 12px 60px;
    }

    h1 { font-size: 28px; }
    .subtitle { font-size: 15px; }

    /* Controls */
    .controls {

      align-items: flex-start;
      gap: 8px;
    }

    /* Legend wraps tightly */
    .dot-legend {

    /* Role section */
    .role-header { gap: 8px; }
    .role-title { font-size: 13px; letter-spacing: 0.15em; }

    /* Scrollable table */
    .role-section { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { min-width: 600px; }

    /* Shrink text in table */
    td, th { padding: 8px 6px; font-size: 15px; }
    .player-name { font-size: 16px; }
    .att-pct { font-size: 14px; min-width: 40px; }
    .att-bar-bg { width: 50px; }
    .priority-score { font-size: 14px; }

    /* Dots smaller gap */

    .raid-dot { width: 7px; height: 7px; min-width: 7px; }
    .raid-star { font-size: 14px; width: 7px; height: 7px; }

    /* Loot expand panel */
    .loot-cell { padding: 8px 10px 12px !important; }
    .loot-item { font-size: 14px; padding: 2px 8px; }

    /* CLA manager */
    .cla-add-form { flex-direction: column; }
    .cla-input, .cla-input.wide { width: 100%; }
    .nav-segments { gap: 8px; }
    .nav-segment-btns { flex-wrap: wrap; }

    .summary { grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px; }

  @media (max-width: 480px) {

  /* ═══════════════════════════════════════════════════════════════
     WoW Forever theme — taken from the logo: deep night-blue field,
     glowing teal centre, bronze frame, ivory lettering.
     Data colours (buff/attendance bands, class colours, SR red/green,
     ★ stars, gear ⚠) are untouched — only chrome changes here.
     The legacy --gold* variable names are kept so the copied LC code
     works unchanged; they now carry the teal accent.
     ═══════════════════════════════════════════════════════════════ */
  :root {
    --gold: #5cc8e0;          /* accent: active state, links, primary buttons */
    --gold-light: #aee9f5;
    --gold-dim: #3a9ab1;      /* muted accent: labels, arrows, secondary buttons */
    --accent-rgb: 92, 200, 224;
    --bronze: #c9a276;        /* frame: dividers, section titles, borders */
    --bronze-light: #e3c79f;
    --bronze-dim: #6f5236;
    --ivory: #f4ead3;         /* lettering: headings */
    --line-rgb: 36, 62, 80;
    --bg: #050c13;
    --bg2: #0a1721;
    --bg3: #0f202c;
    --border: #1c3242;
    --text: #e3eaee;
    --text-dim: #8ea5b2;
  }

  body {
    background:
      radial-gradient(ellipse 80% 520px at 50% -60px, rgba(38, 140, 172, 0.30), transparent 72%),
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(20, 70, 96, 0.18), transparent 70%),
      linear-gradient(180deg, #071421 0%, #050c13 420px, #04090f 100%);
    background-attachment: fixed;
  }
  body::before {
    background-image:
      radial-gradient(ellipse at 15% 40%, rgba(var(--accent-rgb), 0.035) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 25%, rgba(201, 162, 118, 0.03) 0%, transparent 50%);
  }

  /* ── Header: medallion behind the title, like the logo's disc ── */
  header { padding: 56px 0 24px; isolation: isolate; }
  header::before {
    content: '';
    position: absolute;
    left: 50%; top: 22px;
    width: 164px; height: 164px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, rgba(62, 170, 205, 0.34) 0%, rgba(22, 88, 120, 0.22) 45%, rgba(8, 30, 46, 0) 70%);
    box-shadow:
      0 0 0 2px rgba(201, 162, 118, 0.22),
      0 0 0 9px rgba(201, 162, 118, 0.05),
      0 0 0 10px rgba(201, 162, 118, 0.14),
      0 0 60px rgba(62, 170, 205, 0.18);
    z-index: -1;
    pointer-events: none;
  }
  header::after {
    width: 360px;
    background: linear-gradient(90deg, transparent, var(--bronze-dim) 15%, var(--bronze) 50%, var(--bronze-dim) 85%, transparent);
    margin-top: 28px;
  }
  #brandLogo { display: block; margin: -24px auto 8px; max-height: 150px; max-width: 80%; filter: drop-shadow(0 6px 18px rgba(0,0,0,0.5)); }

  h1 {
    color: var(--ivory);
    background: linear-gradient(180deg, #fffaf0 0%, #f1e2c2 45%, #d6b384 72%, #a87b4f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 2px 0 rgba(70, 45, 22, 0.9)) drop-shadow(0 0 22px rgba(var(--accent-rgb), 0.35));
    letter-spacing: 0.06em;
  }
  .subtitle { color: var(--bronze-light); opacity: 0.9; }
  .guild-name { color: var(--bronze); }

  /* ── Navigation ── */
  .group-btn, .nav-dropdown-btn { border-color: rgba(201, 162, 118, 0.28); background: rgba(10, 23, 33, 0.6); }
  .group-btn:hover, .nav-dropdown-btn:hover, .nav-dropdown-btn.open { border-color: var(--gold-dim); color: var(--gold-light); }
  .group-btn.active, .nav-dropdown-btn.has-active {
    border-color: var(--gold);
    color: var(--gold-light);
    background: linear-gradient(180deg, rgba(var(--accent-rgb), 0.16), rgba(var(--accent-rgb), 0.05));
    box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.18), inset 0 0 0 1px rgba(var(--accent-rgb), 0.12);
  }
  .nav-dropdown-menu { background: var(--bg2); border-color: rgba(201, 162, 118, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .nav-dropdown-menu .group-btn { background: transparent; }
  .nav-segment-label { color: var(--bronze); }

  /* ── Sections & tables ── */
  .role-title { color: var(--ivory); }
  .role-line { height: 1px; position: relative; background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.55), rgba(var(--accent-rgb), 0.14) 55%, transparent); box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.25); }
  .role-line::before { content: ''; position: absolute; left: -3px; top: -3px; width: 5px; height: 5px; transform: rotate(45deg); background: var(--gold); box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.7); }
  .role-toggle { color: var(--bronze); }
  .role-header:hover .role-count, .role-header:hover .role-toggle { color: var(--bronze-light); }
  .sort-arrow { color: var(--bronze-dim); }
  thead th { border-bottom-color: rgba(201, 162, 118, 0.22); }
  tbody tr:hover { background: rgba(var(--accent-rgb), 0.05); }
  .loot-cell { background: rgba(10, 23, 33, 0.85); }

  .summary {
    background: linear-gradient(180deg, rgba(15, 32, 44, 0.9), rgba(10, 23, 33, 0.9));

  }

  /* ── Panels / inputs / misc chrome ── */
  .gl-col, .cla-manager { background: rgba(10, 23, 33, 0.85); }
  .gl-col-title { color: var(--bronze); }
  .loot-select, .cla-input { background: var(--bg2); }
  .loot-item-dropdown { background: var(--bg2); border-color: var(--gold-dim); }
  #custom-tooltip { border-color: rgba(201, 162, 118, 0.45); background: #0b1924; }
  .inactive-badge { border-color: var(--border); }
  .btn { border-color: var(--gold-dim); }
  .small-gold-btn, .gl-add button { color: #04111a; }
  input[type=date] { color-scheme: dark; }
  ::selection { background: rgba(var(--accent-rgb), 0.35); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #1e3a4b; border-radius: 5px; border: 2px solid var(--bg); }

  /* ═══ v2: raid-centric UI components ═══ */
  html { background: #04090f; }
  .section-title { font-family: 'Cinzel', serif; font-size: 15px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--bronze); margin: 6px 0 12px; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--text-dim); white-space: nowrap; cursor: pointer; }
  .chk input { width: 15px; height: 15px; accent-color: var(--gold); }

  .ghost-btn:hover:not(:disabled) { border-color: var(--gold-dim); color: var(--gold-light); }
  .ghost-btn:disabled { opacity: 0.4; cursor: default; }
  .ghost-btn.danger:hover { border-color: var(--red); color: var(--red); }
  .x-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 13px; padding: 0 3px; }
  .x-btn:hover { color: var(--red); }
  .subtle-link { color: var(--gold-dim); font-size: 15px; cursor: pointer; list-style: none; }
  .subtle-link:hover { color: var(--gold-light); }
  details > summary.subtle-link::-webkit-details-marker { display: none; }

  .tag-opt, .tag-active, .tag-warn, .tag-ok { display: inline-block; font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; vertical-align: middle; border: 1px solid; }
  .tag-opt { color: var(--bronze-light); border-color: rgba(201,162,118,0.4); }
  .tag-active { color: var(--gold-light); border-color: var(--gold-dim); }
  .tag-warn { color: #e0a060; border-color: rgba(224,160,96,0.5); }
  .tag-ok { color: var(--green); border-color: rgba(76,170,110,0.5); }
  .bonus { color: var(--green); font-size: 13px; }

  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.6); animation: livepulse 1.8s infinite; flex-shrink: 0; }
  @keyframes livepulse { 0% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.6); } 70% { box-shadow: 0 0 0 8px rgba(var(--accent-rgb), 0); } 100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0); } }
  .active-raid-strip { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
  .active-raid-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--gold-dim); border-radius: 999px; background: rgba(var(--accent-rgb), 0.08); color: var(--gold-light); font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.1em; cursor: pointer; }

  .raid-new-grid { display: grid; grid-template-columns: 2fr 150px 2fr auto auto; gap: 8px; align-items: center; }
  .raid-card { border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; background: rgba(10,23,33,0.7); transition: border-color 0.15s, background 0.15s; }
  .raid-card.active { border-color: rgba(var(--accent-rgb), 0.45); box-shadow: 0 0 18px rgba(var(--accent-rgb), 0.08), inset 3px 0 0 var(--gold); }
  .raid-card:hover { background: rgba(var(--accent-rgb), 0.06); }
  .raid-card-name { font-family: 'Cinzel', serif; font-size: 16px; color: var(--ivory); letter-spacing: 0.05em; }
  .raid-card-stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: 15px; color: var(--text-dim); margin-top: 6px; }

  .mini-table { width: 100%; border-collapse: collapse; font-size: 16px; }
  .mini-table th { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); text-align: left !important; padding: 5px 8px; border-bottom: 1px solid rgba(201,162,118,0.22); }
  .mini-table td { padding: 5px 8px; text-align: left !important; font-size: 16px; border-bottom: 1px solid rgba(var(--line-rgb), 0.6); }
  .raid-list tbody tr:hover { background: rgba(var(--accent-rgb), 0.06); }
  .row-over td { background: rgba(201,76,76,0.08); }
  .blp-boost { color: var(--gold-light); font-weight: 700; }

  .raid-head { border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px 0; margin-bottom: 18px; background: rgba(10,23,33,0.85); }
  .raid-head.active { border-color: rgba(var(--accent-rgb), 0.45); box-shadow: 0 0 22px rgba(var(--accent-rgb), 0.08); }
  .back-link { color: var(--gold-dim); font-size: 15px; cursor: pointer; }
  .back-link:hover { color: var(--gold-light); }
  .raid-title { font-family: 'Cinzel', serif; font-size: 20px; color: var(--ivory); letter-spacing: 0.05em; }
  .status-badge { display: inline-flex; align-items: center; gap: 7px; font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.2em; padding: 3px 10px; border-radius: 999px; border: 1px solid; }
  .status-badge.active { color: var(--gold-light); border-color: var(--gold); background: rgba(var(--accent-rgb), 0.1); }
  .status-badge.past { color: var(--text-dim); border-color: var(--border); }
  .over-banner { margin-top: 12px; padding: 10px 12px; border: 1px solid rgba(201,76,76,0.6); background: rgba(201,76,76,0.12); border-radius: 4px; color: #f0b0b0; font-size: 16px; }
  .warn-banner { margin-top: 10px; padding: 8px 12px; border: 1px solid rgba(224,160,96,0.4); background: rgba(224,160,96,0.07); border-radius: 4px; color: #e8c09a; font-size: 15px; }
  .sub-tabs { display: flex; gap: 2px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
  .sub-tab { flex: 0 0 auto; }
  .sub-tab { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-dim); font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase; padding: 10px 16px; cursor: pointer; }
  .sub-tab:hover { color: var(--gold-light); }
  .sub-tab.on { color: var(--gold-light); border-bottom-color: var(--gold); }
  .sub-tab .count { font-family: 'Crimson Pro', serif; letter-spacing: 0; color: var(--text-dim); font-size: 14px; }

  .item-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 4px 0 10px; }
  .sr-box { border: 1px solid rgba(201,76,76,0.45); background: linear-gradient(180deg, rgba(201,76,76,0.08), rgba(201,76,76,0.03)); border-radius: 6px; padding: 12px 14px; }
  .sr-box.empty { border-color: var(--border); background: rgba(10,23,33,0.6); color: var(--text-dim); font-style: italic; font-size: 16px; }
  .sr-row { display: grid; grid-template-columns: minmax(140px, 1.3fr) 44px 90px 1.6fr auto; align-items: center; gap: 10px; padding: 7px 4px; border-top: 1px solid rgba(var(--line-rgb), 0.7); font-size: 16px; }
  .sr-row:first-of-type { border-top: none; }
  .sr-row.absent { opacity: 0.5; }
  .sr-row.over { background: rgba(201,76,76,0.1); }
  .sr-multi { display: inline-block; font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700; color: #1a0a0a; background: #e8a24a; border-radius: 3px; padding: 0 5px; }
  .sr-roll { font-family: 'Cinzel', serif; font-size: 15px; color: var(--text); }
  .over-chip { display: inline-block; font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.08em; color: #fff; background: #b43c3c; border-radius: 3px; padding: 2px 7px; animation: overpulse 1.6s ease-in-out infinite; }
  @keyframes overpulse { 50% { background: #d65050; box-shadow: 0 0 10px rgba(214,80,80,0.6); } }
  .sr-over { animation: none; }
  .assign-btn { background: transparent; border: 1px solid var(--gold-dim); color: var(--gold-light); padding: 4px 12px; border-radius: 4px; cursor: pointer; font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.12em; white-space: nowrap; }
  .assign-btn:hover { background: var(--gold); color: #04111a; }
  .assign-btn.sr { border-color: #c95a5a; color: #f0a0a0; }
  .assign-btn.sr:hover { background: #c95a5a; color: #fff; }
  .sr-toggle { background: none; border: 1px solid var(--green); color: var(--green); border-radius: 3px; cursor: pointer; font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.1em; padding: 2px 8px; min-width: 52px; }
  .sr-toggle.on { border-color: var(--red); color: var(--red); }

  .sheet-card { border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; background: rgba(10,23,33,0.75); }
  .sheet-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .sheet-code { font-family: 'Cinzel', serif; font-size: 15px; color: var(--gold-light); text-decoration: none; letter-spacing: 0.05em; }
  .res-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 15px; padding: 2px 8px; }

  .att-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; }
  .att-tile { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-size: 16px; opacity: 0.55; }
  .att-tile.on { opacity: 1; border-color: rgba(var(--accent-rgb), 0.35); background: rgba(var(--accent-rgb), 0.05); }
  .att-tile.ov { box-shadow: inset 0 0 0 1px var(--bronze); }
  .att-tile input { accent-color: var(--gold); }
  .att-src { margin-left: auto; font-size: 13px; color: var(--text-dim); }
  .att-cb { accent-color: var(--gold-dim); width: 15px; height: 15px; cursor: pointer; }
  .att-cb.ov { accent-color: var(--bronze); outline: 1px solid var(--bronze); outline-offset: 1px; }
  .sticky-col { position: sticky; left: 0; background: var(--bg); z-index: 1; }
  .col-active { color: var(--gold-light); text-shadow: 0 0 8px rgba(var(--accent-rgb), 0.5); }
  .raid-dot.absent.optional { border-style: dashed; opacity: 0.6; }

  .rules { max-width: none; }
  .rules-intro { color: var(--text-dim); font-size: 16px; line-height: 1.55; }
  .rule { display: flex; align-items: center; gap: 18px; padding: 14px 0; border-top: 1px solid rgba(var(--line-rgb), 0.8); }
  .rule-text { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .rule-text b { font-family: 'Cinzel', serif; font-size: 15px; letter-spacing: 0.08em; color: var(--ivory); font-weight: 700; }
  .rule-text span { color: var(--text-dim); font-size: 16px; }
  .rule-ctl { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 15px; white-space: nowrap; }
  .rule-num { width: 72px; flex: none !important; text-align: center; }
  .switch { position: relative; width: 38px; height: 20px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--border); border-radius: 999px; transition: 0.15s; cursor: pointer; }
  .switch span::before { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: var(--text-dim); border-radius: 50%; transition: 0.15s; }
  .switch input:checked + span { background: var(--gold-dim); }
  .switch input:checked + span::before { transform: translateX(18px); background: #fff; }

  .ac-drop { position: absolute; top: 100%; left: 0; min-width: 100%; background: var(--bg2); border: 1px solid var(--border); border-top: none; border-radius: 0 0 4px 4px; max-height: 240px; overflow-y: auto; z-index: 9999; display: none; white-space: nowrap; }
  .ac-opt { padding: 5px 10px; cursor: pointer; font-size: 16px; border-bottom: 1px solid rgba(var(--line-rgb), 0.5); }
  .ac-opt:hover, .ac-opt.on { background: rgba(var(--accent-rgb), 0.1); }

  @media (max-width: 760px) {
    .raid-new-grid { grid-template-columns: 1fr 1fr !important; }
    .sr-row { grid-template-columns: 1fr auto auto; }
    .sr-row .sr-bal { grid-column: 1 / -1; }
    .rule { flex-direction: column; align-items: flex-start; }
  }
  @media (max-width: 768px) {
    .mini-table { min-width: 0 !important; }
    .mini-table th, .mini-table td { padding: 5px 4px; font-size: 15px; }
    .sub-tab { padding: 10px 8px; letter-spacing: 0.08em; }
    .raid-title { font-size: 18px; }
  }

  /* Glossary rows: actions take their space always, just invisible, so hovering never shifts the list */
  .gl-row { min-height: 34px; }
  .gl-row-actions { display: flex !important; visibility: hidden; }
  .gl-row:hover .gl-row-actions, .gl-row.selected .gl-row-actions { visibility: visible; }
  body.read-only .gl-row-actions { display: none !important; }

  /* Officers-only management menu */
  body.read-only #navDdGuildMgmt { display: none !important; }

  /* WoW Forever names: 12-char first + 12-char last name */
  .player-name { width: auto !important; min-width: 0 !important; max-width: 30ch; }
  .sr-row { grid-template-columns: minmax(200px, 1.5fr) 44px 90px 1.4fr auto; }
  .att-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .sticky-col { min-width: 230px; }
  @media (max-width: 768px) { .player-name { max-width: 22ch; } .sticky-col { min-width: 170px; } }
  .sr-row > .sr-multi { justify-self: start; }
  .yn-toggle { background: none; border: none; color: var(--text); font-family: 'Crimson Pro', serif; font-size: 16px; cursor: pointer; padding: 0 4px; }
  .yn-toggle:hover { color: var(--gold-light); text-decoration: underline dotted; }

  /* Raider dropdown: collapsible raid rows */
  .raid-acc-list { display: flex; flex-direction: column; gap: 2px; }
  .raid-acc { border: 1px solid rgba(var(--line-rgb), 0.9); border-radius: 4px; background: rgba(5,12,19,0.4); }
  .raid-acc > summary, .raid-acc.adj { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 6px 10px; font-size: 16px; list-style: none; }
  .raid-acc > summary { cursor: pointer; }
  .raid-acc > summary::-webkit-details-marker { display: none; }
  .raid-acc > summary:hover { background: rgba(var(--accent-rgb), 0.05); }
  .raid-acc[open] { border-color: rgba(var(--accent-rgb), 0.3); }
  .acc-date { font-family: 'Cinzel', serif; font-size: 14px; color: var(--gold-light); padding-left: 4px; }
  .acc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acc-sum { color: var(--text-dim); font-size: 15px; white-space: nowrap; }
  .acc-body { padding: 4px 12px 10px 86px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid rgba(var(--line-rgb), 0.7); }
  .acc-line { display: grid; grid-template-columns: 90px 1fr; gap: 10px; font-size: 16px; align-items: baseline; }
  .acc-k { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--bronze); }
  .acc-res { display: flex; flex-direction: column; gap: 3px; }
  .acc-item { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  @media (max-width: 768px) {
    .raid-acc > summary, .raid-acc.adj { grid-template-columns: 52px 1fr; }
    .acc-sum { grid-column: 1 / -1; white-space: normal; }
    .acc-body { padding-left: 12px; }
  }
  .sr-box.with-cur .sr-row { grid-template-columns: minmax(180px, 1.3fr) 44px minmax(150px, 1.3fr) 90px 1.2fr auto; }
  .sr-cur, .current-gear { font-size: 15px; color: var(--text); min-width: 0; }
  .cur-item { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td.current-gear { text-align: left !important; }
  .raid-acc > summary .acc-date::before { content: '▸ '; color: var(--gold-dim); font-size: 12px; }
  .raid-acc[open] > summary .acc-date::before { content: '▾ '; }
  details.raid-acc > summary span:first-child, details.raid-acc[open] > summary span:first-child { transform: none !important; display: inline; }
  /* Reserve count in the loot item dropdown: sits right after the name, easy to spot */
  .dd-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-res { flex-shrink: 0; font-family: 'Cinzel', serif; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; color: #fff; background: rgba(201,76,76,0.85); border: 1px solid #e07a7a; border-radius: 999px; padding: 1px 9px; box-shadow: 0 0 8px rgba(201,76,76,0.35); }
  .loot-item-option.has-res { background: rgba(201,76,76,0.07); box-shadow: inset 3px 0 0 rgba(201,76,76,0.8); }
  .loot-item-option.has-res:hover { background: rgba(201,76,76,0.14); }
  .loot-item-dropdown { max-height: 380px; }
  .loot-item-option.selected { background: rgba(var(--accent-rgb), 0.1); }

  /* Compact player table (Loot tab "everyone else") */
  .compact-table td, .compact-table th { padding: 7px 6px; }
  .compact-table .att-bar-bg { width: 44px; }
  .compact-table .att-pct { min-width: 44px; font-size: 15px; }
  .compact-table .raid-dots { gap: 3px; }
  .compact-table .player-name { max-width: 22ch; }
  .compact-table .role-icon { display: none; }
  .compact-table th { letter-spacing: 0.12em; }

  /* Guild Overview: fixed column plan (see tableColgroup) */
  .ov-table { table-layout: fixed; }
  .ov-table .player-name { max-width: none; }
  .ov-table .raid-dots { justify-content: center; }
  @media (max-width: 768px) { .ov-table { min-width: 760px; } }

  /* Raider dropdown: bad luck protection chips */
  .loot-item.blp-chip { border-color: rgba(var(--accent-rgb), 0.55); background: rgba(var(--accent-rgb), 0.07); cursor: help; }

  /* Raid loot tab: build a new instance's loot table live */
  .nc-card { margin-bottom: 18px; border-color: rgba(var(--accent-rgb), 0.35); }
  .nc-hint { display: block; margin-top: 4px; font-family: 'Crimson Pro', serif; font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--text-dim); }
  .nc-grid { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
  .nc-field { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 4px; }
  .nc-row { display: flex; gap: 6px; }
  .nc-row .gl-input { flex: 1; min-width: 0; }
  .nc-row input:disabled, .nc-row button:disabled { opacity: 0.45; cursor: not-allowed; }
  .ov-table th:not(:first-child), .ov-table td:not(:first-child) { text-align: center !important; }
  .ov-table th { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; padding-right: 4px; letter-spacing: 0.1em; }
  .ov-table .att-cell { justify-content: center; }

  /* Raid loot list: SR and MS > OS tables */
  .ll-block { margin-bottom: 14px; }
  .ll-title { font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin: 6px 0 4px; }
  .ll-table { table-layout: fixed; }
  .ll-table td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ll-move { font-size: 13px; padding: 2px 8px; margin-right: 4px; min-width: 76px; }
  @media (max-width: 768px) { .ll-table col:last-child { width: 110px !important; } .ll-move { padding: 2px 5px; } }

  /* Item Glossary: merging hand-made entries into SR-sheet ones */
  .gl-merge, .gl-suggest { margin-bottom: 16px; border-color: rgba(var(--accent-rgb), 0.35); }
  .gl-merge-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 16px; }
  .gl-sugg { display: grid; grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); font-size: 16px; }
  .gl-sugg:first-of-type { margin-top: 8px; }
  .gl-sugg-meta { display: block; font-size: 14px; color: var(--text-dim); }
  .gl-sugg-arrow { color: var(--gold); }
  .gl-sugg-actions { display: flex; gap: 6px; }
  .gl-sugg-banner { margin-bottom: 14px; padding: 8px 12px; border: 1px solid rgba(var(--accent-rgb), 0.35); border-radius: 4px; background: rgba(var(--accent-rgb), 0.06); font-size: 16px; }
  .gl-sugg-banner a { color: var(--gold-light); cursor: pointer; margin-left: 6px; }
  @media (max-width: 768px) { .gl-sugg { grid-template-columns: auto 1fr; } .gl-sugg-arrow { display: none; } .gl-sugg-actions { grid-column: 1 / -1; } }

  /* Loot distribution SR box: every row uses the same column plan (minmax(0, …) stops content
     from resizing a column row-by-row). Name · ×N · Current · /roll · flags · Award */
  .sr-row { grid-template-columns: minmax(0, 1.4fr) 36px 96px minmax(0, 1.3fr) 124px; }
  .sr-box.with-cur .sr-row { grid-template-columns: minmax(0, 1.3fr) 36px minmax(0, 1.4fr) 96px minmax(0, 1fr) 124px; }
  .sr-row > span { min-width: 0; }
  .sr-name, .sr-cur .cur-item { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sr-row > span:last-child { text-align: right; }
  @media (max-width: 760px) {
    .sr-row, .sr-box.with-cur .sr-row { grid-template-columns: minmax(0, 1fr) auto auto; }
    .sr-row .sr-cur, .sr-row .sr-bal { grid-column: 1 / -1; }
  }

  /* Active raid cards: the instance is the headline when we know it */
  .raid-card-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .raid-card-top .live-dot { align-self: center; }
  .raid-card-inst { font-family: 'Cinzel', serif; font-size: 19px; color: var(--gold-light); letter-spacing: 0.06em; text-shadow: 0 0 14px rgba(var(--accent-rgb), 0.25); }
  .raid-card-sub { font-size: 16px; color: var(--text-dim); }

  /* Items page (everyone): browse raid → boss → item, BLP holders + SR history */
  .iv-top { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
  .iv-top .loot-select-group { min-width: 200px; }
  .iv-top .ac-input, .iv-top #ivSearch input { width: 100%; }
  .iv-grid { display: grid; grid-template-columns: minmax(250px, 330px) minmax(0, 1fr); gap: 18px; align-items: start; }
  .iv-list { border: 1px solid var(--border); border-radius: 6px; background: rgba(10,23,33,0.6); max-height: 640px; overflow-y: auto; }
  .iv-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; border-top: 1px solid rgba(var(--line-rgb), 0.5); font-size: 16px; }
  .iv-row:first-child { border-top: none; }
  .iv-row:hover { background: rgba(var(--accent-rgb), 0.06); }
  .iv-row.selected { background: rgba(var(--accent-rgb), 0.12); box-shadow: inset 3px 0 0 var(--gold); }
  .iv-row-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .iv-row-slot { margin-left: 6px; font-size: 13px; color: var(--text-dim); }
  .iv-badge { font-size: 13px; color: var(--text-dim); border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; white-space: nowrap; }
  .iv-badge.blp { color: var(--gold-light); border-color: rgba(var(--accent-rgb), 0.5); }
  .iv-detail { border: 1px solid var(--border); border-radius: 6px; background: rgba(10,23,33,0.6); padding: 16px 18px; min-height: 200px; }
  .iv-title { font-family: 'Cinzel', serif; font-size: 19px; }
  .iv-sub { font-size: 15px; margin-top: 3px; }
  .iv-dim { color: var(--text-dim); }
  .iv-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0 18px; }
  .iv-stats > div { border: 1px solid var(--border); border-radius: 4px; padding: 8px; text-align: center; }
  .iv-stats b { display: block; font-family: 'Cinzel', serif; font-size: 20px; color: var(--gold-light); }
  .iv-stats span { font-size: 14px; color: var(--text-dim); }
  .iv-blp { display: flex; flex-direction: column; }
  .iv-blp-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px 130px; gap: 10px; padding: 5px 2px; border-top: 1px solid rgba(var(--line-rgb), 0.5); font-size: 16px; align-items: center; }
  .iv-blp-row:first-child { border-top: none; }
  .iv-blp-row .iv-dim { font-size: 14px; text-align: right; }
  .iv-hist td { vertical-align: top; font-size: 16px; }
  .iv-when { white-space: nowrap; }
  .iv-when a { color: var(--gold-light); cursor: pointer; display: block; }
  .iv-when .iv-dim { font-size: 14px; }
  .iv-res { display: flex; flex-direction: column; gap: 2px; }
  .iv-res-chip { font-size: 15px; }
  .iv-tag { font-size: 13px; border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; color: var(--text-dim); margin-left: 4px; }
  .iv-tag.sr { color: #f08080; border-color: rgba(201,76,76,0.5); }
  @media (max-width: 900px) {
    .iv-grid { grid-template-columns: minmax(0, 1fr); }
    .iv-detail { padding: 12px; }
    .iv-blp-row { grid-template-columns: minmax(0, 1fr) auto; }
    .iv-blp-row .iv-dim { grid-column: 1 / -1; text-align: left; }
    .iv-list { max-height: 300px; }
    .iv-stats { grid-template-columns: repeat(2, 1fr); }
  }
  .iv-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

<script>
// ═════════════════════════════════════════════════════════════════════════════
// WoW Forever — Soft Reserve dashboard (v2: raid-centric)
//
// Forked from the DBS TBC Loot Council dashboard. Storage is the same Cloudflare
// Worker + KV namespace, every key under KV_PREFIX ("wf/"):
//   wf/raids.json      raid events: date, name, optional, status, softres sheets
//                      (synced snapshot + manual edits), attendance overrides, loot
//   wf/roster.json     raiders (+ manual SR adjustments)
//   wf/glossary.json   raids → bosses → item keys, and item metadata
//   wf/sr-rules.json   SR earning rules (edited on the SR Rules page)
//   wf/consume-rules.json consumable requirements per class + role (Consumable Rules page)
//
// Nothing is stored about SR balances or bad-luck counters: both are recomputed
// from raids + rules on every load (see computeSrLedger / computeBlp).
// Attendance and consumables come from Warcraft Logs (js_wcl.js / js_ui_consumes.js).
// ═════════════════════════════════════════════════════════════════════════════

// ── Config (config.json overrides; SR rules live in KV, not here) ──
let CF_WORKER_URL = '';
let KV_PREFIX = 'wf/';
let STORAGE_NS = 'wf:';
let GUILD_NAME = 'WoW Forever';
let GUILD_SUBTITLE = 'Soft Reserve Summary';
let PAGE_TITLE = 'WF Loot';
let WOWHEAD_BRANCH = 'classic';
let CORS_API_KEY = '';
let RH_SERVER_ID = '';           // Discord server ID (Raid-Helper server API, via the Worker)
let DEMO_ANNOUNCE_CHANNEL = '';  // demo raids announce here (a test channel) instead of a real sign-up channel
let writeToken = localStorage.getItem('writeToken') || '';

// ── Data ────────────────────────────────────────────────────────
let raidsData = { raids: [] };
let rosterData = { players: [], excluded: [] };
let glossary = { raids: {}, items: {}, imported: {} };
const DEFAULT_SR_RULES = {
  perRaid: 1,
  buff:   { enabled: true, threshold: 80 },
  streak: { enabled: true, every: 5 },
  blp:    { enabled: true, step: 20 },
  bench:  { countsAsAttended: true },
  severe: { srPenalty: true, srs: 1, resetBlp: false },
};
let srRules = JSON.parse(JSON.stringify(DEFAULT_SR_RULES));

// Current gear per raider (from the newest Warcraft Logs report; see rebuildGearListing)
let gearListingByPlayer = {};
let classMap = {};
let itemIcons = {};

const CLASSES = ['Druid','Hunter','Mage','Paladin','Priest','Rogue','Shaman','Warlock','Warrior'];
const ROLE_ORDER = ['Tanks', 'Physical DPS', 'Ranged DPS', 'Healers'];
const ROLE_CLASSES = {
  'Tanks':        ['Warrior', 'Paladin', 'Druid'],
  'Physical DPS': ['Warrior', 'Rogue', 'Paladin', 'Shaman', 'Druid'],
  'Ranged DPS':   ['Hunter', 'Mage', 'Warlock', 'Druid', 'Priest', 'Shaman'],
  'Healers':      ['Priest', 'Paladin', 'Druid', 'Shaman'],
};
const roleSortState = {};
let lastRenderData = { roles: [], dates: [] };
let groupingMode = 'role';


// ── [from LC dashboard] name/escape helpers ─────────────────────────────────────────
// Normalize player names for fuzzy matching (strip special chars, lowercase)
function normalizeName(name) {
  return String(name ?? '').toLowerCase()
    // Expand ligatures before stripping accents
    .replace(/æ/g, 'ae').replace(/œ/g, 'oe').replace(/ß/g, 'ss')
    .replace(/ø/g, 'o').replace(/[đð]/g, 'd').replace(/þ/g, 'th').replace(/ł/g, 'l').replace(/ı/g, 'i')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '') // strip accent marks
    .replace(/[^a-z0-9]/g, '');       // strip everything else
}

/**
 * Escape a value for use as a single-quoted JS string literal.
 *
 * Use with element.setAttribute('onclick', `fn('${jsStr(name)}')`) — setAttribute stores
 * the value verbatim, so it must NOT be HTML-entity encoded.
 *
 * This existed three different ways in this file, two of them broken:
 *   .replace(/'/g, "\'")      → in a double-quoted JS string "\'" is just ' — the
 *                               backslash is dropped at parse time, so this replaced an
 *                               apostrophe with an apostrophe and did nothing at all.
 *   .replace(/'/g, "\\\\'")   → emitted  Pepe\\'s , an escaped backslash followed by a
 *                               string terminator, which also fails to parse.
 * Both produced "Uncaught SyntaxError: missing ) after argument list" and a button that
 * silently did nothing, for any player or item containing an apostrophe.
 */
function jsStr(value) {
  return String(value ?? '')
    .replace(/\\/g, '\\\\')   // must come first, or it re-escapes our own backslashes
    .replace(/'/g, "\\'")
    .replace(/\r/g, '\\r')
    .replace(/\n/g, '\\n');
}

/**
 * Escape a value for a single-quoted JS string inside an HTML attribute built by a
 * template literal — e.g. html += `<button onclick="fn('${jsAttr(name)}')">`.
 *
 * Two layers, in order: JS-string escaping, then HTML-attribute escaping so a name
 * containing " or & cannot terminate the attribute or corrupt an entity. The browser
 * decodes the entities first, leaving valid JS underneath.
 */
function jsAttr(value) {
  return jsStr(value)
    .replace(/&/g, '&amp;')   // before &quot; below, or the ampersand double-encodes
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// Normalize date strings for flexible matching: strip leading zeros, whitespace
// e.g. "03/11", " 3/11 ", "3/11/2026" all -> "3/11"
function normalizeDate(d) {
  return (d || '').trim()
    .replace(/\b0(\d)/g, '$1')   // remove leading zeros from each number
    .replace(/\/\d{4}$/, '')     // strip 4-digit year suffix if present
    .trim();
}

// ── [from LC dashboard] CSV helpers ─────────────────────────────────────────────────
function normalizeClaPaste(text) {
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
  // Detect TSV by checking if the first line has more tabs than commas
  const firstLine = text.split('\n')[0] || '';
  const tabCount = (firstLine.match(/\t/g) || []).length;
  const commaCount = (firstLine.match(/,/g) || []).length;
  if (tabCount <= commaCount) return text; // already CSV-like
  // Convert TSV to CSV: tabs → commas, handle no special quoting needed for CLA data
  return text.split('\n').map(line =>
    line.split('\t').map(cell => {
      // Quote cells containing commas
      return cell.includes(',') ? '"' + cell.replace(/"/g, '""') + '"' : cell;
    }).join(',')
  ).join('\n');
}

function parseCsvRows(text) {
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim().split('\n');
  return lines.map(line => {
    const result = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    result.push(cur.trim());
    return result;
  });
}



// ── [from LC dashboard] date helpers ────────────────────────────────────────────────
function mstDateParts(date) {
  // Shift date to MST (UTC-7) before extracting parts, avoiding browser timezone issues
  const mst = new Date(date.getTime() - 7 * 60 * 60 * 1000);
  const y = mst.getUTCFullYear();
  const m = mst.getUTCMonth(); // 0-indexed
  const d = mst.getUTCDate();
  return { y, m, d };
}

function formatAttendanceDate(date) {
  // ISO date string YYYY-MM-DD in MST
  const { y, m, d } = mstDateParts(date);
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

function todayMST() {
  // Return today's date as YYYY-MM-DD in MST (UTC-7, no DST adjustment)
  return formatAttendanceDate(new Date());
}

function formatRaidLabel(date) {
  // "Mar 19" style, in MST
  const { m, d } = mstDateParts(date);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[m]} ${d}`;
}

// Route CORS-blocked fetches through our own Cloudflare Worker's /proxy endpoint.
//
// This used to point at corsproxy.io. Their free tier is scoped to localhost and dev
// tunnels only, so a free key can never authenticate from a GitHub Pages origin — it
// returns {"error":"Invalid or inactive API key"} on every request regardless of the
// Allowed Domains list. The Worker has no rate limit, no monthly quota, no key, and
// no third party. corsproxy is kept only as a fallback for installs that haven't set
// cf_worker_url yet.
function corsProxyUrl(targetUrl) {
  const base = (CF_WORKER_URL || '').trim().replace(/\/+$/, '');
  if (base) {
    const b = base.startsWith('http') ? base : 'https://' + base;
    return b + '/proxy?url=' + encodeURIComponent(targetUrl);
  }
  let u = 'https://corsproxy.io/?url=' + encodeURIComponent(targetUrl);
  if (CORS_API_KEY) u += '&key=' + encodeURIComponent(CORS_API_KEY);
  return u;
}

// Fetch a Google Sheet tab via Apps Script proxy
async function proxyFetch(targetUrl) {
  const proxies = [
    u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
    u => corsProxyUrl(u),
    u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  ];
  for (const proxy of proxies) {
    try {
      const res = await fetch(proxy(targetUrl));
      if (res.ok) {
        const text = await res.text();
        if (text && text.length > 2) return text;
      }
    } catch(e) {}
  }
  throw new Error('All proxies failed for: ' + targetUrl);
}

// Circuit breaker: when the proxy rejects us for a reason that applies to EVERY request
// (bad credentials, rate limit), failing the remaining ~130 requests one at a time is
// just noise. Trip once and fail the rest fast.
let _corsProxyTripped = null; // null = ok, otherwise the status that tripped it
let _corsProxy429s = 0;
const CORS_429_LIMIT = 3;

// Clear the breaker before any user-initiated fetch. It is scoped to one load, but
// adding a CLA sheet or looking up gear IDs happens long after a load that may have
// tripped it — without this reset those actions fail with a stale "halted" error.
function resetProxyBreaker() {
  _corsProxyTripped = null;
  _corsProxy429s = 0;
}

// Run `items` through `worker` with at most `limit` in flight at once.
// Used to keep corsproxy.io request bursts under its (low) free-tier rate limit
// instead of firing every CLA sheet's requests simultaneously.
async function runWithConcurrency(items, limit, worker) {
  let idx = 0;
  async function next() {
    while (idx < items.length) {
      const i = idx++;
      await worker(items[i], i);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, next));
}

// ── [from LC dashboard] auth (write token) ──────────────────────────────────────────
async function saveGithubToken() {
  const token = document.getElementById('claToken')?.value.trim();
  if (!token) return;

  const saveBtn = document.querySelector('#githubAuthFooter .btn.primary');
  if (saveBtn) { saveBtn.textContent = 'Validating…'; saveBtn.disabled = true; }

  try {
    let base = (CF_WORKER_URL || '').trim().replace(/\/+$/, '');
    if (!base.startsWith('http')) base = 'https://' + base;
    const res = await fetch(`${base}/auth-check`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Token': token },
    });
    if (!res.ok) {
      if (saveBtn) { saveBtn.textContent = 'Save Token'; saveBtn.disabled = false; }
      const input = document.getElementById('claToken');
      if (input) {
        input.style.borderColor = 'var(--red)';
        setTimeout(() => { input.style.borderColor = ''; }, 2000);
      }
      // Show error below the input
      let errEl = document.getElementById('tokenErrorMsg');
      if (!errEl) {
        errEl = document.createElement('div');
        errEl.id = 'tokenErrorMsg';
        errEl.style.cssText = 'color:var(--red);font-size:14px;margin-top:6px;';
        document.querySelector('#githubAuthFooter .btn.primary')?.parentNode?.after(errEl);
        input?.parentNode?.appendChild(errEl);
      }
      errEl.textContent = res.status === 401 ? 'Invalid token — access denied.' : `Validation failed (${res.status}).`;
      return;
    }
  } catch(e) {
    // Worker unreachable — warn but allow (offline scenario)
    console.warn('Token validation fetch failed:', e.message);
  }

  writeToken = token;
  try { localStorage.setItem('writeToken', token); } catch(e) {}
  document.getElementById('claToken').value = '';
  if (saveBtn) { saveBtn.textContent = 'Save Token'; saveBtn.disabled = false; }
  const errEl = document.getElementById('tokenErrorMsg');
  if (errEl) errEl.remove();
  updateAuthState();
}

function clearGithubToken() {
  writeToken = '';
  try { localStorage.removeItem('writeToken'); } catch(e) {}
  // If currently in CLA mode, switch back to role view
  if (['roster','glossary','rules'].includes(groupingMode)) setGrouping('role');
  updateAuthState();
}

function updateAuthState() {
  const authed = !!writeToken;
  const authFooter = document.getElementById('githubAuthFooter');
  const authBar = document.getElementById('githubAuthBar');
  const readOnlyBadge = document.getElementById('readOnlyBadge');

  if (authBar) authBar.style.display = authed ? 'flex' : 'none';

}

// ── [from LC dashboard] Worker storage (KV) + conflict handling ─────────────────────
// ── Version tracking (optimistic locking) ────────────────────────
// Tracks the _v value seen when each file was last loaded.
// If the Worker has a newer version at save time, the save is rejected.
const _loadedVersions = {};

// Every WF key lives under KV_PREFIX so this dashboard never touches LC data.
function _kvKey(filename) { return KV_PREFIX + filename; }

function _workerBase() {
  let base = CF_WORKER_URL.trim().replace(/\/+$/, '');
  if (!base.startsWith('http://') && !base.startsWith('https://')) base = 'https://' + base;
  return base;
}

async function fetchFromWorker(filename) {
  if (!CF_WORKER_URL) throw new Error('CF_WORKER_URL not configured');
  const res = await fetch(`${_workerBase()}/${_kvKey(filename)}`, { cache: 'no-store' });
  // 404 = nothing saved under this prefix yet (fresh WF install) — callers treat null as "empty".
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`Worker fetch failed for ${_kvKey(filename)}: ${res.status}`);
  const data = await res.json();
  // Record the version we loaded so we can detect conflicts on save
  if (data && typeof data._v === 'number') _loadedVersions[filename] = data._v;
  return data;
}

async function _saveJsonNow(filename, data) {
  if (!CF_WORKER_URL) throw new Error('CF_WORKER_URL not configured — set cf_worker_url in config.json');
  if (!writeToken) throw new Error('Write token required — enter it in the auth panel');

  // Optimistic locking: fetch current version from Worker and compare
  // before writing, to detect if someone else saved since we loaded
  try {
    const current = await fetch(`${_workerBase()}/${_kvKey(filename)}`, { cache: 'no-store' });
    if (current.ok) {
      const currentData = await current.json();
      const currentVersion = typeof currentData._v === 'number' ? currentData._v : 0;
      const loadedVersion = typeof _loadedVersions[filename] === 'number' ? _loadedVersions[filename] : 0;
      if (currentVersion > loadedVersion) {
        throw new Error(`CONFLICT:${filename}`);
      }
    }
  } catch(e) {
    if (e.message.startsWith('CONFLICT:')) throw e;
    // If the version check fetch fails, proceed anyway (Worker may not have file yet)
  }

  // Increment version before saving
  const loadedV = typeof _loadedVersions[filename] === 'number' ? _loadedVersions[filename] : 0;
  const nextV = loadedV + 1;
  const dataWithVersion = { ...data, _v: nextV };

  const res = await fetch(`${_workerBase()}/${_kvKey(filename)}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Token': writeToken },
    body: JSON.stringify(dataWithVersion, null, 2),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(`Worker save failed for ${filename}: ${err.error || res.status}`);
  }

  // Update our local version to what we just wrote
  _loadedVersions[filename] = nextV;

  // The LC dashboard re-fetched the file here. That swapped the in-memory object for the
  // server copy while the user could already be making the next edit on the old object,
  // silently dropping or misplacing that edit (easy to hit when adding glossary entries
  // quickly). What we just wrote IS the current state, so there is nothing to reload.
}

// Saves to the same key run one at a time, in order. Two overlapping saves could otherwise
// both pass the version check and land out of order, leaving the older snapshot in KV.
const _saveChains = {};
function saveJsonToGitHub(filename, data) {
  const run = () => _saveJsonNow(filename, data);
  const p = (_saveChains[filename] || Promise.resolve()).catch(() => {}).then(run);
  _saveChains[filename] = p;
  return p;
}

// ── Conflict error handler ───────────────────────────────────────
function handleSaveError(e, filename) {
  if (e.message && e.message.startsWith('CONFLICT:')) {
    const file = e.message.split(':')[1] || filename || 'data';
    addError(
      `Save conflict on ${file}`,
      'Another user saved changes after you loaded this page. ' +
      'Your changes were NOT saved. Please refresh the page to get the latest data, then re-apply your changes.'
    );
  } else {
    addError(`Save failed${filename ? ' (' + filename + ')' : ''}`, e.message || String(e));
  }
}

// Priority: manual edit  >  softres restriction  >  Wowhead "Classes:"  >  armor type.

  Plate:   ['Paladin','Warrior'],
  Shield:  ['Paladin','Shaman','Warrior'],
  Idol:    ['Druid'], Libram: ['Paladin'], Totem: ['Shaman'],
  Wand:    ['Mage','Priest','Warlock'],

function parseWowheadTooltip(html, name) {

  // further down, which would otherwise read as "Cloth"/"Shield".

    .map(([k, p]) => ({ key: k, name: p.name, detail: `${led[k]?.available ?? 0} SR${led[k]?.available === 1 ? '' : 's'} available` })));

    .map(([k, p]) => ({ key: k, name: p.name, detail: `${why(attendanceOf(raid, k))} · ${reservedCount(raid, k)} reserve${reservedCount(raid, k) === 1 ? '' : 's'} (not charged)` })));

// Softres.it — fetched through the Worker's /proxy (softres.it must be on its
// allow-list). The raid page is server-rendered with an Inertia `data-page` JSON
// blob that carries both the reserves and the full item table for each instance,
// so one request gives us everything. We keep a copy; softres is never the
// permanent source of truth.
// ═════════════════════════════════════════════════════════════════════════════
function softresCodeFromUrl(u) {

async function fetchSoftresRaid(code) {
  const target = `https://softres.it/raid/${encodeURIComponent(code)}`;
  const res = await fetch(corsProxyUrl(target), { cache: 'no-store' });
  if (!res.ok) {
    let detail = '';

    throw new Error(`softres fetch failed (HTTP ${res.status}${detail ? ': ' + detail : ''})` +
      (res.status === 403 ? ' — add softres.it to the Worker proxy allow-list' : ''));
  }
  const html = await res.text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const el = doc.querySelector('[data-page]');
  if (!el) throw new Error('softres page had no data-page blob — the site may have changed or the code is wrong');
  const page = JSON.parse(el.getAttribute('data-page'));
  const raid = page?.props?.raid;

// Copy softres data onto a sheet. Returns { changed, imported:[...] }.
function applySoftresData(sheet, raid) {
  const before = JSON.stringify(sheet.reserves);
  sheet.instances = (raid.instances || []).map(i => ({ id: i.id, slug: i.slug, name: i.name }));
  sheet.reserveLimit = raid.reserve_limit ?? null;
  sheet.locked = !!raid.locked;
  sheet.hidden = !!raid.hide_reserves;
  sheet.reserves = (raid.reserves || []).map(r => ({ name: r.name, spec: r.spec ?? null, items: [...(r.items || [])], note: r.note || '', ...(r.discord_id ? { discordId: String(r.discord_id) } : {}) }));
  sheet.raidDate = raid.raid_date ? new Date(raid.raid_date * 1000).toISOString() : null;

  if (sheet.demo) return { changed: false, imported: [], skipped: 'demo' };
  try {
    const data = await fetchSoftresRaid(sheet.code);
    const r = applySoftresData(sheet, data);
    return r;
  } catch(e) {
    sheet.syncError = e.message;
    sheet.syncErrorAt = new Date().toISOString();
    throw e;
  }

// Called on load by write-token holders, and by the "Refresh" buttons.
async function syncSoftres(raids, { quiet = false } = {}) {
  let changed = false, imported = [], errors = [];
  for (const raid of raids) {
    for (const sheet of raid.softres) {
      const hadError = sheet.syncError || null;
      const neverSynced = !sheet.syncedAt;
      try {
        const r = await syncSoftresSheet(raid, sheet);
        // Only write when something meaningful changed — a bare "synced at" bump on
        // every officer's page load would just churn versions and invite conflicts.
        changed ||= r.changed || !!hadError || (neverSynced && !r.skipped);
        imported.push(...(r.imported || []));
      } catch(e) {
        errors.push(`${raid.name} / ${sheet.code}: ${e.message}`);
        if (hadError !== sheet.syncError) changed = true;
      }
    }
  }
  if (imported.some(r => r.raidsTouched)) changed = true; // hand-made items merged → loot records moved
  if (imported.length) {
    setStatus('Checking item types on Wowhead…', 'loading');
    await enrichGlossaryItems(null).catch(e => console.warn('Wowhead enrichment failed:', e.message));
    await saveGlossary().catch(() => {});
  }
  if (changed && writeToken) await saveRaids().catch(() => {});
  invalidateDerived();
  if (errors.length && !quiet) errors.forEach(e => addError('softres', e));
  if (imported.length && writeToken) {
    const merged = imported.reduce((a, r) => a + (r.autoMerged || 0), 0), sugg = glossaryMergeSuggestions().length;
    if (merged || sugg) setStatus(`SR sheet imported${merged ? ` · ${merged} hand-added entr${merged === 1 ? 'y' : 'ies'} merged` : ''}${sugg ? ` · ${sugg} possible match${sugg === 1 ? '' : 'es'} to review in the Item Glossary` : ''}`, 'success');
  }
  return { changed, imported, errors };
}
