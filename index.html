<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<meta name="theme-color" content="#071421">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WF Loot</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --gold-dim: #7a5f28;
    --bg: #0a0a0a;
    --bg2: #111111;
    --bg3: #191919;
    --border: #2a2a22;
    --text: #e8e4dc;
    --text-dim: #a8a89a;
    --red: #c94c4c;
    --green: #4caa6e;
    /* Width of the main content column. Was 960px; +10% for the wider tables. */
    --content-width: 1056px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 17px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Parchment texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(var(--accent-rgb),0.03) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(var(--accent-rgb),0.02) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    /* Widened from 960px to 1056px (+10%) to give the wide tables more room —
       the attendance cell in particular grew by ~24px when the perfect-attendance
       star slot was added. Single knob: change --content-width to retune. */
    max-width: var(--content-width, 1056px);
    margin: 0 auto;
    padding: 40px 24px 80px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    text-align: center;
    padding: 48px 0 20px;
    position: relative;
  }

  header::after {
    content: '';
    display: block;
    width: 320px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 24px auto 0;
  }

  .guild-name {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.4em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 0.05em;
    line-height: 1.1;
    text-shadow: 0 0 40px rgba(var(--accent-rgb),0.3);
  }

  .subtitle {
    margin-top: 10px;
    color: var(--text-dim);
    font-style: italic;
    font-size: 20px;
    letter-spacing: 0.08em;
  }

  /* Dot legend */
  .dot-legend {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin: 16px 0 0;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: inline-block;
    flex-shrink: 0;
  }

  /* Grouping buttons */
  .group-btns {
    display: flex;
    gap: 4px;
  }

  .nav-segments {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin: 4px auto 0;
  }

  .nav-segment {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .nav-segment-label {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-dim);
    font-weight: 700;
  }

  .nav-dropdown {
    position: relative;
    display: inline-block;
  }

  .nav-dropdown-btn {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 9px 18px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .nav-dropdown-btn:hover,
  .nav-dropdown-btn.open {
    border-color: var(--gold-dim);
    color: var(--gold);
  }

  .nav-dropdown-btn.has-active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(var(--accent-rgb),0.08);
  }

  .nav-dropdown-btn .nav-dd-arrow {
    font-size: 9px;
    opacity: 0.6;
    transition: transform 0.15s;
  }

  .nav-dropdown-btn.open .nav-dd-arrow {
    transform: rotate(180deg);
  }

  .nav-dropdown-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 4px;
    display: none;
    flex-direction: column;
    z-index: 200;
    min-width: 100%;
    overflow: hidden;
  }

  .nav-dropdown-menu.open {
    display: flex;
  }

  .nav-dropdown-menu .group-btn {
    border: none;
    border-bottom: 1px solid var(--border);
    border-radius: 0;
    text-align: left;
    padding: 9px 18px;
    white-space: nowrap;
  }

  .nav-dropdown-menu .group-btn:last-child {
    border-bottom: none;
  }

  .nav-dropdown-menu .group-btn:hover {
    border-color: transparent;
    background: rgba(var(--accent-rgb),0.08);
    color: var(--gold);
  }

  .nav-segment-btns {
    display: flex;
    gap: 4px;
    justify-content: center;
  }

  .group-btn.group-btn-large {
    font-size: 13px;
    padding: 10px 28px;
    letter-spacing: 0.15em;
  }

  .group-btn {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
  }

  .group-btn:hover {
    border-color: var(--gold-dim);
    color: var(--gold);
  }

  .group-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(var(--accent-rgb),0.08);
  }

  .role-icon {
    font-size: 11px;
    opacity: 0.75;
    margin-left: 3px;
    cursor: default;
  }

  .role-subtitle {
    font-family: 'Crimson Pro', serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    text-transform: none;
  }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--gold-dim);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
    flex-shrink: 0;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 10px 24px;
    border: 1px solid var(--gold-dim);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--gold);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.2s;
    z-index: -1;
  }

  .btn:hover {
    color: var(--bg);
    border-color: var(--gold);
  }

  .btn:hover::before { transform: scaleX(1); }

  .btn.primary {
    background: var(--gold);
    color: var(--bg);
    border-color: var(--gold);
  }

  .btn.primary:hover { background: var(--gold-light); border-color: var(--gold-light); }
  .btn.primary::before { display: none; }

  .status {
    font-style: italic;
    color: var(--text-dim);
    font-size: 14px;
    margin-left: auto;
  }

  .status.loading { color: var(--gold-dim); }
  .status.error { color: var(--red); }
  .status.success { color: var(--green); }

  /* Role sections */
  .role-section {
    margin-bottom: 48px;
    animation: fadeIn 0.4s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .role-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }

  .role-title {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .role-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--gold-dim), transparent);
  }

  .role-toggle {
    font-size: 11px;
    color: var(--gold-dim);
    margin-left: 6px;
  }

  .role-header:hover .role-count { color: var(--gold); }
  .role-header:hover .role-toggle { color: var(--gold); }

  .role-count {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  /* Table */
  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  thead th:not(:first-child) { text-align: right; }
  thead th[data-col] { cursor: pointer; user-select: none; white-space: nowrap; }
  thead th[data-col]:hover { color: var(--gold); }
  .sort-arrow { color: var(--gold-dim); font-size: 10px; }
  td.points-cell, td.consumes-cell { text-align: center !important; }
  td.att-count { text-align: right !important; font-family: 'Cinzel', serif; font-size: 13px; color: var(--text-dim); }
  td:has(.raid-dots), td:has(.raid-dot), td:has(.raid-star) { text-align: center !important; }

  tbody tr {
    border-bottom: 1px solid rgba(var(--line-rgb),0.6);
    transition: background 0.15s;
  }

  tbody tr:hover { background: rgba(var(--accent-rgb),0.04); }

  tbody tr.na-row { opacity: 0.45; }

  td {
    padding: 10px 12px;
    font-size: 16px;
  }

  td:not(:first-child) { text-align: right; }

  .player-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 400;
    color: var(--text);
    letter-spacing: 0.02em;
    min-width: 16ch;
    width: 16ch;
  }

  .raids-num {
    color: var(--text-dim);
    font-size: 14px;
  }

  .window-num {
    color: var(--text-dim);
    font-size: 14px;
  }

  /* Attendance bar cell */
  .att-cell {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
  }

  .att-pct {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    min-width: 52px;
    text-align: right;
  }

  /* Perfect-attendance flair: 20+ raids and never missed one. Renders INSIDE .att-pct
     in place of the "100%" text, so it occupies the existing column and adds no width —
     the bar and every other row's percentage stay exactly where they were. Display only:
     sorting reads p.pct / p.attended from the data, never this text. */
  .att-star {
    font-size: 16px;
    line-height: 1;
    color: #f0c419;
    filter: drop-shadow(0 0 4px rgba(240,196,25,0.55));
    cursor: default;
  }

  .att-pct.high { color: #8abf50; }
  .att-pct.mid { color: #d4c84a; }
  .att-pct.low { color: #c94c4c; }
  .att-pct.exact100 { color: #4caa6e; }
  .att-bar-fill.exact100 { background: #4caa6e; }
  .att-bar-fill.high { background: #8abf50; }
  .att-bar-fill.mid { background: #d4c84a; }
  .att-bar-fill.low { background: #c94c4c; }
  .att-pct.na { color: var(--text-dim); font-weight: 400; font-family: 'Crimson Pro', serif; font-style: italic; }

  .att-bar-bg {
    width: 80px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .att-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.6s ease;
  }



  /* Summary footer */
  .summary {
    margin-top: 48px;
    padding: 24px;
    border: 1px solid var(--border);
    background: var(--bg2);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    text-align: center;
    align-items: start;
  }

  .summary-item label {
    display: block;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
    min-height: 2.4em;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .summary-item .val {
    font-family: 'Cinzel', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--gold);
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 80px 24px;
    color: var(--text-dim);
    font-style: italic;
  }

  .empty .icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.3;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 0 0 36px;
  }

  /* Points highlighting */
  .points-cell {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    text-align: right;
    color: var(--text-dim);
  }

  .pts-top .points-cell,
  .points-cell.pts-top {
    color: #e05555;
    text-shadow: 0 0 12px rgba(220,80,80,0.5);
  }

  .pts-bottom .points-cell,
  .points-cell.pts-bottom {
    color: #4caa6e;
    text-shadow: 0 0 12px rgba(76,170,110,0.4);
  }

  tr.pts-top {
    background: rgba(200, 60, 60, 0.06);
  }

  tr.pts-bottom {
    background: rgba(76, 170, 110, 0.06);
  }

  /* Priority column */
  .priority-cell {
    text-align: center !important;
  }

  .priority-score {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    cursor: default;
  }

  /* Gear issue flag */
  .gear-flag-cell {
    width: 20px;
    text-align: center;
    padding: 10px 4px;
  }

  .gear-flag {
    color: #e07830;
    font-size: 13px;
    cursor: default;
    filter: drop-shadow(0 0 4px rgba(224,120,48,0.6));
  }

  /* Consumes column */
  .consumes-cell {
    text-align: right;
  }

  /* Inactive players */
  .inactive-row {
    opacity: 0.4;
    filter: grayscale(0.4);
  }

  .inactive-badge {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 2px 6px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* Loot expansion */
  .loot-arrow {
    font-size: 11px;
    color: var(--gold-dim);
    transition: transform 0.2s;
    margin-left: 4px;
  }

  .player-name:hover .loot-arrow { color: var(--gold); }

  .loot-row {
    animation: fadeIn 0.2s ease both;
  }

  .loot-cell {
    padding: 10px 16px 14px 24px !important;
    background: var(--bg2);
    border-bottom: 1px solid var(--border) !important;
  }

  .loot-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .loot-item {
    font-size: 15px;
    color: var(--gold-light);
    background: rgba(var(--accent-rgb),0.07);
    border: 1px solid var(--gold-dim);
    padding: 3px 10px;
    white-space: nowrap;
    text-decoration: none;
    display: inline-block;
    transition: background 0.15s, color 0.15s;
  }

  a.loot-item:hover {
    background: rgba(var(--accent-rgb),0.18);
    color: #fff;
    border-color: var(--gold);
  }

  .expand-section-title {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 8px;
  }

  /* Raw accumulated loot value beside the "Loot Received" heading — the Loot Score
     numerator before the raids-attended divisor. Brighter than the heading so the
     number reads as data rather than as part of the label. */
  .raw-loot-total {
    color: var(--text-dim);
    letter-spacing: 0.08em;
    font-weight: 700;
    cursor: help;
  }

  .cla-entry-label {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    margin-bottom: 6px;
    margin-top: 4px;
  }

  .loot-item.gear-issue {
    color: #e09050;
    border-color: #7a4a20;
    background: rgba(200,120,60,0.07);
  }

  .buff-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 4px;
  }

  .buff-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4px 10px;
    border: 1px solid var(--border);
    font-size: 11px;
    min-width: 70px;
  }

  .buff-label {
    color: var(--text-dim);
    font-size: 10px;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
    text-align: center;
  }

  .buff-val {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 700;
  }

  .buff-ok { border-color: #2a5a3a; background: rgba(76,170,110,0.06); }
  .buff-ok .buff-val { color: var(--green); }
  .buff-missing { border-color: #5a2a2a; background: rgba(200,80,80,0.06); }
  .buff-missing .buff-val { color: var(--red); }
  .buff-partial { border-color: #5a4a20; background: rgba(200,160,60,0.06); }
  .buff-partial .buff-val { color: var(--gold); }

  .no-loot {
    color: var(--text-dim);
    font-size: 14px;
  }

  /* Dot indicators for raid dates */
  .raid-dots {
    display: inline-flex;
    gap: 4px;
    justify-content: center;
    flex-wrap: nowrap;
  }

  .raid-dot {
    width: 8px;
    height: 8px;
    min-width: 8px;
    border-radius: 50%;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .raid-dot.present { background: var(--green); border-color: var(--green); }

  .raid-star {
    font-size: 14px;
    width: 8px;
    height: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    vertical-align: middle;
    overflow: visible;
    position: relative;
    top: -1px;
    color: #4caa6e;
    cursor: default;
    filter: drop-shadow(0 0 3px currentColor);
  }
  .raid-dot.absent { background: transparent; }
  .raid-dot.inactive { background: transparent; border-color: transparent; }

  /* CLA Manager */
  .cla-manager {
    border: 1px solid var(--border);
    background: var(--bg2);
    margin-bottom: 24px;
  }

  .cla-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }

  .cla-header:hover { background: rgba(var(--accent-rgb),0.04); }

  .cla-title {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .cla-count {
    font-size: 12px;
    color: var(--text-dim);
    margin-left: 4px;
  }

  .cla-toggle {
    margin-left: auto;
    color: var(--gold-dim);
    font-size: 12px;
  }

  .cla-body {
    border-top: 1px solid var(--border);
    padding: 16px;
  }

  .cla-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }

  .cla-row-label {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    color: var(--gold);
    min-width: 60px;
  }

  .cla-row-url {
    color: var(--text-dim);
    font-size: 12px;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cla-row-gids {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .cla-remove {

// ── [from LC dashboard] name/escape helpers ─────────────────────────────────────────
// Normalize player names for fuzzy matching (strip special chars, lowercase)
function normalizeName(name) {
  return name.toLowerCase()
    // Expand ligatures before stripping accents
    .replace(/æ/g, 'ae').replace(/œ/g, 'oe').replace(/ß/g, 'ss')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '') // strip accent marks
    .replace(/[^a-z0-9]/g, '');       // strip everything else
}

/**
 * Escape a value for use as a single-quoted JS string literal.
 *
 * Use with element.setAttribute('onclick', `fn('${jsStr(name)}')`) — setAttribute stores
 * the value verbatim, so it must NOT be HTML-entity encoded.
 *
 * This existed three different ways in this file, two of them broken:
 *   .replace(/'/g, "\'")      → in a double-quoted JS string "\'" is just ' — the
 *                               backslash is dropped at parse time, so this replaced an
 *                               apostrophe with an apostrophe and did nothing at all.
 *   .replace(/'/g, "\\\\'")   → emitted  Pepe\\'s , an escaped backslash followed by a
 *                               string terminator, which also fails to parse.
 * Both produced "Uncaught SyntaxError: missing ) after argument list" and a button that
 * silently did nothing, for any player or item containing an apostrophe.
 */
function jsStr(value) {
  return String(value ?? '')
    .replace(/\\/g, '\\\\')   // must come first, or it re-escapes our own backslashes
    .replace(/'/g, "\\'")
    .replace(/\r/g, '\\r')
    .replace(/\n/g, '\\n');
}

/**
 * Escape a value for a single-quoted JS string inside an HTML attribute built by a
 * template literal — e.g. html += `<button onclick="fn('${jsAttr(name)}')">`.
 *
 * Two layers, in order: JS-string escaping, then HTML-attribute escaping so a name
 * containing " or & cannot terminate the attribute or corrupt an entity. The browser
 * decodes the entities first, leaving valid JS underneath.
 */
function jsAttr(value) {
  return jsStr(value)
    .replace(/&/g, '&amp;')   // before &quot; below, or the ampersand double-encodes
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// Normalize date strings for flexible matching: strip leading zeros, whitespace
// e.g. "03/11", " 3/11 ", "3/11/2026" all -> "3/11"
function normalizeDate(d) {
  return (d || '').trim()
    .replace(/\b0(\d)/g, '$1')   // remove leading zeros from each number
    .replace(/\/\d{4}$/, '')     // strip 4-digit year suffix if present
    .trim();
}

// ── [from LC dashboard] CSV helpers ─────────────────────────────────────────────────
function normalizeClaPaste(text) {
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
  // Detect TSV by checking if the first line has more tabs than commas
  const firstLine = text.split('\n')[0] || '';
  const tabCount = (firstLine.match(/\t/g) || []).length;
  const commaCount = (firstLine.match(/,/g) || []).length;
  if (tabCount <= commaCount) return text; // already CSV-like
  // Convert TSV to CSV: tabs → commas, handle no special quoting needed for CLA data
  return text.split('\n').map(line =>
    line.split('\t').map(cell => {
      // Quote cells containing commas
      return cell.includes(',') ? '"' + cell.replace(/"/g, '""') + '"' : cell;
    }).join(',')
  ).join('\n');
}

function parseCsvRows(text) {
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim().split('\n');
  return lines.map(line => {
    const result = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    result.push(cur.trim());
    return result;
  });
}

// Build attendance data from CLA sheets — called after fetchAllClaData()
// For each CLA sheet, reads the date from claSheetDates and checks which
// roster players appear in that sheet's gear issues or gear listing data
function rebuildAttendanceFromCla() {
  // Collect all known raid dates from CLA sheets
  const claRaidDates = {}; // label -> Date
  for (const [label, date] of Object.entries(claSheetDates)) {
    claRaidDates[label] = date;
  }
  if (!Object.keys(claRaidDates).length) return;

  // Sort dates chronologically
  const sortedLabels = Object.keys(claRaidDates).sort(
    (a, b) => claRaidDates[a] - claRaidDates[b]
  );

  // Ensure each date exists in attendanceData.raids
  console.log('[rebuildAttendance] CLA dates:', Object.fromEntries(sortedLabels.map(l => [l, formatAttendanceDate(claRaidDates[l])])));
  let changed = false;
  for (const label of sortedLabels) {
    const date = claRaidDates[label];
    const dateStr = formatAttendanceDate(date);
    const _deleted = attendanceData.deletedDates || [];
    if (_deleted.includes(dateStr)) continue; // manually deleted, don't re-add
    if (!attendanceData.raids.find(r => r.date === dateStr)) {
      attendanceData.raids.push({ date: dateStr, label: formatRaidLabel(date) });
      changed = true;
    }
  }
  // Keep raids sorted chronologically
  attendanceData.raids.sort((a, b) => a.date.localeCompare(b.date));
  // Persist new raids to attendance.json — only if write token available
  if (changed && writeToken) saveAttendanceToGitHub();

  // Build CLA-derived presence from claPlayersByLabel (every player seen in any CLA sheet)
  const claPresence = {}; // playerKey -> Set of dateStr
  for (const [label, playerKeys] of Object.entries(claPlayersByLabel)) {
    const date = claRaidDates[label];
    if (!date) continue;
    const dateStr = formatAttendanceDate(date);
    for (const key of playerKeys) {
      if (!claPresence[key]) claPresence[key] = new Set();
      claPresence[key].add(dateStr);
    }
  }
  // Also catch players who appear in gear listing but had no gear issues tab entry
  for (const [playerKey, gearData] of Object.entries(gearListingByPlayer)) {
    const date = claRaidDates[gearData.label];
    if (!date) continue;
    if (!claPresence[playerKey]) claPresence[playerKey] = new Set();
    claPresence[playerKey].add(formatAttendanceDate(date));
  }

  // Store CLA-derived presence separately so UI can show it vs overrides
  window._claPresence = claPresence;

  // Bake CLA presence into attendance.json as baseline — stored in raids[].players
  // This ensures data survives if CLA sheets are later removed
  for (const raid of attendanceData.raids) {
    if (!raid.players) raid.players = {};
    for (const [key, dates] of Object.entries(claPresence)) {
      // Only set if not already recorded (don't overwrite manual overrides context)
      if (dates.has(raid.date) && raid.players[key] === undefined) {
        raid.players[key] = true;
      }
    }
    // Mark absent players (in roster but not in CLA for this date)
    for (const p of rosterData.players) {
      const key = normalizeName(p.name);
      if (raid.players[key] === undefined) {
        const inCla = claPresence[key]?.has(raid.date) ?? false;
        if (Object.keys(claPresence).length > 0) {
          // We have CLA data for this raid — explicitly mark absent
          raid.players[key] = inCla;
        }
      }
    }
  }
}

// Returns true/false for a player on a raid date, applying overrides over CLA data
function getPlayerAttendance(playerName, dateStr) {
  const key = normalizeName(playerName);
  // Check override first
  if (attendanceData.overrides[key]?.[dateStr] !== undefined) {
    return attendanceData.overrides[key][dateStr];
  }
  // Check live CLA presence (if CLA still loaded)
  if (window._claPresence?.[key]?.has(dateStr)) return true;
  // Fall back to baked-in raid.players baseline (survives CLA loss)
  const raid = attendanceData.raids.find(r => r.date === dateStr);
  if (raid?.players?.[key] !== undefined) return raid.players[key];
  return false;
}

function setPlayerAttendanceOverride(playerName, dateStr, value) {
  const key = normalizeName(playerName);
  if (!attendanceData.overrides[key]) attendanceData.overrides[key] = {};
  // Compute the effective baseline (what getPlayerAttendance would return without an override)
  let baselineValue = false;
  if (window._claPresence?.[key]?.has(dateStr)) {
    baselineValue = true;
  } else {
    const raid = attendanceData.raids.find(r => r.date === dateStr);
    if (raid?.players?.[key] !== undefined) baselineValue = raid.players[key];
  }
  if (value === baselineValue) {
    // Removing override — matches baseline data
    delete attendanceData.overrides[key][dateStr];
    if (!Object.keys(attendanceData.overrides[key]).length) {
      delete attendanceData.overrides[key];
    }
  } else {
    attendanceData.overrides[key][dateStr] = value;
  }
}

function mstDateParts(date) {
  // Shift date to MST (UTC-7) before extracting parts, avoiding browser timezone issues
  const mst = new Date(date.getTime() - 7 * 60 * 60 * 1000);
  const y = mst.getUTCFullYear();
  const m = mst.getUTCMonth(); // 0-indexed
  const d = mst.getUTCDate();
  return { y, m, d };
}

function formatAttendanceDate(date) {
  // ISO date string YYYY-MM-DD in MST
  const { y, m, d } = mstDateParts(date);
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

function todayMST() {
  // Return today's date as YYYY-MM-DD in MST (UTC-7, no DST adjustment)
  return formatAttendanceDate(new Date());
}

function formatRaidLabel(date) {
  // "Mar 19" style, in MST
  const { m, d } = mstDateParts(date);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[m]} ${d}`;
}

// Build the { dates, roles } structure that the rest of the dashboard uses,
// from attendanceData + rosterData — replaces parseCSV output
function buildAttendanceRenderData() {
  const raids = attendanceData.raids;
  if (!raids.length || !rosterData.players.length) return null;

  const dates = raids.map(r => r.label);
  const n = raids.length;

  const ROLE_ORDER = ['Tanks', 'Physical DPS', 'Ranged DPS', 'Healers'];
  const roleMap = {};
  for (const p of rosterData.players) {
    if (!p.role || rosterData.excluded?.includes(p.name)) continue;
    if (!roleMap[p.role]) roleMap[p.role] = [];
    roleMap[p.role].push(p);
  }

  const roles = ROLE_ORDER.filter(r => roleMap[r]).map(roleName => {
    const players = roleMap[roleName].map(p => {
      const flags = raids.map(r => getPlayerAttendance(p.name, r.date));
      const trueIdx = flags.map((b, i) => b ? i : -1).filter(i => i >= 0);
      if (!trueIdx.length) {
        return { name: p.name, attended: 0, window: 0, pct: null, flags, n, inactive: false };
      }
      const first = trueIdx[0], last = trueIdx[trueIdx.length - 1];
      const raidsSinceLast = (n - 1) - last;
      const inactive = raidsSinceLast > 2;
      const windowEnd = inactive ? last : (n - 1);
      const window = windowEnd - first + 1;
      const attended = flags.slice(first, windowEnd + 1).filter(Boolean).length;
      const pct = (attended / window) * 100;
      return { name: p.name, attended, window, pct, flags, n, first, last, inactive };
    });
    return { name: roleName, players };
  });

  return { dates, roles };
}

// ── [from LC dashboard] CLA cache save ──────────────────────────────────────────────
let _githubSaveTimer = null;
async function saveClaSheetsToGitHub() {
  if (!writeToken) return false;
  // Debounce: cancel pending save and wait 600ms to batch rapid calls
  if (_githubSaveTimer) clearTimeout(_githubSaveTimer);
  await new Promise(resolve => { _githubSaveTimer = setTimeout(resolve, 600); });
  _githubSaveTimer = null;
  try {
    const _wbase = (u => u.startsWith('http') ? u : 'https://' + u)(CF_WORKER_URL.trim().replace(/\/+$/, ''));
    const claPayload = { sheets: claSheets, parsed: _claStoredParsed };
    const res = await fetch(`${_wbase}/${_kvKey('cla-sheets.json')}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Token': writeToken },
      body: JSON.stringify(claPayload, null, 2),
    });
    if (res.ok) {
      setHint('✓ Saved!', 'success');
      return true;
    } else {
      // NOTE: this referenced an undefined `putRes`, so every failed save threw a
      // ReferenceError here and reported that instead of the actual HTTP failure.
      let detail = res.status + '';
      try { detail = (await res.json()).message || detail; } catch(_) {}
      setHint(`GitHub save failed: ${detail}`, 'error');
      return false;
    }

// ── [from LC dashboard] Apps Script / CORS proxy / errors / status ──────────────────

// Route CORS-blocked fetches through our own Cloudflare Worker's /proxy endpoint.
//
// This used to point at corsproxy.io. Their free tier is scoped to localhost and dev
// tunnels only, so a free key can never authenticate from a GitHub Pages origin — it
// returns {"error":"Invalid or inactive API key"} on every request regardless of the
// Allowed Domains list. The Worker has no rate limit, no monthly quota, no key, and
// no third party. corsproxy is kept only as a fallback for installs that haven't set
// cf_worker_url yet.
function corsProxyUrl(targetUrl) {
  const base = (CF_WORKER_URL || '').trim().replace(/\/+$/, '');
  if (base) {
    const b = base.startsWith('http') ? base : 'https://' + base;
    return b + '/proxy?url=' + encodeURIComponent(targetUrl);
  }
  let u = 'https://corsproxy.io/?url=' + encodeURIComponent(targetUrl);
  if (CORS_API_KEY) u += '&key=' + encodeURIComponent(CORS_API_KEY);
  return u;
}

// Fetch a Google Sheet tab via Apps Script proxy
async function proxyFetch(targetUrl) {
  const proxies = [
    u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
    u => corsProxyUrl(u),
    u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  ];
  for (const proxy of proxies) {
    try {
      const res = await fetch(proxy(targetUrl));
      if (res.ok) {
        const text = await res.text();
        if (text && text.length > 2) return text;
      }
    } catch(e) {}
  }
  throw new Error('All proxies failed for: ' + targetUrl);
}

// Circuit breaker: when the proxy rejects us for a reason that applies to EVERY request
// (bad credentials, rate limit), failing the remaining ~130 requests one at a time is
// just noise. Trip once and fail the rest fast.
let _corsProxyTripped = null; // null = ok, otherwise the status that tripped it
let _corsProxy429s = 0;
const CORS_429_LIMIT = 3;

// Clear the breaker before any user-initiated fetch. It is scoped to one load, but
// adding a CLA sheet or looking up gear IDs happens long after a load that may have
// tripped it — without this reset those actions fail with a stale "halted" error.
function resetProxyBreaker() {
  _corsProxyTripped = null;
  _corsProxy429s = 0;
}

async function appsScriptFetch(url, _retry = 0) {
  if (_corsProxyTripped) {
    throw new Error('Apps Script fetch skipped — the CORS proxy returned ' + _corsProxyTripped +
      ' and further requests were halted for this load');
  }
  // Apps Script redirects through script.googleusercontent.com, which sends no CORS
  // headers; the proxy follows that redirect and adds them.
  const proxy = corsProxyUrl(url);
  const res = await fetch(proxy);

  if (res.status === 401) {
    // Credentials rejected — applies to every request, so retrying can never help.
    _corsProxyTripped = 401;
    throw new Error('Apps Script fetch failed: 401');
  }

  if (res.status === 403) {
    // With the Worker proxy, 403 means "this target host isn't on the allowlist" —
    // that is specific to ONE url, not a global failure, so it must NOT trip the
    // breaker or a single mistyped sheet URL would abort the entire load.
    let detail = '';
    try { detail = (await res.clone().json()).error || ''; } catch(_) {}
    throw new Error('Apps Script fetch failed: 403' + (detail ? ' — ' + detail : ''));
  }

  if (res.status === 429) {
    if (++_corsProxy429s >= CORS_429_LIMIT) {
      _corsProxyTripped = 429;
      throw new Error('Apps Script fetch failed: 429 (rate limit — halting further requests)');
    }
    if (_retry < 1) {
      // One gentle retry only. Aggressive retries multiply request volume against
      // the very limit we already exceeded.
      const retryAfterSec = parseFloat(res.headers.get('Retry-After'));
      const delayMs = !isNaN(retryAfterSec) ? retryAfterSec * 1000 : 1500 + Math.random() * 500;
      await new Promise(r => setTimeout(r, delayMs));
      return appsScriptFetch(url, _retry + 1);
    }
  }

  if (!res.ok) throw new Error('Apps Script fetch failed: ' + res.status);
  return res.text();
}

// Run `items` through `worker` with at most `limit` in flight at once.
// Used to keep corsproxy.io request bursts under its (low) free-tier rate limit
// instead of firing every CLA sheet's requests simultaneously.
async function runWithConcurrency(items, limit, worker) {
  let idx = 0;
  async function next() {
    while (idx < items.length) {
      const i = idx++;
      await worker(items[i], i);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, next));
}

async function fetchSheet(sheetId, gid) {
  if (!APPS_SCRIPT) throw new Error('Apps Script URL not configured — set apps_script in config.json to fetch sheets by URL');
  const rawUrl = APPS_SCRIPT + '?sheetId=' + sheetId + '&gid=' + gid;
  const text = await appsScriptFetch(rawUrl);
  if (!text.trim() || !text.includes(',')) throw new Error('Response does not look like CSV');
  return text;
}

// Returns true if this player's role means weapon oil is often out of their control
function isPhysicalRole(playerName) {
  const role = lastRenderData.roles.find(r =>
    r.players.some(p => normalizeName(p.name) === normalizeName(playerName))
  )?.name || '';
  return role === 'Tanks' || role === 'Physical DPS';
}

// For a given raid date, get all wepOil values for Physical DPS / Tank players
// Returns a frequency map: {value -> count}
function getRaidWepOilFrequency(dateLabel) {
  const freq = {};
  for (const [key, dates] of Object.entries(buffScoreByPlayerDate)) {
    const score = dates[dateLabel];
    if (!score || score.wepOil === undefined) continue;
    // Find player name from key
    const playerName = Object.keys(canonicalNames).includes(key) ? canonicalNames[key] : key;
    if (!isPhysicalRole(playerName)) continue;
    const val = score.wepOil;
    freq[val] = (freq[val] || 0) + 1;
  }
  return freq;
}

// Determine if a player is exempt from weapon oil scoring.
// Exempt: Hunters, Warriors, Rogues, Physical DPS Shamans,
// Physical DPS Paladins, and Tank Paladins — these classes/specs
// don't use weapon oils (they use ammo, sharpening stones, etc.)
function isWepOilExempt(playerName) {
  const cls = classMap[normalizeName(playerName)];
  if (!cls) return false;
  // Always exempt regardless of role
  if (cls === 'Hunter' || cls === 'Warrior' || cls === 'Rogue') return true;
  // Shaman / Paladin only exempt in physical roles (Physical DPS or Tanks)
  if (cls === 'Shaman' || cls === 'Paladin') return isPhysicalRole(playerName);
  return false;
}

function getAdjustedConsumeScoresByDate(playerName) {
  const key = normalizeName(playerName);
  const raidScores = buffScoreByPlayerDate[key] || {};
  const physical = isPhysicalRole(playerName);
  const wepOilExempt = isWepOilExempt(playerName);
  const attended = Object.keys(raidScores).length;

  // Step 1: compute adjusted score per raid (weapon oil forgiveness / exemption)
  const adjusted = {};
  for (const [dateLabel, score] of Object.entries(raidScores)) {
    if (score.total === null || score.total === undefined) continue;

    const elixir = score.elixir ?? 100;
    const food = score.food ?? 100;

    // If player is exempt from weapon oil, score only on elixir + food
    if (wepOilExempt) {
      adjusted[dateLabel] = (elixir + food) / 2;
      continue;
    }

    let wepOilScore = score.wepOil ?? 100;

    // If physical role, check if wepOil value is shared by 2+ others → raid buff issue
    if (physical) {
      const freq = getRaidWepOilFrequency(dateLabel);
      const othersWithSameValue = (freq[wepOilScore] || 0) - 1; // subtract self
      if (othersWithSameValue >= 2) {
        wepOilScore = 100; // forgive — raid buff issue, not personal
      }
    }

    // Recompute total from components: elixir + food + wepOil, equal weight
    const adjTotal = (elixir + food + wepOilScore) / 3;
    adjusted[dateLabel] = adjTotal;
  }

  const entries = Object.entries(adjusted);
  if (!entries.length) return {};

  // Step 2: per-raid outlier forgiveness based on track record
  // Sort to find median
  const sorted = entries.map(([, v]) => v).sort((a, b) => a - b);
  const median = sorted[Math.floor(sorted.length / 2)];

  // Forgiveness increases with raids attended — same curve as attendance
  const forgiveness = 1 - 1 / (1 + attended / 8);

  const out = {};
  for (const [dateLabel, s] of entries) {
    const gap = median - s;
    // Outlier low raid — blend toward median
    out[dateLabel] = gap > 20 ? s + gap * forgiveness : s;
  }
  return out;
}

// Values only, in raid order. Kept as-is so every existing caller is unaffected.
function getAdjustedConsumeScores(playerName) {
  return Object.values(getAdjustedConsumeScoresByDate(playerName));
}

// Render one "present" raid dot.
//
// This lived inline in TWO renderers (the main role table and the loot-tab table), which
// is how it drifted: both coloured from the RAW score.total while the consumes column and
// the priority modifier used the ADJUSTED score. A weapon-oil-exempt player therefore got
// red dots for an oil they are not expected to use, next to a healthy consumes %. One
// copy now, and it colours from the same adjusted number the score uses.
function presentRaidDotHtml(playerName, dateLabel, displayDate) {
  const key = normalizeName(playerName);
  const raw = (buffScoreByPlayerDate[key] || {})[dateLabel] ?? null;
  const adj = getAdjustedConsumeScoresByDate(playerName)[dateLabel] ?? null;

  const rawPct = raw?.total ?? null;
  const adjPct = adj !== null ? Math.round(adj) : null;
  const scrollsPct = raw?.scrolls ?? 0;
  const wepOilCounts = !isWepOilExempt(playerName);

  let title = `${displayDate}: Present`;
  if (adjPct !== null) {
    title += ` | Buffs: ${adjPct}%`;
    // Show the raw figure too when forgiveness/exemption moved it, so the number in the
    // tooltip can always be reconciled with the CLA sheet.
    if (rawPct !== null && Math.round(rawPct) !== adjPct) title += ` (raw ${Math.round(rawPct)}%)`;
    const missing = [];
    if ((raw?.elixir ?? 100) < 100) missing.push(`Elixir/Flask: ${raw.elixir}%`);
    if ((raw?.food   ?? 100) < 100) missing.push(`Food: ${raw.food}%`);
    // Only list weapon oil when it actually counts against this player.
    if (wepOilCounts && (raw?.wepOil ?? 100) < 100) missing.push(`Wep Oil: ${raw.wepOil}%`);
    if (missing.length) title += '&#10;Missing: ' + missing.join(', ');
    if (!wepOilCounts && (raw?.wepOil ?? 100) < 100) {
      title += '&#10;Weapon oil not required for this class/role — excluded from score.';
    }
  }

  // "Perfect" is judged on the adjusted score for the same reason the colour is.
  if (adjPct !== null && adjPct >= 100 && scrollsPct === 100) {
    return `<span class="raid-star" style="color:#4caa6e;" title="${title}">★</span>`;
  }
  const col = adjPct !== null ? pctColor(adjPct) : null;
  const bgStyle = col ? `background:${col};border-color:${col};` : '';
  return `<div class="raid-dot present" style="${bgStyle}" title="${title}"></div>`;
}

// Get a single adjusted average consume score for display / modifier use
function getAdjustedConsumeAvg(playerName) {
  const scores = getAdjustedConsumeScores(playerName);
  if (!scores.length) return null;
  return scores.reduce((a, b) => a + b, 0) / scores.length;
}

async function saveGithubToken() {
  const token = document.getElementById('claToken')?.value.trim();
  if (!token) return;

  const saveBtn = document.querySelector('#githubAuthFooter .btn.primary');
  if (saveBtn) { saveBtn.textContent = 'Validating…'; saveBtn.disabled = true; }

  try {
    let base = (CF_WORKER_URL || '').trim().replace(/\/+$/, '');
    if (!base.startsWith('http')) base = 'https://' + base;
    const res = await fetch(`${base}/auth-check`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Token': token },
    });
    if (!res.ok) {
      if (saveBtn) { saveBtn.textContent = 'Save Token'; saveBtn.disabled = false; }
      const input = document.getElementById('claToken');
      if (input) {
        input.style.borderColor = 'var(--red)';
        setTimeout(() => { input.style.borderColor = ''; }, 2000);
      }
      // Show error below the input
      let errEl = document.getElementById('tokenErrorMsg');
      if (!errEl) {
        errEl = document.createElement('div');
        errEl.id = 'tokenErrorMsg';
        errEl.style.cssText = 'color:var(--red);font-size:12px;margin-top:6px;';
        document.querySelector('#githubAuthFooter .btn.primary')?.parentNode?.after(errEl);
        input?.parentNode?.appendChild(errEl);
      }
      errEl.textContent = res.status === 401 ? 'Invalid token — access denied.' : `Validation failed (${res.status}).`;
      return;
    }
  } catch(e) {
    // Worker unreachable — warn but allow (offline scenario)
    console.warn('Token validation fetch failed:', e.message);
  }

  writeToken = token;
  try { localStorage.setItem('writeToken', token); } catch(e) {}
  document.getElementById('claToken').value = '';
  if (saveBtn) { saveBtn.textContent = 'Save Token'; saveBtn.disabled = false; }
  const errEl = document.getElementById('tokenErrorMsg');
  if (errEl) errEl.remove();
  updateAuthState();
}
