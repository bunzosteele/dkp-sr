const _navDropdowns = ['navDdGuildMgmt'];
const _navDropdownModes = { navDdGuildMgmt: ['attendance','cla','glossary','lootlog'] };

function navDropdownToggle(id) {
  const menu = document.getElementById(id + 'Menu');
  const btn  = document.getElementById(id + 'Btn');
  if (!menu || !btn) return;
  const isOpen = menu.classList.contains('open');
  _navDropdowns.forEach(did => {
    document.getElementById(did + 'Menu')?.classList.remove('open');
    document.getElementById(did + 'Btn')?.classList.remove('open');
  });
  if (!isOpen) { menu.classList.add('open'); btn.classList.add('open'); }
}

function navDropdownSelect(ddId, mode) {
  document.getElementById(ddId + 'Menu')?.classList.remove('open');
  document.getElementById(ddId + 'Btn')?.classList.remove('open');
  setGrouping(mode);
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.nav-dropdown')) {
    _navDropdowns.forEach(did => {
      document.getElementById(did + 'Menu')?.classList.remove('open');
      document.getElementById(did + 'Btn')?.classList.remove('open');
    });
  }
});

const PANEL_IDS = { loot: 'lootPanel', cla: 'claPanel', glossary: 'glossaryPanel', attendance: 'attendancePanel', lootlog: 'lootlogPanel' };

function setGrouping(mode) {
  if (mode !== 'role' && !PANEL_IDS[mode]) mode = 'role'; // e.g. an old ?tab=bis link
  groupingMode = mode;
  _urlSetParam('tab', mode === 'role' ? '' : mode);
  document.querySelectorAll('.group-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  _navDropdowns.forEach(did => {
    const btn = document.getElementById(did + 'Btn');
    if (btn) btn.classList.toggle('has-active', (_navDropdownModes[did] || []).includes(mode));
  });
  for (const [m, id] of Object.entries(PANEL_IDS)) {
    const el = document.getElementById(id);
    if (el) el.style.display = m === mode ? 'block' : 'none';
  }
  document.getElementById('output').style.display = mode === 'role' ? 'block' : 'none';

  if (mode === 'loot') {
    renderLootDropdowns();
    // Carry the glossary selection over, else restore from the URL
    const src = (_glossaryState.raid && _glossaryState.boss && _glossaryState.item)
      ? _glossaryState
      : { raid: _urlGetParam('raid'), boss: _urlGetParam('boss'), item: _urlGetParam('item') };
    if (src.raid) lootSelectPath(src.raid, src.boss, src.item);
  } else if (mode === 'cla') {
    renderClaList();
  } else if (mode === 'glossary') {
    if (selectedItem) {
      _glossaryState.raid = document.getElementById('lootRaid')?.value || _glossaryState.raid;
      _glossaryState.boss = document.getElementById('lootBoss')?.value || _glossaryState.boss;
      _glossaryState.item = selectedItem;
    } else if (!_glossaryState.raid) {
      _glossaryState.raid = _urlGetParam('gl_raid');
      _glossaryState.boss = _urlGetParam('gl_boss');
      _glossaryState.item = _urlGetParam('gl_item');
    }
    renderGlossaryPanel();
  } else if (mode === 'attendance') {
    renderAttendancePanel();
  } else if (mode === 'lootlog') {
    renderLootLogPanel();
  } else if (lastRenderData.roles.length) {
    render(lastRenderData);
  }
}

// ═════════════════════════════════════════════════════════════════════════════
// Item Glossary — data model
//   lootGlossary.raids[raidName][bossName] = [ { item, eligibleClasses[], wowheadId?, icon?, notes? } ]
// Object key order IS the display order for raids and bosses (renames/reorders rebuild
// the object to preserve it). Only eligibleClasses is required per item.
// ═════════════════════════════════════════════════════════════════════════════
async function loadLootGlossaryFromRepo() {
  try {
    const data = await fetchFromWorker('loot-glossary.json');
    if (data && data.raids && typeof data.raids === 'object') {
      lootGlossary = data;
      console.log('Loaded loot-glossary.json');
    }
  } catch(e) {
    console.warn('loot-glossary.json:', e.message, '(starting empty)');
  }
  rebuildGlossaryData();
}

async function saveGlossaryToGitHub() {
  try { await saveJsonToGitHub('loot-glossary.json', lootGlossary); }
  catch(e) { handleSaveError(e, 'loot-glossary.json'); }
}

function rebuildGlossaryData() {
  const data = [];
  itemIcons = {};
  for (const [raid, bosses] of Object.entries(lootGlossary.raids || {})) {
    for (const [boss, items] of Object.entries(bosses || {})) {
      for (const entry of (items || [])) {
        data.push({ raid, boss, item: entry.item, notes: entry.notes || '',
                    eligibleClasses: entry.eligibleClasses || [],
                    wowheadId: entry.wowheadId || null, icon: entry.icon || null });
        if (entry.wowheadId && entry.icon) itemIcons[entry.wowheadId] = entry.icon;
      }
    }
  }
  glossaryData = data;
  if (groupingMode === 'loot') renderLootDropdowns();
}

function sortRaids(raids) {
  const order = Object.keys(lootGlossary.raids || {});
  return [...raids].sort((a, b) => {
    const ai = order.indexOf(a), bi = order.indexOf(b);
    return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi) || a.localeCompare(b);
  });
}

function findGlossaryItem(itemName) {
  const k = normalizeName(itemName || '');
  return glossaryData.find(e => normalizeName(e.item) === k) || null;
}

// Wowhead item ID for an item, if the glossary entry has one. WoW Forever items may not
// exist on Wowhead at all, so everything below must work with null.
function getItemId(itemName) {
  return findGlossaryItem(itemName)?.wowheadId || null;
}

function itemIconImg(id, size = 18) {
  const icon = id ? itemIcons[id] : null;
  if (!icon) return '';
  return `<img src="https://wow.zamimg.com/images/wow/icons/small/${icon}.jpg" style="width:${size}px;height:${size}px;border:1px solid #444;border-radius:2px;vertical-align:middle;flex-shrink:0;" />`;
}

function itemLink(itemName, linkText) {
  const id = getItemId(itemName);
  if (id) {
    return `<a href="https://www.wowhead.com/${WOWHEAD_BRANCH}/item=${id}" data-wowhead="item=${id}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:inherit;">${itemIconImg(id)}${escHtml(linkText)}</a>`;
  }
  return `<span>${escHtml(linkText)}</span>`;
}

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═════════════════════════════════════════════════════════════════════════════
// Soft reserves
// ═════════════════════════════════════════════════════════════════════════════
// Loot log entries carry `sr: true` when won via soft reserve.
function buildLootByPlayerFromDistribution() {
  const result = {};
  for (const raid of [...lootDistribution.raids].sort((a, b) => a.date.localeCompare(b.date))) {
    for (const entry of (raid.items || [])) {
      if (!entry.item || !entry.recipient) continue;
      const key = normalizeName(entry.recipient);
      if (!result[key]) result[key] = [];
      result[key].push({ name: entry.item, sr: !!entry.sr, date: raid.date, label: raid.label });
    }
  }
  for (const key in result) result[key].reverse(); // most recent first
  return result;
}

// ⚠ PLACEHOLDER RULE — the SR economy isn't defined yet. Everything that decides how many
// SRs a raider has lives in this one function so it can be swapped out in one place.
//   available = starting + (raids attended × per_raid) + manual adjustments − items won via SR
// per_raid / starting come from config.json → "sr": { "per_raid": 1, "starting": 0 }.
function getSrStats(playerName) {
  const key = normalizeName(playerName);
  const attendedTotal = attendanceData.raids.filter(r => getPlayerAttendance(playerName, r.date)).length;
  const earned = SR_STARTING + attendedTotal * SR_PER_RAID;
  const spent = (lootByPlayer[key] || []).filter(e => e.sr).length;
  const rp = rosterData.players.find(p => normalizeName(p.name) === key);
  const adjustments = rp?.srAdjustments || [];
  const adjusted = adjustments.reduce((s, a) => s + (Number(a.delta) || 0), 0);
  const available = earned + adjusted - spent;
  const tooltip = [
    `Earned: ${earned}` + (SR_STARTING ? ` (${SR_STARTING} starting + ${attendedTotal} raids × ${SR_PER_RAID})` : ` (${attendedTotal} raids × ${SR_PER_RAID})`),
    adjusted ? `Adjustments: ${adjusted > 0 ? '+' : ''}${adjusted}` : null,
    `Spent: ${spent} item${spent === 1 ? '' : 's'} won via SR`,
    `Available: ${available}`,
  ].filter(Boolean).join('&#10;');
  return { earned, spent, adjusted, available, attendedTotal, tooltip };
}

function srCellHtml(playerName) {
  const s = getSrStats(playerName);
  const col = s.available <= 0 ? 'var(--text-dim)' : 'var(--gold-light)';
  return `<span class="priority-score" style="color:${col};" title="${s.tooltip}">${s.available}</span>`;
}

// ═════════════════════════════════════════════════════════════════════════════
// Guild Overview (always grouped by role)
// ═════════════════════════════════════════════════════════════════════════════
const ROLE_ORDER = ['Tanks', 'Physical DPS', 'Ranged DPS', 'Healers'];

function consumeAvg(playerName) {
  const scores = getAdjustedConsumeScores(playerName);
  return scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null;
}

function getSortedPlayers(roleName, players) {
  const { col, dir } = roleSortState[roleName] || { col: 'srs', dir: 'desc' };
  const withPct  = players.filter(p => p.pct !== null && !p.inactive);
  const noPct    = players.filter(p => p.pct === null && !p.inactive);
  const inactive = players.filter(p => p.inactive);
  const val = p => {
    if (col === 'player')   return p.name.toLowerCase();
    if (col === 'srs')      return getSrStats(p.name).available;
    if (col === 'consumes') return consumeAvg(p.name) ?? -1;
    if (col === 'pct')      return p.pct ?? -1;
    return p.attended; // 'attendance'
  };
  withPct.sort((a, b) => {
    const av = val(a), bv = val(b);
    if (av < bv) return dir === 'asc' ? -1 : 1;
    if (av > bv) return dir === 'asc' ? 1 : -1;
    // Tie-break: attendance % desc, then name
    return (b.pct ?? 0) - (a.pct ?? 0) || a.name.localeCompare(b.name);
  });
  return [...withPct, ...noPct, ...inactive];
}

function toggleRole(safeId) {
  const body = document.getElementById('rolebody-' + safeId);
  const arrow = document.getElementById('roletoggle-' + safeId);
  if (!body) return;
  const collapsed = body.style.display === 'none';
  body.style.display = collapsed ? '' : 'none';
  if (arrow) arrow.textContent = collapsed ? '▾' : '▸';
}

function setSort(safeId, roleName, col) {
  const cur = roleSortState[roleName] || { col: 'srs', dir: 'desc' };
  const dir = cur.col === col ? (cur.dir === 'desc' ? 'asc' : 'desc') : (col === 'player' ? 'asc' : 'desc');
  roleSortState[roleName] = { col, dir };
  render(lastRenderData);
}

function gearFlagHtml(playerName) {
  const gi = latestGearIssuesByPlayer[normalizeName(playerName)];
  const issues = (gi?.issues || []).filter(i => typeof i === 'string');
  if (!issues.length) return '';
  const col = gearColor(issues.length);
  return `<span class="gear-flag" style="color:${col};filter:drop-shadow(0 0 4px ${col}88);" title="${escHtml(issues.join('\n')).replace(/\n/g, '&#10;')}">⚠</span>`;
}

function raidDotsHtml(p, dates) {
  const MAX_DOTS = 10;
  const dotStart = Math.max(0, p.n - MAX_DOTS);
  let html = '<div class="raid-dots">';
  for (let i = dotStart; i < p.n; i++) {
    const dateLabel = attendanceData.raids[i]?.date || normalizeDate(dates[i]);
    if (p.pct === null) {
      html += `<div class="raid-dot absent" title="${dates[i]}"></div>`;
    } else if (i < p.first) {
      html += `<div class="raid-dot inactive"></div>`;
    } else if (i > p.last) {
      // Misses after the last attendance count against an active raider (same as pct);
      // only a raider past the inactivity grace window gets blank dots.
      html += p.inactive ? `<div class="raid-dot inactive"></div>` : `<div class="raid-dot absent" title="${dates[i]}: Absent"></div>`;
    } else if (!p.flags[i]) {
      html += `<div class="raid-dot absent" title="${dates[i]}: Absent"></div>`;
    } else {
      html += presentRaidDotHtml(p.name, dateLabel, dates[i]);
    }
  }
  return html + '</div>';
}

function consumesCellHtml(playerName) {
  const avg = consumeAvg(playerName);
  if (avg === null) return '<span style="color:var(--text-dim);font-style:italic;font-size:13px;">—</span>';
  const r = Math.round(avg);
  return `<span style="font-family:'Cinzel',serif;font-size:13px;font-weight:700;color:${pctColor(r)};">${r}%</span>`;
}

function playerRowHtml(p, dates, opts = {}) {
  const cls = pctClass(p.pct);
  const pctStr = p.pct !== null ? (p.pct % 1 === 0 ? p.pct.toFixed(0) : p.pct.toFixed(1)) + '%' : 'N/A';
  const cc = classColor(p.name);
  const badge = opts.badge === 'Inactive' ? `<span title="Inactive" style="font-size:11px;opacity:0.7;">💤</span> `
              : opts.badge === 'Received' ? `<span title="Already received" style="font-size:11px;">✓</span> ` : '';
  const roleIcon = opts.showRole ? ` <span class="role-icon" title="${playerRoleName(p.name)}">${playerRoleIcon(p.name)}</span>` : '';
  return `<tr class="${p.pct === null ? 'na-row' : ''}${p.inactive ? ' inactive-row' : ''}" style="${opts.dimmed ? 'opacity:0.35;' : ''}">
    <td class="player-name" onclick="toggleLoot(this, '${jsAttr(p.name)}')" style="cursor:pointer;" title="Click to view loot"><span class="loot-arrow">▸</span> ${badge}<span style="${cc ? 'color:' + cc + ';' : ''}">${escHtml(p.name)}</span>${roleIcon}</td>
    <td class="gear-flag-cell">${gearFlagHtml(p.name)}</td>
    <td class="priority-cell">${srCellHtml(p.name)}</td>
    <td class="consumes-cell">${consumesCellHtml(p.name)}</td>
    <td>${raidDotsHtml(p, dates)}</td>
    <td class="att-count">${p.attended}</td>
    <td>
      <div class="att-cell">
        <div class="att-bar-bg"><div class="att-bar-fill ${cls}" style="width:${p.pct ?? 0}%"></div></div>
        <span class="att-pct ${cls}">${hasPerfectAttendance(p)
          ? `<span class="att-star" title="Perfect attendance — ${p.attended} raids, ${pctStr}">★</span>`
          : pctStr}</span>
      </div>
    </td>
  </tr>`;
}

function tableColgroup() {
  return `<colgroup>
    <col style="width:18ch;min-width:16ch;"> <!-- Player -->
    <col style="width:24px;">  <!-- Gear flag -->
    <col style="width:80px;">  <!-- SRs Available -->
    <col style="width:64px;">  <!-- Buffs -->
    <col>                      <!-- Raids (dots) -->
    <col style="width:50px;">  <!-- # -->
    <col style="width:130px;"> <!-- Attendance % -->
  </colgroup>`;
}

function render({ dates, roles }) {
  const out = document.getElementById('output');
  lastRenderData = { roles, dates };

  if (!roles.length || !dates.length) {
    out.innerHTML = `<div class="empty"><div class="icon">⚔</div>
      <div>No raids recorded yet.</div>
      <div style="margin-top:10px;font-size:14px;">Add raiders under <em>Management → Roster</em>, add a raid's CLA under <em>Management → CLA</em>,
      or (officers) run <code>seedFromLegacy()</code> in the browser console to pull test data from the LC dashboard.</div></div>`;
    return;
  }

  const allActive = roles.flatMap(r => r.players).filter(p => p.pct !== null && !p.inactive);
  let wSum = 0, wTot = 0;
  allActive.filter(p => p.attended >= 2).forEach(p => {
    const a = consumeAvg(p.name);
    if (a === null) return;
    wSum += a * p.attended; wTot += p.attended;
  });
  const avgConsumeStr = wTot ? (wSum / wTot).toFixed(1) + '%' : '—';
  const avgPct = allActive.length ? allActive.reduce((s, p) => s + p.pct, 0) / allActive.length : 0;
  const total = roles.flatMap(r => r.players).filter(p => p.name).length;

  const sortTh = (roleSafeId, roleName, state, col, label, title = '', align = 'center') =>
    `<th data-col="${col}" onclick="setSort('${roleSafeId}', '${jsAttr(roleName)}', '${col}')" style="cursor:pointer;text-align:${align};" title="${title}">${label}<span class="sort-arrow">${state.col === col ? (state.dir === 'desc' ? ' ▾' : ' ▴') : ' ⬦'}</span></th>`;

  let html = '';
  for (const role of roles) {
    if (!role.players.length) continue;
    const roleSafeId = role.name.replace(/\s+/g, '-');
    const state = roleSortState[role.name] || { col: 'srs', dir: 'desc' };
    const sorted = getSortedPlayers(role.name, role.players);
    html += `
    <div class="role-section">
      <div class="role-header" onclick="toggleRole('${roleSafeId}')" style="cursor:pointer;">
        <span class="role-title">${ROLE_ICONS[role.name] ? ROLE_ICONS[role.name] + ' ' : ''}${ROLE_DISPLAY_NAMES[role.name] || role.name}</span>
        <div class="role-line"></div>
        <span class="role-count">${sorted.filter(p => p.pct !== null && !p.inactive).length} active <span class="role-toggle" id="roletoggle-${roleSafeId}">▾</span></span>
      </div>
      <div class="role-body" id="rolebody-${roleSafeId}">
      <table>
        ${tableColgroup()}
        <thead id="thead-${roleSafeId}"><tr>
          ${sortTh(roleSafeId, role.name, state, 'player', 'Player', '', 'left')}
          <th></th>
          ${sortTh(roleSafeId, role.name, state, 'srs', 'SRs Available', 'Soft reserves this raider can currently spend. Hover a value for the breakdown.')}
          ${sortTh(roleSafeId, role.name, state, 'consumes', 'Buffs', 'Uptime of all required consumables.')}
          <th style="text-align:center;" title="Last 10 raids. Color indicates consumable usage.">Raids</th>
          ${sortTh(roleSafeId, role.name, state, 'attendance', '#')}
          ${sortTh(roleSafeId, role.name, state, 'pct', 'Attendance %')}
        </tr></thead>
        <tbody id="table-${roleSafeId}">${sorted.map(p => playerRowHtml(p, dates)).join('')}</tbody>
      </table></div></div>`;
  }

  html += `
    <div class="summary">
      <div class="summary-item"><label>Raiders</label><div class="val">${total}</div></div>
      <div class="summary-item"><label>Active Raiders</label><div class="val">${allActive.length}</div></div>
      <div class="summary-item"><label>Avg Attendance</label><div class="val">${avgPct.toFixed(1)}%</div></div>
      <div class="summary-item"><label>Avg Consumes</label><div class="val">${avgConsumeStr}</div></div>
      <div class="summary-item"><label># Raids</label><div class="val">${dates.length}</div></div>
    </div>`;
  out.innerHTML = html;
  refreshWowhead();
}

function refreshWowhead(delay = 200) {
  setTimeout(() => { if (typeof $WowheadPower !== 'undefined' && $WowheadPower.refreshLinks) $WowheadPower.refreshLinks(); }, delay);
}

// ═════════════════════════════════════════════════════════════════════════════
// Raider dropdown (loot received, roster edit, SR adjustments)
// ═════════════════════════════════════════════════════════════════════════════
function lootItemChipHtml({ name, sr, label }) {
  // Two border colours only: green = won without an SR, red = won via SR.
  const col = sr ? C5 : C1;
  const tip = `${label ? label + ' — ' : ''}${sr ? 'Won via SR' : 'Won without SR'}`;
  return `<span class="loot-item" style="border-color:${col};background:${col}18;" title="${escHtml(tip)}">${itemLink(name, name)}</span>`;
}

function reopenLootRow(playerName) {
  document.querySelectorAll('.loot-row').forEach(row => {
    const nameTd = row.previousElementSibling?.querySelector('.player-name');
    if (nameTd && normalizeName(nameTd.textContent.replace(/[▸▾✓💤]/g, '').trim()) === normalizeName(playerName)) {
      row.remove();
      const arrow = nameTd.querySelector('.loot-arrow');
      if (arrow) arrow.textContent = '▸';
      setTimeout(() => nameTd.click(), 50);
    }
  });
}

function toggleLoot(td, playerName) {
  const tr = td.closest('tr');
  const arrow = td.querySelector('.loot-arrow');
  const existing = tr.nextElementSibling;
  if (existing && existing.classList.contains('loot-row')) {
    existing.remove();
    arrow.textContent = '▸';
    return;
  }

  const key = normalizeName(playerName);
  const items = lootByPlayer[key] || [];
  const lootTr = document.createElement('tr');
  lootTr.className = 'loot-row';
  let html = `<td colspan="${tr.children.length}" class="loot-cell">`;

  // "+ LOG" buttons on the Loot Distribution tab when an item is selected
  let assignHtml = '';
  if (writeToken && selectedItem && groupingMode === 'loot' && lootDistribution.raids.length) {
    const latest = [...lootDistribution.raids].sort((a, b) => b.date.localeCompare(a.date))[0];
    const trunc = selectedItem.length > 18 ? selectedItem.slice(0, 17) + '…' : selectedItem;
    const btn = (sr) => `<button class="write-gated" onclick="lootLogAssignFromLootTab('${jsAttr(playerName)}', '${jsAttr(selectedItem)}', ${sr})"
        style="background:none;border:1px solid ${sr ? C5 : 'var(--gold)'};color:${sr ? C5 : 'var(--gold)'};padding:4px 12px;border-radius:4px;cursor:pointer;font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.1em;margin-left:10px;line-height:1.4;display:inline-flex;flex-direction:column;align-items:center;">
        <span>+ LOG ${escHtml(trunc)}${sr ? ' (SR)' : ''}</span><span style="font-size:9px;opacity:0.7;letter-spacing:0.05em;">${latest.label}</span>
      </button>`;
    assignHtml = btn(false) + btn(true);
  }
  const srCount = items.filter(i => i.sr).length;
  html += `<div style="display:flex;align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:4px;">
    <div class="expand-section-title" style="margin-bottom:0;">Loot Received</div>
    ${items.length ? `<span style="font-size:12px;color:var(--text-dim);margin-left:8px;">${items.length} item${items.length === 1 ? '' : 's'} · <span style="color:${C5};">${srCount} via SR</span></span>` : ''}
    ${assignHtml}</div>`;
  html += items.length
    ? `<div class="loot-list" style="margin-top:6px;">${items.map(lootItemChipHtml).join('')}</div>`
    : `<em class="no-loot">No loot recorded</em>`;

  // Role / class / alt edit (Roster tab only)
  if (writeToken && groupingMode === 'attendance') {
    const rp = rosterData.players.find(p => normalizeName(p.name) === key);
    if (rp) {
      html += `<div class="expand-section-title" style="margin-top:12px;">Edit Player</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;">
          <select id="editRole_${key}" onchange="rosterEditRoleChanged('${key}')" class="roster-edit-sel">
            ${ROLE_ORDER.map(r => `<option value="${r}" ${r === rp.role ? 'selected' : ''}>${r}</option>`).join('')}
          </select>
          <select id="editClass_${key}" class="roster-edit-sel">
            ${(ROLE_CLASSES[rp.role] || CLASSES).map(c => `<option value="${c}" ${c === rp.class ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
          <label style="font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px;">Alt?
            <input type="checkbox" id="editAlt_${key}" ${rp.isAlt ? 'checked' : ''} style="width:15px;height:15px;cursor:pointer;accent-color:var(--gold-dim);"></label>
          <button onclick="rosterUpdatePlayer('${jsAttr(playerName)}', document.getElementById('editRole_${key}').value, document.getElementById('editClass_${key}').value, document.getElementById('editAlt_${key}').checked)" class="small-gold-btn">SAVE</button>
          <button onclick="rosterRemovePlayer('${jsAttr(playerName)}')" style="background:none;border:1px solid var(--border);color:var(--text-dim);padding:5px 10px;border-radius:4px;cursor:pointer;font-size:12px;">Remove</button>
        </div>`;
    }
  }

  // Manual SR adjustment (replaces the LC dashboard's "Add Loot Value")
  if (writeToken) {
    const s = getSrStats(playerName);
    const rp = rosterData.players.find(p => normalizeName(p.name) === key);
    const adj = rp?.srAdjustments || [];
    html += `<div class="expand-section-title" style="margin-top:12px;">Adjust SRs <span style="color:var(--text-dim);letter-spacing:0.05em;">— ${s.available} available</span></div>`;
    if (!rp) {
      html += `<div style="font-size:12px;color:var(--text-dim);">Add this player to the roster to adjust SRs.</div>`;
    } else {
      html += `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;">
          <input type="number" id="srAdj_${key}" placeholder="±N" step="1" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:4px;font-size:13px;width:70px;"
            onkeydown="if(event.key==='Enter')rosterAddSrAdjustment('${jsAttr(playerName)}')">
          <input type="text" id="srAdjNote_${key}" placeholder="Note (e.g. bonus for progression night)" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:4px;font-size:13px;flex:1;min-width:180px;"
            onkeydown="if(event.key==='Enter')rosterAddSrAdjustment('${jsAttr(playerName)}')">
          <button onclick="rosterAddSrAdjustment('${jsAttr(playerName)}')" class="small-gold-btn">ADJUST</button>
        </div>`;
      if (adj.length) {
        html += `<div style="margin-top:6px;font-size:12px;color:var(--text-dim);display:flex;flex-direction:column;gap:2px;">` +
          adj.map((a, i) => `<div>${a.date} · <span style="color:${a.delta > 0 ? C1 : C5};">${a.delta > 0 ? '+' : ''}${a.delta}</span> · ${escHtml(a.note || '')}
            <button onclick="rosterRemoveSrAdjustment('${jsAttr(playerName)}', ${i})" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:11px;">✕</button></div>`).join('') +
          `</div>`;
      }
    }
  }

  html += `</td>`;
  lootTr.innerHTML = html;
  tr.after(lootTr);
  arrow.textContent = '▾';
  refreshWowhead();
}

function rosterEditRoleChanged(key) {
  const role = document.getElementById('editRole_' + key)?.value;
  const cs = document.getElementById('editClass_' + key);
  if (!cs) return;
  const cur = cs.value;
  cs.innerHTML = (ROLE_CLASSES[role] || CLASSES).map(c => `<option value="${c}" ${c === cur ? 'selected' : ''}>${c}</option>`).join('');
}

async function rosterUpdatePlayer(playerName, newRole, newClass, isAlt) {
  const p = rosterData.players.find(p => normalizeName(p.name) === normalizeName(playerName));
  if (!p) return;
  p.role = newRole; p.class = newClass; p.isAlt = isAlt;
  rebuildClassMap();
  await saveRosterToGitHub();
  if (groupingMode === 'attendance') renderAttendancePanel();
}

async function rosterAddSrAdjustment(playerName) {
  const key = normalizeName(playerName);
  const delta = parseInt(document.getElementById('srAdj_' + key)?.value, 10);
  if (!delta) { setStatus('Enter a non-zero SR adjustment (e.g. 1 or -1).', 'error'); return; }
  const note = document.getElementById('srAdjNote_' + key)?.value.trim() || 'Manual adjustment';
  const rp = rosterData.players.find(p => normalizeName(p.name) === key);
  if (!rp) return;
  if (!rp.srAdjustments) rp.srAdjustments = [];
  rp.srAdjustments.push({ date: todayMST(), delta, note });
  await saveRosterToGitHub();
  rerenderCurrentView();
  reopenLootRow(playerName);
}

async function rosterRemoveSrAdjustment(playerName, idx) {
  const rp = rosterData.players.find(p => normalizeName(p.name) === normalizeName(playerName));
  if (!rp?.srAdjustments?.[idx]) return;
  if (!confirm(`Remove SR adjustment "${rp.srAdjustments[idx].note}" (${rp.srAdjustments[idx].delta})?`)) return;
  rp.srAdjustments.splice(idx, 1);
  await saveRosterToGitHub();
  rerenderCurrentView();
  reopenLootRow(playerName);
}

function rerenderCurrentView() {
  if (groupingMode === 'role' && lastRenderData.roles.length) render(lastRenderData);
  else if (groupingMode === 'loot') onItemChange();
  else if (groupingMode === 'attendance') renderAttendancePanel();
  else if (groupingMode === 'lootlog') renderLootLogPanel();
}

// Assign the Loot Distribution tab's selected item to a player on the latest raid.
function lootLogAssignFromLootTab(playerName, itemName, sr) {
  if (!lootDistribution.raids.length) { alert('No raids in the Loot Log yet. Add a raid on the Loot Log tab first.'); return; }
  const latestRaid = [...lootDistribution.raids].sort((a, b) => b.date.localeCompare(a.date))[0];
  if (latestRaid.date !== todayMST()) {
    if (!confirm(`The most recent raid in the log is ${latestRaid.label}, not today.\n\nAssign "${itemName}"${sr ? ' (SR)' : ''} to ${playerName} on ${latestRaid.label}?`)) return;
  }
  if (sr && getSrStats(playerName).available <= 0) {
    if (!confirm(`${playerName} has no SRs available. Log this as an SR win anyway?`)) return;
  }
  if (!latestRaid.items) latestRaid.items = [];
  latestRaid.items.push({ item: itemName, recipient: playerName, sr: !!sr });
  lootByPlayer = buildLootByPlayerFromDistribution();
  saveLootDistributionToGitHub();
  onItemChange();
}

let selectedItem = '';

function renderLootDropdowns() {
  if (groupingMode !== 'loot') return;
  const raidSel = document.getElementById('lootRaid');
  const cur = raidSel.value;
  const raids = sortRaids([...new Set(glossaryData.map(r => r.raid))]);
  raidSel.innerHTML = '<option value="">— Select Raid —</option>' +
    raids.map(r => `<option value="${escHtml(r)}" ${r === cur ? 'selected' : ''}>${escHtml(r)}</option>`).join('');
  if (!raids.length) {
    document.getElementById('lootEligible').innerHTML =
      '<p style="color:var(--text-dim);font-style:italic;">The Item Glossary is empty — add raids, bosses and items under <em>Management → Item Glossary</em>.</p>';
  }
  if (cur && raids.includes(cur)) onRaidChange(true);
}

// Select raid → boss → item programmatically (URL restore / glossary hand-off)
function lootSelectPath(raid, boss, item) {
  const rSel = document.getElementById('lootRaid');
  if (!rSel || ![...rSel.options].some(o => o.value === raid)) return;
  rSel.value = raid; onRaidChange(true);
  const bSel = document.getElementById('lootBoss');
  if (boss && [...bSel.options].some(o => o.value === boss)) { bSel.value = boss; onBossChange(); }
  if (item && glossaryData.some(e => e.raid === raid && e.boss === bSel.value && e.item === item)) {
    const id = getItemId(item);
    selectItem(item, id, id ? itemIcons[id] : null);
  }
}

function onRaidChange(preserveBoss = false) {
  const raid = document.getElementById('lootRaid').value;
  _urlSetParam('raid', raid);
  if (!raid) { _urlSetParam('boss', ''); _urlSetParam('item', ''); }
  const bossSel = document.getElementById('lootBoss');
  const prevBoss = bossSel.value;
  bossSel.innerHTML = '<option value="">— Select Boss —</option>';
  resetItemSelector();
  if (!raid) { bossSel.disabled = true; return; }
  const bosses = Object.keys(lootGlossary.raids?.[raid] || {});
  bossSel.innerHTML = '<option value="">— Select Boss —</option>' +
    bosses.map(b => `<option value="${escHtml(b)}">${escHtml(b)}</option>`).join('');
  bossSel.disabled = false;
  if (bosses.length) {
    bossSel.value = preserveBoss && bosses.includes(prevBoss) ? prevBoss : bosses[0];
    onBossChange();
  }
}

function resetItemSelector() {
  selectedItem = '';
  const display = document.getElementById('lootItemDisplay');
  display?.querySelector('img')?.remove();
  const text = document.getElementById('lootItemText');
  if (text) text.textContent = '— Select Item —';
  const dropdown = document.getElementById('lootItemDropdown');
  if (dropdown) { dropdown.innerHTML = ''; dropdown.style.display = 'none'; }
  if (display) { display.style.opacity = '0.4'; display.style.pointerEvents = 'none'; }
  document.getElementById('lootEligible').innerHTML = '';
}

function onBossChange() {
  const raid = document.getElementById('lootRaid').value;
  const boss = document.getElementById('lootBoss').value;
  _urlSetParam('boss', boss);
  if (!boss) _urlSetParam('item', '');
  resetItemSelector();
  if (!boss) return;
  const display = document.getElementById('lootItemDisplay');
  const dropdown = document.getElementById('lootItemDropdown');
  const items = glossaryData.filter(r => r.raid === raid && r.boss === boss);
  if (!items.length) {
    document.getElementById('lootEligible').innerHTML = '<p style="color:var(--text-dim);font-style:italic;">No items for this boss yet.</p>';
    return;
  }
  for (const e of items) {
    const opt = document.createElement('div');
    opt.className = 'loot-item-option';
    opt.innerHTML = `${e.wowheadId && e.icon ? `<img src="https://wow.zamimg.com/images/wow/icons/small/${e.icon}.jpg" />` : ''}<span></span>`;
    opt.querySelector('span').textContent = e.item;
    opt.onclick = () => selectItem(e.item, e.wowheadId, e.icon);
    dropdown.appendChild(opt);
  }
  display.style.opacity = '1';
  display.style.pointerEvents = 'auto';
}

function toggleItemDropdown() {
  const dd = document.getElementById('lootItemDropdown');
  dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
}

function selectItem(item, id, iconName) {
  selectedItem = item;
  _urlSetParam('item', item);
  const display = document.getElementById('lootItemDisplay');
  const text = document.getElementById('lootItemText');
  const dropdown = document.getElementById('lootItemDropdown');
  display.querySelector('img')?.remove();
  if (iconName) {
    const img = document.createElement('img');
    img.src = `https://wow.zamimg.com/images/wow/icons/small/${iconName}.jpg`;
    img.style.cssText = 'width:18px;height:18px;border:1px solid #444;border-radius:2px;flex-shrink:0;';
    display.insertBefore(img, text);
  }
  text.textContent = item;
  dropdown.querySelectorAll('.loot-item-option').forEach(opt =>
    opt.classList.toggle('selected', opt.querySelector('span')?.textContent === item));
  dropdown.style.display = 'none';
  onItemChange();
}

document.addEventListener('click', e => {
  if (!e.target.closest('#lootItemDisplay') && !e.target.closest('#lootItemDropdown')) {
    const dd = document.getElementById('lootItemDropdown');
    if (dd) dd.style.display = 'none';
  }
});

function setLootSort(col) {
  lootSortDir = lootSortCol === col ? (lootSortDir === 'desc' ? 'asc' : 'desc') : (col === 'player' ? 'asc' : 'desc');
  lootSortCol = col;
  onItemChange();
}

function onItemChange() {
  const el = document.getElementById('lootEligible');
  if (groupingMode !== 'loot' || !el) return;
  const raid = document.getElementById('lootRaid').value;
  const boss = document.getElementById('lootBoss').value;
  const item = selectedItem;
  if (!item) { el.innerHTML = ''; return; }
  const entry = glossaryData.find(r => r.raid === raid && r.boss === boss && r.item === item);
  if (!entry) { el.innerHTML = '<p style="color:var(--text-dim);font-style:italic;">No data found for this item.</p>'; return; }

  const itemId = entry.wowheadId;
  const bigIcon = itemId && entry.icon
    ? `<img src="https://wow.zamimg.com/images/wow/icons/large/${entry.icon}.jpg" style="width:40px;height:40px;border:2px solid var(--gold-dim);border-radius:4px;display:block;" />` : '';
  const title = itemId
    ? `<a href="https://www.wowhead.com/${WOWHEAD_BRANCH}/item=${itemId}" data-wowhead="item=${itemId}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:12px;font-family:'Cinzel',serif;font-size:16px;color:var(--gold);text-decoration:none;">${bigIcon}${escHtml(item)}</a>`
    : `<span style="font-family:'Cinzel',serif;font-size:16px;color:var(--gold);">${escHtml(item)}</span>`;
  const classesStr = entry.eligibleClasses.length
    ? entry.eligibleClasses.map(c => `<span style="color:${CLASS_COLORS[c] || 'var(--text)'};">${c}</span>`).join(' · ')
    : '<span style="color:var(--text-dim);">All classes</span>';
  const headerHtml = `<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px;flex-wrap:wrap;">
      <div>${title}</div>
      <div style="font-size:13px;">${classesStr}</div>
    </div>
    ${entry.notes ? `<div style="font-size:13px;color:var(--text-dim);font-style:italic;margin-bottom:8px;">${escHtml(entry.notes)}</div>` : ''}`;

  const allPlayers = lastRenderData.roles.flatMap(r => r.players);
  const eligible = allPlayers.filter(p => {
    const cls = classMap[normalizeName(p.name)];
    if (!cls) return false;
    return !entry.eligibleClasses.length || entry.eligibleClasses.some(ec => ec.toLowerCase() === cls.toLowerCase());
  });
  if (!eligible.length) {
    el.innerHTML = headerHtml + '<p style="color:var(--text-dim);font-style:italic;padding:16px 0;">No eligible players found for this item.</p>';
    refreshWowhead();
    return;
  }

  // Already has it: in the loot log, or equipped per the most recent CLA gear listing
  const itemKey = normalizeName(item);
  const hasItem = p => {
    const key = normalizeName(p.name);
    if ((lootByPlayer[key] || []).some(l => normalizeName(l.name) === itemKey)) return true;
    const slots = gearListingByPlayer[key]?.slots || {};
    return Object.values(slots).some(n => n && normalizeName(n) === itemKey);
  };

  const sortVal = p => {
    if (lootSortCol === 'player')   return p.name.toLowerCase();
    if (lootSortCol === 'srs')      return getSrStats(p.name).available;
    if (lootSortCol === 'consumes') return consumeAvg(p.name) ?? -1;
    if (lootSortCol === 'pct')      return p.pct ?? -1;
    return p.attended;
  };
  const sorter = (a, b) => {
    const av = sortVal(a), bv = sortVal(b);
    if (av < bv) return lootSortDir === 'asc' ? -1 : 1;
    if (av > bv) return lootSortDir === 'asc' ? 1 : -1;
    return (b.pct ?? 0) - (a.pct ?? 0) || a.name.localeCompare(b.name);
  };
  const haveIt   = eligible.filter(p => hasItem(p)).sort(sorter);
  const needIt   = eligible.filter(p => !hasItem(p) && !p.inactive).sort(sorter);
  const inactive = eligible.filter(p => !hasItem(p) && p.inactive).sort(sorter);

  const arrow = col => lootSortCol === col ? (lootSortDir === 'desc' ? ' ▾' : ' ▴') : ' ⬦';
  const th = (label, col, align = 'center', title = '') =>
    `<th onclick="setLootSort('${col}')" style="cursor:pointer;text-align:${align};white-space:nowrap;" title="${title}">${label}<span class="sort-arrow">${arrow(col)}</span></th>`;
  const dates = lastRenderData.dates;

  el.innerHTML = headerHtml + `
    <table style="width:100%;border-collapse:collapse;margin-top:16px;">
      ${tableColgroup()}
      <thead><tr style="border-bottom:1px solid var(--border);">
        ${th('Player', 'player', 'left')}
        <th></th>
        ${th('SRs Available', 'srs', 'center', 'Soft reserves this raider can currently spend.')}
        ${th('Buffs', 'consumes', 'center', 'Uptime of all required consumables.')}
        <th style="text-align:center;" title="Last 10 raids. Color indicates consumable usage.">Raids</th>
        ${th('#', 'attendance')}
        ${th('Attendance %', 'pct')}
      </tr></thead>
      <tbody>
        ${needIt.map(p => playerRowHtml(p, dates, { showRole: true })).join('')}
        ${inactive.map(p => playerRowHtml(p, dates, { showRole: true, dimmed: true, badge: 'Inactive' })).join('')}
        ${haveIt.map(p => playerRowHtml(p, dates, { showRole: true, dimmed: true, badge: 'Received' })).join('')}
      </tbody>
    </table>
    <p style="margin-top:12px;font-size:13px;color:var(--text-dim);font-style:italic;">${needIt.length} eligible · ${haveIt.length} already received · ${inactive.length} inactive</p>`;
  refreshWowhead();
}

// raid/boss display order for an item, from the glossary
function glossaryLocationIndex() {
  const loc = {};
  Object.keys(lootGlossary.raids || {}).forEach((raidName, raidIdx) => {
    Object.keys(lootGlossary.raids[raidName] || {}).forEach((bossName, bossIdx) => {
      for (const e of lootGlossary.raids[raidName][bossName] || []) {
        const k = normalizeName(e.item);
        if (!loc[k]) loc[k] = { raidName, bossName, raidIdx, bossIdx };
      }
    });
  });
  return loc;
}

function renderLootLogRaidList() {
  const container = document.getElementById('lootlogRaidList');
  if (!container) return;
  const raids = [...lootDistribution.raids].sort((a, b) => b.date.localeCompare(a.date));
  if (!raids.length) {
    container.innerHTML = '<div style="color:var(--text-dim);font-style:italic;font-size:13px;">No raids recorded yet. Add a raid to get started.</div>';
    return;
  }
  const loc = glossaryLocationIndex();
  container.innerHTML = '';
  for (const raid of raids) {
    const expanded = _lootLogExpanded.has(raid.date);
    const items = raid.items || [];
    const sorted = [...items].sort((a, b) => {
      const la = loc[normalizeName(a.item)] || { raidIdx: 99, bossIdx: 99 };
      const lb = loc[normalizeName(b.item)] || { raidIdx: 99, bossIdx: 99 };
      return la.raidIdx - lb.raidIdx || la.bossIdx - lb.bossIdx;
    });
    // Header chips: icon when the item has one, otherwise a short name pill. Border = SR (red) / non-SR (green).
    let chips = '', lastRaid = null, lastBoss = null;
    const MAX_CHIPS = 14;
    sorted.slice(0, MAX_CHIPS).forEach(entry => {
      const l = loc[normalizeName(entry.item)];
      if (l && lastRaid !== null && l.raidName !== lastRaid) chips += `<span style="width:1px;height:20px;background:var(--border);margin:0 4px;flex-shrink:0;"></span>`;
      else if (l && lastBoss !== null && l.bossName !== lastBoss) chips += `<span style="width:4px;flex-shrink:0;"></span>`;
      const col = entry.sr ? C5 : C1;
      const tip = escHtml(`${entry.item} → ${entry.recipient}${entry.sr ? ' (SR)' : ''}`);
      const id = getItemId(entry.item);
      chips += id && itemIcons[id]
        ? `<img src="https://wow.zamimg.com/images/wow/icons/small/${itemIcons[id]}.jpg" style="width:20px;height:20px;border:1px solid ${col};border-radius:2px;flex-shrink:0;" title="${tip}" />`
        : `<span title="${tip}" style="font-size:11px;border:1px solid ${col};color:var(--text-dim);padding:1px 6px;border-radius:2px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis;">${escHtml(entry.item)}</span>`;
      lastRaid = l?.raidName ?? lastRaid; lastBoss = l?.bossName ?? lastBoss;
    });
    if (items.length > MAX_CHIPS) chips += `<span style="font-size:11px;color:var(--text-dim);margin-left:4px;">+${items.length - MAX_CHIPS} more</span>`;

    const srCount = items.filter(i => i.sr).length;
    const raidDiv = document.createElement('div');
    raidDiv.style.cssText = 'border:1px solid var(--border);border-radius:6px;margin-bottom:8px;';
    const header = document.createElement('div');
    header.style.cssText = 'display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;background:var(--bg2);user-select:none;';
    header.onclick = () => lootLogToggleRaid(raid.date);
    header.innerHTML = `
      <span style="font-size:12px;color:var(--text-dim);display:inline-block;transform:${expanded ? 'rotate(90deg)' : 'rotate(0deg)'}">▶</span>
      <span style="font-family:'Cinzel',serif;font-size:13px;color:var(--gold);min-width:80px;">${raid.label}</span>
      <span style="font-size:12px;color:var(--text-dim);white-space:nowrap;">${items.length} item${items.length !== 1 ? 's' : ''}${srCount ? ` · <span style="color:${C5};">${srCount} SR</span>` : ''}</span>
      <div style="display:flex;gap:3px;flex-wrap:wrap;align-items:center;flex:1;">${chips}</div>`;
    raidDiv.appendChild(header);

    if (expanded) {
      const body = document.createElement('div');
      body.style.cssText = 'padding:12px 14px;border-top:1px solid var(--border);overflow:visible;';
      body.innerHTML = `
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;">
          <div id="lootlogItemDropdown_${raid.date}" class="write-gated" style="position:relative;min-width:320px;"></div>
          <div id="lootlogRecipientDropdown_${raid.date}" class="write-gated" style="position:relative;min-width:160px;"></div>
          <label class="write-gated" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);font-family:'Cinzel',serif;letter-spacing:0.1em;">
            <input type="checkbox" id="lootlogSr_${raid.date}" style="width:15px;height:15px;accent-color:${C5};cursor:pointer;"> SR
          </label>
          <button id="lootlogAddItemBtn_${raid.date}" class="gloss-btn-saveable write-gated small-gold-btn" onclick="lootLogAddItem('${raid.date}')">+ ADD ITEM</button>
        </div>
        <div id="lootlogItems_${raid.date}"></div>`;
      raidDiv.appendChild(body);
      setTimeout(() => {
        lootLogRenderItems(raid.date);
        lootLogInitItemDropdown(raid.date);
        lootLogInitRecipientDropdown(raid.date);
      }, 0);
    }
    container.appendChild(raidDiv);
  }
}

function lootLogRenderItems(dateStr) {
  const container = document.getElementById(`lootlogItems_${dateStr}`);
  if (!container) return;
  const raid = lootDistribution.raids.find(r => r.date === dateStr);
  if (!raid) return;
  const items = raid.items || [];
  if (!items.length) {
    container.innerHTML = '<div style="color:var(--text-dim);font-style:italic;font-size:12px;">No items recorded for this raid.</div>';
    return;
  }
  const thS = 'padding:4px 8px;font-family:\'Cinzel\',serif;font-size:10px;letter-spacing:0.15em;color:var(--text-dim);';
  let html = `<table style="border-collapse:collapse;width:100%;">
    <thead><tr style="border-bottom:1px solid var(--border);">
      <th style="text-align:left;${thS}">ITEM</th>
      <th style="text-align:left;${thS}">RECIPIENT</th>
      <th style="text-align:center;${thS}" title="Won via soft reserve. Click to toggle.">SR?</th>
      <th style="width:32px;"></th>
    </tr></thead><tbody>`;
  items.forEach((entry, idx) => {
    const recipientColor = classColor(entry.recipient) || 'var(--text)';
    const sr = !!entry.sr;
    html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.04);">
      <td style="padding:5px 8px;font-size:13px;color:var(--gold-light);">${itemLink(entry.item, entry.item)}</td>
      <td style="padding:5px 8px;font-size:13px;color:${recipientColor};text-align:left;">${escHtml(entry.recipient)}</td>
      <td style="padding:5px 8px;text-align:center;width:90px;">
        <button class="write-gated" onclick="lootLogToggleSr('${dateStr}', ${idx})" title="Click to toggle"
          style="background:none;border:1px solid ${sr ? C5 : C1};color:${sr ? C5 : C1};border-radius:3px;cursor:pointer;font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.1em;padding:2px 8px;min-width:52px;">${sr ? 'TRUE' : 'FALSE'}</button>
      </td>
      <td style="padding:5px 8px;text-align:center;">
        <button class="write-gated" onclick="lootLogRemoveItem('${dateStr}', ${idx})" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:13px;padding:0 4px;" title="Remove item">✕</button>
      </td>
    </tr>`;
  });
  container.innerHTML = html + '</tbody></table>';
  refreshWowhead();
}

function lootLogToggleSr(dateStr, idx) {
  const raid = lootDistribution.raids.find(r => r.date === dateStr);
  const entry = raid?.items?.[idx];
  if (!entry) return;
  entry.sr = !entry.sr;
  lootByPlayer = buildLootByPlayerFromDistribution();
  saveLootDistributionToGitHub();
  lootLogRenderItems(dateStr);
  renderLootLogRaidList();
}

function lootLogAddItem(dateStr) {
  const item = document.getElementById(`lootlogItemInput_${dateStr}`)?.value.trim();
  const recipient = document.getElementById(`lootlogRecipient_${dateStr}`)?.value.trim();
  const sr = !!document.getElementById(`lootlogSr_${dateStr}`)?.checked;
  if (!item || !recipient) return;
  const raid = lootDistribution.raids.find(r => r.date === dateStr);
  if (!raid) return;
  if (!raid.items) raid.items = [];
  raid.items.push({ item, recipient, sr });
  lootByPlayer = buildLootByPlayerFromDistribution();
  saveLootDistributionToGitHub();
  renderLootLogRaidList();
}

// ═════════════════════════════════════════════════════════════════════════════
// Item Glossary — UI (create / rename / reorder / delete raids, bosses, items)
// ═════════════════════════════════════════════════════════════════════════════
let _glossaryState = { raid: '', boss: '', item: '' };
let _glossaryDirty = false;

function glossaryRaidList() { return Object.keys(lootGlossary.raids || {}); }
function glossaryBossList(raid) { return Object.keys(lootGlossary.raids?.[raid] || {}); }
function glossaryItemList(raid, boss) { return (lootGlossary.raids?.[raid]?.[boss] || []).map(e => e.item); }
function getGlossaryEntry(raid, boss, item) {
  return (lootGlossary.raids?.[raid]?.[boss] || []).find(e => e.item === item) || null;
}
function _currentGlossaryEntry() {
  const { raid, boss, item } = _glossaryState;
  return raid && boss && item ? getGlossaryEntry(raid, boss, item) : null;
}

// Rebuild an object with one key renamed, preserving key order.
function _renameKey(obj, oldKey, newKey) {
  const out = {};
  for (const [k, v] of Object.entries(obj)) out[k === oldKey ? newKey : k] = v;
  return out;
}
// Rebuild an object with one key moved up (-1) or down (+1), preserving the rest.
function _moveKey(obj, key, dir) {
  const keys = Object.keys(obj);
  const i = keys.indexOf(key), j = i + dir;
  if (i < 0 || j < 0 || j >= keys.length) return obj;
  [keys[i], keys[j]] = [keys[j], keys[i]];
  const out = {};
  for (const k of keys) out[k] = obj[k];
  return out;
}

function _glossaryCommit() {
  rebuildGlossaryData();
  _glossaryUrlSync();
  renderGlossaryPanel();
  return saveGlossaryToGitHub();
}

function _glossaryUrlSync() {
  _urlSetParam('gl_raid', _glossaryState.raid);
  _urlSetParam('gl_boss', _glossaryState.boss);
  _urlSetParam('gl_item', _glossaryState.item);
}

function glossarySelect(level, name) {
  if (_glossaryDirty && !confirm('Discard unsaved changes to this item?')) return;
  _glossaryDirty = false;
  if (level === 'raid') {
    _glossaryState = { raid: name, boss: glossaryBossList(name)[0] || '', item: '' };
  } else if (level === 'boss') {
    _glossaryState.boss = name; _glossaryState.item = '';
  } else {
    _glossaryState.item = name;
  }
  _glossaryUrlSync();
  renderGlossaryPanel();
}

function glossaryAdd(level) {
  const input = document.getElementById('glAdd_' + level);
  const name = input?.value.trim();
  if (!name) return;
  const raids = lootGlossary.raids || (lootGlossary.raids = {});
  if (level === 'raid') {
    if (raids[name]) { alert(`Raid "${name}" already exists.`); return; }
    raids[name] = {};
    _glossaryState = { raid: name, boss: '', item: '' };
  } else if (level === 'boss') {
    const r = raids[_glossaryState.raid]; if (!r) return;
    if (r[name]) { alert(`Boss "${name}" already exists in ${_glossaryState.raid}.`); return; }
    r[name] = [];
    _glossaryState.boss = name; _glossaryState.item = '';
  } else {
    const list = raids[_glossaryState.raid]?.[_glossaryState.boss]; if (!list) return;
    if (list.some(e => normalizeName(e.item) === normalizeName(name))) { alert(`"${name}" is already on this boss.`); return; }
    const elsewhere = glossaryData.find(e => normalizeName(e.item) === normalizeName(name));
    if (elsewhere && !confirm(`"${name}" already exists under ${elsewhere.raid} → ${elsewhere.boss}. Add it here too?`)) return;
    list.push({ item: name, eligibleClasses: [] });
    _glossaryState.item = name;
  }
  _glossaryCommit();
}

function glossaryRename(level, oldName) {
  const newName = prompt(`Rename ${level} "${oldName}" to:`, oldName)?.trim();
  if (!newName || newName === oldName) return;
  const raids = lootGlossary.raids;
  if (level === 'raid') {
    if (raids[newName]) { alert(`Raid "${newName}" already exists.`); return; }
    lootGlossary.raids = _renameKey(raids, oldName, newName);
    if (_glossaryState.raid === oldName) _glossaryState.raid = newName;
  } else if (level === 'boss') {
    const r = raids[_glossaryState.raid];
    if (r[newName]) { alert(`Boss "${newName}" already exists.`); return; }
    raids[_glossaryState.raid] = _renameKey(r, oldName, newName);
    if (_glossaryState.boss === oldName) _glossaryState.boss = newName;
  } else {
    const entry = getGlossaryEntry(_glossaryState.raid, _glossaryState.boss, oldName);
    if (!entry) return;
    entry.item = newName;
    if (_glossaryState.item === oldName) _glossaryState.item = newName;
    // Loot log references items by name — carry the rename through.
    let touched = 0;
    for (const raid of lootDistribution.raids) for (const it of (raid.items || [])) {
      if (it.item === oldName) { it.item = newName; touched++; }
    }
    if (touched) { lootByPlayer = buildLootByPlayerFromDistribution(); saveLootDistributionToGitHub(); }
  }
  _glossaryCommit();
}

function glossaryDelete(level, name) {
  const raids = lootGlossary.raids;
  let count = 0, what = '';
  if (level === 'raid') {
    count = Object.values(raids[name] || {}).reduce((n, list) => n + list.length, 0);
    what = `raid "${name}"` + (count ? ` and its ${Object.keys(raids[name]).length} boss(es) / ${count} item(s)` : '');
  } else if (level === 'boss') {
    count = (raids[_glossaryState.raid]?.[name] || []).length;
    what = `boss "${name}"` + (count ? ` and its ${count} item(s)` : '');
  } else {
    what = `item "${name}"`;
  }
  const logged = level === 'item' && lootDistribution.raids.some(r => (r.items || []).some(i => i.item === name));
  if (!confirm(`Delete ${what}?${logged ? '\n\nThis item appears in the Loot Log — those entries are kept.' : ''}`)) return;
  if (level === 'raid') {
    delete raids[name];
    if (_glossaryState.raid === name) _glossaryState = { raid: '', boss: '', item: '' };
  } else if (level === 'boss') {
    delete raids[_glossaryState.raid][name];
    if (_glossaryState.boss === name) { _glossaryState.boss = ''; _glossaryState.item = ''; }
  } else {
    const list = raids[_glossaryState.raid][_glossaryState.boss];
    const i = list.findIndex(e => e.item === name);
    if (i >= 0) list.splice(i, 1);
    if (_glossaryState.item === name) _glossaryState.item = '';
  }
  _glossaryDirty = false;
  _glossaryCommit();
}

function glossaryMove(level, name, dir) {
  const raids = lootGlossary.raids;
  if (level === 'raid') lootGlossary.raids = _moveKey(raids, name, dir);
  else if (level === 'boss') raids[_glossaryState.raid] = _moveKey(raids[_glossaryState.raid], name, dir);
  else {
    const list = raids[_glossaryState.raid][_glossaryState.boss];
    const i = list.findIndex(e => e.item === name), j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
  }
  _glossaryCommit();
}

function glossaryToggleClass(cls) {
  const entry = _currentGlossaryEntry();
  if (!entry) return;
  if (!entry.eligibleClasses) entry.eligibleClasses = [];
  const i = entry.eligibleClasses.indexOf(cls);
  if (i >= 0) entry.eligibleClasses.splice(i, 1); else entry.eligibleClasses.push(cls);
  entry.eligibleClasses.sort();
  _glossaryDirty = true;
  renderGlossaryPanel();
}

function glossaryMarkDirty() {
  _glossaryDirty = true;
  document.getElementById('glSaveBtn')?.classList.add('gloss-btn-ready');
}

function glossarySaveItem() {
  const entry = _currentGlossaryEntry();
  if (!entry) return;
  const idRaw = document.getElementById('glWowheadId')?.value.trim();
  const icon  = document.getElementById('glIcon')?.value.trim().toLowerCase().replace(/\.jpg$/, '');
  const notes = document.getElementById('glNotes')?.value.trim();
  const id = parseInt(idRaw, 10);
  if (id > 0) entry.wowheadId = id; else delete entry.wowheadId;
  if (icon) entry.icon = icon; else delete entry.icon;
  if (notes) entry.notes = notes; else delete entry.notes;
  _glossaryDirty = false;
  _glossaryCommit();
}

function glossaryDiscard() {
  _glossaryDirty = false;
  loadLootGlossaryFromRepo().then(renderGlossaryPanel);
}

function renderGlossaryPanel() {
  const panel = document.getElementById('glossaryPanel');
  if (!panel) return;
  // Drop a stale selection (e.g. after a delete or a reload)
  if (_glossaryState.raid && !lootGlossary.raids?.[_glossaryState.raid]) _glossaryState = { raid: '', boss: '', item: '' };
  if (_glossaryState.boss && !lootGlossary.raids?.[_glossaryState.raid]?.[_glossaryState.boss]) { _glossaryState.boss = ''; _glossaryState.item = ''; }
  if (_glossaryState.item && !_currentGlossaryEntry()) _glossaryState.item = '';
  const { raid, boss, item } = _glossaryState;
  const entry = _currentGlossaryEntry();

  const column = (level, title, names, selected, enabled, placeholder) => {
    const rows = names.map((n, i) => `
      <div class="gl-row${n === selected ? ' selected' : ''}" onclick="glossarySelect('${level}', '${jsAttr(n)}')">
        <span class="gl-row-name">${escHtml(n)}</span>
        <span class="gl-row-actions write-gated-hide" onclick="event.stopPropagation()">
          <button title="Move up" ${i === 0 ? 'disabled' : ''} onclick="glossaryMove('${level}', '${jsAttr(n)}', -1)">▲</button>
          <button title="Move down" ${i === names.length - 1 ? 'disabled' : ''} onclick="glossaryMove('${level}', '${jsAttr(n)}', 1)">▼</button>
          <button title="Rename" onclick="glossaryRename('${level}', '${jsAttr(n)}')">✎</button>
          <button title="Delete" onclick="glossaryDelete('${level}', '${jsAttr(n)}')">✕</button>
        </span>
      </div>`).join('');
    return `<div class="gl-col">
      <div class="gl-col-title">${title} <span style="color:var(--text-dim);">${enabled ? names.length : ''}</span></div>
      <div class="gl-list">${enabled ? (rows || '<div class="gl-empty">None yet</div>') : '<div class="gl-empty">Select a ' + (level === 'boss' ? 'raid' : 'boss') + '</div>'}</div>
      ${enabled ? `<div class="gl-add write-gated-hide">
        <input id="glAdd_${level}" placeholder="${placeholder}" onkeydown="if(event.key==='Enter')glossaryAdd('${level}')">
        <button onclick="glossaryAdd('${level}')">+</button>
      </div>` : ''}
    </div>`;
  };

  let editor = '<p style="color:var(--text-dim);font-size:13px;font-style:italic;">Select an item to edit its eligible classes.</p>';
  if (entry) {
    const logged = lootDistribution.raids.reduce((n, r) => n + (r.items || []).filter(i => i.item === entry.item).length, 0);
    editor = `
      <div style="font-family:'Cinzel',serif;font-size:15px;color:var(--gold);margin-bottom:4px;">${itemLink(entry.item, entry.item)}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:14px;">${escHtml(raid)} → ${escHtml(boss)}${logged ? ` · awarded ${logged}× in the Loot Log` : ''}</div>

      <div class="expand-section-title">Eligible Classes <span style="color:var(--text-dim);letter-spacing:0.05em;">— none selected = all classes</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;">
        ${CLASSES.map(c => {
          const on = (entry.eligibleClasses || []).includes(c);
          const col = CLASS_COLORS[c] || 'var(--text)';
          return `<button class="write-gated" onclick="glossaryToggleClass('${c}')" style="background:${on ? col + '22' : 'transparent'};border:1px solid ${on ? col : 'var(--border)'};color:${on ? col : 'var(--text-dim)'};padding:5px 12px;border-radius:4px;cursor:pointer;font-size:13px;">${c}</button>`;
        }).join('')}
      </div>

      <div class="expand-section-title">Optional</div>
      <div style="display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-size:13px;margin-bottom:14px;">
        <label style="color:var(--text-dim);" title="Numeric Wowhead item ID — enables the link and tooltip. Leave blank if the item isn't on Wowhead.">Wowhead ID</label>
        <input id="glWowheadId" class="gl-input write-gated" type="number" value="${entry.wowheadId || ''}" placeholder="e.g. 19019" oninput="glossaryMarkDirty()">
        <label style="color:var(--text-dim);" title="Wowhead icon name, e.g. inv_sword_39. Shown next to the item.">Icon</label>
        <input id="glIcon" class="gl-input write-gated" value="${escHtml(entry.icon || '')}" placeholder="e.g. inv_sword_39" oninput="glossaryMarkDirty()">
        <label style="color:var(--text-dim);">Notes</label>
        <input id="glNotes" class="gl-input write-gated" value="${escHtml(entry.notes || '')}" placeholder="Shown on the Loot Distribution tab" oninput="glossaryMarkDirty()">
      </div>
      <div style="display:flex;gap:8px;" class="write-gated-hide">
        <button id="glSaveBtn" class="gloss-btn-saveable small-gold-btn ${_glossaryDirty ? 'gloss-btn-ready' : ''}" onclick="glossarySaveItem()">SAVE</button>
        ${_glossaryDirty ? `<button onclick="glossaryDiscard()" style="background:none;border:1px solid var(--border);color:var(--text-dim);padding:5px 10px;border-radius:4px;cursor:pointer;font-size:12px;">Discard</button>` : ''}
      </div>`;
  }

  const counts = glossaryData.length;
  panel.innerHTML = `
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
      <div style="font-family:'Cinzel',serif;font-size:13px;letter-spacing:0.15em;color:var(--gold-dim);">ITEM GLOSSARY</div>
      <div style="font-size:12px;color:var(--text-dim);">${glossaryRaidList().length} raids · ${counts} items${writeToken ? '' : ' · read-only'}</div>
    </div>
    <div class="gl-grid">
      ${column('raid', 'Raids', glossaryRaidList(), raid, true, 'New raid…')}
      ${column('boss', 'Bosses', raid ? glossaryBossList(raid) : [], boss, !!raid, 'New boss…')}
      ${column('item', 'Items', raid && boss ? glossaryItemList(raid, boss) : [], item, !!(raid && boss), 'New item…')}
      <div class="gl-col gl-editor">${editor}</div>
    </div>`;
  refreshWowhead(100);
}

// ═════════════════════════════════════════════════════════════════════════════
// Load / render pipeline
// ═════════════════════════════════════════════════════════════════════════════
async function fetchData() {
  fetchErrors.length = 0;
  resetProxyBreaker();
  setStatus('Summoning the scrolls...', 'loading');
  try {
    await fetchAllClaData();
    lootByPlayer = buildLootByPlayerFromDistribution();

    _storeParsedClaData();
    const claFetchFailed = _claFailedLabels.size > 0 || _corsProxyTripped;
    if (_claNewlyParsed > 0 && writeToken && !claFetchFailed) {
      console.log(`Persisting CLA cache — ${_claNewlyParsed} newly parsed sheet(s)`);
      saveClaSheetsToGitHub().catch(e => console.warn('CLA cache persist failed:', e.message));
      _claNewlyParsed = 0;
    } else if (_claNewlyParsed > 0 && claFetchFailed) {
      console.warn(`NOT persisting CLA cache — ${_claFailedLabels.size} sheet(s) failed this load.`);
    }

    rebuildAttendanceFromCla();
    const data = buildAttendanceRenderData() || { dates: [], roles: [] };

    const stamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (fetchErrors.length) {
      setStatus(`Updated at ${stamp} — <span style="cursor:pointer;text-decoration:underline;" onclick="showErrors()">⚠ ${fetchErrors.length} warning(s) (click to view)</span>`, 'loading');
    } else {
      setStatus(`Updated at ${stamp}`, 'success');
    }
    render(data);
    if (groupingMode === 'attendance') renderAttendancePanel();
  } catch(e) {
    console.error(e);
    setStatus(`Failed to load data — ${e?.message}`, 'error');
    showErrors();
  }
}

// ── URL state ───────────────────────────────────────────────────
function _urlSetParam(key, value) {
  const url = new URL(window.location);
  if (value) url.searchParams.set(key, value); else url.searchParams.delete(key);
  window.history.replaceState({}, '', url);
}
function _urlGetParam(key) {
  return new URL(window.location).searchParams.get(key) || '';
}

// ── Config + boot ───────────────────────────────────────────────
(async () => {
  try {
    const cfg = await fetch('./config.json?t=' + Date.now()).then(r => r.json());
    if (cfg.cf_worker_url)  CF_WORKER_URL  = cfg.cf_worker_url.trim().replace(/\/+$/, '');
    if (cfg.kv_prefix != null) KV_PREFIX   = String(cfg.kv_prefix);
    if (cfg.apps_script)    APPS_SCRIPT    = cfg.apps_script;
    if (cfg.cors_api_key)   CORS_API_KEY   = cfg.cors_api_key.trim();
    if (cfg.guild_name)     GUILD_NAME     = cfg.guild_name;
    if (cfg.guild_subtitle) GUILD_SUBTITLE = cfg.guild_subtitle;
    if (cfg.page_title)     PAGE_TITLE     = cfg.page_title;
    if (cfg.wowhead_branch) WOWHEAD_BRANCH = cfg.wowhead_branch;
    if (cfg.enable_apps_script != null) ENABLE_APPS_SCRIPT = !!cfg.enable_apps_script;
    if (cfg.sr) {
      if (cfg.sr.per_raid != null) SR_PER_RAID = +cfg.sr.per_raid;
      if (cfg.sr.starting != null) SR_STARTING = +cfg.sr.starting;
    }
    // enable_wcl is deliberately ignored — WCL is disabled for WoW Forever.
  } catch(e) {
    console.warn('config.json not found or invalid — using defaults:', e.message);
  }
  if (!KV_PREFIX) {
    // An empty prefix would point this dashboard at the LC dashboard's live data.
    console.error('kv_prefix is empty — refusing to share keys with the LC dashboard. Falling back to "wf/".');
    KV_PREFIX = 'wf/';
  }
  document.title = PAGE_TITLE;
  const h1 = document.querySelector('header h1');
  const sub = document.querySelector('header .subtitle');
  if (h1)  h1.textContent  = GUILD_NAME;
  if (sub) sub.textContent = GUILD_SUBTITLE;
  document.getElementById('claScriptFields').style.display = ENABLE_APPS_SCRIPT ? '' : 'none';
  document.getElementById('claPasteFields').style.display  = ENABLE_APPS_SCRIPT ? 'none' : '';
  if (ENABLE_APPS_SCRIPT && APPS_SCRIPT && !CF_WORKER_URL) {
    addError('config.json', 'Missing "cf_worker_url" — Apps Script/CLA fetches have no proxy and will fail.');
  }
  console.log('config — worker:', CF_WORKER_URL, '| kv prefix:', KV_PREFIX, '| SR:', SR_STARTING, '+', SR_PER_RAID, '/raid');
  boot();
})();

async function boot() {
  claSheets = loadClaSheets();
  updateAuthState();
  await loadClaSheetsFromRepo();
  await Promise.all([loadRosterFromRepo(), loadLootGlossaryFromRepo(), loadAttendanceFromRepo(), loadLootDistributionFromRepo()]);
  await fetchData();
  const tab = _urlGetParam('tab');
  if (tab) setGrouping(tab);
}

//   await seedFromLegacy()                    // copy the 5 most recent LC raids into wf/*
//   await seedFromLegacy({ raids: 8 })        // …or a different number
//   await seedFromLegacy({ overwrite: true }) // replace wf/* data that already exists
//   await seedFromLegacy({ dryRun: true })    // show what would be written, write nothing
//   await resetWfData()                       // wipe wf/* roster/attendance/loot/CLA (glossary kept)
//
// seedFromLegacy READS the LC dashboard's un-prefixed keys (roster, attendance,
// cla-sheets incl. its parsed consumables cache) and WRITES only under KV_PREFIX.
// It never modifies LC data. Loot is not copied — TBC items don't exist in the WF
// glossary — so build a few glossary items and log some wins to exercise SRs.
// ═════════════════════════════════════════════════════════════════════════════
async function _fetchLegacy(key) {
  const res = await fetch(`${_workerBase()}/${key}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`legacy ${key}: HTTP ${res.status}`);
  return res.json();
}

async function _putWf(filename, data) {
  const res = await fetch(`${_workerBase()}/${_kvKey(filename)}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Token': writeToken },
    body: JSON.stringify(data, null, 2),
  });
  if (!res.ok) throw new Error(`write ${_kvKey(filename)}: HTTP ${res.status} ${(await res.text()).slice(0, 200)}`);
}

async function seedFromLegacy(opts = {}) {
  const { raids: nRaids = 5, overwrite = false, dryRun = false } = opts;
  if (!CF_WORKER_URL) { console.error('seedFromLegacy: cf_worker_url is not configured.'); return; }
  if (!dryRun && !writeToken) { console.error('seedFromLegacy: save the write token in the dashboard first.'); return; }
  if (!KV_PREFIX) { console.error('seedFromLegacy: KV_PREFIX is empty — refusing to write over LC data.'); return; }
  if (!overwrite && !dryRun && (rosterData.players.length || attendanceData.raids.length)) {
    console.error(`seedFromLegacy: ${KV_PREFIX} already has ${rosterData.players.length} raider(s) / ${attendanceData.raids.length} raid(s). ` +
      'Run seedFromLegacy({ overwrite: true }) to replace them.');
    return;
  }

  console.log(`seedFromLegacy: reading LC data…`);
  const [lRoster, lAtt, lCla] = await Promise.all([
    _fetchLegacy(LEGACY_KEYS.roster), _fetchLegacy(LEGACY_KEYS.attendance), _fetchLegacy(LEGACY_KEYS.cla),
  ]);

  // 1. The N most recent raids
  const raids = [...(lAtt.raids || [])].sort((a, b) => a.date.localeCompare(b.date)).slice(-nRaids);
  if (!raids.length) { console.error('seedFromLegacy: the LC attendance data has no raids.'); return; }
  const dates = new Set(raids.map(r => r.date));

  // 2. Who attended them (baked-in presence, then manual overrides on top)
  const overrides = {};
  for (const [k, byDate] of Object.entries(lAtt.overrides || {})) {
    for (const [d, v] of Object.entries(byDate)) if (dates.has(d)) (overrides[k] ||= {})[d] = v;
  }
  const present = (k, r) => overrides[k]?.[r.date] ?? !!r.players?.[k];
  const allKeys = new Set([...raids.flatMap(r => Object.keys(r.players || {})), ...Object.keys(overrides)]);
  const attendedKeys = new Set([...allKeys].filter(k => raids.some(r => present(k, r))));

  // 3. Roster: those raiders, with role/class/alt (no LC loot or loot values)
  const players = (lRoster.players || [])
    .filter(p => attendedKeys.has(normalizeName(p.name)))
    .map(p => ({ name: p.name, role: p.role, class: p.class, isAlt: !!p.isAlt }));
  const rosterKeys = new Set(players.map(p => normalizeName(p.name)));
  for (const r of raids) for (const k of Object.keys(r.players || {})) if (!rosterKeys.has(k)) delete r.players[k];
  for (const k of Object.keys(overrides)) if (!rosterKeys.has(k)) delete overrides[k];

  // 4. CLA sheets for those raids + their parsed cache (this is where consumables live)
  const legacySheets = Array.isArray(lCla) ? lCla : (lCla.sheets || []);
  const legacyParsed = Array.isArray(lCla) ? {} : (lCla.parsed || {});
  const labelDate = label => {
    const sd = legacyParsed[label]?.sheetDate;
    return sd ? formatAttendanceDate(new Date(sd)) : null;
  };
  const sheets = legacySheets.filter(s => dates.has(labelDate(s.label)));
  const parsed = {};
  for (const s of sheets) parsed[s.label] = legacyParsed[s.label];
  const missingCla = raids.filter(r => !sheets.some(s => labelDate(s.label) === r.date)).map(r => r.date);

  const out = {
    roster:     { players, excluded: [] },
    attendance: { raids: raids.map(r => ({ date: r.date, label: r.label, players: r.players || {} })), overrides },
    loot:       { raids: raids.map(r => ({ date: r.date, label: r.label, items: [] })) },
    cla:        { sheets, parsed },
  };
  console.table(raids.map(r => ({
    date: r.date, label: r.label,
    present: Object.values(r.players || {}).filter(Boolean).length,
    claSheet: sheets.find(s => labelDate(s.label) === r.date)?.label || '— none —',
  })));
  console.log(`seedFromLegacy: ${players.length} raiders, ${raids.length} raids, ${sheets.length} CLA sheet(s)` +
    (missingCla.length ? ` — no cached CLA for ${missingCla.join(', ')} (those raids will have attendance but no consumables)` : ''));
  if (dryRun) { console.log('dryRun — nothing written. Payload:', out); return out; }

  await _putWf('roster.json', out.roster);
  await _putWf('attendance.json', out.attendance);
  await _putWf('loot-distribution.json', out.loot);
  await _putWf('cla-sheets.json', out.cla);
  try { sessionStorage.removeItem(STORAGE_NS + 'claSheets'); } catch(_) {}
  console.log(`seedFromLegacy: written under "${KV_PREFIX}". Reloading…`);
  setTimeout(() => location.reload(), 800);
}
window.seedFromLegacy = seedFromLegacy;

async function resetWfData() {
  if (!writeToken) { console.error('resetWfData: save the write token first.'); return; }
  if (!confirm(`Wipe roster, attendance, loot log and CLA data under "${KV_PREFIX}"?\n\nThe Item Glossary is kept. The LC dashboard is not touched.`)) return;
  await _putWf('roster.json', { players: [], excluded: [] });
  await _putWf('attendance.json', { raids: [], overrides: {} });
  await _putWf('loot-distribution.json', { raids: [] });
  await _putWf('cla-sheets.json', { sheets: [], parsed: {} });
  try { sessionStorage.removeItem(STORAGE_NS + 'claSheets'); } catch(_) {}
  console.log('resetWfData: done. Reloading…');
  setTimeout(() => location.reload(), 800);
}
window.resetWfData = resetWfData;

</script>
