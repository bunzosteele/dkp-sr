<script type="text/plain" id="wcl-integration-disabled">
const ITEM_SHEET_ID = '1bt-0NVkheMGvWl2FgCcHZH86ZzQxIMuzK_cxPEAsr0A';
const ITEM_SHEET_GIDS = [170506057, 461402221, 1447687848, 962096481, 1520599598];
const WCL_CONFIG_FILE = 'wcl-config.json';
const DATA_DIR = 'data'; // subdirectory where non-config JSON files live

// ── Crypto helpers (AES-GCM via Web Crypto API) ──────────────────
async function deriveKey(password) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode(CF_WORKER_URL || 'dbs-lc-salt'), iterations: 100000, hash: 'SHA-256' },
    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}

async function encryptData(password, data) {
  const key = await deriveKey(password);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(data)));
  return { iv: Array.from(iv), data: Array.from(new Uint8Array(ciphertext)) };
}

async function decryptData(password, encrypted) {
  const key = await deriveKey(password);
  const iv = new Uint8Array(encrypted.iv);
  const data = new Uint8Array(encrypted.data);
  const dec = new TextDecoder();
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  return JSON.parse(dec.decode(plain));
}

// ── PKCE helpers ──────────────────────────────────────────────────
function generateRandomString(length = 64) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  const arr = crypto.getRandomValues(new Uint8Array(length));
  return Array.from(arr).map(b => chars[b % chars.length]).join('');
}

async function generateCodeChallenge(verifier) {
  const enc = new TextEncoder();
  const digest = await crypto.subtle.digest('SHA-256', enc.encode(verifier));
  return btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

async function startWclPkce() {
  const verifier = generateRandomString(64);
  const challenge = await generateCodeChallenge(verifier);
  localStorage.setItem('wclVerifier', verifier);
  const params = new URLSearchParams({
    client_id: WCL_CLIENT_ID,
    redirect_uri: WCL_REDIRECT_URI,
    response_type: 'code',
    code_challenge: challenge,
    code_challenge_method: 'S256',
    state: 'wclauth'
  });
  window.location.href = WCL_AUTH_URL + '?' + params.toString();
}

async function exchangeWclCode(code) {
  const verifier = localStorage.getItem('wclVerifier');
  if (!verifier) { console.warn('No PKCE verifier found in session'); return null; }
  // Route through Apps Script to avoid CORS on token endpoint
  // Encode all params as base64 JSON to keep URL short and avoid length issues
  const payload = btoa(JSON.stringify({
    grant_type: 'authorization_code',
    client_id: WCL_CLIENT_ID,
    redirect_uri: WCL_REDIRECT_URI,
    code,
    code_verifier: verifier
  }));
  const rawUrl = APPS_SCRIPT + '?action=wclAuth&payload=' + encodeURIComponent(payload);
  try {
    // Must go through corsproxy — Apps Script redirects through googleusercontent.com which has no CORS headers
    const text = await appsScriptFetch(rawUrl);
    let data;
    try { data = JSON.parse(text); } catch(e) { console.warn('Token parse error:', text); return null; }
    if (data.error) { console.warn('Token exchange error:', data); return null; }
    localStorage.removeItem('wclVerifier');
    return data;
  } catch(e) { console.warn('Token exchange failed:', e.message); return null; }
}

async function handleWclCallback() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('state') !== 'wclauth' || !params.get('code')) return false;
  setWclStatus('Exchanging auth code...', '');
  const data = await exchangeWclCode(params.get('code'));
  // Clean URL
  window.history.replaceState({}, document.title, window.location.pathname);
  if (!data?.access_token) { setWclStatus('Auth failed — try again.', 'error'); return false; }
  wclToken = data.access_token;
  wclTokenExpiry = Date.now() + ((data.expires_in || 3600) - 60) * 1000;
  sessionStorage.setItem('wclToken', wclToken);
  sessionStorage.setItem('wclTokenExpiry', String(wclTokenExpiry));
  // Also persist to localStorage so token survives page reload
  localStorage.setItem('wclToken', wclToken);
  localStorage.setItem('wclTokenExpiry', String(wclTokenExpiry));
  setWclStatus('✓ Connected to WarcraftLogs!', 'success');
  return true; // fetchWclAllStars will be called after fetchData() completes
}

let WCL_CLIENT_ID = 'a1577bef-44fb-4fb3-87f6-555c24400a38';
let WCL_ZONE_ID = 1048;        // TBC Classic zone — override via config.json wcl_zone_id
let WCL_GAME_SLUG = 'tbc-classic'; // WCL game version slug
let WCL_API_URL = 'https://classic.warcraftlogs.com/api/v2/client'; // Classic uses separate endpoint
const WCL_REDIRECT_URI = window.location.origin + window.location.pathname.replace(/[^/]*$/, '');
let WCL_REALM = 'dreamscythe';
const WCL_AUTH_URL = 'https://www.warcraftlogs.com/oauth/authorize';
const WCL_TOKEN_URL = 'https://www.warcraftlogs.com/oauth/token';
const WCL_REGION = 'US';
let wclToken = null;
let wclTokenExpiry = 0;
let wclData = {}; // normalized name -> { points, rank, outOf }

async function saveWclConfigToGitHub(password, clientId, clientSecret, realm) {
  if (!writeToken) { setWclStatus('Write token required to save credentials.', 'error'); return; }
  try {
    const encrypted = await encryptData(password, { clientId, clientSecret, realm });
    const _wbase = (u => u.startsWith('http') ? u : 'https://' + u)(CF_WORKER_URL.trim().replace(/\/+$/, ''));
    const putRes = await fetch(`${_wbase}/${WCL_CONFIG_FILE}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Token': writeToken },
      body: JSON.stringify(encrypted, null, 2),
    });
    if (putRes.ok) {
      setWclStatus('✓ Credentials encrypted and saved!', 'success');
    } else {
      setWclStatus('Failed to save to GitHub — check your GitHub token.', 'error');
    }
  } catch(e) {
    setWclStatus(`Encryption error: ${e.message}`, 'error');
  }
}

async function loadWclConfigFromRepo(password) {
  try {
    let encrypted;
    try { encrypted = await fetchFromWorker('wcl-config.json'); } catch(e) { return false; }
    const config = await decryptData(password, encrypted);
    if (!config.clientId || !config.clientSecret || !config.realm) return false;
    sessionStorage.setItem('wclClientId', config.clientId);
    sessionStorage.setItem('wclClientSecret', config.clientSecret);
    sessionStorage.setItem('wclRealm', config.realm);
    return config;
  } catch(e) {
    return false; // wrong password or no file
  }
}

function setWclStatus(msg, type = '') {
  const el = document.getElementById('wclStatus');
  if (el) { el.textContent = msg; el.style.color = type === 'error' ? 'var(--red)' : type === 'success' ? '#4caa6e' : 'var(--text-dim)'; }
  const topBtn = document.getElementById('wclConnectTopBtn');
  const connectedLabel = document.getElementById('wclConnectedLabel');
  const connected = type === 'success';
  if (topBtn) topBtn.style.display = connected ? 'none' : '';
  if (connectedLabel) connectedLabel.style.display = connected ? '' : 'none';
  // Clear status text when connected — label handles it
  if (connected && el) el.textContent = '';
  document.body.classList.toggle('wcl-hidden', !connected);
}

async function getWclToken() {
  // Check in-memory token
  if (wclToken && Date.now() < wclTokenExpiry) return wclToken;
  // Check sessionStorage first (survives PKCE redirect within same tab)
  let stored = sessionStorage.getItem('wclToken');
  let storedExpiry = parseInt(sessionStorage.getItem('wclTokenExpiry') || '0');
  // Fall back to localStorage (persists across page loads and tab closes)
  if (!stored || Date.now() >= storedExpiry) {
    stored = localStorage.getItem('wclToken');
    storedExpiry = parseInt(localStorage.getItem('wclTokenExpiry') || '0');
  }
  if (stored && Date.now() < storedExpiry) {
    wclToken = stored;
    wclTokenExpiry = storedExpiry;
    return wclToken;
  }
  return null; // Need to re-authenticate via PKCE
}
async function wclFetch(url) {
  // Apps Script redirects to googleusercontent.com — fetch the redirect target directly
  const res = await fetch(url, { redirect: 'follow' });
  return res;
}

async function wclGraphQL(query, token) {
  const q = btoa(unescape(encodeURIComponent(query)));
  const rawUrl = APPS_SCRIPT + '?action=wclQuery&q=' + encodeURIComponent(q) + '&token=' + encodeURIComponent(token);
  // Must go through corsproxy — Apps Script redirects through googleusercontent.com which has no CORS headers
  const text = await appsScriptFetch(rawUrl);
  if (text.trimStart().startsWith('<')) throw new Error('Apps Script returned HTML — check deployment');
  return JSON.parse(text);
}

async function fetchWclAllStars(realm) {
  if (!ENABLE_WCL) return;
  const token = await getWclToken();
  if (!token) {
    // Token expired or missing — show connect button, hide column, clear spinners
    setWclStatus('Not connected', '');
    if (lastRenderData?.roles) {
      lastRenderData.roles.flatMap(r => r.players).forEach(p => {
        if (p.name) updateWclCell(normalizeName(p.name), null);
      });
    }
    return;
  }
  try {

    // Build player list with their role for metric selection
    // Include ALL named players (even pct===null / inactive with no CLA) so spinners get resolved
    const players = lastRenderData.roles.flatMap(r =>
      r.players.filter(p => p.name).map(p => ({ ...p, roleName: r.name }))
    );
    console.log('Fetching WCL for', players.length, 'players');
    // Process in batches of 5 to avoid rate-limiting proxies
    const BATCH_SIZE = 3;
    for (let i = 0; i < players.length; i += BATCH_SIZE) {
      const batch = players.slice(i, i + BATCH_SIZE);
      await Promise.all(batch.map(async p => {
        // Use canonical name from CLA if available, otherwise fall back to display name
        const wclName = canonicalNames[normalizeName(p.name)] || p.name;
        const isHealer = p.roleName === 'Healers';
        const metric = isHealer ? 'hps' : 'dps';
        const charQuery = `{
          characterData {
            character(name: "${wclName}", serverSlug: "${realm}", serverRegion: "${WCL_REGION}") {
              zoneRankings(zoneID: ${WCL_ZONE_ID}, metric: ${metric})
            }
          }
        }`;
        try {
          const charData = await wclGraphQL(charQuery, token).catch(e => {
            console.warn('Char query failed for', wclName, e);
            updateWclCell(normalizeName(p.name), null, wclName);
            return null;
          });
          if (!charData) { wclData[normalizeName(p.name)] = null; updateWclCell(normalizeName(p.name), null); return; }
          const char = charData?.data?.characterData?.character;
          const rankings = char?.zoneRankings;
          if (!rankings) { console.warn('No rankings for', p.name, JSON.stringify(charData)?.slice(0, 200)); wclData[normalizeName(p.name)] = null; updateWclCell(normalizeName(p.name), null); return; }
          const key = normalizeName(p.name);
          const entry = {
            points: rankings.allStars?.[0]?.points ?? null,
            rank: rankings.allStars?.[0]?.rank ?? null,
            outOf: rankings.allStars?.[0]?.total ?? null,
            bestPerf: rankings.bestPerformanceAverage ?? null,
            medianPerf: rankings.medianPerformanceAverage ?? null,
          };
          // Sycamoore one-off: use best parse as median (healer median unreliable)
          if (normalizeName(wclName) === 'sycamoore' && entry.bestPerf !== null) {
            entry.medianPerf = entry.bestPerf;
          }
          wclData[key] = entry;
          updateWclCell(key, entry);
        } catch(e) { console.warn('WCL char error for', p.name, e); wclData[normalizeName(p.name)] = null; updateWclCell(normalizeName(p.name), null); }
      }));
      // Small delay between batches to avoid rate limiting
      if (i + BATCH_SIZE < players.length) await new Promise(r => setTimeout(r, 500));
    }

    // Ensure ALL players with spinners get a dash (including those skipped due to pct===null)
    // Mark any unresolved players as null so re-render shows — not spinner
    lastRenderData.roles.flatMap(r => r.players).forEach(p => {
      const key = normalizeName(p.name);
      if (!wclData.hasOwnProperty(key)) wclData[key] = null;
    });

    // Final re-render to update sort order if sorted by WCL (skip if in loot view)
    if (lastRenderData.roles.length && groupingMode !== 'loot') render(lastRenderData);
  } catch(e) {
    console.warn('WCL fetch failed:', e.message);
    lastRenderData.roles.flatMap(r => r.players).forEach(p => {
      wclData[normalizeName(p.name)] = null;
    });
    if (lastRenderData.roles.length && groupingMode !== 'loot') render(lastRenderData);
  }
}

function wclCellHtml(wcl, playerName) {
  const wclName = (playerName ? (canonicalNames[normalizeName(playerName)] || playerName) : '').toLowerCase();
  const href = wclName ? `https://fresh.warcraftlogs.com/character/us/dreamscythe/${encodeURIComponent(wclName)}` : null;
  const link = (inner, style) => href
    ? `<a href="${href}" target="_blank" rel="noopener" style="text-decoration:none;${style}">${inner}</a>`
    : `<span style="${style}">${inner}</span>`;
  if (wcl === null) return link('—', 'color:var(--text-dim);font-size:11px;'); // explicit failure
  if (!wcl || wcl.medianPerf === null || wcl.medianPerf === undefined) return link('—', 'color:var(--text-dim);font-size:11px;');
  const col = wclColor(wcl.medianPerf);
  return link(`${Math.round(wcl.medianPerf)}%`, `color:${col};font-family:'Cinzel',serif;font-size:12px;font-weight:600;`);
}

function updateWclCell(key, entry, playerName) {
  const name = playerName || key;
  document.querySelectorAll(`[data-wcl-key="${key}"]`).forEach(td => {
    td.innerHTML = wclCellHtml(entry, name);
  });
}

function wclColor(pct) {
  if (pct === null) return 'var(--text-dim)';
  if (pct >= 99) return '#e268a8'; // pink
  if (pct >= 95) return '#ff8000'; // orange
  if (pct >= 75) return '#a335ee'; // purple
  if (pct >= 50) return '#0070ff'; // blue
  if (pct >= 25) return '#1eff00'; // green
  return '#666666'; // grey
}
