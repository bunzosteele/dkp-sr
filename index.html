// Parse gear listing CSV -> { playerName: { Head: 'itemname', Neck: 'itemname', ... } }
function parseGearListing(csvText) {
  const rows = csvText.split('\n').map(r => {
    const cols = [];
    let cur = '', inQ = false;
    for (const ch of r) {
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    cols.push(cur.trim());
    return cols;
  });
  // Find header row (contains 'Head')
  const headerIdx = rows.findIndex(r => r.some(c => c === 'Head'));
  if (headerIdx === -1) return {};
  const slotCols = rows[headerIdx]; // col 0=empty, col 1=empty, col 2=Head, ...
  const result = {};
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    const name = row[1]?.trim();
    if (!name) continue;
    const gear = {};
    for (let s = 0; s < GEAR_LISTING_SLOTS.length; s++) {
      const itemName = row[s + 2]?.trim();
      if (itemName) gear[GEAR_LISTING_SLOTS[s]] = itemName;
    }
    result[name] = gear;
  }
  return result;
}

// Look up a single item name via Apps Script -> Wowhead search XML


// ── [from LC dashboard] CLA fetch / parse / cache ───────────────────────────────────
function addCla() {
  const label = document.getElementById('claLabel').value.trim();
  if (!label) { alert('Please enter a label.'); return; }

  let entry;
  if (ENABLE_APPS_SCRIPT) {
    // Apps Script mode — URL + GIDs
    const url = document.getElementById('claUrl').value.trim();
    const gearGid = document.getElementById('claGearGid').value.trim();
    const buffGid = document.getElementById('claBuffGid').value.trim();
    const gearListingGid = document.getElementById('claGearListingGid').value.trim();
    if (!url || !gearGid || !buffGid) { alert('Please fill in the Sheet URL, Issues GID, and Consumes GID.'); return; }
    const sheetId = extractSheetId(url);
    if (!sheetId) { alert('Could not parse Sheet ID from URL.'); return; }
    entry = { label, url, sheetId, gearGid, buffGid };
    if (gearListingGid) entry.gearListingGid = gearListingGid;
    // Gap-fill item IDs from gear listing if provided. Reset the breaker first: a page
    // load that tripped it hours ago must not make adding a raid fail instantly.
    resetProxyBreaker();
    document.getElementById('claUrl').value = '';
    document.getElementById('claGearGid').value = '';
    document.getElementById('claBuffGid').value = '';
    document.getElementById('claGearListingGid').value = '';
  } else {
    // Paste mode — raw CSV pasted directly
    const csvGearRaw = document.getElementById('claPasteGear').value.trim();
    const csvBuffRaw = document.getElementById('claPasteBuff').value.trim();
    const csvGearListingRaw = document.getElementById('claPasteGearListing').value.trim();
    if (!csvGearRaw || !csvBuffRaw) { alert('Please paste the Gear Issues and Buff Consumables data.'); return; }
    // Normalize TSV (Ctrl+A, Ctrl+C from Google Sheets) or CSV (downloaded)
    const csvGear = normalizeClaPaste(csvGearRaw);
    const csvBuff = normalizeClaPaste(csvBuffRaw);
    const csvGearListing = csvGearListingRaw ? normalizeClaPaste(csvGearListingRaw) : '';
    entry = { label, csvGear, csvBuff };
    if (csvGearListing) entry.csvGearListing = csvGearListing;
    // Parse immediately since we have the data now
    try { parseGearIssues(csvGear, label); } catch(e) { console.warn('Gear issues parse error:', e); }
    try { parseBuffConsumables(csvBuff, label); } catch(e) { console.warn('Buff consumables parse error:', e); }
    if (csvGearListing) {
      try {
        const gearData = parseGearListing(csvGearListing);
        const thisIdx = claSheets.length; // entry not pushed yet, so length = its future index
        const thisDate = claSheetDates[label] || null;
        Object.entries(gearData).forEach(([playerName, slots]) => {
          const key = normalizeName(playerName);
          const existingLabel = gearListingByPlayer[key]?.label;
          const existingDate = existingLabel ? (claSheetDates[existingLabel] || null) : null;
          const existingIdx = existingLabel ? claSheets.findIndex(s => s.label === existingLabel) : -1;
          const isNewer = (thisDate && existingDate) ? thisDate >= existingDate : thisIdx >= existingIdx;
          if (isNewer) gearListingByPlayer[key] = { label, slots };
        });
      } catch(e) { console.warn('Gear listing parse error:', e); }
    }
    // Pasted data supersedes any earlier fetch failure for this label.
    _claFailedLabels.delete(label);
    _storeParsedClaData();
    document.getElementById('claPasteGear').value = '';
    document.getElementById('claPasteBuff').value = '';
    document.getElementById('claPasteGearListing').value = '';
  }

  document.getElementById('claLabel').value = '';
  claSheets.push(entry);
  // Re-store AFTER the push. _storeParsedClaData iterates claSheets, so the earlier
  // paste-mode call above ran before this entry existed and could never cache it.
  if (!ENABLE_APPS_SCRIPT) _storeParsedClaData();
  saveClaSheets();
  renderClaList();
  saveClaSheetsToGitHub();
  rebuildAttendanceFromCla();
  renderAttendancePanel();
}

function removeCla(i) {
  const removed = claSheets[i];
  claSheets.splice(i, 1);
  // Drop its cache entry too. _applyClaStoredParsed walks every label in the cache,
  // including ones no longer in claSheets, so an orphan entry would keep injecting a
  // deleted raid's attendance, gear issues and buff scores into memory on every load.
  if (removed && _claStoredParsed[removed.label]) {
    delete _claStoredParsed[removed.label];
    _claFailedLabels.delete(removed.label);
  }
  saveClaSheets();
  renderClaList();
  saveClaSheetsToGitHub();
}


// Apply stored parsed CLA data to in-memory globals
function _applyClaStoredParsed() {
  // Process in sheet order (chronological) so newer entries correctly overwrite older ones
  const _sortedLabels = claSheets.map(s => s.label).filter(l => _claStoredParsed[l]);
  const _remainingLabels = Object.keys(_claStoredParsed).filter(l => !_sortedLabels.includes(l));
  const _allLabels = [..._sortedLabels, ..._remainingLabels];

  // Pre-populate ALL sheet dates before any recency comparisons so they're available
  for (const label of _allLabels) {
    const pd = _claStoredParsed[label];
    if (pd?.sheetDate) claSheetDates[label] = pd.sheetDate instanceof Date ? pd.sheetDate : new Date(pd.sheetDate);
  }

  for (const label of _allLabels) {
    const pd = _claStoredParsed[label];
    if (!pd) continue;

    // claPresence
    if (pd.claPresence) {
      if (!claPlayersByLabel[label]) claPlayersByLabel[label] = new Set();
      for (const key of (pd.claPresence || [])) {
        claPlayersByLabel[label].add(key);
        if (!canonicalNames[key]) {
          const sheet = claSheets.find(s => s.label === label);
          // canonical name stored separately
        }
      }
    }

    // canonicalNames
    if (pd.canonicalNames) {
      for (const [k, v] of Object.entries(pd.canonicalNames)) canonicalNames[k] = v;
    }

    // gearIssues
    if (pd.gearIssues) {
      for (const [key, data] of Object.entries(pd.gearIssues)) {
        if (!claDataByPlayer[key]) claDataByPlayer[key] = { gearIssues: [], buffConsumables: [] };
        claDataByPlayer[key].gearIssues.push(data);
        // Apply recency logic for latestGearIssuesByPlayer
        const existingLabel = latestGearIssuesByPlayer[key]?.label;
        const existingDate = existingLabel ? (claSheetDates[existingLabel] || null) : null;
        // Use the NORMALISED date, not pd.sheetDate. After a JSON round-trip through KV
        // pd.sheetDate is an ISO string while claSheetDates holds Date objects, and
        // `string >= Date` compares "2026-03-13T12:.." against "Fri Mar 13 2026 .."
        // lexicographically — always false. That made every recency check fail, so the
        // FIRST label processed won and "latest" silently resolved to the OLDEST raid.
        const thisDate = claSheetDates[label] || null;
        let isNewer;
        if (thisDate && existingDate) { isNewer = thisDate >= existingDate; }
        else {
          const si = claSheets.findIndex(s => s.label === label);
          const ei = existingLabel ? claSheets.findIndex(s => s.label === existingLabel) : -1;
          isNewer = si >= ei;
        }
        if (isNewer) latestGearIssuesByPlayer[key] = { label, issues: data.issues };
      }
    }

    // latestIssues — the CLEAN-PLAYER case.
    //
    // pd.gearIssues only contains players who HAD issues (parseGearIssues pushes only
    // `if (issues.length)`), so it structurally cannot express "showed up in this CLA
    // with nothing wrong". Rebuilding "latest" from gearIssues alone therefore leaves a
    // player who fixed their gear pinned to the last raid where they had problems, and
    // the ⚠ flag never clears. pd.latestIssues DOES carry those empty entries — it was
    // being written to KV and never read back. Apply it under the same recency rule.
    if (pd.latestIssues) {
      for (const [key, data] of Object.entries(pd.latestIssues)) {
        if (!claDataByPlayer[key]) claDataByPlayer[key] = { gearIssues: [], buffConsumables: [] };
        const existingLabel = latestGearIssuesByPlayer[key]?.label;
        const existingDate = existingLabel ? (claSheetDates[existingLabel] || null) : null;
        const thisDate = claSheetDates[label] || null;
        let isNewer;
        if (thisDate && existingDate) { isNewer = thisDate >= existingDate; }
        else {
          const si = claSheets.findIndex(s => s.label === label);
          const ei = existingLabel ? claSheets.findIndex(s => s.label === existingLabel) : -1;
          isNewer = si >= ei;
        }
        if (isNewer) latestGearIssuesByPlayer[key] = { label, issues: data.issues || [] };
      }
    }

    // buffScores
    if (pd.buffScores) {
      for (const [key, scores] of Object.entries(pd.buffScores)) {
        if (!claDataByPlayer[key]) claDataByPlayer[key] = { gearIssues: [], buffConsumables: [] };
        for (const [dateStr, score] of Object.entries(scores)) {
          if (!buffScoreByPlayerDate[key]) buffScoreByPlayerDate[key] = {};
          buffScoreByPlayerDate[key][dateStr] = score;
        }
      }
    }

    // gearListing — only apply if this sheet had entries (skip empty/older sheets)
    console.log(`[apply] label="${label}" stored gearListing players: ${Object.keys(pd.gearListing||{}).length}`);
    if (pd.gearListing && Object.keys(pd.gearListing).length > 0) {
      for (const [key, slots] of Object.entries(pd.gearListing)) {
        const existingLabel = gearListingByPlayer[key]?.label;
        const existingDate = existingLabel ? (claSheetDates[existingLabel] || null) : null;
        // Use the NORMALISED date, not pd.sheetDate. After a JSON round-trip through KV
        // pd.sheetDate is an ISO string while claSheetDates holds Date objects, and
        // `string >= Date` compares "2026-03-13T12:.." against "Fri Mar 13 2026 .."
        // lexicographically — always false. That made every recency check fail, so the
        // FIRST label processed won and "latest" silently resolved to the OLDEST raid.
        const thisDate = claSheetDates[label] || null;
        let isNewer;
        if (thisDate && existingDate) { isNewer = thisDate >= existingDate; }
        else {
          const si = claSheets.findIndex(s => s.label === label);
          const ei = existingLabel ? claSheets.findIndex(s => s.label === existingLabel) : -1;
          isNewer = si >= ei;
        }
        if (isNewer) gearListingByPlayer[key] = { label, slots };
      }
    }
  } // end for loop
  console.log('CLA cache applied:', Object.keys(claDataByPlayer).length, 'players,',
    Object.keys(gearListingByPlayer).length, 'gear listings,',
    Object.keys(buffScoreByPlayerDate).length, 'buff score players');
}

// Re-fetch all CLA sheets, re-parse, store in _claStoredParsed, and save
async function reparseAllClaData() {
  const btn = document.getElementById('claReparseBtn');
  if (btn) { btn.textContent = 'Re-parsing…'; btn.disabled = true; }
  const backup = _claStoredParsed;
  try {
    // Force full re-fetch by temporarily clearing cache
    _claStoredParsed = {};
    _corsProxyTripped = null;
    _corsProxy429s = 0;
    await fetchAllClaData();
    // Store parsed results back into _claStoredParsed
    _storeParsedClaData();
    // Don't overwrite a good cache with a partial one. If sheets failed, keep what we had.
    if (_claFailedLabels.size) {
      const failed = _claFailedLabels.size;
      _claStoredParsed = backup;
      if (btn) { btn.textContent = 'Re-parse CLAs'; btn.disabled = false; }
      setHint(`Re-parse aborted — ${failed} sheet(s) failed to fetch` +
        (_corsProxyTripped ? ` (the CORS proxy returned ${_corsProxyTripped})` : '') +
        '. The existing cache was left untouched.', 'error');
      return;
    }
    await saveClaSheetsToGitHub();
    if (btn) { btn.textContent = '✓ Done'; setTimeout(() => { btn.textContent = 'Re-parse CLAs'; btn.disabled = false; }, 2000); }
    setHint('CLA data re-parsed and cached — future loads will be instant.', 'success');
  } catch(e) {
    _claStoredParsed = backup;
    if (btn) { btn.textContent = 'Re-parse CLAs'; btn.disabled = false; }
    setHint('Re-parse failed: ' + e.message, 'error');
  }
}

// Snapshot current in-memory parsed state into _claStoredParsed
// A cache entry is only worth keeping if it actually names players. An entry written from
// a load whose fetches failed has empty presence/issues/listing and is worse than no entry
// at all, because it stops the sheet ever being re-fetched.
function _isUsableClaCacheEntry(e) {
  if (!e || typeof e !== 'object') return false;
  return (e.claPresence && e.claPresence.length > 0)
      || (e.gearIssues && Object.keys(e.gearIssues).length > 0)
      || (e.gearListing && Object.keys(e.gearListing).length > 0)
      || (e.buffScores && Object.keys(e.buffScores).length > 0);
}

// ── KV cache warmer ─────────────────────────────────────────────
// Fills the KV cache one sheet at a time, checkpointing progress as it goes, so a run
// that dies partway can be resumed instead of restarted. With the Worker proxy there is
// no rate limit to respect, so this is now a convenience (bank 29 sheets once, resumably)
// rather than a necessity — a normal page load will warm the cache on its own.
//
//   warmClaCache()                       // fill in whatever isn't cached yet
//   warmClaCache({ force: true })        // re-fetch every sheet from scratch
//   warmClaCache({ reqPerMin: 15 })      // go slower (gentler on Apps Script)
async function warmClaCache(opts = {}) {
  const { force = false, reqPerMin = 60, saveEvery = 3 } = opts;

  if (!writeToken) { console.error('warmClaCache: no write token saved — enter it in the dashboard first.'); return; }
  if (!APPS_SCRIPT) { console.error('warmClaCache: apps_script is not configured in config.json.'); return; }
  if (!CF_WORKER_URL && !CORS_API_KEY) console.warn('warmClaCache: no cf_worker_url set — requests have no proxy and will fail.');

  const gap = Math.ceil(60000 / Math.max(1, reqPerMin));
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // Start from a clean breaker; this is an explicit, deliberate attempt.
  _corsProxyTripped = null;
  _corsProxy429s = 0;
  _claFailedLabels = new Set();

  if (force) _claStoredParsed = {};
  else for (const [label, e] of Object.entries(_claStoredParsed)) {
    if (!_isUsableClaCacheEntry(e)) delete _claStoredParsed[label];
  }

  // Rebuild in-memory state from whatever is already cached, so recency comparisons
  // against already-warmed sheets are correct as we add new ones.
  claDataByPlayer = {}; claPlayersByLabel = {}; buffScoreByPlayerDate = {};
  latestGearIssuesByPlayer = {}; gearListingByPlayer = {}; claSheetDates = {}; canonicalNames = {};
  _applyClaStoredParsed();

  // Oldest first, so each sheet we parse is newer than everything already in memory and
  // the gear-listing recency rules resolve the same way a full load would.
  const todo = claSheets
    .map((s, i) => ({ s, i }))
    .filter(({ s }) => s.sheetId && !_claStoredParsed[s.label])
    .sort((a, b) => a.i - b.i);

  if (!todo.length) { console.log('warmClaCache: nothing to do — every sheet with a URL is already cached.'); return; }

  const totalReqs = todo.reduce((n, { s }) => n + 2 + (s.gearListingGid ? 1 : 0), 0);
  const etaMin = ((totalReqs * gap) / 60000).toFixed(1);
  console.log(`warmClaCache: ${todo.length} sheet(s), ~${totalReqs} requests at ${reqPerMin}/min — about ${etaMin} min. Leave this tab open.`);

  let done = 0, failed = 0, sinceSave = 0;

  for (const { s: sheet, i: sheetIdx } of todo) {
    if (_corsProxyTripped) {
      console.error(`warmClaCache: halted — the CORS proxy returned ${_corsProxyTripped}. ` +
        `${done} sheet(s) warmed and saved before stopping. Fix the proxy, then run warmClaCache() again to resume.`);
      break;
    }

    const label = sheet.label;
    let ok = true;
    // One request at a time, spaced by `gap`. Sequential on purpose.
    const pull = async (gid, what) => {
      await sleep(gap);
      try { return await fetchSheet(sheet.sheetId, gid); }
      catch (e) { ok = false; console.warn(`  ✗ "${label}" ${what}: ${e.message}`); return null; }
    };

    const gearText = await pull(sheet.gearGid, 'gear issues');
    if (gearText) {
      try { parseGearIssues(gearText, label); }
      catch (e) { ok = false; console.warn(`  ✗ "${label}" gear issues parse: ${e.message}`); }
    }

    const buffText = _corsProxyTripped ? null : await pull(sheet.buffGid, 'buff consumables');
    if (buffText) {
      try { parseBuffConsumables(buffText, label); }
      catch (e) { ok = false; console.warn(`  ✗ "${label}" buff parse: ${e.message}`); }
    }

    if (sheet.gearListingGid && !_corsProxyTripped) {
      const listText = await pull(sheet.gearListingGid, 'gear listing');
      if (listText) {
        // claSheetDates[label] is populated by parseGearIssues above, so recency is correct.
        try {
          const data = parseGearListing(listText);
          const thisDate = claSheetDates[label] || null;
          Object.entries(data).forEach(([playerName, slots]) => {
            const key = normalizeName(playerName);
            const existingLabel = gearListingByPlayer[key]?.label;
            const existingDate = existingLabel ? (claSheetDates[existingLabel] || null) : null;
            let isNewer;
            if (thisDate && existingDate) isNewer = thisDate >= existingDate;
            else {
              const ei = existingLabel ? claSheets.findIndex(x => x.label === existingLabel) : -1;
              isNewer = sheetIdx >= ei;
            }
            if (isNewer) gearListingByPlayer[key] = { label, slots };
          });
        } catch (e) { ok = false; console.warn(`  ✗ "${label}" gear listing parse: ${e.message}`); }
      }
    }

    if (ok) { done++; sinceSave++; console.log(`  ✓ ${label}  (${done}/${todo.length})`); }
    else { failed++; _claFailedLabels.add(label); console.warn(`  ⚠ ${label} incomplete — not cached, will retry on a later run.`); }

    // Checkpoint. _storeParsedClaData skips failed labels, so a partial run still banks
    // every sheet that fully succeeded rather than losing the work.
    if (sinceSave >= saveEvery || _corsProxyTripped) {
      _storeParsedClaData();
      const saved = await saveClaSheetsToGitHub();
      console.log(saved ? `  … checkpoint saved (${Object.keys(_claStoredParsed).length} sheets in cache)`
                        : '  … checkpoint SAVE FAILED — see the error above');
      sinceSave = 0;
    }
  }

  _storeParsedClaData();
  const saved = await saveClaSheetsToGitHub();
  console.log(`warmClaCache: finished — ${done} warmed, ${failed} failed, ` +
    `${Object.keys(_claStoredParsed).length} sheet(s) now cached in KV. Final save: ${saved ? 'ok' : 'FAILED'}.`);
  if (failed || _corsProxyTripped) console.log('Run warmClaCache() again to retry the sheets that failed — cached ones are skipped.');
  else console.log('Reload the page — it should now load without any corsproxy.io requests for CLA data.');
}
window.warmClaCache = warmClaCache;

// Escape hatch: wipe the KV-persisted CLA cache and force a full re-fetch on next load.
async function clearClaCache() {
  _claStoredParsed = {};
  _claFailedLabels = new Set();
  await saveClaSheetsToGitHub();
  console.log('CLA cache cleared in KV — reload the page to re-fetch every sheet.');
}
window.clearClaCache = clearClaCache;

function _storeParsedClaData() {
  const prev = _claStoredParsed;
  _claStoredParsed = {};
  for (const sheet of claSheets) {
    const label = sheet.label;
    // A sheet whose fetch or parse failed this load has NO usable in-memory data. Writing
    // it into the cache would store an empty entry that every future load then treats as
    // "already cached" and never re-fetches — permanently masking the real data. Keep the
    // previous cached entry if we had one, otherwise leave the label uncached entirely.
    if (_claFailedLabels.has(label)) {
      if (prev[label]) _claStoredParsed[label] = prev[label];
      continue;
    }
    const sheetDate = claSheetDates[label] || null;

    // Gear issues per player for this label
    const gearIssues = {};
    for (const [key, data] of Object.entries(claDataByPlayer)) {
      const entry = data.gearIssues.find(gi => gi.label === label);
      if (entry) gearIssues[key] = entry;
    }
    // Also capture latestGearIssuesByPlayer for this label
    const latestIssues = {};
    for (const [key, data] of Object.entries(latestGearIssuesByPlayer)) {
      if (data.label === label) latestIssues[key] = data;
    }

    // Buff scores per player for this label's date.
    //
    // buffScoreByPlayerDate is keyed by an ISO 'YYYY-MM-DD' STRING (parseBuffConsumables
    // uses formatAttendanceDate), but claSheetDates[label] holds a Date OBJECT. Indexing
    // the former with the latter coerces the Date via toString() —
    // "Fri Feb 20 2026 12:00:00 GMT+0000" — which never matches, so this silently stored
    // {} for every sheet. Harmless while the cache was broken; with the cache working, a
    // fully-cached load would have had no consumable data and quietly wrong priority
    // scores. Normalise to the same string key both sides use.
    const sheetDateKey = sheetDate
      ? (sheetDate instanceof Date ? formatAttendanceDate(sheetDate) : String(sheetDate))
      : null;
    const buffScores = {};
    if (sheetDateKey) {
      for (const [key, scores] of Object.entries(buffScoreByPlayerDate)) {
        if (scores[sheetDateKey]) {
          if (!buffScores[key]) buffScores[key] = {};
          buffScores[key][sheetDateKey] = scores[sheetDateKey];
        }
      }
    }

    // Gear listing for this label
    const gearListing = {};
    for (const [key, data] of Object.entries(gearListingByPlayer)) {
      if (data.label === label) gearListing[key] = data.slots;
    }
    console.log(`[store] label="${label}" gearListing players: ${Object.keys(gearListing).length} / gearListingByPlayer total: ${Object.keys(gearListingByPlayer).length}`);

    // CLA presence
    const claPresence = [...(claPlayersByLabel[label] || [])];

    // Canonical names
    const canonical = { ...canonicalNames };

    const entry = {
      sheetDate,
      claPresence,
      canonicalNames: canonical,
      gearIssues,
      latestIssues,
      buffScores,
      gearListing,
    };
    // Invariant: never store an entry with no players in it. A sheet that was never
    // attempted this run (the warmer halted before reaching it, say) produces exactly
    // that, and storing it would mark the sheet "cached" so nothing ever re-fetches it.
    if (!_isUsableClaCacheEntry(entry)) {
      if (prev[label]) _claStoredParsed[label] = prev[label];
      continue;
    }
    _claStoredParsed[label] = entry;
  }
  console.log('Stored parsed CLA data for', Object.keys(_claStoredParsed).length, 'of',
    claSheets.length, 'sheets' + (_claFailedLabels.size ? ` (${_claFailedLabels.size} skipped — failed this load)` : ''));
}

async function fetchAllClaData() {
  claDataByPlayer = {};
  claPlayersByLabel = {};
  buffScoreByPlayerDate = {};
  latestGearIssuesByPlayer = {};
  gearListingByPlayer = {};
  claSheetDates = {};
  canonicalNames = {};
  _claFailedLabels = new Set();

  // Any sheet that loses a request or a parse is unusable for caching purposes.
  const claFailed = (label, source, msg) => {
    _claFailedLabels.add(label);
    addError(source, msg);
  };

  // Partition by what work each sheet actually needs. Anything already parsed into
  // _claStoredParsed (loaded from KV) needs no HTTP at all, so adding one new raid
  // costs 3 requests instead of re-pulling every historical CLA from scratch.
  // Self-healing guard: an entry with no players in it carries no information, so treating
  // it as "cached" would permanently suppress the re-fetch that could repair it. Any such
  // entry — however it got written — is discarded and the sheet re-fetched.
  const purged = [];
  for (const [label, e] of Object.entries(_claStoredParsed)) {
    if (!_isUsableClaCacheEntry(e)) { delete _claStoredParsed[label]; purged.push(label); }
  }
  if (purged.length) console.warn('[fetchAllClaData] discarded', purged.length,
    'empty cache entries (will re-fetch):', purged.join(', '));

  const cachedSheets  = claSheets.filter(s => _claStoredParsed[s.label]);
  const uncachedFetch = claSheets.filter(s => !_claStoredParsed[s.label] && s.sheetId);
  const uncachedPaste = claSheets.filter(s => !_claStoredParsed[s.label] && (s.csvGear || s.csvBuff));
  console.log('[fetchAllClaData] total:', claSheets.length, '| cached:', cachedSheets.length,
    '| to fetch:', uncachedFetch.length, '| paste:', uncachedPaste.length);
  _claNewlyParsed = uncachedFetch.length + uncachedPaste.length;

  // Collect raw results first, then parse in recency order once all dates are known
  const gearResults = [];        // { label, text }
  const gearListingResults = []; // { label, text, sheetIdx }
  // Parse uncached paste-mode entries immediately (no fetch needed)
  uncachedPaste.forEach(sheet => {
    const csvGear = normalizeClaPaste(sheet.csvGear || '');
    const csvBuff = normalizeClaPaste(sheet.csvBuff || '');
    const csvGearListing = sheet.csvGearListing ? normalizeClaPaste(sheet.csvGearListing) : '';
    try { parseGearIssues(csvGear, sheet.label); }
    catch(e) { claFailed(sheet.label, `CLA "${sheet.label}" — Gear Issues`, `Parse error: ${e.message}`); }
    try { parseBuffConsumables(csvBuff, sheet.label); }
    catch(e) { claFailed(sheet.label, `CLA "${sheet.label}" — Buff Consumables`, `Parse error: ${e.message}`); }
    if (csvGearListing) {
      // Push into gearListingResults so it goes through the same recency-ordered processing as URL sheets
      gearListingResults.push({ label: sheet.label, text: csvGearListing, sheetIdx: claSheets.indexOf(sheet) });
    }
  });

  // Fetch ONLY sheets we have no cached parse for, 4 sheets' worth of requests (up to 12
  // concurrent HTTP calls) at a time. The Worker proxy has no rate limit, so this cap now
  // exists to stay clear of Apps Script's own simultaneous-execution quota rather than a
  // third party's — which is why it's 4 and not unbounded.
  if (uncachedFetch.length) {
    await runWithConcurrency(uncachedFetch, 4, async (sheet) => {
      const sheetIdx = claSheets.indexOf(sheet);
      await Promise.all([
        fetchSheet(sheet.sheetId, sheet.gearGid)
          .then(text => gearResults.push({ label: sheet.label, text }))
          .catch(e => claFailed(sheet.label, `CLA "${sheet.label}" — Gear Issues (gid: ${sheet.gearGid})`, e.message)),
        sheet.gearListingGid
          ? fetchSheet(sheet.sheetId, sheet.gearListingGid)
              .then(text => gearListingResults.push({ label: sheet.label, text, sheetIdx }))
              .catch(e => claFailed(sheet.label, `CLA "${sheet.label}" — Gear Listing (gid: ${sheet.gearListingGid})`, e.message))
          : Promise.resolve(),
        fetchSheet(sheet.sheetId, sheet.buffGid)
          .then(text => {
            try { parseBuffConsumables(text, sheet.label); }
            catch(e) { claFailed(sheet.label, `CLA "${sheet.label}" — Buff Consumables (gid: ${sheet.buffGid})`, `Parse error: ${e.message}`); }
          })
          .catch(e => claFailed(sheet.label, `CLA "${sheet.label}" — Buff Consumables (gid: ${sheet.buffGid})`, e.message)),
      ]);
    });
  }

  // Restore everything we already had parsed in KV. This pre-populates claSheetDates for
  // every cached label and applies gear listings / latest issues under the same recency
  // rules, so cached and freshly-fetched sheets interleave correctly whichever is newer.
  if (cachedSheets.length) _applyClaStoredParsed();

  // Now that claSheetDates is fully populated, parse gear issues and gear listings with correct recency
  for (const { label, text } of gearResults) {
    try { parseGearIssues(text, label); }
    catch(e) { claFailed(label, `CLA "${label}" — Gear Issues`, `Parse error: ${e.message}`); }
  }
  // Sort by sheet index so newer CLAs correctly overwrite older ones
  gearListingResults.sort((a, b) => a.sheetIdx - b.sheetIdx);
  for (const { label, text, sheetIdx } of gearListingResults) {
    try {
      const data = parseGearListing(text);
      const thisDate = claSheetDates[label] || null;
      let count = 0;
      Object.entries(data).forEach(([playerName, slots]) => {
        const key = normalizeName(playerName);
        const existingLabel = gearListingByPlayer[key]?.label;
        const existingDate = existingLabel ? (claSheetDates[existingLabel] || null) : null;
        let isNewer;
        if (thisDate && existingDate) { isNewer = thisDate >= existingDate; }
        else {
          const ei = existingLabel ? claSheets.findIndex(s => s.label === existingLabel) : -1;
          isNewer = sheetIdx >= ei;
        }
        if (isNewer) { gearListingByPlayer[key] = { label, slots }; count++; }
      });
      console.log(`Gear listing "${label}": ${Object.keys(data).length} players parsed, ${count} updated`);
    } catch(e) { claFailed(label, `CLA "${label}" — Gear Listing`, `Parse error: ${e.message}`); console.warn('Gear listing parse error:', label, e); }
  }
  console.log(`gearListingByPlayer: ${Object.keys(gearListingByPlayer).length} players total`);
}


function parseGearIssues(text, label) {
  const rows = parseCsvRows(text);
  // Always flag: missing gem or enchant entirely
  const ALWAYS_FLAGGED = /\[no (gem|enchant)|common gem/i;
  // Suboptimal: wrong/cheap enchant — only flagged on top-5 BiS items
  const SUBOPTIMAL = /\[(?!no )/i;

  for (const row of rows) {
    const player = row[4]?.trim();
    if (!player) continue;

    // Parse all issue cells, extracting item name and issue type
    // Items to always exclude from gear issue checks regardless of enchant status
    const EXCLUDED_ITEMS = /mark of the champion|meta gem/i;
    const allIssues = row.slice(5)
      .map(v => v.trim())
      .filter(v => v && v !== '' && !v.startsWith('-') && !EXCLUDED_ITEMS.test(v) && !/ZG/i.test(v))
      .map(v => {
        const m = v.match(/^(.+?)\s*\[([^\]]+)\]$/);
        return m ? { raw: v, itemName: m[1].trim(), issue: m[2].trim() } : null;
      })
      .filter(Boolean);
      // (LC dashboard filtered to items on a TBC BiS list here — no BiS lists for WoW Forever.)

    // Split into always-flagged and suboptimal
    const egregious = allIssues.filter(i => ALWAYS_FLAGGED.test('[' + i.issue + ']'));
    const suboptimal = allIssues.filter(i => !ALWAYS_FLAGGED.test('[' + i.issue + ']'));

    // For suboptimal issues, only include if the item is top-5 BiS for this player
    // We store suboptimal separately so we can evaluate against BiS data at render time
    const issues = [
      ...egregious.map(i => i.raw),
    ];

    const key = normalizeName(player);
    if (!claDataByPlayer[key]) claDataByPlayer[key] = { gearIssues: [], buffConsumables: [] };
    if (issues.length) claDataByPlayer[key].gearIssues.push({ label, issues });
    // Always record presence regardless of whether they have any issues
    if (!claPlayersByLabel[label]) claPlayersByLabel[label] = new Set();
    claPlayersByLabel[label].add(key);
    // Only overwrite if this sheet is more recent than what we have
    // Use C3 date from buff tab if available, otherwise fall back to claSheets array order
    const thisDate = claSheetDates[label] || null;
    const existingLabel = latestGearIssuesByPlayer[key]?.label;
    const existingDate = existingLabel ? (claSheetDates[existingLabel] || null) : null;
    let isNewer;
    if (thisDate && existingDate) {
      isNewer = thisDate >= existingDate;
    } else {
      // Fall back to array index order
      const sheetIdx = claSheets.findIndex(s => s.label === label);
      const existingIdx = existingLabel ? claSheets.findIndex(s => s.label === existingLabel) : -1;
      isNewer = sheetIdx >= existingIdx;
    }
    if (isNewer) {
      latestGearIssuesByPlayer[key] = { label, issues };
    }
  }
}

function parseBuffConsumables(text, label) {
  const rows = parseCsvRows(text);
  // C3 (row index 2, col index 2) contains the raid date for this CLA
  // Use the CLA label (e.g. "2/25", "3/4") as the raid date — it's set manually
  // and is the actual raid date, unlike the CLA export date in the sheet which
  // reflects when the export was generated (often the next day).
  // Also try to get the year from the CLA date cell since labels don't include it.
  const dateStr = rows[2]?.[2]?.trim();
  let raidYear = new Date().getUTCFullYear(); // default to current year
  if (dateStr) {
    const yearMatch = dateStr.match(/(20\d{2})/);
    if (yearMatch) raidYear = parseInt(yearMatch[1], 10);
  }
  // Parse label as M/D
  const labelMatch = label.match(/^(\d{1,2})\/(\d{1,2})$/);
  if (labelMatch) {
    const month = parseInt(labelMatch[1], 10) - 1; // 0-indexed
    const day   = parseInt(labelMatch[2], 10);
    claSheetDates[label] = new Date(Date.UTC(raidYear, month, day, 12, 0, 0));
  }
  // Header row is row index 4 (0-based), data starts at row 5
  const headers = rows[4]?.slice(2) || []; // col C onwards
  const normLabel = normalizeDate(label);
  // Use ISO date as key if we have it, otherwise fall back to normLabel
  const isoLabel = claSheetDates[label] ? formatAttendanceDate(claSheetDates[label]) : normLabel;
  for (let i = 5; i < rows.length; i++) {
    const row = rows[i];
    const player = row[1]?.trim();
    if (!player) continue;
    const values = row.slice(2);
    const cols = {};
    headers.forEach((h, idx) => {
      if (h.trim()) cols[h.trim()] = values[idx]?.trim() || '0%';
    });
    const key = normalizeName(player);
    if (!claDataByPlayer[key]) claDataByPlayer[key] = { gearIssues: [], buffConsumables: [] };
    // NOTE: buffConsumables is populated here but is NOT written to the KV cache by
    // _storeParsedClaData, so it is always [] on a cached load. That is currently
    // harmless because nothing renders it — the consumes column and the raid dots both
    // read buffScoreByPlayerDate, which IS cached. If you ever display this, cache it
    // too or it will silently be empty for every visitor who loads from KV.
    claDataByPlayer[key].buffConsumables.push({ label, cols });
    // Store exact name with special chars for WCL lookups
    if (!canonicalNames[key]) canonicalNames[key] = player;

    // Store total average + scrolls score keyed by normalized date for dot colouring
    const totalAvg = values[0]?.trim() || '0%'; // col C = index 0 of slice(2) = total average
    const scrollsVal = values[6]?.trim() || '0%'; // col I = index 6 of slice(2) = Scrolls
    const pct = parseInt(totalAvg);
    const scrollsPct = parseInt(scrollsVal);
    if (!buffScoreByPlayerDate[key]) buffScoreByPlayerDate[key] = {};
    const elixirVal  = parseInt(values[1]?.trim()) || 0;  // Elixir or Flask
    const foodVal     = parseInt(values[5]?.trim()) || 0;  // Food Buff
    const wepOilVal   = parseInt(values[7]?.trim()) || 0;  // Weapon Enhancement
    buffScoreByPlayerDate[key][isoLabel] = {
      total: isNaN(pct) ? null : pct,
      scrolls: isNaN(scrollsPct) ? 0 : scrollsPct,
      elixir: elixirVal,
      food: foodVal,
      wepOil: wepOilVal
    };
  }
}


// ── [from LC dashboard] CLA load from KV ────────────────────────────────────────────
// Auto-load CLA sheets from repo JSON if no sheets saved locally
async function loadClaSheetsFromRepo() {
  try {
    let data;
    try { data = await fetchFromWorker('cla-sheets.json'); } catch(e) { return; }
    // Support both old format (array) and new format ({ sheets, parsed })
    const sheets = Array.isArray(data) ? data : (data?.sheets || []);
    const parsed = Array.isArray(data) ? null : (data?.parsed || null);
    if (!sheets.length) return;
    if (!claSheets.length) {
      claSheets = sheets;
      saveClaSheets();
      renderClaList();
      updateAuthState();
    }
    // Adopt the parsed cache regardless of where claSheets came from.
    //
    // claSheets is restored from sessionStorage, so on any refresh within the same tab
    // the branch above is skipped — and _claStoredParsed lives ONLY in KV, never in
    // sessionStorage. Loading it inside that branch meant the cache was picked up on a
    // cold tab and silently dropped on every refresh, which is why the load log read
    // "cached: 0 | to fetch: 29" even though the data was sitting in KV.
    if (parsed && Object.keys(parsed).length && !Object.keys(_claStoredParsed).length) {
      _claStoredParsed = parsed;
      console.log('Loaded CLA cache from KV:', Object.keys(parsed).length, 'sheet(s)');
    }
  } catch(e) {}
}

function lootLogBuildAutocomplete({ container, inputId, placeholder, items, renderOption, onSelect, onInput }) {
  const inputStyle = 'background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-size:13px;width:100%;box-sizing:border-box;';
  const dropStyle = 'position:absolute;top:100%;left:0;min-width:100%;background:var(--bg2);border:1px solid var(--border);border-top:none;border-radius:0 0 4px 4px;max-height:220px;overflow-y:auto;z-index:9999;display:none;white-space:nowrap;';

  container.innerHTML = `<input id="${inputId}" placeholder="${placeholder}" autocomplete="off" style="${inputStyle}" /><div id="${inputId}_drop" style="${dropStyle}"></div>`;

  const input = container.querySelector(`#${inputId}`);
  const drop = container.querySelector(`#${inputId}_drop`);
  let activeIdx = -1;

  function stripAccents(s) {
    return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }
  function showDrop(filter) {
    const q = stripAccents(filter);
    const matched = q ? items.filter(i => stripAccents(i).includes(q)) : items;
    if (!matched.length) { drop.style.display = 'none'; return; }
    drop.innerHTML = matched.slice(0, 40).map((name, idx) =>
      `<div data-val="${name.replace(/"/g,'&quot;')}" data-idx="${idx}"
        style="padding:5px 10px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04);"
        onmouseenter="this.style.background='var(--bg)'"
        onmouseleave="this.style.background=''"
        onmousedown="event.preventDefault()">
        ${renderOption(name)}
      </div>`
    ).join('');
    drop.style.display = 'block';
    activeIdx = -1;
  }

  function hideDrop() { drop.style.display = 'none'; activeIdx = -1; }

  function selectItem(val) {
    input.value = val;
    hideDrop();
    if (onSelect) onSelect(val);
  }

  input.addEventListener('input', () => { showDrop(input.value); if (onInput) onInput(); });
  input.addEventListener('focus', () => showDrop(input.value));
  input.addEventListener('blur', () => setTimeout(hideDrop, 150));
  input.addEventListener('keydown', (e) => {
    const opts = drop.querySelectorAll('[data-val]');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIdx = Math.min(activeIdx + 1, opts.length - 1);
      opts.forEach((o, i) => o.style.background = i === activeIdx ? 'var(--bg)' : '');
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIdx = Math.max(activeIdx - 1, 0);
      opts.forEach((o, i) => o.style.background = i === activeIdx ? 'var(--bg)' : '');
    } else if (e.key === 'Enter' && activeIdx >= 0) {
      e.preventDefault();
      selectItem(opts[activeIdx].dataset.val);
    } else if (e.key === 'Escape') {
      hideDrop();
    }
  });
  drop.addEventListener('mousedown', (e) => {
    const opt = e.target.closest('[data-val]');
    if (opt) selectItem(opt.dataset.val);
  });
}

function lootLogCheckAddItemReady(dateStr) {

function lootLogAddRaid() {
  const input = document.getElementById('lootlogDateInput');
  if (!input?.value) return;
  const dateStr = input.value;
  if (lootDistribution.raids.find(r => r.date === dateStr)) return;
  const date = new Date(dateStr + 'T12:00:00');
  const label = formatRaidLabel(date);
  lootDistribution.raids.push({ date: dateStr, label, items: [] });
  lootDistribution.raids.sort((a, b) => a.date.localeCompare(b.date));

let _attendanceFilter = { role: '', cls: '' };
let _attendanceDirty = false;

function renderAttendancePanel() {
  const panel = document.getElementById('attendancePanel');
  if (!panel) return;

  const raids = attendanceData.raids;
  const players = rosterData.players.filter(p => !rosterData.excluded?.includes(p.name));

  const ROLE_ORDER = ['Tanks', 'Physical DPS', 'Ranged DPS', 'Healers'];
  const CLASSES = ['Druid','Hunter','Mage','Paladin','Priest','Rogue','Shaman','Warlock','Warrior'];

  const filteredPlayers = players.filter(p => {
    if (_attendanceFilter.role && p.role !== _attendanceFilter.role) return false;
    if (_attendanceFilter.cls && p.class !== _attendanceFilter.cls) return false;
    return true;
  });

  // Compute last attended raid index per player for sorting
  function lastAttendedIndex(p) {
    for (let i = raids.length - 1; i >= 0; i--) {
      if (getPlayerAttendance(p.name, raids[i].date)) return i;
    }
    return -1;
  }

  function isInactive(p) {
    const last = lastAttendedIndex(p);
    if (last === -1) return true;
    return (raids.length - 1 - last) > 2;
  }

  filteredPlayers.sort((a, b) => {
    const aInactive = isInactive(a), bInactive = isInactive(b);
    // Inactive players always go to bottom
    if (aInactive !== bInactive) return aInactive ? 1 : -1;
    const ri = ROLE_ORDER.indexOf(a.role) - ROLE_ORDER.indexOf(b.role);
    if (ri !== 0) return ri;
    // Within same role, sort by most recent raid attended (descending)
    return lastAttendedIndex(b) - lastAttendedIndex(a);
  });

  const selStyle = 'background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-size:13px;';
  const thStyle = 'text-align:center;padding:6px 4px;font-family:\'Cinzel\',serif;font-size:10px;color:var(--text-dim);white-space:nowrap;min-width:52px;';

  panel.innerHTML = `

      <!-- Filters + Add Raid -->
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap;">
        <select style="${selStyle}" onchange="attendanceFilterRole(this.value)">
          <option value="">All Roles</option>
          ${ROLE_ORDER.map(r => `<option value="${r}" ${_attendanceFilter.role===r?'selected':''}>${r}</option>`).join('')}
        </select>
        <select style="${selStyle}" onchange="attendanceFilterClass(this.value)">
          <option value="">All Classes</option>
          ${CLASSES.map(c => `<option value="${c}" ${_attendanceFilter.cls===c?'selected':''}>${c}</option>`).join('')}
        </select>
        <div style="display:flex;gap:6px;align-items:center;margin-left:auto;">
          <input type="date" id="newRaidDateInput" class="write-gated" style="${selStyle}padding:5px 8px;" oninput="document.getElementById('addRaidBtn')?.classList.toggle('gloss-btn-ready', !!this.value)" />
          <button id="addRaidBtn" class="gloss-btn-saveable write-gated" onclick="attendanceAddRaid()" style="background:var(--gold-dim);border:none;color:var(--bg);padding:6px 14px;border-radius:4px;cursor:pointer;font-family:\'Cinzel\',serif;font-size:11px;letter-spacing:0.1em;transition:background 0.15s,box-shadow 0.15s;">+ ADD RAID</button>
        </div>
        <button id="attendanceSaveBtn" class="gloss-btn-saveable write-gated" onclick="attendanceSave()" style="background:var(--gold-dim);border:none;color:var(--bg);padding:6px 14px;border-radius:4px;cursor:pointer;font-family:\'Cinzel\',serif;font-size:11px;letter-spacing:0.1em;transition:background 0.15s,box-shadow 0.15s;">SAVE</button>
        <span style="font-size:12px;color:var(--text-dim);">${filteredPlayers.length} players · ${raids.length} raids</span>
      </div>

      <!-- Table -->
      <div id="attendanceScrollContainer" style="overflow-x:auto;">
        <table style="border-collapse:collapse;min-width:100%;">
          <thead>
            <tr style="border-bottom:2px solid var(--border);">
              <th style="text-align:left;padding:6px 12px;font-family:\'Cinzel\',serif;font-size:10px;letter-spacing:0.2em;color:var(--text-dim);white-space:nowrap;position:sticky;left:0;background:var(--bg);z-index:2;min-width:140px;">PLAYER</th>

              ${raids.map(r => `<th style="${thStyle}cursor:pointer;" onclick="attendanceToggleDeleteRaid('${r.date}')" title="Click to delete raid">

function attendanceToggleDeleteRaid(dateStr) {
  if (!writeToken) return;
  // Hide all other X buttons first
  document.querySelectorAll('[id^="att-del-"]').forEach(el => {
    if (el.id !== 'att-del-' + dateStr) el.style.display = 'none';
  });
  const el = document.getElementById('att-del-' + dateStr);
  if (el) el.style.display = el.style.display === 'none' ? 'inline' : 'none';
}

function attendanceDeleteRaid(dateStr) {
  const raid = attendanceData.raids.find(r => r.date === dateStr);
  if (!raid) return;
  if (!confirm(`Delete raid "${raid.label}" (${dateStr}) and all its attendance data?\n\nThis cannot be undone.`)) return;
  attendanceData.raids = attendanceData.raids.filter(r => r.date !== dateStr);
  // Record as manually deleted so rebuildAttendanceFromCla won't re-add it
  if (!attendanceData.deletedDates) attendanceData.deletedDates = [];
  if (!attendanceData.deletedDates.includes(dateStr)) attendanceData.deletedDates.push(dateStr);
  // Also clear any overrides for this date
  for (const key of Object.keys(attendanceData.overrides || {})) {
    if (attendanceData.overrides[key][dateStr] !== undefined) {
      delete attendanceData.overrides[key][dateStr];
    }
  }
  saveAttendanceToGitHub();
  renderAttendancePanel();
}

function attendanceAddRaid() {
  const input = document.getElementById('newRaidDateInput');
  if (!input?.value) return;
  const dateStr = input.value; // YYYY-MM-DD
  if (attendanceData.raids.find(r => r.date === dateStr)) return; // already exists
  const date = new Date(dateStr + 'T12:00:00'); // noon to avoid TZ issues
  const label = formatRaidLabel(date);
  attendanceData.raids.push({ date: dateStr, label });
  attendanceData.raids.sort((a, b) => a.date.localeCompare(b.date));
  // Also add to loot distribution so loot assigned during the raid goes to the right date
  if (!lootDistribution.raids.find(r => r.date === dateStr)) {
    lootDistribution.raids.push({ date: dateStr, label, items: [] });
    lootDistribution.raids.sort((a, b) => a.date.localeCompare(b.date));
    saveLootDistributionToGitHub();
  }
  input.value = '';
  saveAttendanceToGitHub();
  renderAttendancePanel();
}

function attendanceFilterRole(val) {
  _attendanceFilter.role = val;
  renderAttendancePanel();
}

function attendanceFilterClass(val) {
  _attendanceFilter.cls = val;
  renderAttendancePanel();
}

function attendanceToggle(playerName, dateStr, value) {
  setPlayerAttendanceOverride(playerName, dateStr, value);
  // Update count for this column
  const players = rosterData.players.filter(p => !rosterData.excluded?.includes(p.name));
  const count = players.filter(p => getPlayerAttendance(p.name, dateStr)).length;
  const el = document.getElementById('att-count-' + dateStr);
  if (el) el.textContent = count;
  // Mark dirty — user must explicitly save
  _attendanceDirty = true;
  const saveBtn = document.getElementById('attendanceSaveBtn');
  if (saveBtn) saveBtn.classList.add('gloss-btn-ready');
}

async function attendanceSave() {
  if (!_attendanceDirty) return;
  const saveBtn = document.getElementById('attendanceSaveBtn');
  if (saveBtn) { saveBtn.textContent = 'SAVING…'; saveBtn.disabled = true; }
  try {
    await saveAttendanceToGitHub();
    _attendanceDirty = false;
    if (saveBtn) { saveBtn.textContent = 'SAVED ✓'; saveBtn.classList.remove('gloss-btn-ready'); }
    setTimeout(() => {
      if (saveBtn) { saveBtn.textContent = 'SAVE'; saveBtn.disabled = false; }
    }, 1500);
  } catch(e) {
    if (saveBtn) { saveBtn.textContent = 'FAILED'; saveBtn.disabled = false; }
    setTimeout(() => { if (saveBtn) saveBtn.textContent = 'SAVE'; }, 2000);
  }
}

// ── [from LC dashboard] Worker storage (KV) + conflict handling ─────────────────────
// ── Version tracking (optimistic locking) ────────────────────────
// Tracks the _v value seen when each file was last loaded.
// If the Worker has a newer version at save time, the save is rejected.
const _loadedVersions = {};

// Every WF key lives under KV_PREFIX so this dashboard never touches LC data.
function _kvKey(filename) { return KV_PREFIX + filename; }

function _workerBase() {
  let base = CF_WORKER_URL.trim().replace(/\/+$/, '');
  if (!base.startsWith('http://') && !base.startsWith('https://')) base = 'https://' + base;
  return base;
}

async function fetchFromWorker(filename) {
  if (!CF_WORKER_URL) throw new Error('CF_WORKER_URL not configured');
  const res = await fetch(`${_workerBase()}/${_kvKey(filename)}`, { cache: 'no-store' });
  // 404 = nothing saved under this prefix yet (fresh WF install) — callers treat null as "empty".
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`Worker fetch failed for ${_kvKey(filename)}: ${res.status}`);
  const data = await res.json();
  // Record the version we loaded so we can detect conflicts on save
  if (data && typeof data._v === 'number') _loadedVersions[filename] = data._v;
  return data;
}

async function _saveJsonNow(filename, data) {
  if (!CF_WORKER_URL) throw new Error('CF_WORKER_URL not configured — set cf_worker_url in config.json');
  if (!writeToken) throw new Error('Write token required — enter it in the auth panel');

  // Optimistic locking: fetch current version from Worker and compare
  // before writing, to detect if someone else saved since we loaded
  try {
    const current = await fetch(`${_workerBase()}/${_kvKey(filename)}`, { cache: 'no-store' });
    if (current.ok) {
      const currentData = await current.json();
      const currentVersion = typeof currentData._v === 'number' ? currentData._v : 0;
      const loadedVersion = typeof _loadedVersions[filename] === 'number' ? _loadedVersions[filename] : 0;
      if (currentVersion > loadedVersion) {
        throw new Error(`CONFLICT:${filename}`);
      }
    }
  } catch(e) {
    if (e.message.startsWith('CONFLICT:')) throw e;
    // If the version check fetch fails, proceed anyway (Worker may not have file yet)
  }

  // Increment version before saving
  const loadedV = typeof _loadedVersions[filename] === 'number' ? _loadedVersions[filename] : 0;
  const nextV = loadedV + 1;
  const dataWithVersion = { ...data, _v: nextV };

  const res = await fetch(`${_workerBase()}/${_kvKey(filename)}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Token': writeToken },
    body: JSON.stringify(dataWithVersion, null, 2),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(`Worker save failed for ${filename}: ${err.error || res.status}`);
  }

  // Update our local version to what we just wrote
  _loadedVersions[filename] = nextV;

  // The LC dashboard re-fetched the file here. That swapped the in-memory object for the
  // server copy while the user could already be making the next edit on the old object,
  // silently dropping or misplacing that edit (easy to hit when adding glossary entries
  // quickly). What we just wrote IS the current state, so there is nothing to reload.
}

// Saves to the same key run one at a time, in order. Two overlapping saves could otherwise
// both pass the version check and land out of order, leaving the older snapshot in KV.
const _saveChains = {};
function saveJsonToGitHub(filename, data) {
  const run = () => _saveJsonNow(filename, data);
  const p = (_saveChains[filename] || Promise.resolve()).catch(() => {}).then(run);
  _saveChains[filename] = p;
  return p;
}

// ── Conflict error handler ───────────────────────────────────────
function handleSaveError(e, filename) {
  if (e.message && e.message.startsWith('CONFLICT:')) {
    const file = e.message.split(':')[1] || filename || 'data';
    addError(
      `Save conflict on ${file}`,
      'Another user saved changes after you loaded this page. ' +
      'Your changes were NOT saved. Please refresh the page to get the latest data, then re-apply your changes.'
    );
  } else {
    addError(`Save failed${filename ? ' (' + filename + ')' : ''}`, e.message || String(e));
  }
}



// ── [from LC dashboard] custom tooltips ─────────────────────────────────────────────
const tooltipEl = document.createElement('div');
tooltipEl.id = 'custom-tooltip';
document.body.appendChild(tooltipEl);

let longPressTimer = null;
let activeTooltipTarget = null;

function showTooltip(text, x, y) {
  if (!text) return;
  tooltipEl.textContent = text.replace(/&#10;/g, '\n');
  tooltipEl.classList.add('visible');
  positionTooltip(x, y);
}

function positionTooltip(x, y) {
  const pad = 12;
  const tw = tooltipEl.offsetWidth;
  const th = tooltipEl.offsetHeight;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  let left = x + pad;
  let top  = y + pad;
  if (left + tw > vw - pad) left = x - tw - pad;
  if (top  + th > vh - pad) top  = y - th - pad;
  tooltipEl.style.left = Math.max(pad, left) + 'px';
  tooltipEl.style.top  = Math.max(pad, top)  + 'px';
}

function hideTooltip() {
  tooltipEl.classList.remove('visible');
}

function getTitleText(el) {
  let cur = el;
  while (cur && cur !== document.body) {
    // Check both real title and our stashed data attribute
    const stashed = cur.getAttribute('data-title-stash');
    if (stashed) return stashed;
    const t = cur.getAttribute('title');
    if (t) return t;
    cur = cur.parentElement;
  }
  return null;
}

// Track which element we stripped title from so we can restore it
let strippedEl = null;
let strippedTitle = '';

function getTitleEl(el) {
  let cur = el;
  while (cur && cur !== document.body) {
    if (cur.hasAttribute('title') && cur.getAttribute('title')) return cur;
    cur = cur.parentElement;
  }
  return null;
}

// Desktop: hover
document.addEventListener('mouseover', e => {
  const el = getTitleEl(e.target);
  if (el) {
    // Strip title to prevent native tooltip overlapping
    if (strippedEl && strippedEl !== el) {
      strippedEl.setAttribute('title', strippedTitle);
    }
    strippedTitle = el.getAttribute('title');
    strippedEl = el;
    el.setAttribute('data-title-stash', strippedTitle);
    el.setAttribute('title', '');
    showTooltip(strippedTitle, e.clientX, e.clientY);
  } else {
    hideTooltip();
  }
});
document.addEventListener('mousemove', e => {
  if (tooltipEl.classList.contains('visible')) positionTooltip(e.clientX, e.clientY);
});
document.addEventListener('mouseout', e => {
  const el = getTitleEl(e.relatedTarget);
  if (!el) {
    hideTooltip();
    // Restore stripped title
    if (strippedEl) {
      strippedEl.setAttribute('title', strippedTitle);
      strippedEl.removeAttribute('data-title-stash');
      strippedEl = null;
      strippedTitle = '';
    }
  }
});

// Mobile: long-press (500ms)
document.addEventListener('touchstart', e => {
  const text = getTitleText(e.target);
  if (!text) return;
  const touch = e.touches[0];
  longPressTimer = setTimeout(() => {
    showTooltip(text, touch.clientX, touch.clientY);
    activeTooltipTarget = e.target;
  }, 500);
}, { passive: true });

document.addEventListener('touchend', () => {
  clearTimeout(longPressTimer);
  // Keep tooltip visible briefly so user can read it
  setTimeout(hideTooltip, 5000);
}, { passive: true });

document.addEventListener('touchmove', () => {
  clearTimeout(longPressTimer);
  hideTooltip();
}, { passive: true });
