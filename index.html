<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<meta name="theme-color" content="#071421">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WF Loot</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --gold-dim: #7a5f28;
    --bg: #0a0a0a;
    --bg2: #111111;
    --bg3: #191919;
    --border: #2a2a22;
    --text: #e8e4dc;
    --text-dim: #a8a89a;
    --red: #c94c4c;
    --green: #4caa6e;
    /* Width of the main content column. Was 960px; +10% for the wider tables. */
    --content-width: 1056px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 17px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Parchment texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(var(--accent-rgb),0.03) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(var(--accent-rgb),0.02) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    /* Widened from 960px to 1056px (+10%) to give the wide tables more room —
       the attendance cell in particular grew by ~24px when the perfect-attendance
       star slot was added. Single knob: change --content-width to retune. */
    max-width: var(--content-width, 1056px);
    margin: 0 auto;
    padding: 40px 24px 80px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    text-align: center;
    padding: 48px 0 20px;
    position: relative;
  }

  header::after {
    content: '';
    display: block;
    width: 320px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 24px auto 0;
  }

  .guild-name {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.4em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 0.05em;
    line-height: 1.1;
    text-shadow: 0 0 40px rgba(var(--accent-rgb),0.3);
  }

  .subtitle {
    margin-top: 10px;
    color: var(--text-dim);
    font-style: italic;
    font-size: 20px;
    letter-spacing: 0.08em;
  }

  /* Dot legend */
  .dot-legend {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin: 16px 0 0;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: inline-block;
    flex-shrink: 0;
  }

  /* Grouping buttons */
  .group-btns {
    display: flex;
    gap: 4px;
  }

  .nav-segments {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin: 4px auto 0;
  }

  .nav-segment {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .nav-segment-label {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-dim);
    font-weight: 700;
  }

  .nav-dropdown {
    position: relative;
    display: inline-block;
  }

  .nav-dropdown-btn {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 9px 18px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .nav-dropdown-btn:hover,
  .nav-dropdown-btn.open {
    border-color: var(--gold-dim);
    color: var(--gold);
  }

  .nav-dropdown-btn.has-active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(var(--accent-rgb),0.08);
  }

  .nav-dropdown-btn .nav-dd-arrow {
    font-size: 9px;
    opacity: 0.6;
    transition: transform 0.15s;
  }

  .nav-dropdown-btn.open .nav-dd-arrow {
    transform: rotate(180deg);
  }

  .nav-dropdown-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 4px;
    display: none;
    flex-direction: column;
    z-index: 200;
    min-width: 100%;
    overflow: hidden;
  }

  .nav-dropdown-menu.open {
    display: flex;
  }

  .nav-dropdown-menu .group-btn {
    border: none;
    border-bottom: 1px solid var(--border);
    border-radius: 0;
    text-align: left;
    padding: 9px 18px;
    white-space: nowrap;
  }

  .nav-dropdown-menu .group-btn:last-child {
    border-bottom: none;
  }

  .nav-dropdown-menu .group-btn:hover {
    border-color: transparent;
    background: rgba(var(--accent-rgb),0.08);
    color: var(--gold);
  }

  .nav-segment-btns {
    display: flex;
    gap: 4px;
    justify-content: center;
  }

  .group-btn.group-btn-large {
    font-size: 13px;
    padding: 10px 28px;
    letter-spacing: 0.15em;
  }

  .group-btn {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
  }

  .group-btn:hover {
    border-color: var(--gold-dim);
    color: var(--gold);
  }

  .group-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(var(--accent-rgb),0.08);
  }

  .role-icon {
    font-size: 11px;
    opacity: 0.75;
    margin-left: 3px;
    cursor: default;
  }

  .role-subtitle {
    font-family: 'Crimson Pro', serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    text-transform: none;
  }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--gold-dim);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
    flex-shrink: 0;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 10px 24px;
    border: 1px solid var(--gold-dim);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--gold);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.2s;
    z-index: -1;
  }

  .btn:hover {
    color: var(--bg);
    border-color: var(--gold);
  }

  .btn:hover::before { transform: scaleX(1); }

  .btn.primary {
    background: var(--gold);
    color: var(--bg);
    border-color: var(--gold);
  }

  .btn.primary:hover { background: var(--gold-light); border-color: var(--gold-light); }
  .btn.primary::before { display: none; }

  .status {
    font-style: italic;
    color: var(--text-dim);
    font-size: 14px;
    margin-left: auto;
  }

  .status.loading { color: var(--gold-dim); }
  .status.error { color: var(--red); }
  .status.success { color: var(--green); }

  /* Role sections */
  .role-section {
    margin-bottom: 48px;
    animation: fadeIn 0.4s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .role-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }

  .role-title {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .role-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--gold-dim), transparent);
  }

  .role-toggle {
    font-size: 11px;
    color: var(--gold-dim);
    margin-left: 6px;
  }

  .role-header:hover .role-count { color: var(--gold); }
  .role-header:hover .role-toggle { color: var(--gold); }

  .role-count {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  /* Table */
  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  thead th:not(:first-child) { text-align: right; }
  thead th[data-col] { cursor: pointer; user-select: none; white-space: nowrap; }
  thead th[data-col]:hover { color: var(--gold); }
  .sort-arrow { color: var(--gold-dim); font-size: 10px; }
  td.points-cell, td.consumes-cell { text-align: center !important; }
  td.att-count { text-align: right !important; font-family: 'Cinzel', serif; font-size: 13px; color: var(--text-dim); }
  td:has(.raid-dots), td:has(.raid-dot), td:has(.raid-star) { text-align: center !important; }

  tbody tr {
    border-bottom: 1px solid rgba(var(--line-rgb),0.6);
    transition: background 0.15s;
  }

  tbody tr:hover { background: rgba(var(--accent-rgb),0.04); }

  tbody tr.na-row { opacity: 0.45; }

  td {
    padding: 10px 12px;
    font-size: 16px;
  }

  td:not(:first-child) { text-align: right; }

  .player-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 400;
    color: var(--text);
    letter-spacing: 0.02em;
    min-width: 16ch;
    width: 16ch;
  }

  .raids-num {
    color: var(--text-dim);
    font-size: 14px;
  }

  .window-num {
    color: var(--text-dim);
    font-size: 14px;
  }

  /* Attendance bar cell */
  .att-cell {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
  }

  .att-pct {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    min-width: 52px;
    text-align: right;
  }

  /* Perfect-attendance flair: 20+ raids and never missed one. Renders INSIDE .att-pct
     in place of the "100%" text, so it occupies the existing column and adds no width —
     the bar and every other row's percentage stay exactly where they were. Display only:
     sorting reads p.pct / p.attended from the data, never this text. */
  .att-star {
    font-size: 16px;
    line-height: 1;
    color: #f0c419;
    filter: drop-shadow(0 0 4px rgba(240,196,25,0.55));
    cursor: default;
  }

  .att-pct.high { color: #8abf50; }
  .att-pct.mid { color: #d4c84a; }
  .att-pct.low { color: #c94c4c; }
  .att-pct.exact100 { color: #4caa6e; }
  .att-bar-fill.exact100 { background: #4caa6e; }
  .att-bar-fill.high { background: #8abf50; }
  .att-bar-fill.mid { background: #d4c84a; }
  .att-bar-fill.low { background: #c94c4c; }
  .att-pct.na { color: var(--text-dim); font-weight: 400; font-family: 'Crimson Pro', serif; font-style: italic; }

  .att-bar-bg {
    width: 80px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .att-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.6s ease;
  }



  /* Summary footer */
  .summary {
    margin-top: 48px;
    padding: 24px;
    border: 1px solid var(--border);
    background: var(--bg2);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    text-align: center;
    align-items: start;
  }

  .summary-item label {
    display: block;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
    min-height: 2.4em;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .summary-item .val {
    font-family: 'Cinzel', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--gold);
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 80px 24px;
    color: var(--text-dim);
    font-style: italic;
  }

  .empty .icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.3;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 0 0 36px;
  }

  /* Points highlighting */
  .points-cell {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    text-align: right;
    color: var(--text-dim);
  }

  .pts-top .points-cell,
  .points-cell.pts-top {
    color: #e05555;
    text-shadow: 0 0 12px rgba(220,80,80,0.5);
  }

  .pts-bottom .points-cell,
  .points-cell.pts-bottom {
    color: #4caa6e;
    text-shadow: 0 0 12px rgba(76,170,110,0.4);
  }

  tr.pts-top {
    background: rgba(200, 60, 60, 0.06);
  }

  tr.pts-bottom {
    background: rgba(76, 170, 110, 0.06);
  }

  /* Priority column */
  .priority-cell {
    text-align: center !important;
  }

  .priority-score {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    cursor: default;
  }

  /* Gear issue flag */
  .gear-flag-cell {
    width: 20px;
    text-align: center;
    padding: 10px 4px;
  }

  .gear-flag {
    color: #e07830;
    font-size: 13px;
    cursor: default;
    filter: drop-shadow(0 0 4px rgba(224,120,48,0.6));
  }

  /* Consumes column */
  .consumes-cell {
    text-align: right;
  }

  /* Inactive players */
  .inactive-row {
    opacity: 0.4;
    filter: grayscale(0.4);
  }

  .inactive-badge {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 2px 6px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* Loot expansion */
  .loot-arrow {
    font-size: 11px;
    color: var(--gold-dim);
    transition: transform 0.2s;
    margin-left: 4px;
  }

  .player-name:hover .loot-arrow { color: var(--gold); }

  .loot-row {
    animation: fadeIn 0.2s ease both;
  }

  .loot-cell {
    padding: 10px 16px 14px 24px !important;
    background: var(--bg2);
    border-bottom: 1px solid var(--border) !important;
  }

  .loot-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .loot-item {
    font-size: 15px;
    color: var(--gold-light);
    background: rgba(var(--accent-rgb),0.07);
    border: 1px solid var(--gold-dim);
    padding: 3px 10px;
    white-space: nowrap;
    text-decoration: none;
    display: inline-block;
    transition: background 0.15s, color 0.15s;
  }

  a.loot-item:hover {
    background: rgba(var(--accent-rgb),0.18);
    color: #fff;
    border-color: var(--gold);
  }

  .expand-section-title {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 8px;
  }

  /* Raw accumulated loot value beside the "Loot Received" heading — the Loot Score
     numerator before the raids-attended divisor. Brighter than the heading so the
     number reads as data rather than as part of the label. */
  .raw-loot-total {
    color: var(--text-dim);
    letter-spacing: 0.08em;
    font-weight: 700;
    cursor: help;
  }

  .cla-entry-label {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    margin-bottom: 6px;
    margin-top: 4px;
  }

  .loot-item.gear-issue {
    color: #e09050;
    border-color: #7a4a20;
    background: rgba(200,120,60,0.07);
  }

  .buff-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 4px;
  }

  .buff-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4px 10px;
    border: 1px solid var(--border);
    font-size: 11px;
    min-width: 70px;
  }

  .buff-label {
    color: var(--text-dim);
    font-size: 10px;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
    text-align: center;
  }

  .buff-val {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 700;
  }

  .buff-ok { border-color: #2a5a3a; background: rgba(76,170,110,0.06); }
  .buff-ok .buff-val { color: var(--green); }
  .buff-missing { border-color: #5a2a2a; background: rgba(200,80,80,0.06); }
  .buff-missing .buff-val { color: var(--red); }
  .buff-partial { border-color: #5a4a20; background: rgba(200,160,60,0.06); }
  .buff-partial .buff-val { color: var(--gold); }

  .no-loot {
    color: var(--text-dim);
    font-size: 14px;
  }

  /* Dot indicators for raid dates */
  .raid-dots {
    display: inline-flex;
    gap: 4px;
    justify-content: center;
    flex-wrap: nowrap;
  }

  .raid-dot {
    width: 8px;
    height: 8px;
    min-width: 8px;
    border-radius: 50%;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .raid-dot.present { background: var(--green); border-color: var(--green); }

  .raid-star {
    font-size: 14px;
    width: 8px;
    height: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    vertical-align: middle;
    overflow: visible;
    position: relative;
    top: -1px;
    color: #4caa6e;
    cursor: default;
    filter: drop-shadow(0 0 3px currentColor);
  }
  .raid-dot.absent { background: transparent; }
  .raid-dot.inactive { background: transparent; border-color: transparent; }

  /* CLA Manager */
  .cla-manager {
    border: 1px solid var(--border);
    background: var(--bg2);
    margin-bottom: 24px;
  }

  .cla-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }

  .cla-header:hover { background: rgba(var(--accent-rgb),0.04); }

  .cla-title {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .cla-count {
    font-size: 12px;
    color: var(--text-dim);
    margin-left: 4px;
  }

  .cla-toggle {
    margin-left: auto;
    color: var(--gold-dim);
    font-size: 12px;
  }

  .cla-body {
    border-top: 1px solid var(--border);
    padding: 16px;
  }

  .cla-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }

  .cla-row-label {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    color: var(--gold);
    min-width: 60px;
  }

  .cla-row-url {
    color: var(--text-dim);
    font-size: 12px;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cla-row-gids {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .cla-remove {

    #glValueInput::-webkit-outer-spin-button,

  @media (max-width: 768px) {

      padding: 20px 12px 60px;
    }

    h1 { font-size: 28px; }
    .subtitle { font-size: 13px; }

    /* Controls */
    .controls {

      align-items: flex-start;
      gap: 8px;
    }

    /* Legend wraps tightly */
    .dot-legend {

    /* Role section */
    .role-header { gap: 8px; }
    .role-title { font-size: 11px; letter-spacing: 0.15em; }

    /* Scrollable table */
    .role-section { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { min-width: 600px; }

    /* Shrink text in table */
    td, th { padding: 8px 6px; font-size: 13px; }
    .player-name { font-size: 14px; }
    .att-pct { font-size: 12px; min-width: 40px; }
    .att-bar-bg { width: 50px; }
    .priority-score { font-size: 12px; }

    /* Dots smaller gap */
    .raid-dots { gap: 3px; }
    .raid-dot { width: 7px; height: 7px; min-width: 7px; }
    .raid-star { font-size: 12px; width: 7px; height: 7px; }

    /* Loot expand panel */
    .loot-cell { padding: 8px 10px 12px !important; }
    .loot-item { font-size: 12px; padding: 2px 8px; }

    /* CLA manager */
    .cla-add-form { flex-direction: column; }
    .cla-input, .cla-input.wide { width: 100%; }
    .nav-segments { gap: 8px; }
    .nav-segment-btns { flex-wrap: wrap; }

    .summary { grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px; }

  @media (max-width: 480px) {

  /* ═══════════════════════════════════════════════════════════════
     WoW Forever theme — taken from the logo: deep night-blue field,
     glowing teal centre, bronze frame, ivory lettering.
     Data colours (buff/attendance bands, class colours, SR red/green,
     ★ stars, gear ⚠) are untouched — only chrome changes here.
     The legacy --gold* variable names are kept so the copied LC code
     works unchanged; they now carry the teal accent.
     ═══════════════════════════════════════════════════════════════ */
  :root {
    --gold: #5cc8e0;          /* accent: active state, links, primary buttons */
    --gold-light: #aee9f5;
    --gold-dim: #3a9ab1;      /* muted accent: labels, arrows, secondary buttons */
    --accent-rgb: 92, 200, 224;
    --bronze: #c9a276;        /* frame: dividers, section titles, borders */
    --bronze-light: #e3c79f;
    --bronze-dim: #6f5236;
    --ivory: #f4ead3;         /* lettering: headings */
    --line-rgb: 36, 62, 80;
    --bg: #050c13;
    --bg2: #0a1721;
    --bg3: #0f202c;
    --border: #1c3242;
    --text: #e3eaee;
    --text-dim: #8ea5b2;
  }

  body {
    background:
      radial-gradient(ellipse 80% 520px at 50% -60px, rgba(38, 140, 172, 0.30), transparent 72%),
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(20, 70, 96, 0.18), transparent 70%),
      linear-gradient(180deg, #071421 0%, #050c13 420px, #04090f 100%);
    background-attachment: fixed;
  }
  body::before {
    background-image:
      radial-gradient(ellipse at 15% 40%, rgba(var(--accent-rgb), 0.035) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 25%, rgba(201, 162, 118, 0.03) 0%, transparent 50%);
  }

  /* ── Header: medallion behind the title, like the logo's disc ── */
  header { padding: 56px 0 24px; isolation: isolate; }
  header::before {
    content: '';
    position: absolute;
    left: 50%; top: 22px;
    width: 164px; height: 164px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, rgba(62, 170, 205, 0.34) 0%, rgba(22, 88, 120, 0.22) 45%, rgba(8, 30, 46, 0) 70%);
    box-shadow:
      0 0 0 2px rgba(201, 162, 118, 0.22),
      0 0 0 9px rgba(201, 162, 118, 0.05),
      0 0 0 10px rgba(201, 162, 118, 0.14),
      0 0 60px rgba(62, 170, 205, 0.18);
    z-index: -1;
    pointer-events: none;
  }
  header::after {
    width: 360px;
    background: linear-gradient(90deg, transparent, var(--bronze-dim) 15%, var(--bronze) 50%, var(--bronze-dim) 85%, transparent);
    margin-top: 28px;
  }
  #brandLogo { display: block; margin: -24px auto 8px; max-height: 150px; max-width: 80%; filter: drop-shadow(0 6px 18px rgba(0,0,0,0.5)); }

  h1 {
    color: var(--ivory);
    background: linear-gradient(180deg, #fffaf0 0%, #f1e2c2 45%, #d6b384 72%, #a87b4f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 2px 0 rgba(70, 45, 22, 0.9)) drop-shadow(0 0 22px rgba(var(--accent-rgb), 0.35));
    letter-spacing: 0.06em;
  }
  .subtitle { color: var(--bronze-light); opacity: 0.9; }
  .guild-name { color: var(--bronze); }

  /* ── Navigation ── */
  .group-btn, .nav-dropdown-btn { border-color: rgba(201, 162, 118, 0.28); background: rgba(10, 23, 33, 0.6); }
  .group-btn:hover, .nav-dropdown-btn:hover, .nav-dropdown-btn.open { border-color: var(--gold-dim); color: var(--gold-light); }
  .group-btn.active, .nav-dropdown-btn.has-active {
    border-color: var(--gold);
    color: var(--gold-light);
    background: linear-gradient(180deg, rgba(var(--accent-rgb), 0.16), rgba(var(--accent-rgb), 0.05));
    box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.18), inset 0 0 0 1px rgba(var(--accent-rgb), 0.12);
  }
  .nav-dropdown-menu { background: var(--bg2); border-color: rgba(201, 162, 118, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .nav-dropdown-menu .group-btn { background: transparent; }
  .nav-segment-label { color: var(--bronze); }

  /* ── Sections & tables ── */
  .role-title { color: var(--ivory); }
  .role-line { height: 1px; position: relative; background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.55), rgba(var(--accent-rgb), 0.14) 55%, transparent); box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.25); }
  .role-line::before { content: ''; position: absolute; left: -3px; top: -3px; width: 5px; height: 5px; transform: rotate(45deg); background: var(--gold); box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.7); }
  .role-toggle { color: var(--bronze); }
  .role-header:hover .role-count, .role-header:hover .role-toggle { color: var(--bronze-light); }
  .sort-arrow { color: var(--bronze-dim); }
  thead th { border-bottom-color: rgba(201, 162, 118, 0.22); }
  tbody tr:hover { background: rgba(var(--accent-rgb), 0.05); }
  .loot-cell { background: rgba(10, 23, 33, 0.85); }

  .summary {
    background: linear-gradient(180deg, rgba(15, 32, 44, 0.9), rgba(10, 23, 33, 0.9));

  }

  /* ── Panels / inputs / misc chrome ── */
  .gl-col, .cla-manager { background: rgba(10, 23, 33, 0.85); }
  .gl-col-title { color: var(--bronze); }
  .loot-select, .cla-input { background: var(--bg2); }
  .loot-item-dropdown { background: var(--bg2); border-color: var(--gold-dim); }
  #custom-tooltip { border-color: rgba(201, 162, 118, 0.45); background: #0b1924; }
  .inactive-badge { border-color: var(--border); }
  .btn { border-color: var(--gold-dim); }
  .small-gold-btn, .gl-add button { color: #04111a; }
  input[type=date] { color-scheme: dark; }
  ::selection { background: rgba(var(--accent-rgb), 0.35); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #1e3a4b; border-radius: 5px; border: 2px solid var(--bg); }

  /* ═══ v2: raid-centric UI components ═══ */
  html { background: #04090f; }
  .section-title { font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--bronze); margin: 6px 0 12px; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-dim); white-space: nowrap; cursor: pointer; }

  .ghost-btn:hover:not(:disabled) { border-color: var(--gold-dim); color: var(--gold-light); }
  .ghost-btn:disabled { opacity: 0.4; cursor: default; }
  .ghost-btn.danger:hover { border-color: var(--red); color: var(--red); }

  .x-btn:hover { color: var(--red); }
  .subtle-link { color: var(--gold-dim); font-size: 13px; cursor: pointer; list-style: none; }
  .subtle-link:hover { color: var(--gold-light); }
  details > summary.subtle-link::-webkit-details-marker { display: none; }

  .tag-opt, .tag-active, .tag-warn, .tag-ok { display: inline-block; font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; vertical-align: middle; border: 1px solid; }
  .tag-opt { color: var(--bronze-light); border-color: rgba(201,162,118,0.4); }
  .tag-active { color: var(--gold-light); border-color: var(--gold-dim); }
  .tag-warn { color: #e0a060; border-color: rgba(224,160,96,0.5); }
  .tag-ok { color: var(--green); border-color: rgba(76,170,110,0.5); }
  .bonus { color: var(--green); font-size: 11px; }

  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.6); animation: livepulse 1.8s infinite; flex-shrink: 0; }
  @keyframes livepulse { 0% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.6); } 70% { box-shadow: 0 0 0 8px rgba(var(--accent-rgb), 0); } 100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0); } }
  .active-raid-strip { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
  .active-raid-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--gold-dim); border-radius: 999px; background: rgba(var(--accent-rgb), 0.08); color: var(--gold-light); font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.1em; cursor: pointer; }

  .raid-new-grid { display: grid; grid-template-columns: 2fr 150px 2fr auto auto; gap: 8px; align-items: center; }
  .raid-card { border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; background: rgba(10,23,33,0.7); transition: border-color 0.15s, background 0.15s; }
  .raid-card.active { border-color: rgba(var(--accent-rgb), 0.45); box-shadow: 0 0 18px rgba(var(--accent-rgb), 0.08), inset 3px 0 0 var(--gold); }
  .raid-card:hover { background: rgba(var(--accent-rgb), 0.06); }
  .raid-card-name { font-family: 'Cinzel', serif; font-size: 15px; color: var(--ivory); letter-spacing: 0.05em; }
  .raid-card-stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text-dim); margin-top: 6px; }

  .mini-table { width: 100%; border-collapse: collapse; font-size: 14px; }

  @media (max-width: 768px) { .gl-sugg { grid-template-columns: auto 1fr; } .gl-sugg-arrow { display: none; } .gl-sugg-actions { grid-column: 1 / -1; } }

<script>
// ═════════════════════════════════════════════════════════════════════════════
// WoW Forever — Soft Reserve dashboard (v2: raid-centric)
//
// Forked from the DBS TBC Loot Council dashboard. Storage is the same Cloudflare
// Worker + KV namespace, every key under KV_PREFIX ("wf/"):
//   wf/raids.json      raid events: date, name, optional, status, softres sheets
//                      (synced snapshot + manual edits), attendance overrides, loot
//   wf/roster.json     raiders (+ manual SR adjustments)
//   wf/glossary.json   raids → bosses → item keys, and item metadata
//   wf/sr-rules.json   SR earning rules (edited on the SR Rules page)
//   wf/cla-sheets.json CLA sheet references + parsed cache (label = raid date)
//
// Nothing is stored about SR balances or bad-luck counters: both are recomputed
// from raids + rules on every load (see computeSrLedger / computeBlp).
// WarcraftLogs is preserved but disabled — see <script id="wcl-integration-disabled">.
// ═════════════════════════════════════════════════════════════════════════════

// ── Config (config.json overrides; SR rules live in KV, not here) ──
let CF_WORKER_URL = '';
let KV_PREFIX = 'wf/';
let STORAGE_NS = 'wf:';
let GUILD_NAME = 'WoW Forever';
let GUILD_SUBTITLE = 'Soft Reserve Summary';
let PAGE_TITLE = 'WF Loot';
let WOWHEAD_BRANCH = 'classic';
let ENABLE_WCL = false;
let ENABLE_APPS_SCRIPT = true;

// ── [from LC dashboard] name/escape helpers ─────────────────────────────────────────
// Normalize player names for fuzzy matching (strip special chars, lowercase)
function normalizeName(name) {
  return String(name ?? '').toLowerCase()
    // Expand ligatures before stripping accents
    .replace(/æ/g, 'ae').replace(/œ/g, 'oe').replace(/ß/g, 'ss')
    .replace(/ø/g, 'o').replace(/[đð]/g, 'd').replace(/þ/g, 'th').replace(/ł/g, 'l').replace(/ı/g, 'i')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '') // strip accent marks
    .replace(/[^a-z0-9]/g, '');       // strip everything else
}

/**
 * Escape a value for use as a single-quoted JS string literal.
 *
 * Use with element.setAttribute('onclick', `fn('${jsStr(name)}')`) — setAttribute stores
 * the value verbatim, so it must NOT be HTML-entity encoded.
 *
 * This existed three different ways in this file, two of them broken:
 *   .replace(/'/g, "\'")      → in a double-quoted JS string "\'" is just ' — the
 *                               backslash is dropped at parse time, so this replaced an
 *                               apostrophe with an apostrophe and did nothing at all.
 *   .replace(/'/g, "\\\\'")   → emitted  Pepe\\'s , an escaped backslash followed by a
 *                               string terminator, which also fails to parse.
 * Both produced "Uncaught SyntaxError: missing ) after argument list" and a button that
 * silently did nothing, for any player or item containing an apostrophe.
 */
function jsStr(value) {
  return String(value ?? '')
    .replace(/\\/g, '\\\\')   // must come first, or it re-escapes our own backslashes
    .replace(/'/g, "\\'")
    .replace(/\r/g, '\\r')
    .replace(/\n/g, '\\n');
}

/**
 * Escape a value for a single-quoted JS string inside an HTML attribute built by a
 * template literal — e.g. html += `<button onclick="fn('${jsAttr(name)}')">`.
 *
 * Two layers, in order: JS-string escaping, then HTML-attribute escaping so a name
 * containing " or & cannot terminate the attribute or corrupt an entity. The browser
 * decodes the entities first, leaving valid JS underneath.
 */
function jsAttr(value) {
  return jsStr(value)
    .replace(/&/g, '&amp;')   // before &quot; below, or the ampersand double-encodes
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// Normalize date strings for flexible matching: strip leading zeros, whitespace
// e.g. "03/11", " 3/11 ", "3/11/2026" all -> "3/11"
function normalizeDate(d) {
  return (d || '').trim()
    .replace(/\b0(\d)/g, '$1')   // remove leading zeros from each number
    .replace(/\/\d{4}$/, '')     // strip 4-digit year suffix if present
    .trim();
}

// ── [from LC dashboard] CSV helpers ─────────────────────────────────────────────────
function normalizeClaPaste(text) {
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
  // Detect TSV by checking if the first line has more tabs than commas
  const firstLine = text.split('\n')[0] || '';
  const tabCount = (firstLine.match(/\t/g) || []).length;
  const commaCount = (firstLine.match(/,/g) || []).length;
  if (tabCount <= commaCount) return text; // already CSV-like
  // Convert TSV to CSV: tabs → commas, handle no special quoting needed for CLA data
  return text.split('\n').map(line =>
    line.split('\t').map(cell => {
      // Quote cells containing commas
      return cell.includes(',') ? '"' + cell.replace(/"/g, '""') + '"' : cell;
    }).join(',')
  ).join('\n');
}

function parseCsvRows(text) {
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim().split('\n');
  return lines.map(line => {
    const result = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    result.push(cur.trim());
    return result;
  });
}



// ── [from LC dashboard] date helpers ────────────────────────────────────────────────
function mstDateParts(date) {
  // Shift date to MST (UTC-7) before extracting parts, avoiding browser timezone issues
  const mst = new Date(date.getTime() - 7 * 60 * 60 * 1000);
  const y = mst.getUTCFullYear();
  const m = mst.getUTCMonth(); // 0-indexed
  const d = mst.getUTCDate();
  return { y, m, d };
}

function formatAttendanceDate(date) {
  // ISO date string YYYY-MM-DD in MST
  const { y, m, d } = mstDateParts(date);
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

function todayMST() {
  // Return today's date as YYYY-MM-DD in MST (UTC-7, no DST adjustment)
  return formatAttendanceDate(new Date());
}

function formatRaidLabel(date) {
  // "Mar 19" style, in MST
  const { m, d } = mstDateParts(date);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[m]} ${d}`;
}

// ── [from LC dashboard] Apps Script / CORS proxy / errors / status ──────────────────

// Route CORS-blocked fetches through our own Cloudflare Worker's /proxy endpoint.
//
// This used to point at corsproxy.io. Their free tier is scoped to localhost and dev
// tunnels only, so a free key can never authenticate from a GitHub Pages origin — it
// returns {"error":"Invalid or inactive API key"} on every request regardless of the
// Allowed Domains list. The Worker has no rate limit, no monthly quota, no key, and
// no third party. corsproxy is kept only as a fallback for installs that haven't set
// cf_worker_url yet.
function corsProxyUrl(targetUrl) {
  const base = (CF_WORKER_URL || '').trim().replace(/\/+$/, '');
  if (base) {
    const b = base.startsWith('http') ? base : 'https://' + base;
    return b + '/proxy?url=' + encodeURIComponent(targetUrl);
  }
  let u = 'https://corsproxy.io/?url=' + encodeURIComponent(targetUrl);
  if (CORS_API_KEY) u += '&key=' + encodeURIComponent(CORS_API_KEY);
  return u;
}

// Fetch a Google Sheet tab via Apps Script proxy
async function proxyFetch(targetUrl) {
  const proxies = [
    u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
    u => corsProxyUrl(u),
    u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  ];
  for (const proxy of proxies) {
    try {
      const res = await fetch(proxy(targetUrl));
      if (res.ok) {
        const text = await res.text();
        if (text && text.length > 2) return text;
      }
    } catch(e) {}
  }
  throw new Error('All proxies failed for: ' + targetUrl);
}

// Circuit breaker: when the proxy rejects us for a reason that applies to EVERY request
// (bad credentials, rate limit), failing the remaining ~130 requests one at a time is
// just noise. Trip once and fail the rest fast.
let _corsProxyTripped = null; // null = ok, otherwise the status that tripped it
let _corsProxy429s = 0;
const CORS_429_LIMIT = 3;

// Clear the breaker before any user-initiated fetch. It is scoped to one load, but
// adding a CLA sheet or looking up gear IDs happens long after a load that may have
// tripped it — without this reset those actions fail with a stale "halted" error.
function resetProxyBreaker() {
  _corsProxyTripped = null;
  _corsProxy429s = 0;
}

async function appsScriptFetch(url, _retry = 0) {
  if (_corsProxyTripped) {
    throw new Error('Apps Script fetch skipped — the CORS proxy returned ' + _corsProxyTripped +
      ' and further requests were halted for this load');
  }
  // Apps Script redirects through script.googleusercontent.com, which sends no CORS
  // headers; the proxy follows that redirect and adds them.
  const proxy = corsProxyUrl(url);
  const res = await fetch(proxy);

  if (res.status === 401) {
    // Credentials rejected — applies to every request, so retrying can never help.
    _corsProxyTripped = 401;
    throw new Error('Apps Script fetch failed: 401');
  }

  if (res.status === 403) {
    // With the Worker proxy, 403 means "this target host isn't on the allowlist" —
    // that is specific to ONE url, not a global failure, so it must NOT trip the
    // breaker or a single mistyped sheet URL would abort the entire load.
    let detail = '';
    try { detail = (await res.clone().json()).error || ''; } catch(_) {}
    throw new Error('Apps Script fetch failed: 403' + (detail ? ' — ' + detail : ''));
  }

  if (res.status === 429) {
    if (++_corsProxy429s >= CORS_429_LIMIT) {
      _corsProxyTripped = 429;
      throw new Error('Apps Script fetch failed: 429 (rate limit — halting further requests)');
    }
    if (_retry < 1) {
      // One gentle retry only. Aggressive retries multiply request volume against
      // the very limit we already exceeded.
      const retryAfterSec = parseFloat(res.headers.get('Retry-After'));
      const delayMs = !isNaN(retryAfterSec) ? retryAfterSec * 1000 : 1500 + Math.random() * 500;
      await new Promise(r => setTimeout(r, delayMs));
      return appsScriptFetch(url, _retry + 1);
    }
  }

  if (!res.ok) throw new Error('Apps Script fetch failed: ' + res.status);
  return res.text();
}

// Run `items` through `worker` with at most `limit` in flight at once.
// Used to keep corsproxy.io request bursts under its (low) free-tier rate limit
// instead of firing every CLA sheet's requests simultaneously.
async function runWithConcurrency(items, limit, worker) {
  let idx = 0;
  async function next() {
    while (idx < items.length) {
      const i = idx++;
      await worker(items[i], i);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, next));
}

function setStatus(msg, type='') {
  const el = document.getElementById('status');
  const btn = document.querySelector('.btn.primary');
  if (type === 'loading') {
    el.innerHTML = '<span class="spinner"></span>' + msg;
    if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; btn.style.cursor = 'not-allowed'; }
  } else {
    el.innerHTML = msg;
    if (btn) { btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = ''; }
  }
  el.className = 'status ' + type;
}



// ── [from LC dashboard] colour bands ────────────────────────────────────────────────
function pctColor(pct) {
  // 100 / 90+ / 75+ / 50+ / <50  (used for attendance & consumes & dots)
  if (pct >= 100) return C1;
  if (pct >= 90)  return C2;
  if (pct >= 75)  return C3;
  if (pct >= 50)  return C4;
  return C5;
}

function gearColor(count) {
  // 0=none, 1 / 2 / 3-4 / 5+
  if (count <= 0) return C1;
  if (count === 1) return C2;
  if (count === 2) return C3;
  if (count === 3) return C4;
  return C5; // 4+
}



// ── [from LC dashboard] perfect attendance ──────────────────────────────────────────
const PERFECT_ATT_MIN_RAIDS = 20;
function hasPerfectAttendance(p) {
  return !!p
    && p.pct !== null && p.pct !== undefined
    && p.attended >= PERFECT_ATT_MIN_RAIDS
    // pct is (attended / window) * 100; guard the float rather than testing === 100.
    && p.pct >= 99.995;
}



// ── [from LC dashboard] attendance % class ──────────────────────────────────────────
function pctClass(pct) {
  if (pct === null) return 'na';
  if (pct >= 100) return 'exact100';
  if (pct >= 90)  return 'high';
  if (pct >= 75)  return 'mid';
  if (pct >= 50)  return 'low';
  return 'low';
}
// Inline colour for attendance bar text
function attPctColor(pct) { return pct === null ? '' : pctColor(pct); }

async function saveGithubToken() {
  const token = document.getElementById('claToken')?.value.trim();
  if (!token) return;

  const saveBtn = document.querySelector('#githubAuthFooter .btn.primary');
  if (saveBtn) { saveBtn.textContent = 'Validating…'; saveBtn.disabled = true; }

  try {
    let base = (CF_WORKER_URL || '').trim().replace(/\/+$/, '');
    if (!base.startsWith('http')) base = 'https://' + base;
    const res = await fetch(`${base}/auth-check`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Token': token },
    });
    if (!res.ok) {
      if (saveBtn) { saveBtn.textContent = 'Save Token'; saveBtn.disabled = false; }
      const input = document.getElementById('claToken');
      if (input) {
        input.style.borderColor = 'var(--red)';
        setTimeout(() => { input.style.borderColor = ''; }, 2000);
      }
      // Show error below the input
      let errEl = document.getElementById('tokenErrorMsg');
      if (!errEl) {
        errEl = document.createElement('div');
        errEl.id = 'tokenErrorMsg';
        errEl.style.cssText = 'color:var(--red);font-size:12px;margin-top:6px;';
        document.querySelector('#githubAuthFooter .btn.primary')?.parentNode?.after(errEl);
        input?.parentNode?.appendChild(errEl);
      }
      errEl.textContent = res.status === 401 ? 'Invalid token — access denied.' : `Validation failed (${res.status}).`;
      return;
    }
  } catch(e) {
    // Worker unreachable — warn but allow (offline scenario)
    console.warn('Token validation fetch failed:', e.message);
  }

  writeToken = token;
  try { localStorage.setItem('writeToken', token); } catch(e) {}
  document.getElementById('claToken').value = '';
  if (saveBtn) { saveBtn.textContent = 'Save Token'; saveBtn.disabled = false; }
  const errEl = document.getElementById('tokenErrorMsg');
  if (errEl) errEl.remove();
  updateAuthState();
}

// ── [from LC dashboard] CLA gear listing parser ─────────────────────────────────────
// Gear listing slot columns (matches CSV header row)
const GEAR_LISTING_SLOTS = ['Head','Neck','Shoulders','Cloak','Chest','Bracers','Hands','Waist','Legs','Feet','Ring1','Ring2','Trinket1','Trinket2','Weapon','Off-Hand','Wand/Idol/Relic etc.'];

// Parse gear listing CSV -> { playerName: { Head: 'itemname', Neck: 'itemname', ... } }
function parseGearListing(csvText) {
  const rows = csvText.split('\n').map(r => {
    const cols = [];
    let cur = '', inQ = false;
    for (const ch of r) {
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    cols.push(cur.trim());
    return cols;
  });
  // Find header row (contains 'Head')
  const headerIdx = rows.findIndex(r => r.some(c => c === 'Head'));
  if (headerIdx === -1) return {};
  const slotCols = rows[headerIdx]; // col 0=empty, col 1=empty, col 2=Head, ...
  const result = {};
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    const name = row[1]?.trim();
    if (!name) continue;
    const gear = {};
    for (let s = 0; s < GEAR_LISTING_SLOTS.length; s++) {
      const itemName = row[s + 2]?.trim();
      if (itemName) gear[GEAR_LISTING_SLOTS[s]] = itemName;
    }
    result[name] = gear;
  }
  return result;
}

// ── [from LC dashboard] CLA fetch / parse / cache ───────────────────────────────────
function removeCla(i) {
  const removed = claSheets[i];
  claSheets.splice(i, 1);
  // Drop its cache entry too. _applyClaStoredParsed walks every label in the cache,
  // including ones no longer in claSheets, so an orphan entry would keep injecting a
  // deleted raid's attendance, gear issues and buff scores into memory on every load.
  if (removed && _claStoredParsed[removed.label]) {
    delete _claStoredParsed[removed.label];
    _claFailedLabels.delete(removed.label);
  }
  saveClaSheets();
  renderClaList();
  saveClaSheetsToGitHub();
}


// Apply stored parsed CLA data to in-memory globals
function _applyClaStoredParsed() {
  // Process in sheet order (chronological) so newer entries correctly overwrite older ones
  const _sortedLabels = claSheets.map(s => s.label).filter(l => _claStoredParsed[l]);
  const _remainingLabels = Object.keys(_claStoredParsed).filter(l => !_sortedLabels.includes(l));
  const _allLabels = [..._sortedLabels, ..._remainingLabels];

  // Pre-populate ALL sheet dates before any recency comparisons so they're available
  for (const label of _allLabels) {
    const pd = _claStoredParsed[label];
    if (pd?.sheetDate) claSheetDates[label] = pd.sheetDate instanceof Date ? pd.sheetDate : new Date(pd.sheetDate);
  }

  for (const label of _allLabels) {
    const pd = _claStoredParsed[label];
    if (!pd) continue;

    // claPresence
    if (pd.claPresence) {
      if (!claPlayersByLabel[label]) claPlayersByLabel[label] = new Set();
      for (const key of (pd.claPresence || [])) {
        claPlayersByLabel[label].add(key);
        if (!canonicalNames[key]) {
          const sheet = claSheets.find(s => s.label === label);
          // canonical name stored separately
        }
      }
    }

    // canonicalNames
    if (pd.canonicalNames) {
      for (const [k, v] of Object.entries(pd.canonicalNames)) canonicalNames[k] = v;
    }

    // gearIssues
    if (pd.gearIssues) {
      for (const [key, data] of Object.entries(pd.gearIssues)) {
        if (!claDataByPlayer[key]) claDataByPlayer[key] = { gearIssues: [], buffConsumables: [] };
        claDataByPlayer[key].gearIssues.push(data);
        // Apply recency logic for latestGearIssuesByPlayer
        const existingLabel = latestGearIssuesByPlayer[key]?.label;
        const existingDate = existingLabel ? (claSheetDates[existingLabel] || null) : null;
        // Use the NORMALISED date, not pd.sheetDate. After a JSON round-trip through KV
        // pd.sheetDate is an ISO string while claSheetDates holds Date objects, and
        // `string >= Date` compares "2026-03-13T12:.." against "Fri Mar 13 2026 .."
        // lexicographically — always false. That made every recency check fail, so the
        // FIRST label processed won and "latest" silently resolved to the OLDEST raid.
        const thisDate = claSheetDates[label] || null;
        let isNewer;
        if (thisDate && existingDate) { isNewer = thisDate >= existingDate; }
        else {
          const si = claSheets.findIndex(s => s.label === label);
          const ei = existingLabel ? claSheets.findIndex(s => s.label === existingLabel) : -1;
          isNewer = si >= ei;
        }
        if (isNewer) latestGearIssuesByPlayer[key] = { label, issues: data.issues };
      }
    }

    // latestIssues — the CLEAN-PLAYER case.
    //
    // pd.gearIssues only contains players who HAD issues (parseGearIssues pushes only
    // `if (issues.length)`), so it structurally cannot express "showed up in this CLA
    // with nothing wrong". Rebuilding "latest" from gearIssues alone therefore leaves a
    // player who fixed their gear pinned to the last raid where they had problems, and
    // the ⚠ flag never clears. pd.latestIssues DOES carry those empty entries — it was
    // being written to KV and never read back. Apply it under the same recency rule.
    if (pd.latestIssues) {
      for (const [key, data] of Object.entries(pd.latestIssues)) {
        if (!claDataByPlayer[key]) claDataByPlayer[key] = { gearIssues: [], buffConsumables: [] };
        const existingLabel = latestGearIssuesByPlayer[key]?.label;
        const existingDate = existingLabel ? (claSheetDates[existingLabel] || null) : null;
        const thisDate = claSheetDates[label] || null;
        let isNewer;
        if (thisDate && existingDate) { isNewer = thisDate >= existingDate; }
        else {
          const si = claSheets.findIndex(s => s.label === label);
          const ei = existingLabel ? claSheets.findIndex(s => s.label === existingLabel) : -1;
          isNewer = si >= ei;
        }
        if (isNewer) latestGearIssuesByPlayer[key] = { label, issues: data.issues || [] };
      }
    }

    // buffScores
    if (pd.buffScores) {
      for (const [key, scores] of Object.entries(pd.buffScores)) {
        if (!claDataByPlayer[key]) claDataByPlayer[key] = { gearIssues: [], buffConsumables: [] };
        for (const [dateStr, score] of Object.entries(scores)) {
          if (!buffScoreByPlayerDate[key]) buffScoreByPlayerDate[key] = {};
          buffScoreByPlayerDate[key][dateStr] = score;
        }
      }
    }

    // gearListing — only apply if this sheet had entries (skip empty/older sheets)
    console.log(`[apply] label="${label}" stored gearListing players: ${Object.keys(pd.gearListing||{}).length}`);
    if (pd.gearListing && Object.keys(pd.gearListing).length > 0) {
      for (const [key, slots] of Object.entries(pd.gearListing)) {
        const existingLabel = gearListingByPlayer[key]?.label;
        const existingDate = existingLabel ? (claSheetDates[existingLabel] || null) : null;
        // Use the NORMALISED date, not pd.sheetDate. After a JSON round-trip through KV
        // pd.sheetDate is an ISO string while claSheetDates holds Date objects, and
        // `string >= Date` compares "2026-03-13T12:.." against "Fri Mar 13 2026 .."
        // lexicographically — always false. That made every recency check fail, so the
        // FIRST label processed won and "latest" silently resolved to the OLDEST raid.
        const thisDate = claSheetDates[label] || null;
        let isNewer;
        if (thisDate && existingDate) { isNewer = thisDate >= existingDate; }
        else {
          const si = claSheets.findIndex(s => s.label === label);
          const ei = existingLabel ? claSheets.findIndex(s => s.label === existingLabel) : -1;
          isNewer = si >= ei;
        }
        if (isNewer) gearListingByPlayer[key] = { label, slots };
      }
    }
  } // end for loop
  console.log('CLA cache applied:', Object.keys(claDataByPlayer).length, 'players,',
    Object.keys(gearListingByPlayer).length, 'gear listings,',
    Object.keys(buffScoreByPlayerDate).length, 'buff score players');
}

// Re-fetch all CLA sheets, re-parse, store in _claStoredParsed, and save
async function reparseAllClaData() {
  const btn = document.getElementById('claReparseBtn');
  if (btn) { btn.textContent = 'Re-parsing…'; btn.disabled = true; }
  const backup = _claStoredParsed;
  try {
    // Force full re-fetch by temporarily clearing cache
    _claStoredParsed = {};
    _corsProxyTripped = null;
    _corsProxy429s = 0;
    await fetchAllClaData();
    // Store parsed results back into _claStoredParsed
    _storeParsedClaData();
    // Don't overwrite a good cache with a partial one. If sheets failed, keep what we had.
    if (_claFailedLabels.size) {
      const failed = _claFailedLabels.size;
      _claStoredParsed = backup;
      if (btn) { btn.textContent = 'Re-parse CLAs'; btn.disabled = false; }
      setHint(`Re-parse aborted — ${failed} sheet(s) failed to fetch` +
        (_corsProxyTripped ? ` (the CORS proxy returned ${_corsProxyTripped})` : '') +
        '. The existing cache was left untouched.', 'error');
      return;
    }
    await saveClaSheetsToGitHub();
    if (btn) { btn.textContent = '✓ Done'; setTimeout(() => { btn.textContent = 'Re-parse CLAs'; btn.disabled = false; }, 2000); }
    setHint('CLA data re-parsed and cached — future loads will be instant.', 'success');
  } catch(e) {
    _claStoredParsed = backup;
    if (btn) { btn.textContent = 'Re-parse CLAs'; btn.disabled = false; }
    setHint('Re-parse failed: ' + e.message, 'error');
  }
}

// Snapshot current in-memory parsed state into _claStoredParsed
// A cache entry is only worth keeping if it actually names players. An entry written from
// a load whose fetches failed has empty presence/issues/listing and is worse than no entry
// at all, because it stops the sheet ever being re-fetched.
function _isUsableClaCacheEntry(e) {
  if (!e || typeof e !== 'object') return false;
  return (e.claPresence && e.claPresence.length > 0)
      || (e.gearIssues && Object.keys(e.gearIssues).length > 0)
      || (e.gearListing && Object.keys(e.gearListing).length > 0)
      || (e.buffScores && Object.keys(e.buffScores).length > 0);
}

// ── KV cache warmer ─────────────────────────────────────────────
// Fills the KV cache one sheet at a time, checkpointing progress as it goes, so a run
// that dies partway can be resumed instead of restarted. With the Worker proxy there is
// no rate limit to respect, so this is now a convenience (bank 29 sheets once, resumably)
// rather than a necessity — a normal page load will warm the cache on its own.
//
//   warmClaCache()                       // fill in whatever isn't cached yet
//   warmClaCache({ force: true })        // re-fetch every sheet from scratch
//   warmClaCache({ reqPerMin: 15 })      // go slower (gentler on Apps Script)
async function warmClaCache(opts = {}) {
  const { force = false, reqPerMin = 60, saveEvery = 3 } = opts;

  if (!writeToken) { console.error('warmClaCache: no write token saved — enter it in the dashboard first.'); return; }
  if (!APPS_SCRIPT) { console.error('warmClaCache: apps_script is not configured in config.json.'); return; }
  if (!CF_WORKER_URL && !CORS_API_KEY) console.warn('warmClaCache: no cf_worker_url set — requests have no proxy and will fail.');

  const gap = Math.ceil(60000 / Math.max(1, reqPerMin));
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // Start from a clean breaker; this is an explicit, deliberate attempt.
  _corsProxyTripped = null;
  _corsProxy429s = 0;
  _claFailedLabels = new Set();

  if (force) _claStoredParsed = {};
  else for (const [label, e] of Object.entries(_claStoredParsed)) {
    if (!_isUsableClaCacheEntry(e)) delete _claStoredParsed[label];
  }

  // Rebuild in-memory state from whatever is already cached, so recency comparisons
  // against already-warmed sheets are correct as we add new ones.
  claDataByPlayer = {}; claPlayersByLabel = {}; buffScoreByPlayerDate = {};
  latestGearIssuesByPlayer = {}; gearListingByPlayer = {}; claSheetDates = {}; canonicalNames = {};
  _applyClaStoredParsed();

  // Oldest first, so each sheet we parse is newer than everything already in memory and
  // the gear-listing recency rules resolve the same way a full load would.
  const todo = claSheets
    .map((s, i) => ({ s, i }))
    .filter(({ s }) => s.sheetId && !_claStoredParsed[s.label])
    .sort((a, b) => a.i - b.i);

  if (!todo.length) { console.log('warmClaCache: nothing to do — every sheet with a URL is already cached.'); return; }

  const totalReqs = todo.reduce((n, { s }) => n + 2 + (s.gearListingGid ? 1 : 0), 0);
  const etaMin = ((totalReqs * gap) / 60000).toFixed(1);
  console.log(`warmClaCache: ${todo.length} sheet(s), ~${totalReqs} requests at ${reqPerMin}/min — about ${etaMin} min. Leave this tab open.`);

  let done = 0, failed = 0, sinceSave = 0;

  for (const { s: sheet, i: sheetIdx } of todo) {
    if (_corsProxyTripped) {
      console.error(`warmClaCache: halted — the CORS proxy returned ${_corsProxyTripped}. ` +
        `${done} sheet(s) warmed and saved before stopping. Fix the proxy, then run warmClaCache() again to resume.`);
      break;
    }

    const label = sheet.label;
    let ok = true;
    // One request at a time, spaced by `gap`. Sequential on purpose.
    const pull = async (gid, what) => {
      await sleep(gap);
      try { return await fetchSheet(sheet.sheetId, gid); }
      catch (e) { ok = false; console.warn(`  ✗ "${label}" ${what}: ${e.message}`); return null; }
    };

    const gearText = await pull(sheet.gearGid, 'gear issues');
    if (gearText) {
      try { parseGearIssues(gearText, label); }
      catch (e) { ok = false; console.warn(`  ✗ "${label}" gear issues parse: ${e.message}`); }
    }

    const buffText = _corsProxyTripped ? null : await pull(sheet.buffGid, 'buff consumables');
    if (buffText) {
      try { parseBuffConsumables(buffText, label); }
      catch (e) { ok = false; console.warn(`  ✗ "${label}" buff parse: ${e.message}`); }
    }

    if (sheet.gearListingGid && !_corsProxyTripped) {
      const listText = await pull(sheet.gearListingGid, 'gear listing');
      if (listText) {
        // claSheetDates[label] is populated by parseGearIssues above, so recency is correct.
        try {
          const data = parseGearListing(listText);
          const thisDate = claSheetDates[label] || null;
          Object.entries(data).forEach(([playerName, slots]) => {
            const key = normalizeName(playerName);
            const existingLabel = gearListingByPlayer[key]?.label;
            const existingDate = existingLabel ? (claSheetDates[existingLabel] || null) : null;
            let isNewer;
            if (thisDate && existingDate) isNewer = thisDate >= existingDate;
            else {
              const ei = existingLabel ? claSheets.findIndex(x => x.label === existingLabel) : -1;
              isNewer = sheetIdx >= ei;
            }
            if (isNewer) gearListingByPlayer[key] = { label, slots };
          });
        } catch (e) { ok = false; console.warn(`  ✗ "${label}" gear listing parse: ${e.message}`); }
      }
    }

    if (ok) { done++; sinceSave++; console.log(`  ✓ ${label}  (${done}/${todo.length})`); }
    else { failed++; _claFailedLabels.add(label); console.warn(`  ⚠ ${label} incomplete — not cached, will retry on a later run.`); }

    // Checkpoint. _storeParsedClaData skips failed labels, so a partial run still banks
    // every sheet that fully succeeded rather than losing the work.
    if (sinceSave >= saveEvery || _corsProxyTripped) {
      _storeParsedClaData();
      const saved = await saveClaSheetsToGitHub();
      console.log(saved ? `  … checkpoint saved (${Object.keys(_claStoredParsed).length} sheets in cache)`
                        : '  … checkpoint SAVE FAILED — see the error above');
      sinceSave = 0;
    }
  }

  _storeParsedClaData();
  const saved = await saveClaSheetsToGitHub();
  console.log(`warmClaCache: finished — ${done} warmed, ${failed} failed, ` +
    `${Object.keys(_claStoredParsed).length} sheet(s) now cached in KV. Final save: ${saved ? 'ok' : 'FAILED'}.`);
  if (failed || _corsProxyTripped) console.log('Run warmClaCache() again to retry the sheets that failed — cached ones are skipped.');
  else console.log('Reload the page — it should now load without any corsproxy.io requests for CLA data.');
}
window.warmClaCache = warmClaCache;

// Escape hatch: wipe the KV-persisted CLA cache and force a full re-fetch on next load.
async function clearClaCache() {
  _claStoredParsed = {};
  _claFailedLabels = new Set();
  await saveClaSheetsToGitHub();
  console.log('CLA cache cleared in KV — reload the page to re-fetch every sheet.');
}
window.clearClaCache = clearClaCache;

function _storeParsedClaData() {
  const prev = _claStoredParsed;
  _claStoredParsed = {};
  for (const sheet of claSheets) {
    const label = sheet.label;
    // A sheet whose fetch or parse failed this load has NO usable in-memory data. Writing
    // it into the cache would store an empty entry that every future load then treats as
    // "already cached" and never re-fetches — permanently masking the real data. Keep the
    // previous cached entry if we had one, otherwise leave the label uncached entirely.
    if (_claFailedLabels.has(label)) {
      if (prev[label]) _claStoredParsed[label] = prev[label];
      continue;
    }
    const sheetDate = claSheetDates[label] || null;

    // Gear issues per player for this label
    const gearIssues = {};
    for (const [key, data] of Object.entries(claDataByPlayer)) {
      const entry = data.gearIssues.find(gi => gi.label === label);
      if (entry) gearIssues[key] = entry;
    }
    // Also capture latestGearIssuesByPlayer for this label
    const latestIssues = {};
    for (const [key, data] of Object.entries(latestGearIssuesByPlayer)) {
      if (data.label === label) latestIssues[key] = data;
    }

    // Buff scores per player for this label's date.
    //
    // buffScoreByPlayerDate is keyed by an ISO 'YYYY-MM-DD' STRING (parseBuffConsumables
    // uses formatAttendanceDate), but claSheetDates[label] holds a Date OBJECT. Indexing
    // the former with the latter coerces the Date via toString() —
    // "Fri Feb 20 2026 12:00:00 GMT+0000" — which never matches, so this silently stored
    // {} for every sheet. Harmless while the cache was broken; with the cache working, a
    // fully-cached load would have had no consumable data and quietly wrong priority
    // scores. Normalise to the same string key both sides use.
    const sheetDateKey = sheetDate
      ? (sheetDate instanceof Date ? formatAttendanceDate(sheetDate) : String(sheetDate))
      : null;
    const buffScores = {};
    if (sheetDateKey) {
      for (const [key, scores] of Object.entries(buffScoreByPlayerDate)) {
        if (scores[sheetDateKey]) {
          if (!buffScores[key]) buffScores[key] = {};
          buffScores[key][sheetDateKey] = scores[sheetDateKey];
        }
      }
    }

    // Gear listing for this label
    const gearListing = {};
    for (const [key, data] of Object.entries(gearListingByPlayer)) {
      if (data.label === label) gearListing[key] = data.slots;
    }
    console.log(`[store] label="${label}" gearListing players: ${Object.keys(gearListing).length} / gearListingByPlayer total: ${Object.keys(gearListingByPlayer).length}`);

    // CLA presence
    const claPresence = [...(claPlayersByLabel[label] || [])];

    // Canonical names
    const canonical = { ...canonicalNames };

    const entry = {
      sheetDate,
      claPresence,
      canonicalNames: canonical,
      gearIssues,
      latestIssues,
      buffScores,
      gearListing,
    };
    // Invariant: never store an entry with no players in it. A sheet that was never
    // attempted this run (the warmer halted before reaching it, say) produces exactly
    // that, and storing it would mark the sheet "cached" so nothing ever re-fetches it.
    if (!_isUsableClaCacheEntry(entry)) {
      if (prev[label]) _claStoredParsed[label] = prev[label];
      continue;
    }
    _claStoredParsed[label] = entry;
  }
  console.log('Stored parsed CLA data for', Object.keys(_claStoredParsed).length, 'of',
    claSheets.length, 'sheets' + (_claFailedLabels.size ? ` (${_claFailedLabels.size} skipped — failed this load)` : ''));
}

async function fetchAllClaData() {
  claDataByPlayer = {};
  claPlayersByLabel = {};
  buffScoreByPlayerDate = {};
  latestGearIssuesByPlayer = {};
  gearListingByPlayer = {};
  claSheetDates = {};
  canonicalNames = {};
  _claFailedLabels = new Set();

  // Any sheet that loses a request or a parse is unusable for caching purposes.
  const claFailed = (label, source, msg) => {
    _claFailedLabels.add(label);
    addError(source, msg);
  };

  // Partition by what work each sheet actually needs. Anything already parsed into
  // _claStoredParsed (loaded from KV) needs no HTTP at all, so adding one new raid
  // costs 3 requests instead of re-pulling every historical CLA from scratch.
  // Self-healing guard: an entry with no players in it carries no information, so treating
  // it as "cached" would permanently suppress the re-fetch that could repair it. Any such
  // entry — however it got written — is discarded and the sheet re-fetched.
  const purged = [];
  for (const [label, e] of Object.entries(_claStoredParsed)) {
    if (!_isUsableClaCacheEntry(e)) { delete _claStoredParsed[label]; purged.push(label); }
  }
  if (purged.length) console.warn('[fetchAllClaData] discarded', purged.length,
    'empty cache entries (will re-fetch):', purged.join(', '));

  const cachedSheets  = claSheets.filter(s => _claStoredParsed[s.label]);
  const uncachedFetch = claSheets.filter(s => !_claStoredParsed[s.label] && s.sheetId);
  const uncachedPaste = claSheets.filter(s => !_claStoredParsed[s.label] && (s.csvGear || s.csvBuff));
  console.log('[fetchAllClaData] total:', claSheets.length, '| cached:', cachedSheets.length,
    '| to fetch:', uncachedFetch.length, '| paste:', uncachedPaste.length);
  _claNewlyParsed = uncachedFetch.length + uncachedPaste.length;

  // Collect raw results first, then parse in recency order once all dates are known
  const gearResults = [];        // { label, text }
  const gearListingResults = []; // { label, text, sheetIdx }
  // Parse uncached paste-mode entries immediately (no fetch needed)
  uncachedPaste.forEach(sheet => {
    const csvGear = normalizeClaPaste(sheet.csvGear || '');
    const csvBuff = normalizeClaPaste(sheet.csvBuff || '');
    const csvGearListing = sheet.csvGearListing ? normalizeClaPaste(sheet.csvGearListing) : '';
    try { parseGearIssues(csvGear, sheet.label); }
    catch(e) { claFailed(sheet.label, `CLA "${sheet.label}" — Gear Issues`, `Parse error: ${e.message}`); }
    try { parseBuffConsumables(csvBuff, sheet.label); }
    catch(e) { claFailed(sheet.label, `CLA "${sheet.label}" — Buff Consumables`, `Parse error: ${e.message}`); }
    if (csvGearListing) {
      // Push into gearListingResults so it goes through the same recency-ordered processing as URL sheets
      gearListingResults.push({ label: sheet.label, text: csvGearListing, sheetIdx: claSheets.indexOf(sheet) });
    }
  });

  // Fetch ONLY sheets we have no cached parse for, 4 sheets' worth of requests (up to 12
  // concurrent HTTP calls) at a time. The Worker proxy has no rate limit, so this cap now
  // exists to stay clear of Apps Script's own simultaneous-execution quota rather than a
  // third party's — which is why it's 4 and not unbounded.
  if (uncachedFetch.length) {
    await runWithConcurrency(uncachedFetch, 4, async (sheet) => {
      const sheetIdx = claSheets.indexOf(sheet);
      await Promise.all([
        fetchSheet(sheet.sheetId, sheet.gearGid)
          .then(text => gearResults.push({ label: sheet.label, text }))
          .catch(e => claFailed(sheet.label, `CLA "${sheet.label}" — Gear Issues (gid: ${sheet.gearGid})`, e.message)),
        sheet.gearListingGid
          ? fetchSheet(sheet.sheetId, sheet.gearListingGid)
              .then(text => gearListingResults.push({ label: sheet.label, text, sheetIdx }))
              .catch(e => claFailed(sheet.label, `CLA "${sheet.label}" — Gear Listing (gid: ${sheet.gearListingGid})`, e.message))
          : Promise.resolve(),
        fetchSheet(sheet.sheetId, sheet.buffGid)
          .then(text => {
            try { parseBuffConsumables(text, sheet.label); }
            catch(e) { claFailed(sheet.label, `CLA "${sheet.label}" — Buff Consumables (gid: ${sheet.buffGid})`, `Parse error: ${e.message}`); }
          })
          .catch(e => claFailed(sheet.label, `CLA "${sheet.label}" — Buff Consumables (gid: ${sheet.buffGid})`, e.message)),
      ]);
    });
  }

  // Restore everything we already had parsed in KV. This pre-populates claSheetDates for
  // every cached label and applies gear listings / latest issues under the same recency
  // rules, so cached and freshly-fetched sheets interleave correctly whichever is newer.
  if (cachedSheets.length) _applyClaStoredParsed();

  // Now that claSheetDates is fully populated, parse gear issues and gear listings with correct recency
  for (const { label, text } of gearResults) {
    try { parseGearIssues(text, label); }
    catch(e) { claFailed(label, `CLA "${label}" — Gear Issues`, `Parse error: ${e.message}`); }
  }
  // Sort by sheet index so newer CLAs correctly overwrite older ones
  gearListingResults.sort((a, b) => a.sheetIdx - b.sheetIdx);
  for (const { label, text, sheetIdx } of gearListingResults) {
    try {
      const data = parseGearListing(text);
      const thisDate = claSheetDates[label] || null;
      let count = 0;
      Object.entries(data).forEach(([playerName, slots]) => {
        const key = normalizeName(playerName);
        const existingLabel = gearListingByPlayer[key]?.label;
        const existingDate = existingLabel ? (claSheetDates[existingLabel] || null) : null;
        let isNewer;
        if (thisDate && existingDate) { isNewer = thisDate >= existingDate; }
        else {
          const ei = existingLabel ? claSheets.findIndex(s => s.label === existingLabel) : -1;
          isNewer = sheetIdx >= ei;
        }
        if (isNewer) { gearListingByPlayer[key] = { label, slots }; count++; }
      });
      console.log(`Gear listing "${label}": ${Object.keys(data).length} players parsed, ${count} updated`);
    } catch(e) { claFailed(label, `CLA "${label}" — Gear Listing`, `Parse error: ${e.message}`); console.warn('Gear listing parse error:', label, e); }
  }
  console.log(`gearListingByPlayer: ${Object.keys(gearListingByPlayer).length} players total`);
}


function parseGearIssues(text, label) {
  const rows = parseCsvRows(text);
  // Always flag: missing gem or enchant entirely
  const ALWAYS_FLAGGED = /\[no (gem|enchant)|common gem/i;
  // Suboptimal: wrong/cheap enchant — only flagged on top-5 BiS items
  const SUBOPTIMAL = /\[(?!no )/i;

  for (const row of rows) {
    const player = row[4]?.trim();
    if (!player) continue;

    // Parse all issue cells, extracting item name and issue type
    // Items to always exclude from gear issue checks regardless of enchant status
    const EXCLUDED_ITEMS = /mark of the champion|meta gem/i;
    const allIssues = row.slice(5)
      .map(v => v.trim())
      .filter(v => v && v !== '' && !v.startsWith('-') && !EXCLUDED_ITEMS.test(v) && !/ZG/i.test(v))
      .map(v => {
        const m = v.match(/^(.+?)\s*\[([^\]]+)\]$/);
        return m ? { raw: v, itemName: m[1].trim(), issue: m[2].trim() } : null;
      })
      .filter(Boolean);
      // (LC dashboard filtered to items on a TBC BiS list here — no BiS lists for WoW Forever.)

    // Split into always-flagged and suboptimal
    const egregious = allIssues.filter(i => ALWAYS_FLAGGED.test('[' + i.issue + ']'));
    const suboptimal = allIssues.filter(i => !ALWAYS_FLAGGED.test('[' + i.issue + ']'));

    // For suboptimal issues, only include if the item is top-5 BiS for this player
    // We store suboptimal separately so we can evaluate against BiS data at render time
    const issues = [
      ...egregious.map(i => i.raw),
    ];

    const key = normalizeName(player);
    if (!claDataByPlayer[key]) claDataByPlayer[key] = { gearIssues: [], buffConsumables: [] };
    if (issues.length) claDataByPlayer[key].gearIssues.push({ label, issues });
    // Always record presence regardless of whether they have any issues
    if (!claPlayersByLabel[label]) claPlayersByLabel[label] = new Set();
    claPlayersByLabel[label].add(key);
    // Only overwrite if this sheet is more recent than what we have
    // Use C3 date from buff tab if available, otherwise fall back to claSheets array order
    const thisDate = claSheetDates[label] || null;
    const existingLabel = latestGearIssuesByPlayer[key]?.label;
    const existingDate = existingLabel ? (claSheetDates[existingLabel] || null) : null;
    let isNewer;
    if (thisDate && existingDate) {
      isNewer = thisDate >= existingDate;
    } else {
      // Fall back to array index order
      const sheetIdx = claSheets.findIndex(s => s.label === label);
      const existingIdx = existingLabel ? claSheets.findIndex(s => s.label === existingLabel) : -1;
      isNewer = sheetIdx >= existingIdx;
    }
    if (isNewer) {
      latestGearIssuesByPlayer[key] = { label, issues };
    }
  }
}

function parseBuffConsumables(text, label) {
  const rows = parseCsvRows(text);
  // C3 (row index 2, col index 2) contains the raid date for this CLA
  // Use the CLA label (e.g. "2/25", "3/4") as the raid date — it's set manually
  // and is the actual raid date, unlike the CLA export date in the sheet which
  // reflects when the export was generated (often the next day).
  // Also try to get the year from the CLA date cell since labels don't include it.
  const dateStr = rows[2]?.[2]?.trim();
  let raidYear = new Date().getUTCFullYear(); // default to current year
  if (dateStr) {
    const yearMatch = dateStr.match(/(20\d{2})/);
    if (yearMatch) raidYear = parseInt(yearMatch[1], 10);
  }
  // Parse label as M/D
  const isoMatch = label.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (isoMatch) claSheetDates[label] = new Date(Date.UTC(+isoMatch[1], +isoMatch[2] - 1, +isoMatch[3], 12, 0, 0));
  const labelMatch = label.match(/^(\d{1,2})\/(\d{1,2})$/);
  if (labelMatch) {
    const month = parseInt(labelMatch[1], 10) - 1; // 0-indexed
    const day   = parseInt(labelMatch[2], 10);
    claSheetDates[label] = new Date(Date.UTC(raidYear, month, day, 12, 0, 0));
  }
  // Header row is row index 4 (0-based), data starts at row 5
  const headers = rows[4]?.slice(2) || []; // col C onwards
  const normLabel = normalizeDate(label);
  // Use ISO date as key if we have it, otherwise fall back to normLabel
  const isoLabel = claSheetDates[label] ? formatAttendanceDate(claSheetDates[label]) : normLabel;
  for (let i = 5; i < rows.length; i++) {
    const row = rows[i];
    const player = row[1]?.trim();
    if (!player) continue;
    const values = row.slice(2);
    const cols = {};
    headers.forEach((h, idx) => {
      if (h.trim()) cols[h.trim()] = values[idx]?.trim() || '0%';
    });
    const key = normalizeName(player);
    if (!claDataByPlayer[key]) claDataByPlayer[key] = { gearIssues: [], buffConsumables: [] };
    // NOTE: buffConsumables is populated here but is NOT written to the KV cache by
    // _storeParsedClaData, so it is always [] on a cached load. That is currently
    // harmless because nothing renders it — the consumes column and the raid dots both
    // read buffScoreByPlayerDate, which IS cached. If you ever display this, cache it
    // too or it will silently be empty for every visitor who loads from KV.
    claDataByPlayer[key].buffConsumables.push({ label, cols });
    // Store exact name with special chars for WCL lookups
    if (!canonicalNames[key]) canonicalNames[key] = player;

    // Store total average + scrolls score keyed by normalized date for dot colouring
    const totalAvg = values[0]?.trim() || '0%'; // col C = index 0 of slice(2) = total average
    const scrollsVal = values[6]?.trim() || '0%'; // col I = index 6 of slice(2) = Scrolls
    const pct = parseInt(totalAvg);
    const scrollsPct = parseInt(scrollsVal);
    if (!buffScoreByPlayerDate[key]) buffScoreByPlayerDate[key] = {};
    const elixirVal  = parseInt(values[1]?.trim()) || 0;  // Elixir or Flask
    const foodVal     = parseInt(values[5]?.trim()) || 0;  // Food Buff
    const wepOilVal   = parseInt(values[7]?.trim()) || 0;  // Weapon Enhancement
    buffScoreByPlayerDate[key][isoLabel] = {
      total: isNaN(pct) ? null : pct,
      scrolls: isNaN(scrollsPct) ? 0 : scrollsPct,
      elixir: elixirVal,
      food: foodVal,
      wepOil: wepOilVal
    };
  }
}

// Auto-load CLA sheets from repo JSON if no sheets saved locally
async function loadClaSheetsFromRepo() {
  try {
    let data;
    try { data = await fetchFromWorker('cla-sheets.json'); } catch(e) { return; }
    // Support both old format (array) and new format ({ sheets, parsed })
    const sheets = Array.isArray(data) ? data : (data?.sheets || []);
    const parsed = Array.isArray(data) ? null : (data?.parsed || null);
    if (!sheets.length) return;
    if (!claSheets.length) {
      claSheets = sheets;
      saveClaSheets();
      renderClaList();
      updateAuthState();
    }
    // Adopt the parsed cache regardless of where claSheets came from.
    //
    // claSheets is restored from sessionStorage, so on any refresh within the same tab
    // the branch above is skipped — and _claStoredParsed lives ONLY in KV, never in
    // sessionStorage. Loading it inside that branch meant the cache was picked up on a
    // cold tab and silently dropped on every refresh, which is why the load log read
    // "cached: 0 | to fetch: 29" even though the data was sitting in KV.
    if (parsed && Object.keys(parsed).length && !Object.keys(_claStoredParsed).length) {
      _claStoredParsed = parsed;
      console.log('Loaded CLA cache from KV:', Object.keys(parsed).length, 'sheet(s)');
    }
  } catch(e) {}
}
