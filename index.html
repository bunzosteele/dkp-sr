  17548: 'Shadow Protection', 17549: 'Arcane Protection', 17544: 'Frost Protection', 17546: 'Nature Protection', 7233: 'Fire Protection Potion',
  11359: 'Restoration', 17540: 'Greater Stoneshield', 13455: 'Greater Stoneshield', 4941: 'Lesser Stoneshield', 29235: 'Fire Festival Fortitude',
  27722: 'Sweet Surprise', 27723: 'Dark Desire', 16591: 'Noggenfogger Elixir', 16593: 'Noggenfogger Elixir', 16595: 'Noggenfogger Elixir',
  11350: 'Fire Shield (Oil of Immolation)', 5665: 'Bogling Root', 12175: 'Scroll of Protection', 12176: 'Scroll of Stamina',
  12177: 'Scroll of Strength', 12174: 'Scroll of Agility', 12178: 'Scroll of Intellect', 12179: 'Scroll of Spirit',
};
const _WCL_CONSUMABLE_NAME = /elixir|flask|potion|juju|zanza|scroll|well fed|food|drink|firewater|sunfruit|stoneshield|protection$|power$|wisdom|titans|oil|sharpen|weightstone|rumsey|gordok|kreeg|cerebral|r\.o\.i\.d\.s|ground scorpok|lung juice|toasted smorc|nightfin|sagefish|squid|dumpling/i;

let WCL_SITE = 'vanilla';                       // which Warcraft Logs section (config: wcl_site)
let WCL_GUILD = null;                           // { name, server, region } for automatic matching (config: wcl_guild_*)

async function wclQuery(query, variables, site = WCL_SITE) {
  if (!CF_WORKER_URL || !writeToken) throw new Error('Warcraft Logs needs the write token');
  const res = await fetch(`${CF_WORKER_URL}/wcl/${site}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Token': writeToken }, body: JSON.stringify({ query, variables }),
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok || j.error) throw new Error(j.error || `Warcraft Logs HTTP ${res.status}`);
  if (j.errors?.length) throw new Error('Warcraft Logs: ' + j.errors[0].message);
  return j.data;
}
// A pasted report link → { code, site } (the site comes from the link: vanilla., fresh., …)
function wclParseUrl(u) {
  const s = String(u || '').trim();
  const m = s.match(/(?:https?:\/\/)?(?:(\w+)\.)?warcraftlogs\.com\/reports\/(?:a:)?([A-Za-z0-9]{16})/);
  if (m) return { code: m[2], site: m[1] && m[1] !== 'www' ? m[1] : WCL_SITE };
  const c = s.match(/^([A-Za-z0-9]{16})$/);
  return c ? { code: c[1], site: WCL_SITE } : null;
}
function wclReportUrl(r) { return `https://${r.site || WCL_SITE}.warcraftlogs.com/reports/${r.code}`; }
// Gear snapshot slot index (combatant info) → the dashboard's gear slot names
const WCL_GEAR_SLOTS = { 0: 'Head', 1: 'Neck', 2: 'Shoulders', 4: 'Chest', 5: 'Waist', 6: 'Legs', 7: 'Feet', 8: 'Bracers', 9: 'Hands',
  10: 'Ring1', 11: 'Ring2', 12: 'Trinket1', 13: 'Trinket2', 14: 'Cloak', 15: 'Weapon', 16: 'Off-Hand', 17: 'Wand/Idol/Relic etc.' };
function wclAbilityName(id, raid) {
  if (id === WCL_WE_ANY) return 'Any weapon enhancement';
  if (String(id).startsWith('we:')) { const n = +String(id).slice(3); return WCL_TEMP_ENCHANTS[n] || `Weapon enhancement #${n}`; }
  return raid?.wcl?.abilities?.[id] || consumableCatalog()[id] || WCL_CONSUMABLES[id] || `Buff #${id}`;
}

// Is this buff worth keeping? Known consumables, anything used in a rule, consumable-looking
// names, and self-applied buffs seen on 2+ classes (consumables and racials, not class spells).
function _wclKeepBuff(id, name, selfClasses) {
  if (WCL_CONSUMABLES[id] || consumableRuleIds().has(String(id))) return true;
  if (_WCL_CONSUMABLE_NAME.test(name || '')) return true;
  return (selfClasses?.size || 0) >= 2;
}

// One report → { code, title, zone, start, end, fights, players, abilities }
async function wclReadReport(code, site = WCL_SITE) {
  const meta = (await wclQuery(`query($c:String!){ reportData{ report(code:$c){ title startTime endTime zone{name}
      masterData{ actors(type:"Player"){ id name subType } abilities{ gameID name } }
      fights(killType:Encounters){ id name kill startTime endTime friendlyPlayers } } } }`, { c: code }, site)).reportData.report;
  if (!meta) throw new Error('Report not found: ' + code);
  const actors = new Map(meta.masterData.actors.map(a => [a.id, a]));
  const abilityName = new Map((meta.masterData.abilities || []).map(a => [a.gameID, a.name]));
  const fights = meta.fights.map(f => ({ id: f.id, name: f.name, kill: !!f.kill, start: f.startTime, end: f.endTime, players: f.friendlyPlayers || [] }));
  const players = {};
  const P = id => { const a = actors.get(id); if (!a) return null; const k = normalizeName(baseName(a.name)); return (players[k] ||= { name: baseName(a.name), cls: a.subType, f: 0, b: {} }); };
  // Everyone in the log counts as present, boss fight or not
  for (const a of meta.masterData.actors) P(a.id);
  fights.forEach((f, i) => { for (const id of f.players) { const p = P(id); if (p) p.f = _or(p.f, 2 ** i); } });

  // Buff events (apply / refresh / remove only) → active intervals per (player, buff)
  const intervals = new Map(), open = new Map(), seen = new Set(), selfCls = new Map();
  const reportEnd = meta.endTime - meta.startTime;
  let t = 0;
  for (let page = 0; t !== null && t !== undefined && page < 40; page++) {
    const ev = (await wclQuery(`query($c:String!,$s:Float,$e:Float){ reportData{ report(code:$c){
        events(dataType:Buffs, startTime:$s, endTime:$e, limit:10000, filterExpression:"type in (\\"applybuff\\",\\"refreshbuff\\",\\"removebuff\\")"){ data nextPageTimestamp } } } }`,
      { c: code, s: t, e: reportEnd }, site)).reportData.report.events;
    for (const e of ev.data) {
      if (!actors.has(e.targetID)) continue;
      const key = e.targetID + ':' + e.abilityGameID;
      if (e.sourceID === e.targetID) { const s = (selfCls.get(e.abilityGameID) || new Set()); s.add(actors.get(e.targetID).subType); selfCls.set(e.abilityGameID, s); }
      if (e.type === 'removebuff') {
        const st = open.has(key) ? open.get(key) : (seen.has(key) ? null : 0); // first event is a remove → active since log start
        if (st !== null) (intervals.get(key) || intervals.set(key, []).get(key)).push([st, e.timestamp]);
        open.delete(key);
      } else if (!open.has(key)) open.set(key, e.type === 'applybuff' || seen.has(key) ? e.timestamp : 0); // refresh with no apply → active since log start
      seen.add(key);
    }
    t = ev.nextPageTimestamp;
  }
  for (const [key, st] of open) (intervals.get(key) || intervals.set(key, []).get(key)).push([st, reportEnd]);

  const kept = {};
  for (const [key, list] of intervals) {
    const [tid, aid] = key.split(':').map(Number);
    const name = abilityName.get(aid) || WCL_CONSUMABLES[aid] || '';
    if (!_wclKeepBuff(aid, name, selfCls.get(aid))) continue;
    const p = P(tid); let mask = 0;
    fights.forEach((f, i) => { if (list.some(([a, b]) => a <= f.end && b >= f.start)) mask += 2 ** i; });
    mask = _and(mask, p.f);
    if (mask) { p.b[aid] = mask; kept[aid] = name || WCL_CONSUMABLES[aid] || `Buff #${aid}`; }
  }

  // Weapon enhancements from the per-pull snapshot
  if (fights.length) {
    const ci = (await wclQuery(`query($c:String!,$f:[Int]){ reportData{ report(code:$c){ events(dataType:CombatantInfo, fightIDs:$f, startTime:0, endTime:999999999999, limit:10000){ data } } } }`,
      { c: code, f: fights.map(f => f.id) }, site)).reportData.report.events.data;
    for (const e of ci) {
      const i = fights.findIndex(f => f.id === e.fight); const p = P(e.sourceID); if (i < 0 || !p) continue;
      if (e.gear?.length) p.g = Object.fromEntries(e.gear.map((g, n) => [WCL_GEAR_SLOTS[n], g.id]).filter(([sl, id]) => sl && id)); // latest pull wins
      for (const g of e.gear || []) if (g.temporaryEnchant) {
        const id = 'we:' + g.temporaryEnchant; p.b[id] = _or(p.b[id] || 0, 2 ** i); p.b[WCL_WE_ANY] = _or(p.b[WCL_WE_ANY] || 0, 2 ** i);
        kept[id] = wclAbilityName(id);
      }
    }
  }
  return { code, site, title: meta.title, zone: meta.zone?.name || '', start: meta.startTime, end: meta.endTime,
    fights: fights.map(f => ({ name: f.name, kill: f.kill, report: code })), players, abilities: kept };
}

// Several reports from one night → one record (fight masks shifted so indices stay unique)
function wclMerge(parts) {
  const out = { reports: [], fights: [], players: {}, abilities: {} };
  for (const r of parts.sort((a, b) => a.start - b.start)) {
    const off = out.fights.length;
    out.reports.push({ code: r.code, site: r.site, title: r.title, zone: r.zone, start: r.start, end: r.end });
    out.fights.push(...r.fights);
    Object.assign(out.abilities, r.abilities);
    for (const [k, p] of Object.entries(r.players)) {
      const q = (out.players[k] ||= { name: p.name, cls: p.cls, f: 0, b: {} });
      if (p.g) q.g = p.g;
      q.f = _or(q.f, p.f * 2 ** off);
      for (const [id, m] of Object.entries(p.b)) q.b[id] = (q.b[id] || 0) + m * 2 ** off; // masks never overlap across reports
    }
  }
  return out;
}

// The guild's reports that started on this raid's night: noon → 8am next morning, server time
// (US Mountain, like the rest of the dashboard's dates — see todayMST), whatever the viewer's zone.
async function wclFindReports(raid) {
  if (!WCL_GUILD?.name) return [];
  const [y, m, d] = raid.date.split('-').map(Number);
  const from = Date.UTC(y, m - 1, d, 12 + 7), to = from + 20 * 3600e3;
  const r = (await wclQuery(`query($n:String,$s:String,$g:String,$a:Float,$b:Float){ reportData{ reports(guildName:$n, guildServerSlug:$s, guildServerRegion:$g, startTime:$a, endTime:$b, limit:25){ data{ code title startTime endTime zone{name} } } } }`,
    { n: WCL_GUILD.name, s: WCL_GUILD.server, g: WCL_GUILD.region, a: from, b: to })).reportData.reports.data;
  return r.filter(x => x.startTime >= from && x.startTime < to).map(x => ({ code: x.code, site: WCL_SITE }));
}

// Read (or re-read) a raid's logs. refs = pasted override [{code, site}]; otherwise the
// automatic match on the guild's reports (or the reports pasted earlier, if overridden).
async function syncWcl(raid, refs) {
  if (raid.wcl?.demo) return false;
  const manual = refs ? true : !!raid.wcl?.manual;
  try {
    const list = refs || (manual ? raid.wcl.reports.map(r => ({ code: r.code, site: r.site })) : await wclFindReports(raid));
    if (!list.length) { raid.wcl = { reports: [], fights: [], players: {}, abilities: {}, manual: false, syncedAt: new Date().toISOString(), none: true }; return true; }
    const parts = [];
    for (const r of list) parts.push(await wclReadReport(r.code, r.site));
    raid.wcl = { ...wclMerge(parts), manual, syncedAt: new Date().toISOString() };
    _keepGearOnLatest(raid);
    return true;
  } catch (e) {
    raid.wcl = { ...(raid.wcl || { reports: [], fights: [], players: {}, abilities: {} }), error: e.message, errorAt: new Date().toISOString() };
    throw e;
  }
}
// Current gear only matters for the newest logged raid; drop it from older ones to keep raids.json small
function _keepGearOnLatest(raid) {
  const newest = sortedRaids().filter(r => Object.keys(r.wcl?.players || {}).length).pop();
  for (const r of raidsData.raids) if (r !== newest) for (const p of Object.values(r.wcl?.players || {})) delete p.g;
  void raid;
}

// Present in the log (any of the night's reports): Set of roster keys, or null if no log yet
function raidWclSet(raid) {
  const pl = raid.wcl?.players; if (!pl || !Object.keys(pl).length) return null;
  return new Set(Object.values(pl).map(p => resolveRosterKey(p.name)).filter(Boolean));
}
function raidWclPlayer(raid, key) {
  for (const p of Object.values(raid.wcl?.players || {})) if (resolveRosterKey(p.name) === key) return p;
  return null;
}
function _bits(m) { let n = 0; for (let x = m; x > 0; x = Math.floor(x / 2)) n += x % 2; return n; }
function _and(a, b) { // masks can exceed 32 bits when reports are merged
  let r = 0, p = 1; for (let x = a, y = b; x > 0 && y > 0; x = Math.floor(x / 2), y = Math.floor(y / 2), p *= 2) if (x % 2 && y % 2) r += p; return r;
}
function _or(a, b) { let r = 0, p = 1; for (let x = a, y = b; x > 0 || y > 0; x = Math.floor(x / 2), y = Math.floor(y / 2), p *= 2) if (x % 2 || y % 2) r += p; return r; }

// % of the boss fights a raider was in that had this buff
function wclBuffPct(p, id) { const n = _bits(p.f); return n ? Math.round(100 * _bits(_and(p.b[id] || 0, p.f)) / n) : 0; }

// Guild Overview
// ═════════════════════════════════════════════════════════════════════════════
// Attendance % over PAST raids. Missing an optional raid doesn't count against you;
// attending one does count for you.
function buildRenderData() {
  // Optional raids are left out of the overview entirely (no dot, not in #, not in %).
  // They still count for SRs and streaks — see the SR ledger.
  const raids = pastRaids().filter(r => !r.optional);
  const dates = raids.map(r => r.label);
  const n = raids.length;
  const roleMap = {};
  for (const p of rosterData.players) {
    if (!p.role || rosterData.excluded?.includes(p.name)) continue;
    const key = normalizeName(p.name);
    const flags = raids.map(r => attendanceOf(r, key).present);
    const bench = raids.map(r => attendanceOf(r, key).bench);
    const severe = raids.map(r => !!attendanceOf(r, key).severe);
    const trueIdx = flags.map((b, i) => b ? i : -1).filter(i => i >= 0);
    let rec;
    if (!trueIdx.length) rec = { name: p.name, attended: 0, window: 0, pct: null, flags, bench, severe, n, inactive: false };
    else {
      const first = trueIdx[0], last = trueIdx[trueIdx.length - 1];
      const missedAfter = raids.slice(last + 1).filter(r => !r.optional).length;
      const inactive = missedAfter > 2;
      const end = inactive ? last : n - 1;
      let window = 0, attended = 0;
      for (let i = first; i <= end; i++) {
        if (flags[i]) { attended++; window++; }
        else if (!raids[i].optional) window++;
      }
      rec = { name: p.name, attended, window, pct: window ? attended / window * 100 : null, flags, bench, severe, n, first, last, inactive };
    }
    (roleMap[p.role] ||= []).push(rec);
  }
  return { dates, raids, roles: ROLE_ORDER.filter(r => roleMap[r]).map(r => ({ name: r, players: roleMap[r] })) };
}

// Consumes score per raid = consumeScore() (Warcraft Logs vs the Consumable Rules).
// Green at/above the buff-bonus threshold, then yellow → orange → red the further below.
function buffColor(pct) {
  const t = srRules.buff.threshold;
  if (pct >= t) return C1;
  if (pct >= t - 10) return C3;
  if (pct >= t - 25) return C4;
  return C5;
}
// Officers: clicking a dot opens that raid's Consumes tab on this raider
function buffDotHtml(playerName, date, label) {
  const v = rawBuffScoresByDate(playerName)[date];
  const link = writeToken ? ` dot-link" onclick="event.stopPropagation();openRaidConsumes('${date}','${jsAttr(normalizeName(playerName))}')` : '';
  const more = writeToken ? ' (click for their consumables)' : '';
  if (v === undefined) return `<div class="raid-dot present${link}" title="${label}: Present${more}"></div>`;
  const pct = Math.round(v), col = buffColor(pct);
  const tip = `${label}: Present | Consumes ${pct}%${srRules.buff.enabled ? (pct >= srRules.buff.threshold ? ' — earned the consumes SR' : ` — below ${srRules.buff.threshold}%`) : ''}${more}`;
  if (pct >= 100) return `<span class="raid-star${link}" style="color:${C1};" title="${tip}">★</span>`;
  return `<div class="raid-dot present${link}" style="background:${col};border-color:${col};" title="${tip}"></div>`;
}

function consumeAvg(playerName) {
  const s = Object.values(rawBuffScoresByDate(playerName));
  return s.length ? s.reduce((a, b) => a + b, 0) / s.length : null;
}

function getSortedPlayers(roleName, players) {
  const { col, dir } = roleSortState[roleName] || { col: 'srs', dir: 'desc' };
  const withPct = players.filter(p => p.pct !== null && !p.inactive);
  const noPct = players.filter(p => p.pct === null && !p.inactive);
  const inactive = players.filter(p => p.inactive);
  const val = p => col === 'player' ? p.name.toLowerCase()
    : col === 'srs' ? srStats(p.name).available
    : col === 'consumes' ? (consumeAvg(p.name) ?? -1)
    : col === 'pct' ? (p.pct ?? -1) : p.attended;
  const cmp = (a, b) => {
    const av = val(a), bv = val(b);
    if (av < bv) return dir === 'asc' ? -1 : 1;
    if (av > bv) return dir === 'asc' ? 1 : -1;
    return (b.pct ?? 0) - (a.pct ?? 0) || a.name.localeCompare(b.name);
  };
  return [...withPct.sort(cmp), ...noPct.sort(cmp), ...inactive.sort(cmp)];
}

function toggleRole(safeId) {
  const body = document.getElementById('rolebody-' + safeId), arrow = document.getElementById('roletoggle-' + safeId);
  if (!body) return;
  const collapsed = body.style.display === 'none';
  body.style.display = collapsed ? '' : 'none';
  if (arrow) arrow.textContent = collapsed ? '▾' : '▸';
}
function setSort(safeId, roleName, col) {
  const cur = roleSortState[roleName] || { col: 'srs', dir: 'desc' };
  roleSortState[roleName] = { col, dir: cur.col === col ? (cur.dir === 'desc' ? 'asc' : 'desc') : (col === 'player' ? 'asc' : 'desc') };
  render(lastRenderData);
}

function gearFlagHtml() { return ''; } // gear-issue flags came from the CLA; not tracked from Warcraft Logs (yet)

function raidDotsHtml(p, raids) {
  const MAX = 10, start = Math.max(0, p.n - MAX);
  let html = '<div class="raid-dots">';
  for (let i = start; i < p.n; i++) {
    const r = raids[i];
    const label = `${r.label}${r.optional ? ' (optional)' : ''}`;
    if (p.pct === null) html += `<div class="raid-dot absent" title="${label}"></div>`;
    else if (i < p.first) html += `<div class="raid-dot inactive"></div>`;
    else if (p.severe?.[i]) html += `<div class="raid-dot severe" title="${label}: Severe absence"></div>`;
    else if (p.bench?.[i]) html += `<div class="raid-dot bench" title="${label}: Benched${srRules.bench.countsAsAttended ? ' — counts as attended' : ' — streak paused'}"></div>`;
    else if (!p.flags[i]) {
      if (p.inactive && i > p.last) html += `<div class="raid-dot inactive"></div>`;
      else html += `<div class="raid-dot absent${r.optional ? ' optional' : ''}" title="${label}: Absent${r.optional ? ' — optional, doesn\'t count' : ''}"></div>`;
    } else html += buffDotHtml(p.name, r.date, label);
  }
  return html + '</div>';
}

function srCellHtml(playerName) {
  const s = srStats(playerName);
  const last = s.events.filter(e => e.type === 'raid').slice(-1)[0];
  const lines = [];
  const earned = s.events.reduce((a, e) => a + (e.type === 'raid' ? e.base + e.streakBonus + e.buffBonus : 0), 0);
  const spent = s.events.reduce((a, e) => a + (e.type === 'raid' ? e.spent : 0), 0);
  const adj = s.events.reduce((a, e) => a + (e.type === 'adjust' ? e.applied : 0), 0);
  lines.push(`Earned ${earned} · spent ${spent}${adj ? ` · adjusted ${adj > 0 ? '+' : ''}${adj}` : ''}`);
  if (srRules.streak.enabled) lines.push(`Streak: ${s.streak} raid${s.streak === 1 ? '' : 's'} — next bonus in ${s.nextStreakIn}`);
  if (s.activeOver.length && writeToken) lines.push(`⚠ Over-reserved on ${s.activeOver.map(e => e.name).join(', ')}`);
  const over = s.activeOver.length > 0 && !!writeToken; // over-reservation flags are officer-only
  const col = over ? C5 : s.available <= 0 ? 'var(--text-dim)' : 'var(--gold-light)';
  return `<span class="priority-score${over ? ' sr-over' : ''}" style="color:${col};" title="${escHtml(lines.join('\n')).replace(/\n/g, '&#10;')}">${over ? '⚠ ' : ''}${s.available}</span>`;
}

function consumesCellHtml(playerName) {
  const avg = consumeAvg(playerName);
  if (avg === null) return '<span style="color:var(--text-dim);font-style:italic;font-size:15px;">—</span>';
  const r = Math.round(avg);
  return `<span style="font-family:'Cinzel',serif;font-size:15px;font-weight:700;color:${buffColor(r)};">${r}%</span>`;
}

function playerRowHtml(p, raids, opts = {}) {
  const cls = pctClass(p.pct);
  const pctStr = p.pct !== null ? (p.pct % 1 === 0 ? p.pct.toFixed(0) : p.pct.toFixed(1)) + '%' : 'N/A';
  const badge = opts.badge ? `<span style="font-size:13px;opacity:0.8;" title="${opts.badgeTitle || ''}">${opts.badge}</span> ` : '';
  const roleIcon = opts.showRole ? ` <span class="role-icon" title="${playerRoleName(p.name)}">${playerRoleIcon(p.name)}</span>` : '';
  const action = opts.action ? `<td style="text-align:right;white-space:nowrap;">${opts.action}</td>` : (opts.actionCol ? '<td></td>' : '');
  return `<tr class="${p.pct === null ? 'na-row' : ''}${p.inactive ? ' inactive-row' : ''}" style="${opts.dimmed ? 'opacity:0.4;' : ''}">
    <td class="player-name" onclick="toggleLoot(this, '${jsAttr(p.name)}')" style="cursor:pointer;" title="Click for loot & SR history"><span class="loot-arrow">▸</span> ${badge}${playerNameHtml(p.name)}${roleIcon}</td>
    ${opts.current !== undefined ? `<td class="current-gear">${opts.current}</td>` : ''}
    <td class="gear-flag-cell">${gearFlagHtml(p.name)}</td>
    <td class="priority-cell">${srCellHtml(p.name)}</td>
    <td class="consumes-cell">${consumesCellHtml(p.name)}</td>
    <td>${raidDotsHtml(p, raids)}</td>
    <td class="att-count">${p.attended}</td>
    <td><div class="att-cell">
      <div class="att-bar-bg"><div class="att-bar-fill ${cls}" style="width:${p.pct ?? 0}%"></div></div>
      <span class="att-pct ${cls}">${hasPerfectAttendance(p) ? `<span class="att-star" title="Perfect attendance — ${p.attended} raids">★</span>` : pctStr}</span>
    </div></td>
    ${action}
  </tr>`;
}

function tableColgroup(withAction, withCurrent) {
  if (withAction) // compact variant for the Loot tab (has Current + Award columns)
    return `<colgroup><col style="width:22ch;">${withCurrent ? '<col style="width:20ch;">' : ''}<col style="width:20px;"><col style="width:104px;"><col style="width:96px;"><col><col style="width:36px;"><col style="width:100px;"><col style="width:74px;"></colgroup>`;
  // Guild Overview: the name column fits 25 characters plus the arrow; SR Balance and Consumes get
  // equal shares, # is narrow, Attendance has room for its full bar, and Raids takes what's left.
  // Needs table-layout: fixed — .ov-table.
  return `<colgroup><col style="width:calc(28ch + 24px);"><col style="width:32px;"><col style="width:13.5%;"><col style="width:12%;"><col><col style="width:5.5%;"><col style="width:16.5%;"></colgroup>`;
}
function tableHeadHtml(th, withAction, withCurrent) {
  return `<tr>${th('Player', 'player', 'left')}${withCurrent ? '<th style="text-align:left;" title="Currently equipped in this slot, from the newest Warcraft Logs report">Current</th>' : ''}<th></th>
    ${th('SR Balance', 'srs', 'center', 'Soft reserves this raider can spend right now (active raids included). Hover a value for the breakdown.')}
    ${th('Consumes', 'consumes', 'center', 'Consumes score from Warcraft Logs, against the Consumable Rules. Green = at or above the consumes-bonus threshold.')}
    <th style="text-align:center;" title="Last 10 past raids. Colour = consumable usage.">Raids</th>
    ${th('#', 'attendance')}${th('Attendance', 'pct')}${withAction ? '<th></th>' : ''}</tr>`;
}

function render(data) {
  const out = document.getElementById('output');
  if (!out) return;
  const { dates = [], roles = [], raids = [] } = data || {};
  if (!roles.length) {
    out.innerHTML = `<div class="empty"><div class="icon">⚔</div><div>No raiders yet.</div>
      <div style="margin-top:10px;font-size:16px;">Add raiders under <em>Management → Roster</em>, then start a raid from <em>Raids</em>.</div></div>`;
    return;
  }
  const allActive = roles.flatMap(r => r.players).filter(p => p.pct !== null && !p.inactive);
  let wS = 0, wT = 0;
  allActive.forEach(p => { const a = consumeAvg(p.name); if (a !== null) { wS += a * p.attended; wT += p.attended; } });
  const avgPct = allActive.length ? allActive.reduce((s, p) => s + p.pct, 0) / allActive.length : 0;
  const totalSr = roles.flatMap(r => r.players).reduce((s, p) => s + Math.max(0, srStats(p.name).available), 0);
  const act = activeRaids();

  let html = '';
  if (act.length) {
    html += `<div class="active-raid-strip">${act.map(r => `<a class="active-raid-pill" onclick="openRaid('${r.id}')">
      <span class="live-dot"></span> ACTIVE: ${escHtml(r.name)} <span style="opacity:0.7;">· ${r.label}</span></a>`).join('')}</div>`;
  }
  for (const role of roles) {
    const safe = role.name.replace(/\s+/g, '-');
    const state = roleSortState[role.name] || { col: 'srs', dir: 'desc' };
    const sorted = getSortedPlayers(role.name, role.players);
    const th = (label, col, align = 'center', title = '') =>
      `<th data-col="${col}" onclick="setSort('${safe}', '${jsAttr(role.name)}', '${col}')" style="cursor:pointer;text-align:${align};" title="${title}">${label}<span class="sort-arrow">${state.col === col ? (state.dir === 'desc' ? ' ▾' : ' ▴') : ' ⬦'}</span></th>`;
    html += `<div class="role-section">
      <div class="role-header" onclick="toggleRole('${safe}')" style="cursor:pointer;">
        <span class="role-title">${ROLE_ICONS[role.name] ? ROLE_ICONS[role.name] + ' ' : ''}${ROLE_DISPLAY_NAMES[role.name] || role.name}</span>
        <div class="role-line"></div>
        <span class="role-count">${sorted.filter(p => p.pct !== null && !p.inactive).length} active <span class="role-toggle" id="roletoggle-${safe}">▾</span></span>
      </div>
      <div class="role-body" id="rolebody-${safe}"><table class="ov-table">${tableColgroup()}<thead>${tableHeadHtml(th)}</thead>
      <tbody>${sorted.map(p => playerRowHtml(p, raids)).join('')}</tbody></table></div></div>`;
  }
  html += `<div class="summary">
    <div class="summary-item"><label>Raiders</label><div class="val">${roles.flatMap(r => r.players).length}</div></div>
    <div class="summary-item"><label>Active Raiders</label><div class="val">${allActive.length}</div></div>
    <div class="summary-item"><label>Avg Attendance</label><div class="val">${avgPct.toFixed(1)}%</div></div>
    <div class="summary-item"><label>Avg Consumes</label><div class="val">${wT ? (wS / wT).toFixed(1) + '%' : '—'}</div></div>
    <div class="summary-item"><label>SR Balance</label><div class="val">${totalSr}</div></div>
  </div>`;
  out.innerHTML = html;
  refreshWowhead();
}

// ═════════════════════════════════════════════════════════════════════════════
// Raider dropdown — loot received, SR history (with BLP), ledger, adjustments
// ═════════════════════════════════════════════════════════════════════════════
function lootReceived(key) {
  const out = [];
  for (const r of sortedRaids()) for (const l of r.loot) if (lootKey(l) === key) out.push({ ...l, raid: r });
  return out.reverse();
}

function srHistory(key) {
  const { outcome, before } = derived().blp;
  const rows = [];
  for (const r of sortedRaids()) {
    const items = raidReserves(r)[key];
    if (!items) continue;
    for (const [ik, count] of Object.entries(items)) {
      rows.push({ raid: r, itemKey: ik, count, outcome: outcome[r.id]?.[key]?.[ik] || (r.status === 'active' ? 'pending' : 'nodrop'),
        losses: before[r.id]?.[key]?.[ik] || 0, roll: rollFor(r, key, ik) });
    }
  }
  return rows.reverse();
}

function lootChipHtml(l) {
  const col = l.sr ? C5 : C1;
  const tip = l.sr ? 'SR' : 'MS > OS';
  return `<span class="loot-item" style="border-color:${col};background:${col}18;" title="${escHtml(tip)}">${itemLinkHtml(l.itemKey, l.name)}</span>`;
}

const OUTCOME_LABEL = {
  won: ['Won', C1], lost: ['Lost roll', C5], nodrop: ['Didn\'t drop', 'var(--text-dim)'],
  absent: ['Absent', 'var(--text-dim)'], bench: ['Benched', 'var(--text-dim)'], pending: ['Active', 'var(--gold)'],
};

function raiderRaidListHtml(key, s, hist, loot) {
  const histByRaid = {}; for (const x of hist) (histByRaid[x.raid.id] ||= []).push(x);
  const lootByRaid = {}; for (const l of loot) (lootByRaid[l.raid.id] ||= []).push(l);
  const rows = s.events.slice().reverse().filter(e => e.type === 'adjust' || e.present || e.bench || e.severe || histByRaid[e.raidId]?.length);
  if (!rows.length) return '<em class="no-loot">No raids yet</em>';
  return `<div class="raid-acc-list">${rows.map(e => {
    if (e.type === 'adjust') return `<div class="raid-acc adj"><span class="acc-date">${e.date ? fmtShort(e.date) : ''}</span>
      <span class="acc-name">Adjustment <span style="color:var(--text-dim);">— ${escHtml(e.note || '')}</span></span>
      <span class="acc-sum"><span style="color:${e.applied >= 0 ? C1 : C5};">${e.applied > 0 ? '+' : ''}${e.applied}</span>${e.applied !== e.delta ? ` <span style="color:var(--text-dim);">(of ${e.delta}, floored at 0)</span>` : ''}</span></div>`;
    const earned = e.base + e.streakBonus + e.buffBonus;
    const res = histByRaid[e.raidId] || [], won = lootByRaid[e.raidId] || [];
    const results = res.map(x => x.outcome);
    const icons = [results.includes('won') ? '<span title="Won an SR item" style="color:' + C1 + ';">✓</span>' : '',
                   results.includes('lost') ? '<span title="Lost an SR roll" style="color:' + C5 + ';">✗</span>' : ''].join('');
    const parts = [];
    if (e.bench) parts.push(`<span class="bench-tag">benched</span>`);
    if (e.severe) parts.push(`<span class="severe-tag">severe absence</span>${e.severePenalty ? ` <span style="color:${C5};">−${e.severePenalty} SR${e.severePenalty === 1 ? '' : 's'}</span>` : ''}`);
    if (e.present) parts.push(`<span style="color:${C1};">+${earned} SR${earned === 1 ? '' : 's'}</span>`);
    else if (!e.bench && !e.severe) parts.push('<span style="color:var(--text-dim);">absent</span>');
    if (e.spent) parts.push(`${e.spent} spent`);
    if (e.over) parts.push(`<span style="color:${C5};">${e.over} over</span>`);
    if (won.length) parts.push(`${won.length} loot`);
    const summary = parts.join(' · ') + (icons ? ' ' + icons : '');
    const detail = `
      <div class="acc-body">
        <div class="acc-line"><span class="acc-k">SRs earned</span><span>${e.present
          ? `+${earned} ${[e.bench ? 'attendance (bench)' : 'attendance', e.buffBonus && 'consumes', e.streakBonus && 'streak'].filter(Boolean).join(', ')}`
          : e.bench ? 'none — benched (streak paused)' : e.severe ? `none — severe absence${e.severePenalty ? `, −${e.severePenalty} SR${e.severePenalty === 1 ? '' : 's'}` : ''}${srRules.severe.resetBlp ? ', bad luck protection reset' : ''}` : 'none — not present'}</span></div>
        <div class="acc-line"><span class="acc-k">SRs used</span><span>${e.reserved ? `${e.reserved}${e.attStatus === 'present' ? '' : e.bench ? ' (not charged — benched)' : ' (not charged — absent)'}${e.over ? ` · <span style="color:${C5};">${e.status === 'active' ? `${e.over} more than available` : `${e.over} forgiven (balance can't go below 0)`}</span>` : ''}` : 'none'}</span></div>
        ${res.length ? `<div class="acc-line"><span class="acc-k">Reserves</span><span class="acc-res">${res.map(x => {
            const [lab, col] = OUTCOME_LABEL[x.outcome] || [x.outcome, 'var(--text-dim)'];
            const rm = x.roll.max;
            const tip = x.roll.source === 'softres' ? (x.roll.bonus ? `Softres bonus +${x.roll.bonus} going into this raid` : '') : (x.losses ? `Lost ${x.losses}× before this raid` : '');
            return `<span class="acc-item">${itemLinkHtml(x.itemKey)}${x.count > 1 ? ` <span class="sr-multi">×${x.count}</span>` : ''} <span class="${rm > 100 ? 'blp-boost' : ''}" style="font-size:14px;" title="${tip}">1–${rm}</span> <span style="color:${col};font-size:14px;">${lab}</span></span>`;
          }).join('')}</span></div>` : ''}
        ${won.length ? `<div class="acc-line"><span class="acc-k">Loot</span><span class="loot-list">${won.map(lootChipHtml).join('')}</span></div>` : ''}
      </div>`;
    return `<details class="raid-acc"><summary><span class="acc-date">${fmtShort(e.date)}</span>
      <span class="acc-name">${escHtml(e.name)}${e.optional ? ' <span class="tag-opt">optional</span>' : ''}${e.status === 'active' ? ' <span class="tag-active">active</span>' : ''}</span>
      <span class="acc-sum">${summary}</span></summary>${detail}</details>`;
  }).join('')}</div>`;
}

// ── Currently equipped gear (from the newest Warcraft Logs report, see rebuildGearListing) ──
const GEAR_SLOT_MAP = {
  Head: ['Head'], Neck: ['Neck'], Shoulder: ['Shoulders'], Shoulders: ['Shoulders'], Back: ['Cloak'], Chest: ['Chest'],
  Wrist: ['Bracers'], Hands: ['Hands'], Waist: ['Waist'], Legs: ['Legs'], Feet: ['Feet'],
  Finger: ['Ring1', 'Ring2'], Trinket: ['Trinket1', 'Trinket2'],
  'Two-Hand': ['Weapon'], 'Main Hand': ['Weapon'], 'One-Hand': ['Weapon', 'Off-Hand'],
  'Off Hand': ['Off-Hand'], Shield: ['Off-Hand'], 'Held In Off-hand': ['Off-Hand'],
  Ranged: ['Wand/Idol/Relic etc.'], Relic: ['Wand/Idol/Relic etc.'], Thrown: ['Wand/Idol/Relic etc.'],
};
function gearSlotsForItem(itemKey) { return GEAR_SLOT_MAP[getItem(itemKey)?.slot] || null; }
function currentGearHtml(playerName, slots) {
  const g = gearListingByPlayer[normalizeName(playerName)]?.slots;
  if (!g) return '<span style="color:var(--text-dim);font-style:italic;font-size:14px;">no gear data</span>';
  const names = slots.map(sl => g[sl]).filter(Boolean);
  if (!names.length) return '<span style="color:var(--text-dim);">— empty —</span>';
  return names.map(n => {
    const k = String(n).startsWith('id:') ? n : Object.keys(glossary.items).find(k => normalizeName(glossary.items[k].name) === normalizeName(n));
    return `<div class="cur-item">${k ? itemLinkHtml(k) : escHtml(n)}</div>`;
  }).join('');
}

function reopenLootRow(playerName) {
  document.querySelectorAll('.loot-row').forEach(row => {
    const nameTd = row.previousElementSibling?.querySelector('.player-name');
    if (nameTd && nameTd.textContent.includes(playerName)) {
      row.remove();
      const a = nameTd.querySelector('.loot-arrow'); if (a) a.textContent = '▸';
      setTimeout(() => nameTd.click(), 30);
    }
  });
}

function toggleLoot(td, playerName) {
  const tr = td.closest('tr');
  const arrow = td.querySelector('.loot-arrow');
  if (tr.nextElementSibling?.classList.contains('loot-row')) { tr.nextElementSibling.remove(); if (arrow) arrow.textContent = '▸'; return; }
  const key = normalizeName(playerName);
  const loot = lootReceived(key);
  const hist = srHistory(key);
  const s = srStats(playerName);
  const row = document.createElement('tr');
  row.className = 'loot-row';
  let h = `<td colspan="${tr.children.length}" class="loot-cell">`;

  const srWins = loot.filter(l => l.sr).length;
  h += `<div class="expand-section-title">Loot Received ${loot.length ? `<span style="color:var(--text-dim);letter-spacing:0.05em;">— ${loot.length} item${loot.length === 1 ? '' : 's'} · ${srWins} via SR</span>` : ''}</div>`;
  h += loot.length ? `<div class="loot-list">${loot.map(lootChipHtml).join('')}</div>` : `<em class="no-loot">No loot recorded</em>`;

  // Bad luck protection: every item this raider has lost an SR roll on and not won since.
  if (srRules.blp.enabled) {
    const blp = Object.entries(derived().blp.losses[key] || {}).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1] || itemName(a[0]).localeCompare(itemName(b[0])));
    h += `<div class="expand-section-title" style="margin-top:14px;">Bad Luck Protection ${blp.length ? `<span style="color:var(--text-dim);letter-spacing:0.05em;">— ${blp.length} item${blp.length === 1 ? '' : 's'}</span>` : ''}</div>`;
    h += blp.length ? `<div class="loot-list">${blp.map(([ik, n]) => `<span class="loot-item blp-chip" title="Rolls 1–${rollMax(n)} on this item (lost ${n} SR roll${n === 1 ? '' : 's'})">${itemLinkHtml(ik)}</span>`).join('')}</div>`
      : `<em class="no-loot">No boosted rolls</em>`;
  }

  // Raid-by-raid history: one collapsible row per attended raid (and per adjustment).
  h += `<div class="expand-section-title" style="margin-top:14px;">Raids <span style="color:var(--text-dim);letter-spacing:0.05em;">— ${s.available} SR${s.available === 1 ? '' : 's'} available${srRules.streak.enabled && s.nextStreakIn === 1 ? ' · next raid earns the streak bonus' : ''}</span></div>`;
  h += raiderRaidListHtml(key, s, hist, loot);
  // Roster edit (Roster page only)
  if (writeToken && groupingMode === 'roster') {
    const rp = rosterPlayer(key);
    if (rp) {
      h += `<div class="expand-section-title" style="margin-top:14px;">Edit Player</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <select id="editRole_${key}" onchange="rosterEditRoleChanged('${key}')" class="roster-edit-sel">${ROLE_ORDER.map(r => `<option ${r === rp.role ? 'selected' : ''}>${r}</option>`).join('')}</select>
          <select id="editClass_${key}" class="roster-edit-sel">${(ROLE_CLASSES[rp.role] || CLASSES).map(c => `<option ${c === rp.class ? 'selected' : ''}>${c}</option>`).join('')}</select>
          <label style="font-size:14px;color:var(--text-dim);display:flex;align-items:center;gap:6px;">Alt? <input type="checkbox" id="editAlt_${key}" ${rp.isAlt ? 'checked' : ''}></label>
          <button class="small-gold-btn" onclick="rosterUpdatePlayer('${jsAttr(playerName)}', document.getElementById('editRole_${key}').value, document.getElementById('editClass_${key}').value, document.getElementById('editAlt_${key}').checked)">SAVE</button>
          <button class="ghost-btn" onclick="rosterRemovePlayer('${jsAttr(playerName)}')">Remove</button>
        </div>` + akaEditorHtml(key);
    }
  }
  // SR adjustments
  if (writeToken) {
    const rp = rosterPlayer(key);
    h += `<div class="expand-section-title" style="margin-top:14px;">Adjust SRs</div>`;
    if (!rp) h += `<div style="font-size:14px;color:var(--text-dim);">Add this player to the roster to adjust SRs.</div>`;
    else h += `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <input type="number" id="srAdj_${key}" placeholder="±N" step="1" class="gl-input" style="max-width:80px;" onkeydown="if(event.key==='Enter')rosterAddSrAdjustment('${jsAttr(playerName)}')">
        <input type="text" id="srAdjNote_${key}" placeholder="Note (required)" class="gl-input" style="min-width:200px;" onkeydown="if(event.key==='Enter')rosterAddSrAdjustment('${jsAttr(playerName)}')">
        <button class="small-gold-btn" onclick="rosterAddSrAdjustment('${jsAttr(playerName)}')">ADJUST</button>
      </div>
      ${(rp.srAdjustments || []).length ? `<div style="margin-top:6px;font-size:14px;color:var(--text-dim);">${rp.srAdjustments.map((a, i) =>
        `<div>${a.date} · <span style="color:${a.delta > 0 ? C1 : C5};">${a.delta > 0 ? '+' : ''}${a.delta}</span> · ${escHtml(a.note || '')} <button class="x-btn" onclick="rosterRemoveSrAdjustment('${jsAttr(playerName)}', ${i})">✕</button></div>`).join('')}</div>` : ''}`;
  }
  h += `</td>`;
  row.innerHTML = h;
  tr.after(row);
  if (arrow) arrow.textContent = '▾';
  refreshWowhead();
}

function rosterEditRoleChanged(key) {

// ── URL state ───────────────────────────────────────────────────
function _urlSetParam(key, value) {
  const url = new URL(window.location);
  if (value) url.searchParams.set(key, value); else url.searchParams.delete(key);
  window.history.replaceState({}, '', url);
}
function _urlGetParam(key) { return new URL(window.location).searchParams.get(key) || ''; }

// Shared autocomplete (from the LC loot log): items: [{value,label}] or strings
function buildAutocomplete({ container, inputId, placeholder, items, renderOption, onSelect }) {
  const vals = items.map(i => typeof i === 'string' ? { value: i, label: i } : i);
  container.innerHTML = `<input id="${inputId}" placeholder="${placeholder}" autocomplete="off" class="gl-input" style="width:100%;" /><div id="${inputId}_drop" class="ac-drop"></div>`;
  const input = container.querySelector('#' + inputId), drop = container.querySelector('#' + inputId + '_drop');
  let active = -1;
  const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const show = f => {
    const q = strip(f);
    const m = q ? vals.filter(v => strip(v.label).includes(q)) : vals;
    if (!m.length) { drop.style.display = 'none'; return; }
    drop.innerHTML = m.slice(0, 40).map((v, i) => `<div data-i="${vals.indexOf(v)}" class="ac-opt">${renderOption ? renderOption(v) : escHtml(v.label)}</div>`).join('');
    drop.style.display = 'block'; active = -1;
  };
  const pick = i => { const v = vals[i]; input.value = v.label; input.dataset.value = v.value; drop.style.display = 'none'; onSelect?.(v); };
  input.addEventListener('input', () => { delete input.dataset.value; show(input.value); });
  input.addEventListener('focus', () => show(input.value));
  input.addEventListener('blur', () => setTimeout(() => drop.style.display = 'none', 150));
  input.addEventListener('keydown', e => {
    const opts = drop.querySelectorAll('.ac-opt');
    if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, opts.length - 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); }
    else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); pick(+opts[active].dataset.i); return; }
    else if (e.key === 'Escape') { drop.style.display = 'none'; return; }
    else return;
    opts.forEach((o, i) => o.classList.toggle('on', i === active));
  });
  drop.addEventListener('mousedown', e => { const o = e.target.closest('.ac-opt'); if (o) { e.preventDefault(); pick(+o.dataset.i); } });
  return input;
}

async function createRaid() {
  const name = document.getElementById('nrName').value.trim() || 'Raid';
  const date = document.getElementById('nrDate').value || todayMST();
  const optional = document.getElementById('nrOptional').checked;
  const link = document.getElementById('nrSoftres').value.trim();
  const existing = raidsData.raids.find(r => r.date === date);
  if (existing) {
    alert(`There's already a raid on ${fmtDate(date)} ("${existing.name}"). Attendance is counted per night, so add extra SR sheets to that raid instead.`);
    openRaid(existing.id); return;
  }
  let code = null;
  if (link) { code = softresCodeFromUrl(link); if (!code) { alert('That doesn\'t look like a softres.it raid link.'); return; } }
  const raid = normalizeRaid({ name, date, optional, status: 'active', createdAt: new Date().toISOString(), softres: [] });
  const rhId = raidHelperIdFromUrl(document.getElementById('nrRaidHelper')?.value);
  if (rhId) {
    const pv = _nrRh.id === rhId ? _nrRh.data : null;
    raid.raidHelper = { eventId: rhId, url: `https://raid-helper.xyz/raidplan/${rhId}`, ...(pv || {}), syncedAt: pv ? new Date().toISOString() : null, syncError: null };
    // Fields that still hold what Raid-Helper filled in follow later changes to the event
    raid.seeded = { name: !!pv && name === pv.event.displayTitle, date: !!pv && date === pv.event.date };
  }
  if (code) raid.softres.push({ id: _uid('s_'), code, url: `https://softres.it/raid/${code}`, addedAt: new Date().toISOString(), reserves: [], edits: {}, instances: [] });
  const known = rhId && _planned.events?.find(e => e.id === rhId);
  if (known?.channelId) raid.raidHelper.channelId = known.channelId;
  raidsData.raids.push(raid);
  await saveRaids().catch(() => {});
  if (rhId && !raid.raidHelper.channelId && RH_SERVER_ID && !raid.raidHelper.demo) raidHelperChannelId(raid).then(() => saveRaids()).catch(() => {});
  if (rhId && !raid.raidHelper.syncedAt) { try { await syncRaidHelper(raid); await saveRaids().catch(() => {}); } catch (e) { flash(e.message, 'error'); } }
  _nrRh = { id: null, data: null };
  if (code) { flash('Fetching softres…', 'loading'); await syncSoftres([raid]); flash(raid.softres[0].syncError ? 'Softres sync failed — see the Reserves tab' : 'Raid started', raid.softres[0].syncError ? 'error' : 'success'); }
  refreshAll();
  openRaid(raid.id);
}

function editRaidMeta(id) { _raidView.editing = !_raidView.editing; renderRaidsPanel(); }
async function saveRaidMeta(id) {
  const raid = getRaid(id);
  const name = document.getElementById('erName').value.trim() || raid.name;
  const date = document.getElementById('erDate').value;
  const optional = document.getElementById('erOptional').checked;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { alert('Pick a date.'); return; }
  if (date !== raid.date && raidsData.raids.some(r => r.date === date)) { alert('Another raid already uses that date.'); return; }
  if (date !== raid.date && raid.wcl && !raid.wcl.manual && !raid.wcl.demo) raid.wcl = null; // matched by date — match again for the new date
  // Editing a seeded field by hand stops it following Raid-Helper
  raid.seeded ||= {};
  if (name !== raid.name) raid.seeded.name = false;
  if (date !== raid.date) raid.seeded.date = false;
  Object.assign(raid, { name, date, optional });
  const rhRaw = document.getElementById('erRaidHelper')?.value.trim() || '';
  const rhId = raidHelperIdFromUrl(rhRaw);
  if (rhRaw && !rhId) { alert('That doesn\'t look like a Raid-Helper event link.'); return; }
  let rhErr = null;
  if (!rhId) delete raid.raidHelper;
  else if (rhId !== raid.raidHelper?.eventId) {
    raid.raidHelper = { eventId: rhId, url: `https://raid-helper.xyz/raidplan/${rhId}`, signUps: [], comp: null, event: null };
    try { await syncRaidHelper(raid); } catch (e) { rhErr = e.message; }
  }
  normalizeRaid(raid);
  _raidView.editing = false;
  await saveRaids().catch(() => {});
  if (rhErr) flash(rhErr, 'error');
  refreshAll();
}

async function endRaid(id) {
  const raid = getRaid(id);
  const note = 'Attendance and consumables are read from Warcraft Logs once the log is up (checked now and again on later page loads). Until then '
    + (raid.raidHelper ? 'the Raid-Helper sign-ups stand in (plus any manual marks).' : `everyone who reserved counts as present (${Object.keys(raidReserves(raid)).filter(k => rosterPlayer(k)).length} raiders), plus any manual marks.`);
  const announce = canAnnounce(raid) && !!document.getElementById('announceLoot')?.checked;
  const where = raid.raidHelper?.demo ? ` the test channel (${DEMO_ANNOUNCE_CHANNEL})` : raid.raidHelper?.event?.channelName ? ` #${raid.raidHelper.event.channelName}` : ' the Raid-Helper sign-up channel';
  if (!confirm(`End "${raid.name}"?\n\n${note}\n\nReserves beyond anyone's balance are forgiven once the raid ends.${announce ? `\n\nThe loot and current bad luck protection will be posted to${where}.` : ''}`)) return;
  if (raid.raidHelper?.eventId && !raid.raidHelper.demo) { try { await syncRaidHelper(raid); raid.raidHelper.finalAt = new Date().toISOString(); } catch (_) { /* keep the last good copy */ } }
  raid.status = 'past'; raid.endedAt = new Date().toISOString();
  await saveRaids().catch(() => {});
  refreshAll();
  if (announce) await announceRaidLoot(raid);
  if (!raid.wcl?.demo && (WCL_GUILD?.name || raid.wcl?.manual)) refreshWcl(raid.id); // the log may still be uploading; retried automatically later
}
async function reopenRaid(id) {
  const raid = getRaid(id);
  if (!confirm(`Reopen "${raid.name}" as an active raid?`)) return;
  raid.status = 'active'; delete raid.endedAt;
  await saveRaids().catch(() => {});
  refreshAll();
}
async function deleteRaid(id) {
  const raid = getRaid(id);
  const typed = prompt(`Delete "${raid.name}" (${raid.date}) with its ${raid.loot.length} loot entries, reserves and attendance?\nThis cannot be undone. Type the date to confirm:`);
  if (typed !== raid.date) return;
  raidsData.raids = raidsData.raids.filter(r => r.id !== id);
  await saveRaids().catch(() => {});
  closeRaid(); refreshAll();
}

  } catch (e) { _nrRh = { id: null, data: null }; if (st) st.innerHTML = `<span class="tag-warn">${escHtml(e.message)}</span>`; }
}
function raidHelperCountsHtml(raid) {
  const c = raidHelperCounts(raid); if (!c) return '';
  const parts = [`${c.signed} signed`];
  if (c.hasComp) parts.push(`${c.confirmed || 0} ✓`);
  if (c.cancelled) parts.push(`${c.cancelled} cancelled`);
  if (c.bench) parts.push(`${c.bench} bench`);
  if (c.absent) parts.push(`${c.absent} absent`);
  return `<span class="rh-counts" title="Raid-Helper sign-ups${c.hasComp ? ' · ✓ = confirmed in the comp' : ''}">${parts.join(' · ')}</span>`;
}

// Attendance tab: who signed up and how they matched (Phase 3 turns this into expected attendance)

// ── Loot ────────────────────────────────────────────────────────
// Instances we actually know this raid is in: its SR sheets, content built during it, or its loot
function raidKnownInstances(raid) {
  return [...new Set([...raid.softres.flatMap(s => s.instances.map(i => i.name)), ...(raid.newContent || []),
    ...raid.loot.flatMap(l => itemSources(l.itemKey).map(x => x.raid))])].filter(Boolean);
}
function raidInstanceOrder(raid) {
  const fromSheets = raid.softres.flatMap(s => s.instances.map(i => i.name));
  const fromLoot = raid.loot.flatMap(l => itemSources(l.itemKey).map(x => x.raid)); // e.g. new content built during this raid
  const all = Object.keys(glossary.raids);
  return [...new Set([...fromSheets, ...fromLoot, ...(raid.newContent || [])].filter(n => all.includes(n)).concat(all))];
}

function renderRaidLoot(el, raid) {
  const instances = raidInstanceOrder(raid);
  const v = _raidView;
  if (!instances.includes(v.raid)) { v.raid = instances[0] || ''; v.boss = ''; v.item = ''; }

  const items = (glossary.raids[v.raid]?.[v.boss] || []);
  const res = raidReserves(raid);
  const reservedKeys = new Set(Object.values(res).flatMap(m => Object.keys(m)));
  if (v.item && !items.includes(v.item)) v.item = '';

  const opt = (vals, cur) => vals.map(x => `<option value="${escHtml(x)}" ${x === cur ? 'selected' : ''}>${escHtml(x)}</option>`).join('');
  const building = !!writeToken && !raid.softres.length; // no SR sheet → probably new content
  const nSugg = writeToken && raid.softres.length ? glossaryMergeSuggestions().length : 0;
  el.innerHTML = `
    ${nSugg ? `<div class="gl-sugg-banner">${nSugg} item${nSugg === 1 ? '' : 's'} added by hand may match entries from the SR sheet.

    ${building ? newContentCardHtml(raid) : ''}

      <div class="loot-select-group"><label class="loot-select-label">Instance</label>

      <div class="loot-select-group" style="flex:2;position:relative;"><label class="loot-select-label">Item <span style="text-transform:none;letter-spacing:0;">— ★ = reserved this raid</span></label>
        <div class="loot-select loot-item-display" onclick="toggleLootItemDd(event)" style="display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;">
          ${v.item ? `${itemIconSmall(v.item)}<span>${escHtml(itemName(v.item))}</span>${reserveCountFor(res, v.item) ? `<span class="dd-res">★ ${reserveCountFor(res, v.item)} SR${reserveCountFor(res, v.item) === 1 ? '' : 's'}</span>` : ''}` : '<span style="color:var(--text-dim);">— Select item —</span>'}
        </div>

            ${itemIconSmall(k)}<span class="dd-name">${escHtml(itemName(k))}</span>${n ? `<span class="dd-res" title="${n} reserve${n === 1 ? '' : 's'} this raid">★ ${n} SR${n === 1 ? '' : 's'}</span>` : ''}</div>`; }).join('')}
        </div></div>
    </div>` : building ? '' : `<p class="gl-empty">The Item Glossary is empty. Add a softres link on the Reserves tab (it imports the instance's items) or add items under Management → Item Glossary.</p>`}
    <div id="lootItemView"></div>
    <div class="section-title" style="margin-top:28px;">Loot this raid <span style="color:var(--text-dim);font-size:14px;letter-spacing:0.05em;">${raid.loot.length}</span></div>
    ${writeToken ? gargulCheckHtml(raid) : ''}
    <div id="raidLootLog"></div>`;
  if (v.item) renderLootItemView(document.getElementById('lootItemView'), raid, v.item);

}

async function ncAddInstance(raidId) {
  const name = document.getElementById('ncRaid')?.value.trim(); if (!name) return;
  if (!glossary.raids[name]) glossary.raids[name] = {};
  const raid = getRaid(raidId);
  if (!(raid.newContent ||= []).includes(name)) { raid.newContent.push(name); saveRaids().catch(() => {}); }
  Object.assign(_raidView, { raid: name, boss: '', item: '' });
  renderRaidsPanel();

}
async function ncAddBoss() {
  const name = document.getElementById('ncBoss')?.value.trim(); if (!name || !_raidView.raid) return;
  const r = glossary.raids[_raidView.raid];

async function ncAddItem() {
  const raw = document.getElementById('ncItem')?.value.trim(); if (!raw || !_raidView.boss) return;
  const idm = raw.match(/item[=/](\d+)/i) || raw.match(/^(\d+)$/);
  const id = idm ? +idm[1] : null;
  const list = glossary.raids[_raidView.raid][_raidView.boss];
  const existing = Object.entries(glossary.items).find(([, it]) => id ? it.wowheadId === id : normalizeName(it.name) === normalizeName(raw));
  const key = existing ? existing[0] : itemKeyFor(id, raw);
  if (!existing) glossary.items[key] = { name: id ? `Item ${id}` : raw, wowheadId: id, origin: 'manual', eligibleClasses: [], notes: '', icon: null, slot: '', classesSource: 'pending' };
  if (!list.includes(key)) list.push(key);
  _raidView.item = key;
  renderRaidsPanel();
  if (id && !existing) {
    flash('Looking up the item on Wowhead…', 'loading');
    const r = await enrichGlossaryItems([key]).catch(() => ({ failed: 1 }));
    flash(r.failed ? 'Wowhead lookup failed — set the name and classes in the Item Glossary' : `Added ${itemName(key)}`, r.failed ? 'error' : 'success');
    renderRaidsPanel();
  } else if (!id) flash(`Added "${raw}" — no Wowhead ID, so set its eligible classes in the Item Glossary`, 'success');
  await saveGlossary().catch(() => {});
}

function itemIconSmall(key) {
  const id = itemWowheadId(key), ic = id && itemIcons[id];
  return ic ? `<img src="https://wow.zamimg.com/images/wow/icons/small/${ic}.jpg" style="width:18px;height:18px;border:1px solid #444;border-radius:2px;flex-shrink:0;" />`
            : '<span style="width:18px;height:18px;display:inline-block;flex-shrink:0;border:1px solid var(--border);border-radius:2px;"></span>';
}
function reserveCountFor(res, key) { return Object.values(res).reduce((a, m) => a + (m[key] || 0), 0); }
function toggleLootItemDd(e) { e.stopPropagation(); const d = document.getElementById('lootItemDd'); if (d) d.style.display = d.style.display === 'none' ? 'block' : 'none'; }
function pickLootItem(k) { _raidView.item = k; _urlSetParam('item', k); renderRaidsPanel(); }

function renderLootItemView(el, raid, itemKey) {
  const it = getItem(itemKey) || { name: itemName(itemKey), eligibleClasses: [] };
  const res = raidReserves(raid);
  const reservers = Object.entries(res).filter(([, m]) => m[itemKey]).map(([k, m]) => ({ key: k, count: m[itemKey] }));
  const alreadyThisRaid = new Set(raid.loot.filter(l => l.itemKey === itemKey).map(l => lootKey(l)));
  const classes = it.eligibleClasses || [];
  const gearSlots = gearSlotsForItem(itemKey);
  const canAssign = !!writeToken;
  const assignBtn = (name, sr) => canAssign
    ? `<button class="assign-btn ${sr ? 'sr' : ''}" onclick="assignLoot('${raid.id}', '${itemKey}', '${jsAttr(name)}', ${sr})">${sr ? 'Award (SR)' : 'Award'}</button>` : '';

  // SR block
  let srHtml = '';
  if (reservers.length) {
    const rows = reservers.map(({ key, count }) => {
      const rp = rosterPlayer(key);
      const name = rp?.name || Object.values(raid.softres.map(s => effectiveReserves(s)[key]).filter(Boolean))[0]?.name || key;
      const roll = rollFor(raid, key, itemKey);
      const losses = roll.losses || 0, rm = roll.max;
      const st = rp ? srStats(rp.name) : null;
      const ev = st?.events.find(e => e.raidId === raid.id);
      const att = attendanceOf(raid, key), present = att.status === 'present';
      const over = ev?.over > 0;
      return { key, name, count, losses, rm, roll, present, bench: att.bench, over, ev, rp, got: alreadyThisRaid.has(key) };
    }).sort((a, b) => b.rm - a.rm || a.name.localeCompare(b.name));
    srHtml = `<div class="sr-box ${gearSlots ? 'with-cur' : ''}">
      <div class="gl-col-title">Soft reserved by ${reservers.length}</div>
      ${rows.map(r => `<div class="sr-row ${r.present ? '' : 'absent'} ${r.over ? 'over' : ''}">
        <span class="sr-name">${playerNameHtml(r.name)}${r.rp ? '' : notOnRosterTag(r.name)}</span>
        ${r.count > 1 ? `<span class="sr-multi" title="Reserved ${r.count} times — rolls ${r.count} times">×${r.count}</span>` : '<span></span>'}
        ${gearSlots ? `<span class="sr-cur">${currentGearHtml(r.name, gearSlots)}</span>` : ''}
        <span class="sr-roll ${r.rm > 100 ? 'blp-boost' : ''}" title="${r.losses ? `Lost this item ${r.losses}× before — bad luck protection` : 'Standard roll'}">/roll ${r.rm}</span>
        <span class="sr-bal">${r.over && writeToken ? `<span class="over-chip" title="Reserved ${r.ev.reserved} SRs this raid but only had ${r.ev.reserved - r.ev.over}">⚠ OVER-RESERVED ${r.ev.reserved}/${r.ev.reserved - r.ev.over}</span>` : ''}
          ${r.bench ? '<span class="bench-tag">benched</span>' : !r.present ? '<span class="tag-warn">not marked present</span>' : ''}${r.got ? '<span class="tag-ok">✓ awarded</span>' : ''}</span>
        <span style="text-align:right;">${r.got ? '' : assignBtn(r.name, true)}</span>
      </div>`).join('')}
    </div>`;
  } else srHtml = `<div class="sr-box empty">No one soft reserved this item on this raid.</div>`;

  // Eligible by class
  const pool = lastRenderData.roles.flatMap(r => r.players);
  const eligible = pool.filter(p => {
    const cls = classMap[normalizeName(p.name)];
    return cls && (!classes.length || classes.includes(cls)) && attendanceOf(raid, normalizeName(p.name)).status === 'present';
  });
  const reserverSet = new Set(reservers.map(r => r.key));
  const others = eligible.filter(p => !reserverSet.has(normalizeName(p.name)))
    .sort((a, b) => srStats(b.name).available - srStats(a.name).available || (b.pct ?? 0) - (a.pct ?? 0));
  const th = (label, col, align = 'center', title = '') => `<th style="text-align:${align};" title="${title}">${label}</th>`;
  el.innerHTML = `
    <div class="item-head">
      <div style="font-family:'Cinzel',serif;font-size:18px;color:var(--gold-light);">${itemLinkHtml(itemKey)}</div>
      <div style="font-size:15px;">${classes.length ? classes.map(c => `<span style="color:${CLASS_COLORS[c]};">${c}</span>`).join(' · ') : '<span style="color:var(--text-dim);">All classes</span>'}</div>
    </div>
    ${it.notes ? `<div style="font-size:15px;color:var(--text-dim);font-style:italic;margin-bottom:8px;">${escHtml(it.notes)}</div>` : ''}
    ${srHtml}
    <div style="overflow-x:auto;margin-top:18px;"><table class="compact-table" style="width:100%;border-collapse:collapse;">${tableColgroup(true, !!gearSlots)}<thead>${tableHeadHtml(th, true, !!gearSlots)}</thead>
      <tbody>${others.map(p => playerRowHtml(p, lastRenderData.raids || [], { showRole: true, current: gearSlots ? currentGearHtml(p.name, gearSlots) : undefined, action: alreadyThisRaid.has(normalizeName(p.name)) ? '<span class="tag-ok">✓ awarded</span>' : assignBtn(p.name, false) })).join('')}</tbody>
    </table></div>`;
}

async function assignLoot(raidId, itemKey, playerName, sr) {
  const raid = getRaid(raidId);
  if (raid.status === 'past' && !confirm(`"${raid.name}" has ended. Add this award retroactively?`)) return;
  if (!confirm(`Award ${itemName(itemKey)} to ${playerName}${sr ? ' (won via SR)' : ''}?`)) return;
  raid.loot.push({ id: _uid('l_'), itemKey, name: itemName(itemKey), recipient: playerName, sr: !!sr, at: new Date().toISOString() });
  await saveRaids().catch(() => {});
  refreshAll();
}

function renderRaidLootLog(el, raid) {
  const res = raidReserves(raid);
  // Two lists: loot won through a soft reserve, and loot handed out MS > OS.
  // The ⇄ button moves an award to the other list if it was recorded wrong.
  const row = (l, i) => `<tr>
      <td>${itemLinkHtml(l.itemKey, l.name)}${!l.sr && res[lootKey(l)]?.[l.itemKey] ? ' <span class="tag-warn" title="They reserved this item — was it an SR win?">reserved</span>' : ''}</td>
      <td>${playerNameHtml(l.recipient)}</td>
      <td style="text-align:right;white-space:nowrap;"><button class="ghost-btn write-gated-hide ll-move" onclick="toggleLootSr('${raid.id}', ${i})" title="${l.sr ? 'Move to MS > OS' : 'Move to SR'}">⇄ ${l.sr ? 'MS > OS' : 'SR'}</button>
        <button class="x-btn write-gated-hide" onclick="removeLoot('${raid.id}', ${i})" title="Remove">✕</button></td>
    </tr>`;
  const table = (title, sr) => {
    const list = raid.loot.map((l, i) => [l, i]).filter(([l]) => !!l.sr === sr);
    return `<div class="ll-block"><div class="ll-title">${title} <span style="color:var(--text-dim);">${list.length}</span></div>
      ${list.length ? `<table class="mini-table ll-table"><colgroup><col><col style="width:32%;"><col style="width:150px;"></colgroup><tbody>${list.map(([l, i]) => row(l, i)).join('')}</tbody></table>`
        : `<div class="gl-empty">None yet.</div>`}</div>`;
  };
  el.innerHTML = `
    ${table('SR', true)}
    ${table('MS &gt; OS', false)}
    <div class="write-gated-hide" style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;">
      <div id="llItem" style="position:relative;min-width:280px;flex:2;"></div>
      <div id="llWho" style="position:relative;min-width:160px;flex:1;"></div>
      <label class="chk"><input type="checkbox" id="llSr"> SR</label>
      <button class="small-gold-btn" onclick="addLootManual('${raid.id}')">+ ADD</button>
    </div>`;
  if (!writeToken) return;
  const itemVals = Object.entries(glossary.items).map(([k, it]) => ({ value: k, label: it.name })).sort((a, b) => a.label.localeCompare(b.label));
  buildAutocomplete({ container: document.getElementById('llItem'), inputId: 'llItemIn', placeholder: 'Item (from the glossary)', items: itemVals,
    onSelect: v => { const who = document.getElementById('llWhoIn')?.dataset.value; if (who && res[normalizeName(who)]?.[v.value]) document.getElementById('llSr').checked = true; } });
  buildAutocomplete({ container: document.getElementById('llWho'), inputId: 'llWhoIn', placeholder: 'Recipient', items: rosterData.players.map(p => p.name).sort(),
    renderOption: v => playerNameHtml(v.label),
    onSelect: v => { const ik = document.getElementById('llItemIn')?.dataset.value; if (ik && res[normalizeName(v.value)]?.[ik]) document.getElementById('llSr').checked = true; } });
}
async function addLootManual(raidId) {
  const raid = getRaid(raidId);
  const itemIn = document.getElementById('llItemIn'), whoIn = document.getElementById('llWhoIn');
  const itemKey = itemIn?.dataset.value, who = whoIn?.dataset.value || whoIn?.value.trim();
  if (!itemKey) { flash('Pick the item from the list (add it to the glossary first if it\'s missing).', 'error'); return; }
  if (!who) { flash('Pick a recipient.', 'error'); return; }
  raid.loot.push({ id: _uid('l_'), itemKey, name: itemName(itemKey), recipient: who, sr: document.getElementById('llSr').checked, at: new Date().toISOString() });
  await saveRaids().catch(() => {});
  refreshAll();
}
async function toggleLootSr(raidId, i) {
  const l = getRaid(raidId).loot[i]; if (!l) return;
  l.sr = !l.sr; await saveRaids().catch(() => {}); refreshAll();
}
async function removeLoot(raidId, i) {
  const raid = getRaid(raidId); const l = raid.loot[i]; if (!l) return;
  if (!confirm(`Remove ${l.name} → ${l.recipient}?`)) return;
  raid.loot.splice(i, 1); await saveRaids().catch(() => {}); refreshAll();
}

// ── Gargul post-raid export: catch awards that never made it into the loot log ──
function gargulBadgeHtml(raid) {
  const d = gargulDiff(raid); if (!d) return '';
  return d.issues ? `<span class="gx-badge warn" title="Loot log differs from the Gargul export">⚠ ${d.issues} loot difference${d.issues === 1 ? '' : 's'}</span>`
    : '<span class="gx-badge ok" title="Loot log matches the Gargul export">✓ Gargul</span>';
}
function gargulCheckHtml(raid) {
  const d = gargulDiff(raid);
  const paste = (open, label) => `<details class="gx-paste" ${open ? 'open' : ''}><summary class="subtle-link">${label}</summary>
      <textarea id="gxText" class="gl-input gx-text" placeholder="In game: /gl export → copy the post-raid export → paste it here"></textarea>
      <div style="display:flex;gap:8px;margin-top:6px;"><button class="small-gold-btn" onclick="importGargulExport('${raid.id}')">CHECK LOOT</button></div></details>`;
  if (!d) return `<div class="gx-box">${paste(raid.status === 'past', 'Check against the Gargul export')}</div>`;
  const g = raid.gargul;

async function importGargulExport(raidId) {

    const unknown = [...new Set(g.awards.map(a => a.itemId).filter(id => !glossary.items['id:' + id]))];
    const names = Object.fromEntries(await Promise.all(unknown.map(id => fetchWowheadItem(id).then(i => [id, i.name], () => [id, '']))));

async function editReserve(raidId, sheetId, charKey, op, id) {
  const raid = getRaid(raidId); const s = raid.softres.find(x => x.id === sheetId);

  if (op === 'revert') delete s.edits[charKey];
  else {
    const items = [...(cur?.items || [])];
    if (op === 'remove') { const i = items.indexOf(id); if (i >= 0) items.splice(i, 1); }
    if (op === 'add') items.push(id);
    s.edits[charKey] = { name: cur?.name || rosterPlayer(charKey)?.name || charKey, items, editedAt: new Date().toISOString() };

// Five-state attendance: default (calculated) → present → absent → severe absence → bench → default
const ATT_CYCLE = [undefined, true, false, 'severe', 'bench'];
const ATT_LOOK = { present: ['✓', 'Present'], absent: ['✕', 'Absent'], severe: ['!', 'Severe absence'], bench: ['B', 'Benched'] };
function attCycleHtml(raid, key, a) {
  const ov = raid.attendance.overrides[key], look = a.severe ? 'severe' : a.status;
  const [sym, lab] = ATT_LOOK[look];
  const title = `${raid.label}: ${ov === undefined ? `default — ${lab.toLowerCase()} (${ATT_SOURCE_LABEL[a.source] || a.source}${a.flag ? ', ' + a.flag : ''})` : `${lab} — set by hand`}${a.bench ? (srRules.bench.countsAsAttended ? ' · counts as attended' : ' · streak paused') : ''}`;
  return `<button type="button" class="att-cyc st-${look} ${ov === undefined ? 'def' : 'ov'} ${a.flag && ov === undefined ? 'flag' : ''}" ${writeToken ? '' : 'disabled'}
    title="${escHtml(title)}"
    onclick="event.stopPropagation();cycleAttendance('${raid.id}','${key}',1)" oncontextmenu="event.preventDefault();event.stopPropagation();cycleAttendance('${raid.id}','${key}',-1)">${ov === undefined && look === 'absent' ? '·' : sym}</button>`;
}
function cycleAttendance(raidId, key, dir = 1) {
  if (!writeToken) return;
  const ov = getRaid(raidId).attendance.overrides[key];
  let i = ATT_CYCLE.findIndex(v => v === ov); if (i < 0) i = 0;
  const next = ATT_CYCLE[(i + dir + 5) % 5];
  setRaidAttendance(raidId, key, next === undefined ? null : next);
}
function benchRaider(raidId) {
  const k = document.getElementById('benchAcIn')?.dataset.value;
  if (!k) { flash('Pick a raider from the list.', 'error'); return; }
  setRaidAttendance(raidId, k, 'bench');
}
// Clear a manual bench; a bench that came from Raid-Helper is overridden to present
function unbenchRaider(raidId, k) {
  const raid = getRaid(raidId);
  if (raid.attendance.overrides[k] === 'bench') { delete raid.attendance.overrides[k]; invalidateDerived(); if (attendanceOf(raid, k).bench) raid.attendance.overrides[k] = true; }
  else raid.attendance.overrides[k] = true;
  invalidateDerived();
  clearTimeout(_attSaveTimer);
  _attSaveTimer = setTimeout(() => saveRaids().catch(() => {}), 700);
  refreshAll();
}
let _attSaveTimer = null;
function setRaidAttendance(raidId, key, value) {
  const raid = getRaid(raidId);
  if (value === null) delete raid.attendance.overrides[key]; else raid.attendance.overrides[key] = value === 'bench' || value === 'severe' ? value : !!value;
  invalidateDerived();
  clearTimeout(_attSaveTimer);
  _attSaveTimer = setTimeout(() => saveRaids().catch(() => {}), 700);
  refreshAll();
}

function _dName(key, fallback) { return rosterPlayer(key)?.name || fallback || key; }
function _dItem(ik, link) {

}

    cur += (cur ? '\n' : '') + ln;

function discordSummaryEmbeds(raid) {
  const lootLine = l => {
    const k = lootKey(l), r = l.sr && k ? rollFor(raid, k, l.itemKey) : null;
    return `• ${_dItem(l.itemKey, true)} → **${_dName(k, l.recipient)}**${r && r.bonus > 0 ? ` *(rolled 1-${r.max})*` : ''}`;
  };
  const sr = raid.loot.filter(l => l.sr), ms = raid.loot.filter(l => !l.sr);
  const lootLines = [];
  if (sr.length) lootLines.push('**Soft reserves**', ...sr.map(lootLine));
  if (sr.length && ms.length) lootLines.push('');
  if (ms.length) lootLines.push('**MS > OS**', ...ms.map(lootLine));
  if (!lootLines.length) lootLines.push('*No loot recorded.*');

  // Current BLP; ▲ = went up in this raid (latest raid only)
  const latest = !raidsData.raids.some(r => r.id !== raid.id && r.date > raid.date);
  // Items won in this raid with BLP on them (and not lost again since) — shown struck through
  const wonBy = {};
  for (const l of raid.loot.filter(l => l.sr)) {
    const k = lootKey(l), before = k ? blpLossesBefore(raid.id, k, l.itemKey) : 0;
    if (before > 0 && !(derived().blp.losses[k]?.[l.itemKey] > 0)) (wonBy[k] ||= []).push([l.itemKey, before]);
  }
  const keys = new Set([...Object.keys(derived().blp.losses), ...Object.keys(wonBy)]);
  const rows = [...keys].map(k => {
    const items = Object.entries(derived().blp.losses[k] || {}).filter(([, n]) => n > 0)
      .sort((a, b) => b[1] - a[1] || itemName(a[0]).localeCompare(itemName(b[0])));
    return { k, name: _dName(k), items, won: wonBy[k] || [] };
  }).filter(r => (r.items.length || r.won.length) && rosterPlayer(r.k)).sort((a, b) => a.name.localeCompare(b.name));
  const blpLines = rows.map(r => {
    const cur = r.items.map(([ik, n]) => `${_dItem(ik, false)} +${rollMax(n) - 100}${latest && n > blpLossesBefore(raid.id, r.k, ik) ? ' ▲' : ''}`);
    const won = r.won.map(([ik, n]) => `~~${_dItem(ik, false)} +${rollMax(n) - 100}~~`);
    // Won everything they had BLP on: strike the whole line
    return cur.length ? `**${r.name}** — ${[...cur, ...won].join(' · ')}` : `~~**${r.name}** — ${won.join(' · ').replace(/~~/g, '')}~~`;
  });
  if (!blpLines.length) blpLines.push('*Nobody has bad luck protection right now.*');

  const head = `${raid.name} · ${fmtDate(raid.date)}`;
  const embeds = [];
  _chunkLines(lootLines).forEach((d, i) => embeds.push({ title: { text: `Loot — ${head}${i ? ' (cont.)' : ''}` }, description: d, color: '#c8a04a' }));
  _chunkLines(blpLines).forEach((d, i) => embeds.push({ title: { text: `Bad luck protection${i ? ' (cont.)' : ''}` }, description: d, color: '#4a8fc8' }));
  return embeds;
}

function _rhServerUrl(path) { return `${CF_WORKER_URL}/raidhelper/v4/servers/${RH_SERVER_ID}/${path}`; }
// The Discord channel the raid's sign-up was posted in. Only the server API (via the Worker)

async function raidHelperChannelId(raid) {
  const rh = raid.raidHelper; if (!rh?.eventId) return null;

  for (let page = 1; page <= 10; page++) {
    const res = await fetch(_rhServerUrl(`events?page=${page}`), { headers: { 'X-Token': writeToken } });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || 'HTTP ' + res.status);
    const ev = (j.postedEvents || []).find(e => String(e.id) === String(rh.eventId));

async function announceRaidLoot(raid) {
  let sent = 0;
  try {
    const ch = await raidHelperChannelId(raid);
    if (!ch) throw new Error("couldn't find the Raid-Helper sign-up's channel");
    for (const e of discordSummaryEmbeds(raid)) {
      const res = await fetch(_rhServerUrl(`channels/${ch}/embed`), { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Token': writeToken }, body: JSON.stringify(e) });
      const j = await res.json().catch(() => ({}));

      if (glossary.items[newKey] && newKey !== key) return alert('Another glossary item already has that Wowhead ID.');
      it.wowheadId = id;
