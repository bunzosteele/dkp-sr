// ── [from LC dashboard] Worker storage (KV) + conflict handling ─────────────────────
// ── Version tracking (optimistic locking) ────────────────────────
// Tracks the _v value seen when each file was last loaded.
// If the Worker has a newer version at save time, the save is rejected.
const _loadedVersions = {};

// Every WF key lives under KV_PREFIX so this dashboard never touches LC data.
function _kvKey(filename) { return KV_PREFIX + filename; }

function _workerBase() {
  let base = CF_WORKER_URL.trim().replace(/\/+$/, '');
  if (!base.startsWith('http://') && !base.startsWith('https://')) base = 'https://' + base;
  return base;
}

async function fetchFromWorker(filename) {
  if (!CF_WORKER_URL) throw new Error('CF_WORKER_URL not configured');
  const res = await fetch(`${_workerBase()}/${_kvKey(filename)}`, { cache: 'no-store' });
  // 404 = nothing saved under this prefix yet (fresh WF install) — callers treat null as "empty".
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`Worker fetch failed for ${_kvKey(filename)}: ${res.status}`);
  const data = await res.json();
  // Record the version we loaded so we can detect conflicts on save
  if (data && typeof data._v === 'number') _loadedVersions[filename] = data._v;
  return data;
}

async function _saveJsonNow(filename, data) {
  if (!CF_WORKER_URL) throw new Error('CF_WORKER_URL not configured — set cf_worker_url in config.json');
  if (!writeToken) throw new Error('Write token required — enter it in the auth panel');

  // Optimistic locking: fetch current version from Worker and compare
  // before writing, to detect if someone else saved since we loaded
  try {
    const current = await fetch(`${_workerBase()}/${_kvKey(filename)}`, { cache: 'no-store' });
    if (current.ok) {
      const currentData = await current.json();
      const currentVersion = typeof currentData._v === 'number' ? currentData._v : 0;
      const loadedVersion = typeof _loadedVersions[filename] === 'number' ? _loadedVersions[filename] : 0;
      if (currentVersion > loadedVersion) {
        throw new Error(`CONFLICT:${filename}`);
      }
    }
  } catch(e) {
    if (e.message.startsWith('CONFLICT:')) throw e;
    // If the version check fetch fails, proceed anyway (Worker may not have file yet)
  }

  // Increment version before saving
  const loadedV = typeof _loadedVersions[filename] === 'number' ? _loadedVersions[filename] : 0;
  const nextV = loadedV + 1;
  const dataWithVersion = { ...data, _v: nextV };

  const res = await fetch(`${_workerBase()}/${_kvKey(filename)}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Token': writeToken },
    body: JSON.stringify(dataWithVersion, null, 2),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(`Worker save failed for ${filename}: ${err.error || res.status}`);
  }

  // Update our local version to what we just wrote
  _loadedVersions[filename] = nextV;

  // The LC dashboard re-fetched the file here. That swapped the in-memory object for the
  // server copy while the user could already be making the next edit on the old object,
  // silently dropping or misplacing that edit (easy to hit when adding glossary entries
  // quickly). What we just wrote IS the current state, so there is nothing to reload.
}

// Saves to the same key run one at a time, in order. Two overlapping saves could otherwise
// both pass the version check and land out of order, leaving the older snapshot in KV.
const _saveChains = {};
function saveJsonToGitHub(filename, data) {
  const run = () => _saveJsonNow(filename, data);
  const p = (_saveChains[filename] || Promise.resolve()).catch(() => {}).then(run);
  _saveChains[filename] = p;
  return p;
}

// ── Conflict error handler ───────────────────────────────────────
function handleSaveError(e, filename) {
  if (e.message && e.message.startsWith('CONFLICT:')) {
    const file = e.message.split(':')[1] || filename || 'data';
    addError(
      `Save conflict on ${file}`,
      'Another user saved changes after you loaded this page. ' +
      'Your changes were NOT saved. Please refresh the page to get the latest data, then re-apply your changes.'
    );
  } else {
    addError(`Save failed${filename ? ' (' + filename + ')' : ''}`, e.message || String(e));
  }
}



// ── [from LC dashboard] custom tooltips ─────────────────────────────────────────────
const tooltipEl = document.createElement('div');
tooltipEl.id = 'custom-tooltip';
document.body.appendChild(tooltipEl);

let longPressTimer = null;
let activeTooltipTarget = null;

function showTooltip(text, x, y) {
  if (!text) return;
  tooltipEl.textContent = text.replace(/&#10;/g, '\n');
  tooltipEl.classList.add('visible');
  positionTooltip(x, y);
}

function positionTooltip(x, y) {
  const pad = 12;
  const tw = tooltipEl.offsetWidth;
  const th = tooltipEl.offsetHeight;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  let left = x + pad;
  let top  = y + pad;
  if (left + tw > vw - pad) left = x - tw - pad;
  if (top  + th > vh - pad) top  = y - th - pad;
  tooltipEl.style.left = Math.max(pad, left) + 'px';
  tooltipEl.style.top  = Math.max(pad, top)  + 'px';
}

function hideTooltip() {
  tooltipEl.classList.remove('visible');
}

function getTitleText(el) {
  let cur = el;
  while (cur && cur !== document.body) {
    // Check both real title and our stashed data attribute
    const stashed = cur.getAttribute('data-title-stash');
    if (stashed) return stashed;
    const t = cur.getAttribute('title');
    if (t) return t;
    cur = cur.parentElement;
  }
  return null;
}

// Track which element we stripped title from so we can restore it
let strippedEl = null;
let strippedTitle = '';

function getTitleEl(el) {
  let cur = el;
  while (cur && cur !== document.body) {
    if (cur.hasAttribute('title') && cur.getAttribute('title')) return cur;
    cur = cur.parentElement;
  }
  return null;
}

// Desktop: hover
document.addEventListener('mouseover', e => {
  const el = getTitleEl(e.target);
  if (el) {
    // Strip title to prevent native tooltip overlapping
    if (strippedEl && strippedEl !== el) {
      strippedEl.setAttribute('title', strippedTitle);
    }
    strippedTitle = el.getAttribute('title');
    strippedEl = el;
    el.setAttribute('data-title-stash', strippedTitle);
    el.setAttribute('title', '');
    showTooltip(strippedTitle, e.clientX, e.clientY);
  } else {
    hideTooltip();
  }
});
document.addEventListener('mousemove', e => {
  if (tooltipEl.classList.contains('visible')) positionTooltip(e.clientX, e.clientY);
});
document.addEventListener('mouseout', e => {
  const el = getTitleEl(e.relatedTarget);
  if (!el) {
    hideTooltip();
    // Restore stripped title
    if (strippedEl) {
      strippedEl.setAttribute('title', strippedTitle);
      strippedEl.removeAttribute('data-title-stash');
      strippedEl = null;
      strippedTitle = '';
    }
  }
});

// Mobile: long-press (500ms)
document.addEventListener('touchstart', e => {
  const text = getTitleText(e.target);
  if (!text) return;
  const touch = e.touches[0];
  longPressTimer = setTimeout(() => {
    showTooltip(text, touch.clientX, touch.clientY);
    activeTooltipTarget = e.target;
  }, 500);
}, { passive: true });

document.addEventListener('touchend', () => {
  clearTimeout(longPressTimer);
  // Keep tooltip visible briefly so user can read it
  setTimeout(hideTooltip, 5000);
}, { passive: true });

document.addEventListener('touchmove', () => {
  clearTimeout(longPressTimer);
  hideTooltip();
}, { passive: true });

async function loadRaidsFromRepo() {

  raidsData.raids.forEach(normalizeRaid);
  invalidateDerived();
}

async function saveRaids() {

  try { await saveJsonToGitHub('raids.json', raidsData); }
  catch(e) { handleSaveError(e, 'raids.json'); throw e; }
}

async function loadRulesFromRepo() {

    if (d) srRules = mergeRules(d);
  } catch(e) { addError('sr-rules.json', e.message); }
}
function mergeRules(d) {
  const r = JSON.parse(JSON.stringify(DEFAULT_SR_RULES));
  if (d.perRaid != null) r.perRaid = Math.max(0, +d.perRaid || 0);
  for (const k of ['buff', 'streak', 'blp']) if (d[k]) Object.assign(r[k], d[k]);
  r.buff.threshold = Math.min(100, Math.max(0, +r.buff.threshold || 0));
  r.streak.every   = Math.max(1, Math.round(+r.streak.every || 1));
  r.blp.step       = Math.max(0, +r.blp.step || 0);
  return r;
}
async function saveRules() {
  invalidateDerived();
  try { await saveJsonToGitHub('sr-rules.json', srRules); }
  catch(e) { handleSaveError(e, 'sr-rules.json'); throw e; }
}

async function loadGlossaryFromRepo() {
  try {
    const d = await fetchFromWorker('glossary.json');
    if (d && d.raids && d.items) glossary = d;
    else {
      // One-time migration from the v1 per-boss-array format (wf/loot-glossary.json)
      const old = await fetchFromWorker('loot-glossary.json');
      if (old && old.raids && Object.keys(old.raids).length) {
        glossary = { raids: {}, items: {}, imported: {} };
        for (const [raid, bosses] of Object.entries(old.raids)) {
          glossary.raids[raid] = {};
          for (const [boss, list] of Object.entries(bosses || {})) {
            glossary.raids[raid][boss] = [];
            for (const e of list || []) {
              const key = itemKeyFor(e.wowheadId, e.item);
              glossary.items[key] ||= { name: e.item, wowheadId: e.wowheadId || null, eligibleClasses: e.eligibleClasses || [], icon: e.icon || null, notes: e.notes || '' };
              if (!glossary.raids[raid][boss].includes(key)) glossary.raids[raid][boss].push(key);
            }
          }
        }
        console.log('Migrated wf/loot-glossary.json → glossary v2 (saved on next edit).');
      }
    }
  } catch(e) { addError('glossary.json', e.message); }
  glossary.raids ||= {}; glossary.items ||= {}; glossary.imported ||= {};
  rebuildItemIcons();
}
async function saveGlossary() {
  rebuildItemIcons();
  try { await saveJsonToGitHub('glossary.json', glossary); }
  catch(e) { handleSaveError(e, 'glossary.json'); throw e; }
}

// ═════════════════════════════════════════════════════════════════════════════
// Glossary model — item identity is the Wowhead ID when known ("id:17063"),
// otherwise the normalised name ("n:fieryheart"). Softres reserves are Wowhead IDs,
// so imported items and reserves line up automatically. Items are boss-agnostic:
// one item record, listed under every boss that drops it.
// ═════════════════════════════════════════════════════════════════════════════

}

  return glossary.items[key]?.name || fallback || (key?.startsWith('id:') ? 'Item ' + key.slice(3) : key);
}

  return glossary.items[key]?.wowheadId || (key?.startsWith('id:') ? +key.slice(3) : null);
}

  }

}

}
function eligibleClassesOf(key) { return glossary.items[key]?.eligibleClasses || []; }

// Import one softres instance (raid → bosses → items) into the glossary. Never
// overwrites a sheet item that already exists — manual class edits win. Entries a
// leader added by hand that exactly match the sheet (same Wowhead ID, or same name
// ignoring case/spacing/"the") are merged into the sheet's entries.
// Accepts softres objects ({id,name,from,roles,tags,slot,quality}) or the compact
// demo arrays ([id,name,from,roles,tags,slot,quality]).
function importInstanceToGlossary(inst) {
  const raidName = inst.name;
  // A raid typed in by hand under a slightly different spelling ("Blackwing lair") is the same raid
  const twin = Object.keys(glossary.raids).find(r => r !== raidName && _mk(r) === _mk(raidName));
  glossary.raids[raidName] ||= {};
  let touched = 0, autoMerged = 0;
  if (twin) { touched += mergeRaidInto(twin, raidName); autoMerged++; }
  const bosses = glossary.raids[raidName];
  for (const b of inst.boss_order || []) bosses[b] ||= [];
  let addedItems = 0, addedLinks = 0;
  const srBosses = new Set(inst.boss_order || []), importedKeys = [];
  for (const raw of inst.items || []) {
    const it = Array.isArray(raw)
      ? { id: raw[0], name: raw[1], from: raw[2], roles: raw[3], tags: raw[4], slot: raw[5], quality: raw[6] }
      : raw;
    if (!it.id || !it.name) continue;
    const key = itemKeyFor(it.id, it.name);
    const srClasses = (it.roles || []).filter(c => CLASSES.includes(c)).sort();
    if (!glossary.items[key]) {
      glossary.items[key] = {
        name: it.name, wowheadId: it.id, origin: 'softres',
        eligibleClasses: srClasses, srClasses,
        // 'softres' = softres' own restriction; 'auto' = filled from Wowhead armor type;
        // 'manual' = a leader clicked a class button (never auto-overwritten again)
        classesSource: srClasses.length ? 'softres' : 'pending',
        slot: it.slot || '', quality: it.quality || '', notes: '', icon: null,
      };
      addedItems++;
    } else if (isManualItem(key)) {
      // Added by hand (same Wowhead ID) before the SR sheet existed — it's the same item.
      // Adopt the sheet's name and class restriction; keep the leader's notes and hand-set classes.
      const cur = glossary.items[key];
      if (cur.name !== it.name) { cur.name = it.name; touched += renameLootRecords(key, it.name); }
      cur.origin = 'softres'; cur.srClasses = srClasses;
      if (srClasses.length && cur.classesSource !== 'manual') { cur.eligibleClasses = srClasses; cur.classesSource = 'softres'; }
      if (!cur.slot && it.slot) cur.slot = it.slot;
      if ((cur.quality == null || cur.quality === '') && it.quality) cur.quality = it.quality;
      autoMerged++;

    importedKeys.push(key);
    const from = it.from === 'Shared' && (it.tags || []).length ? it.tags : [it.from || 'Trash'];
    for (const b of from) {

      const list = (bosses[b] ||= []);
      if (!list.includes(key)) { list.push(key); addedLinks++; }

  for (const b of Object.keys(bosses)) if (!srBosses.has(b)) {

    if (t) { mergeBossInto(raidName, b, raidName, t); autoMerged++; }

  const byName = {}; for (const k of importedKeys) byName[_mk(glossary.items[k].name)] = k;
  for (const k of Object.keys(glossary.items)) {
    if (!k.startsWith('n:') || !isManualItem(k)) continue;
    const t = byName[_mk(glossary.items[k].name)];
    if (t) { touched += mergeItemInto(k, t); autoMerged++; }
  }
  // Keep "Trash" last
  if (bosses.Trash) { const t = bosses.Trash; delete bosses.Trash; bosses.Trash = t; }
  glossary.imported[inst.slug || raidName] = { name: raidName, at: new Date().toISOString(), bosses: [...srBosses] };
  return { raid: raidName, addedItems, addedLinks, autoMerged, raidsTouched: touched };

// ═════════════════════════════════════════════════════════════════════════════

// New content is often built by hand during the first raid (raid → boss → item),
// and the softres sheet only turns up later. Exact matches merge on import; near
// matches ("Razorgore" vs "Razorgore the Untamed") are suggested on the Item
// Glossary page; anything else can be merged by hand there. Merging an item moves

// Returns how many raid records changed (so the caller knows to save raids.json)

    for (const i of imp) if (nameCloseness(m, i) !== null) add({ level: 'raid', from: m, to: i, id: `raid|${m}|${i}` });

// ═════════════════════════════════════════════════════════════════════════════
// Class eligibility from Wowhead — the item tooltip carries the armor/weapon
// type ("Plate", "Shield", "Wand"…), any "Classes:" restriction, and the icon.
// Priority: manual edit  >  softres restriction  >  Wowhead "Classes:"  >  armor type.
// Only types that clearly limit who can equip them restrict anything; cloth,
// jewelry, cloaks and melee weapons stay open to every class.
// ═════════════════════════════════════════════════════════════════════════════
const TYPE_CLASSES = {
  Cloth: null,
  Leather: ['Druid','Hunter','Paladin','Rogue','Shaman','Warrior'],
  Mail:    ['Hunter','Paladin','Shaman','Warrior'],
  Plate:   ['Paladin','Warrior'],
  Shield:  ['Paladin','Shaman','Warrior'],
  Idol:    ['Druid'], Libram: ['Paladin'], Totem: ['Shaman'],
  Wand:    ['Mage','Priest','Warlock'],
  Bow: ['Hunter','Rogue','Warrior'], Gun: ['Hunter','Rogue','Warrior'], Crossbow: ['Hunter','Rogue','Warrior'],
  Thrown:  ['Rogue','Warrior'],
};
let WOWHEAD_DATA_ENV = 4; // config.json "wowhead_data_env" — 4 = Classic Era tooltips
const RECIPE_RE = /^(Pattern|Plans|Schematic|Formula|Recipe|Design|Manual|Tome):/i;

function parseWowheadTooltip(html, name) {
  // Only look at the item's own header: recipes embed the crafted item's tooltip
  // further down, which would otherwise read as "Cloth"/"Shield".
  const cut = html.indexOf('</td></tr></table><table>');
  const head = cut > 0 ? html.slice(0, cut) : html;
  const th = head.match(/<table width="100%"><tr><td>([^<]*)<\/td><th>(.*?)<\/th>/);
  const type = RECIPE_RE.test(name || '') ? '' : (th ? th[2].replace(/<[^>]+>/g, '').trim() : '');
  const slot = th ? th[1].trim() : '';
  const text = head.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
  const cm = text.match(/Classes:\s*([A-Za-z ,]+?)(?=\s+(?:Requires|Equip:|Use:|Chance|Durability|Set:|\d)|$)/);
  const classes = cm ? cm[1].split(',').map(c => c.trim()).filter(c => CLASSES.includes(c)) : [];
  return { type, classes, slot };
}

async function fetchWowheadItem(id) {
  const url = `https://nether.wowhead.com/tooltip/item/${id}?dataEnv=${WOWHEAD_DATA_ENV}&locale=0`;
  let res;
  try { res = await fetch(url); } catch(_) { res = null; }
  if (!res || !res.ok) res = await fetch(corsProxyUrl(url)); // fallback if Wowhead ever drops CORS
  if (!res.ok) throw new Error(`Wowhead ${id}: HTTP ${res.status}`);
  const j = await res.json();
  const parsed = parseWowheadTooltip(j.tooltip || '', j.name);
  return { type: parsed.type, classes: parsed.classes, slot: parsed.slot, icon: j.icon || null, name: j.name || '', quality: j.quality ?? null };
}

// Apply Wowhead facts to a glossary item. Returns true if anything changed.
function applyWowheadInfo(key, info) {
  const it = glossary.items[key]; if (!it) return false;
  const before = JSON.stringify(it);
  it.armorType = info.type || '';
  if (info.icon && !it.icon) it.icon = info.icon;
  // Items added by Wowhead ID alone start as "Item 12345" — fill in the real name, slot and quality
  if (info.name && (!it.name || /^Item \d+$/.test(it.name))) it.name = info.name;
  if (info.slot && !it.slot) it.slot = info.slot;
  if (info.quality != null && (it.quality == null || it.quality === '')) it.quality = info.quality;
  it.whCheckedAt = new Date().toISOString();
  if (it.classesSource !== 'manual' && !(it.srClasses || []).length) {
    const byType = TYPE_CLASSES[info.type] || null;
    it.eligibleClasses = info.classes.length ? [...info.classes].sort() : byType ? [...byType] : [];
    it.classesSource = 'auto';
  }
  return JSON.stringify(it) !== before;

// Enrich items that haven't been checked yet (or all non-manual ones with force).
async function enrichGlossaryItems(keys, { force = false, onProgress } = {}) {
  const todo = (keys || Object.keys(glossary.items)).filter(k => {
    const it = glossary.items[k];
    return it?.wowheadId && (force || !it.whCheckedAt);
  });
  let done = 0, changed = 0, failed = 0;
  const worker = async k => {
    try { if (applyWowheadInfo(k, await fetchWowheadItem(glossary.items[k].wowheadId))) changed++; }
    catch(e) { failed++; console.warn(e.message); }
    onProgress?.(++done, todo.length);
  };
  await runWithConcurrency(todo, 6, worker);
  rebuildItemIcons();
  return { checked: todo.length, changed, failed };
}

// ═════════════════════════════════════════════════════════════════════════════
// Raids
// ═════════════════════════════════════════════════════════════════════════════

  return [...raidsData.raids].sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || '').localeCompare(b.createdAt || ''));
}
function getRaid(idOrDate) {
  return raidsData.raids.find(r => r.id === idOrDate) || raidsData.raids.find(r => r.date === idOrDate) || null;
}

// edits[charKey] = { name, items:[wowheadIds] } replaces that character's list
// (an empty list removes them); characters only in edits are manual additions.
// ── Name matching ─────────────────────────────────────────────
// WoW Forever names are "First Last". Softres (and CLA) names may be the first name,
// the last name, or both — accent-insensitive. We match the full name first, then a

    if (out[k]) { out[k].items.push(...(r.items || [])); out[k].synced.push(...(r.items || [])); continue; } // "Kael" + "Kael Brightblade"
    out[k] = { key: k, name: r.name, items: [...(r.items || [])], spec: r.spec, edited: false, synced: [...(r.items || [])] };
  }
  for (const [k, e] of Object.entries(sheet.edits || {})) {
    out[k] = { key: k, name: e.name || out[k]?.name || k, items: [...(e.items || [])], spec: out[k]?.spec, edited: true, synced: out[k]?.synced || [] };
  }
  for (const k of Object.keys(out)) if (!out[k].items.length && out[k].edited && !out[k].synced.length) delete out[k];
  return out;
}
// { playerKey: { itemKey: count } } across every sheet on the raid
function raidReserves(raid) {
  const m = {};
  for (const s of raid.softres) {
    for (const r of Object.values(effectiveReserves(s))) {
      const pm = (m[r.key] ||= {});
      for (const id of r.items) { const k = itemKeyFor(id); pm[k] = (pm[k] || 0) + 1; }
    }
  }
  return m;
}
function reservedCount(raid, key) {
  return Object.values(raidReserves(raid)[key] || {}).reduce((a, b) => a + b, 0);
}
function reserveLimitOf(raid) {
  const lims = raid.softres.map(s => s.reserveLimit).filter(Boolean);
  return lims.length ? lims.reduce((a, b) => a + b, 0) : null;
}

// ═════════════════════════════════════════════════════════════════════════════
// Attendance — one answer per raid per raider, with where it came from:
//   1. manual override                         (source: 'manual')
//   2. CLA presence, once a CLA is attached    (source: 'cla')
//   3. active raid → every active raider       (source: 'assumed')
//   4. past raid, no CLA and no manual input   (source: 'softres': anyone who reserved)
//      past raid, no CLA, some manual input    (source: 'manual': unlisted = absent)
// ═════════════════════════════════════════════════════════════════════════════
function raidClaSet(raid) {
  const live = raid.claLabel ? claPlayersByLabel[raid.claLabel] : null;
  const src = live && live.size ? [...live] : raid.attendance.cla;
  if (!src.length) return null;
  return new Set(src.map(k => resolveRosterKey(canonicalNames[k] || k))); // CLA names may be first or last name only
}

function isActiveRaiderFor(key, raid) {
  const p = rosterPlayer(key);
  if (!p) return false;
  const before = pastRaids().filter(r => r.date < raid.date && !r.optional && (!p.addedAt || r.date >= p.addedAt));
  let missed = 0;
  for (let i = before.length - 1; i >= 0; i--) {
    if (attendanceOf(before[i], key).present) break;
    missed++;
  }
  return missed <= 2;
}

const _attMemo = new Map();
function attendanceOf(raid, key) {
  const mk = raid.id + '|' + key;
  if (_attMemo.has(mk)) return _attMemo.get(mk);
  let res;
  const ov = raid.attendance.overrides[key];
  if (ov !== undefined) res = { present: !!ov, source: 'manual' };
  else {
    const cla = raidClaSet(raid);
    if (cla) res = { present: cla.has(key), source: 'cla' };
    else if (raid.status === 'active') res = { present: isActiveRaiderFor(key, raid), source: 'assumed' };
    else if (Object.keys(raid.attendance.overrides).length) res = { present: false, source: 'manual' };
    else res = { present: reservedCount(raid, key) > 0, source: 'softres' };
  }
  _attMemo.set(mk, res);
  return res;
}

// ═════════════════════════════════════════════════════════════════════════════
// SR ledger — recomputed from scratch, chronologically, per raider.
//   Earned per attended raid: perRaid
//     + 1 on every Nth consecutive attended raid (streak; optional raids never break it)
//     + 1 if that raid's buff score ≥ threshold (only once the CLA is in)
//   Spent: 1 per reserve placed on a raid they attended (won or not).
//   Past raids can never spend below 0 — a reserve beyond the balance at the time
//   (e.g. after a rules change) is recorded as "over" and forgiven. Active raids are
//   NOT capped, so over-reserving shows as a negative balance and gets flagged.
//   Manual adjustments apply on their date (before that day's raid) and floor at 0.
// ═════════════════════════════════════════════════════════════════════════════
let _derived = null;
function invalidateDerived() { _derived = null; _attMemo.clear(); _nameIndex = null; }

function buffScoreFor(playerName, date) {
  const v = rawBuffScoresByDate(playerName)[date];
  return v === undefined || v === null ? null : Math.round(v);
}

function computeSrLedger() {
  const raids = sortedRaids();
  const out = {};
  for (const p of rosterData.players) {
    const key = normalizeName(p.name);
    const adj = [...(p.srAdjustments || [])].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    let bal = 0, streak = 0, ai = 0;
    const events = [];
    const applyAdj = a => {
      const before = bal;
      bal = Math.max(0, bal + (Number(a.delta) || 0));
      events.push({ type: 'adjust', date: a.date, delta: a.delta, applied: bal - before, note: a.note, balance: bal });
    };
    for (const r of raids) {
      while (ai < adj.length && (adj[ai].date || '') <= r.date) applyAdj(adj[ai++]);
      const att = attendanceOf(r, key);
      let base = 0, streakBonus = 0, buffBonus = 0, buffScore = null;
      if (att.present) {
        base = srRules.perRaid;
        streak++;
        if (srRules.streak.enabled && streak % srRules.streak.every === 0) streakBonus = 1;
        if (r.status === 'past') {
          buffScore = buffScoreFor(p.name, r.date);
          if (srRules.buff.enabled && buffScore !== null && buffScore >= srRules.buff.threshold) buffBonus = 1;
        }
      } else if (!r.optional) {
        streak = 0;
      }
      bal += base + streakBonus + buffBonus;
      const reserved = reservedCount(r, key);
      let spent = 0, over = 0;
      if (att.present && reserved) {
        if (r.status === 'past') { spent = Math.min(reserved, bal); over = reserved - spent; bal -= spent; }
        else { spent = reserved; over = Math.max(0, reserved - bal); bal -= reserved; }
      }
      events.push({ type: 'raid', raidId: r.id, date: r.date, name: r.name, status: r.status, optional: r.optional,
        present: att.present, source: att.source, base, streakBonus, buffBonus, buffScore, streak,
        reserved, spent, over, balance: bal });
    }
    while (ai < adj.length) applyAdj(adj[ai++]);
    const every = srRules.streak.every;
    out[key] = { key, name: p.name, available: bal, streak, events,
      nextStreakIn: srRules.streak.enabled ? every - (streak % every) : null,
      activeOver: events.filter(e => e.type === 'raid' && e.status === 'active' && e.over > 0) };
  }
  return out;
}

// ═════════════════════════════════════════════════════════════════════════════
// Bad luck protection — per raider, per item (boss/raid agnostic).
// A loss: raider reserved the item on a raid they attended, it was awarded to
// someone else that raid, and they didn't also get one. Winning it resets to 0.
// Roll = 1–(100 + losses × step).
// ═════════════════════════════════════════════════════════════════════════════
function computeBlp() {
  const losses = {};          // player -> item -> current count
  const before = {};          // raidId -> player -> item -> count going into that raid
  const outcome = {};         // raidId -> player -> item -> 'won' | 'lost' | 'nodrop' | 'absent'
  for (const r of sortedRaids()) {
    const res = raidReserves(r);
    const winners = {};
    for (const l of r.loot) (winners[l.itemKey] ||= new Set()).add(normalizeName(l.recipient));
    before[r.id] = {}; outcome[r.id] = {};
    for (const [pk, items] of Object.entries(res)) {
      before[r.id][pk] = {}; outcome[r.id][pk] = {};
      for (const ik of Object.keys(items)) before[r.id][pk][ik] = losses[pk]?.[ik] || 0;
    }
    for (const [pk, items] of Object.entries(res)) {
      const present = attendanceOf(r, pk).present;
      for (const ik of Object.keys(items)) {
        const w = winners[ik];
        if (!present) { outcome[r.id][pk][ik] = 'absent'; continue; }
        if (w?.has(pk)) { outcome[r.id][pk][ik] = 'won'; }
        else if (w && w.size) { (losses[pk] ||= {})[ik] = (losses[pk][ik] || 0) + 1; outcome[r.id][pk][ik] = 'lost'; }
        else outcome[r.id][pk][ik] = 'nodrop';
      }
    }
    for (const [ik, set] of Object.entries(winners)) for (const pk of set) if (losses[pk]) losses[pk][ik] = 0;
  }
  return { losses, before, outcome };
}

function derived() {
  if (!_derived) _derived = { ledger: computeSrLedger(), blp: computeBlp() };
  return _derived;
}
function srStats(playerName) {
  return derived().ledger[normalizeName(playerName)] || { available: 0, events: [], streak: 0, activeOver: [] };
}
function blpLossesBefore(raidId, playerKey, itemKey) {
  return derived().blp.before[raidId]?.[playerKey]?.[itemKey] || 0;
}
function rollMax(losses) {
  return 100 + (srRules.blp.enabled ? losses * srRules.blp.step : 0);
}

// ═════════════════════════════════════════════════════════════════════════════
// Softres.it — fetched through the Worker's /proxy (softres.it must be on its
// allow-list). The raid page is server-rendered with an Inertia `data-page` JSON
// blob that carries both the reserves and the full item table for each instance,
// so one request gives us everything. We keep a copy; softres is never the
// permanent source of truth.
// ═════════════════════════════════════════════════════════════════════════════
function softresCodeFromUrl(u) {
  const s = String(u || '').trim();
  const m = s.match(/softres\.it\/(?:raid\/)?([A-Za-z0-9]{4,})/) || s.match(/^([A-Za-z0-9]{4,})$/);
  return m ? m[1] : null;
}

async function fetchSoftresRaid(code) {
  const target = `https://softres.it/raid/${encodeURIComponent(code)}`;
  const res = await fetch(corsProxyUrl(target), { cache: 'no-store' });
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.clone().json()).error || ''; } catch(_) {}
    throw new Error(`softres fetch failed (HTTP ${res.status}${detail ? ': ' + detail : ''})` +
      (res.status === 403 ? ' — add softres.it to the Worker proxy allow-list' : ''));
  }
  const html = await res.text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const el = doc.querySelector('[data-page]');
  if (!el) throw new Error('softres page had no data-page blob — the site may have changed or the code is wrong');
  const page = JSON.parse(el.getAttribute('data-page'));
  const raid = page?.props?.raid;
  if (!raid || !Array.isArray(raid.reserves)) throw new Error('softres data had no raid/reserves — check the link');
  return raid;
}

// Copy softres data onto a sheet. Returns { changed, imported:[...] }.
function applySoftresData(sheet, raid) {
  const before = JSON.stringify(sheet.reserves);
  sheet.instances = (raid.instances || []).map(i => ({ id: i.id, slug: i.slug, name: i.name }));
  sheet.reserveLimit = raid.reserve_limit ?? null;
  sheet.locked = !!raid.locked;
  sheet.hidden = !!raid.hide_reserves;
  sheet.reserves = (raid.reserves || []).map(r => ({ name: r.name, spec: r.spec ?? null, items: [...(r.items || [])], note: r.note || '' }));
  sheet.syncedAt = new Date().toISOString();
  sheet.syncError = null;
  const imported = [];
  for (const inst of raid.instances || []) {
    if (inst.items?.length && !glossary.imported[inst.slug || inst.name]) imported.push(importInstanceToGlossary(inst));
  }
  return { changed: before !== JSON.stringify(sheet.reserves), imported };
}

async function syncSoftresSheet(raid, sheet) {
  if (sheet.demo) return { changed: false, imported: [], skipped: 'demo' };
  try {
    const data = await fetchSoftresRaid(sheet.code);
    const r = applySoftresData(sheet, data);
    return r;
  } catch(e) {
    sheet.syncError = e.message;
    sheet.syncErrorAt = new Date().toISOString();
    throw e;
  }
}

// Called on load by write-token holders, and by the "Refresh" buttons.
async function syncSoftres(raids, { quiet = false } = {}) {
  let changed = false, imported = [], errors = [];
  for (const raid of raids) {
    for (const sheet of raid.softres) {
      const hadError = sheet.syncError || null;
      const neverSynced = !sheet.syncedAt;
      try {
        const r = await syncSoftresSheet(raid, sheet);
        // Only write when something meaningful changed — a bare "synced at" bump on
        // every officer's page load would just churn versions and invite conflicts.
        changed ||= r.changed || !!hadError || (neverSynced && !r.skipped);
        imported.push(...(r.imported || []));
      } catch(e) {
        errors.push(`${raid.name} / ${sheet.code}: ${e.message}`);
        if (hadError !== sheet.syncError) changed = true;
      }
    }
  }
  if (imported.some(r => r.raidsTouched)) changed = true; // hand-made items merged → loot records moved
  if (imported.length) {
    setStatus('Checking item types on Wowhead…', 'loading');
    await enrichGlossaryItems(null).catch(e => console.warn('Wowhead enrichment failed:', e.message));
    await saveGlossary().catch(() => {});
  }
  if (changed && writeToken) await saveRaids().catch(() => {});
  invalidateDerived();
  if (errors.length && !quiet) errors.forEach(e => addError('softres', e));
  if (imported.length && writeToken) {
    const merged = imported.reduce((a, r) => a + (r.autoMerged || 0), 0), sugg = glossaryMergeSuggestions().length;
    if (merged || sugg) setStatus(`SR sheet imported${merged ? ` · ${merged} hand-added entr${merged === 1 ? 'y' : 'ies'} merged` : ''}${sugg ? ` · ${sugg} possible match${sugg === 1 ? '' : 'es'} to review in the Item Glossary` : ''}`, 'success');
  }
  return { changed, imported, errors };
}

function escHtml(s) {

function refreshWowhead(delay = 200) {

function itemLinkHtml(key, fallbackName) {

function fmtDate(iso) {

  if (s < 3600) return Math.round(s / 60) + ' min ago';

// ═════════════════════════════════════════════════════════════════════════════
// Guild Overview
// ═════════════════════════════════════════════════════════════════════════════
// Attendance % over PAST raids. Missing an optional raid doesn't count against you;
// attending one does count for you.
function buildRenderData() {
  // Optional raids are left out of the overview entirely (no dot, not in #, not in %).
  // They still count for SRs and streaks — see the SR ledger.
  const raids = pastRaids().filter(r => !r.optional);
  const dates = raids.map(r => r.label);
  const n = raids.length;
  const roleMap = {};
  for (const p of rosterData.players) {
    if (!p.role || rosterData.excluded?.includes(p.name)) continue;
    const key = normalizeName(p.name);
    const flags = raids.map(r => attendanceOf(r, key).present);
    const trueIdx = flags.map((b, i) => b ? i : -1).filter(i => i >= 0);
    let rec;
    if (!trueIdx.length) rec = { name: p.name, attended: 0, window: 0, pct: null, flags, n, inactive: false };
    else {
      const first = trueIdx[0], last = trueIdx[trueIdx.length - 1];
      const missedAfter = raids.slice(last + 1).filter(r => !r.optional).length;
      const inactive = missedAfter > 2;
      const end = inactive ? last : n - 1;
      let window = 0, attended = 0;
      for (let i = first; i <= end; i++) {
        if (flags[i]) { attended++; window++; }
        else if (!raids[i].optional) window++;
      }
      rec = { name: p.name, attended, window, pct: window ? attended / window * 100 : null, flags, n, first, last, inactive };
    }
    (roleMap[p.role] ||= []).push(rec);
  }
  return { dates, raids, roles: ROLE_ORDER.filter(r => roleMap[r]).map(r => ({ name: r, players: roleMap[r] })) };
}

// Buff score = the CLA's raw per-raid total. (The LC dashboard's weapon-oil exemptions and
// outlier smoothing were TBC-specific and are not used here.)
function rawBuffScoresByDate(playerName) {
  const out = {};
  for (const [d, v] of Object.entries(buffScoreByPlayerDate[normalizeName(playerName)] || {})) if (v && v.total !== null && v.total !== undefined) out[d] = v.total;
  return out;
}
// Green at/above the buff-bonus threshold, then yellow → orange → red the further below.
function buffColor(pct) {
  const t = srRules.buff.threshold;
  if (pct >= t) return C1;
  if (pct >= t - 10) return C3;
  if (pct >= t - 25) return C4;
  return C5;
}
function buffDotHtml(playerName, date, label) {
  const v = rawBuffScoresByDate(playerName)[date];
  if (v === undefined) return `<div class="raid-dot present" title="${label}: Present"></div>`;
  const pct = Math.round(v), col = buffColor(pct);
  const tip = `${label}: Present | Consumes ${pct}%${srRules.buff.enabled ? (pct >= srRules.buff.threshold ? ' — earned the buff SR' : ` — below ${srRules.buff.threshold}%`) : ''}`;
  if (pct >= 100) return `<span class="raid-star" style="color:${C1};" title="${tip}">★</span>`;
  return `<div class="raid-dot present" style="background:${col};border-color:${col};" title="${tip}"></div>`;
}

function consumeAvg(playerName) {
  const s = Object.values(rawBuffScoresByDate(playerName));
  return s.length ? s.reduce((a, b) => a + b, 0) / s.length : null;
}

function getSortedPlayers(roleName, players) {
  const { col, dir } = roleSortState[roleName] || { col: 'srs', dir: 'desc' };
  const withPct = players.filter(p => p.pct !== null && !p.inactive);
  const noPct = players.filter(p => p.pct === null && !p.inactive);
  const inactive = players.filter(p => p.inactive);
  const val = p => col === 'player' ? p.name.toLowerCase()
    : col === 'srs' ? srStats(p.name).available
    : col === 'consumes' ? (consumeAvg(p.name) ?? -1)
    : col === 'pct' ? (p.pct ?? -1) : p.attended;
  const cmp = (a, b) => {
    const av = val(a), bv = val(b);
    if (av < bv) return dir === 'asc' ? -1 : 1;
    if (av > bv) return dir === 'asc' ? 1 : -1;
    return (b.pct ?? 0) - (a.pct ?? 0) || a.name.localeCompare(b.name);
  };
  return [...withPct.sort(cmp), ...noPct.sort(cmp), ...inactive.sort(cmp)];
}

function toggleRole(safeId) {

  roleSortState[roleName] = { col, dir: cur.col === col ? (cur.dir === 'desc' ? 'asc' : 'desc') : (col === 'player' ? 'asc' : 'desc') };

function gearFlagHtml(playerName) {
  const gi = latestGearIssuesByPlayer[normalizeName(playerName)];
  const issues = (gi?.issues || []).filter(i => typeof i === 'string');
  if (!issues.length) return '';
  const col = gearColor(issues.length);
  return `<span class="gear-flag" style="color:${col};filter:drop-shadow(0 0 4px ${col}88);" title="${escHtml(issues.join('\n')).replace(/\n/g, '&#10;')}">⚠</span>`;
}

function raidDotsHtml(p, raids) {
  const MAX = 10, start = Math.max(0, p.n - MAX);
  let html = '<div class="raid-dots">';
  for (let i = start; i < p.n; i++) {
    const r = raids[i];
    const label = `${r.label}${r.optional ? ' (optional)' : ''}`;
    if (p.pct === null) html += `<div class="raid-dot absent" title="${label}"></div>`;
    else if (i < p.first) html += `<div class="raid-dot inactive"></div>`;
    else if (!p.flags[i]) {
      if (p.inactive && i > p.last) html += `<div class="raid-dot inactive"></div>`;
      else html += `<div class="raid-dot absent${r.optional ? ' optional' : ''}" title="${label}: Absent${r.optional ? ' — optional, doesn\'t count' : ''}"></div>`;
    } else html += buffDotHtml(p.name, r.date, label);
  }
  return html + '</div>';
}

function srCellHtml(playerName) {
  const s = srStats(playerName);
  const last = s.events.filter(e => e.type === 'raid').slice(-1)[0];
  const lines = [];
  const earned = s.events.reduce((a, e) => a + (e.type === 'raid' ? e.base + e.streakBonus + e.buffBonus : 0), 0);
  const spent = s.events.reduce((a, e) => a + (e.type === 'raid' ? e.spent : 0), 0);
  const adj = s.events.reduce((a, e) => a + (e.type === 'adjust' ? e.applied : 0), 0);
  lines.push(`Earned ${earned} · spent ${spent}${adj ? ` · adjusted ${adj > 0 ? '+' : ''}${adj}` : ''}`);
  if (srRules.streak.enabled) lines.push(`Streak: ${s.streak} raid${s.streak === 1 ? '' : 's'} — next bonus in ${s.nextStreakIn}`);
  if (s.activeOver.length && writeToken) lines.push(`⚠ Over-reserved on ${s.activeOver.map(e => e.name).join(', ')}`);
  const over = s.activeOver.length > 0 && !!writeToken; // over-reservation flags are officer-only
  const col = over ? C5 : s.available <= 0 ? 'var(--text-dim)' : 'var(--gold-light)';
  return `<span class="priority-score${over ? ' sr-over' : ''}" style="color:${col};" title="${escHtml(lines.join('\n')).replace(/\n/g, '&#10;')}">${over ? '⚠ ' : ''}${s.available}</span>`;
}

function consumesCellHtml(playerName) {
  const avg = consumeAvg(playerName);
  if (avg === null) return '<span style="color:var(--text-dim);font-style:italic;font-size:13px;">—</span>';
  const r = Math.round(avg);
  return `<span style="font-family:'Cinzel',serif;font-size:13px;font-weight:700;color:${buffColor(r)};">${r}%</span>`;
}

function playerRowHtml(p, raids, opts = {}) {
  const cls = pctClass(p.pct);
  const pctStr = p.pct !== null ? (p.pct % 1 === 0 ? p.pct.toFixed(0) : p.pct.toFixed(1)) + '%' : 'N/A';
  const badge = opts.badge ? `<span style="font-size:11px;opacity:0.8;" title="${opts.badgeTitle || ''}">${opts.badge}</span> ` : '';
  const roleIcon = opts.showRole ? ` <span class="role-icon" title="${playerRoleName(p.name)}">${playerRoleIcon(p.name)}</span>` : '';
  const action = opts.action ? `<td style="text-align:right;white-space:nowrap;">${opts.action}</td>` : (opts.actionCol ? '<td></td>' : '');
  return `<tr class="${p.pct === null ? 'na-row' : ''}${p.inactive ? ' inactive-row' : ''}" style="${opts.dimmed ? 'opacity:0.4;' : ''}">
    <td class="player-name" onclick="toggleLoot(this, '${jsAttr(p.name)}')" style="cursor:pointer;" title="Click for loot & SR history"><span class="loot-arrow">▸</span> ${badge}${playerNameHtml(p.name)}${roleIcon}</td>
    ${opts.current !== undefined ? `<td class="current-gear">${opts.current}</td>` : ''}
    <td class="gear-flag-cell">${gearFlagHtml(p.name)}</td>
    <td class="priority-cell">${srCellHtml(p.name)}</td>
    <td class="consumes-cell">${consumesCellHtml(p.name)}</td>
    <td>${raidDotsHtml(p, raids)}</td>
    <td class="att-count">${p.attended}</td>
    <td><div class="att-cell">
      <div class="att-bar-bg"><div class="att-bar-fill ${cls}" style="width:${p.pct ?? 0}%"></div></div>
      <span class="att-pct ${cls}">${hasPerfectAttendance(p) ? `<span class="att-star" title="Perfect attendance — ${p.attended} raids">★</span>` : pctStr}</span>
    </div></td>
    ${action}
  </tr>`;
}

function tableColgroup(withAction, withCurrent) {
  if (withAction) // compact variant for the Loot tab (has Current + Award columns)
    return `<colgroup><col style="width:22ch;">${withCurrent ? '<col style="width:20ch;">' : ''}<col style="width:20px;"><col style="width:72px;"><col style="width:72px;"><col><col style="width:36px;"><col style="width:100px;"><col style="width:74px;"></colgroup>`;
  // Guild Overview: the name column fits 25 characters plus the arrow; SR Balance and Consumes get
  // equal shares, # is narrow, Attendance has room for its full bar, and Raids takes what's left.
  // Needs table-layout: fixed — .ov-table.
  const one = '<col style="width:11.5%;">';
  return `<colgroup><col style="width:calc(28ch + 24px);"><col style="width:32px;">${one}${one}<col><col style="width:5.5%;"><col style="width:17.5%;"></colgroup>`;
}
function tableHeadHtml(th, withAction, withCurrent) {
  return `<tr>${th('Player', 'player', 'left')}${withCurrent ? '<th style="text-align:left;" title="Currently equipped in this slot, from the most recent CLA gear listing">Current</th>' : ''}<th></th>
    ${th('SR Balance', 'srs', 'center', 'Soft reserves this raider can spend right now (active raids included). Hover a value for the breakdown.')}
    ${th('Consumes', 'consumes', 'center', 'CLA consumable score. Green = at or above the buff-bonus threshold.')}
    <th style="text-align:center;" title="Last 10 past raids. Colour = consumable usage.">Raids</th>
    ${th('#', 'attendance')}${th('Attendance', 'pct')}${withAction ? '<th></th>' : ''}</tr>`;
}

function render(data) {
  const out = document.getElementById('output');
  if (!out) return;
  const { dates = [], roles = [], raids = [] } = data || {};
  if (!roles.length) {
    out.innerHTML = `<div class="empty"><div class="icon">⚔</div><div>No raiders yet.</div>
      <div style="margin-top:10px;font-size:14px;">Add raiders under <em>Management → Roster</em>, then start a raid from <em>Raids</em>.</div></div>`;
    return;
  }
  const allActive = roles.flatMap(r => r.players).filter(p => p.pct !== null && !p.inactive);
  let wS = 0, wT = 0;
  allActive.forEach(p => { const a = consumeAvg(p.name); if (a !== null) { wS += a * p.attended; wT += p.attended; } });
  const avgPct = allActive.length ? allActive.reduce((s, p) => s + p.pct, 0) / allActive.length : 0;
  const totalSr = roles.flatMap(r => r.players).reduce((s, p) => s + Math.max(0, srStats(p.name).available), 0);
  const act = activeRaids();

  let html = '';
  if (act.length) {
    html += `<div class="active-raid-strip">${act.map(r => `<a class="active-raid-pill" onclick="openRaid('${r.id}')">
      <span class="live-dot"></span> ACTIVE: ${escHtml(r.name)} <span style="opacity:0.7;">· ${r.label}</span></a>`).join('')}</div>`;
  }
  for (const role of roles) {
    const safe = role.name.replace(/\s+/g, '-');
    const state = roleSortState[role.name] || { col: 'srs', dir: 'desc' };
    const sorted = getSortedPlayers(role.name, role.players);
    const th = (label, col, align = 'center', title = '') =>
      `<th data-col="${col}" onclick="setSort('${safe}', '${jsAttr(role.name)}', '${col}')" style="cursor:pointer;text-align:${align};" title="${title}">${label}<span class="sort-arrow">${state.col === col ? (state.dir === 'desc' ? ' ▾' : ' ▴') : ' ⬦'}</span></th>`;
    html += `<div class="role-section">
      <div class="role-header" onclick="toggleRole('${safe}')" style="cursor:pointer;">
        <span class="role-title">${ROLE_ICONS[role.name] ? ROLE_ICONS[role.name] + ' ' : ''}${ROLE_DISPLAY_NAMES[role.name] || role.name}</span>
        <div class="role-line"></div>
        <span class="role-count">${sorted.filter(p => p.pct !== null && !p.inactive).length} active <span class="role-toggle" id="roletoggle-${safe}">▾</span></span>
      </div>
      <div class="role-body" id="rolebody-${safe}"><table class="ov-table">${tableColgroup()}<thead>${tableHeadHtml(th)}</thead>
      <tbody>${sorted.map(p => playerRowHtml(p, raids)).join('')}</tbody></table></div></div>`;
  }
  html += `<div class="summary">
    <div class="summary-item"><label>Raiders</label><div class="val">${roles.flatMap(r => r.players).length}</div></div>
    <div class="summary-item"><label>Active Raiders</label><div class="val">${allActive.length}</div></div>
    <div class="summary-item"><label>Avg Attendance</label><div class="val">${avgPct.toFixed(1)}%</div></div>
    <div class="summary-item"><label>Avg Consumes</label><div class="val">${wT ? (wS / wT).toFixed(1) + '%' : '—'}</div></div>
    <div class="summary-item"><label>SR Balance</label><div class="val">${totalSr}</div></div>
  </div>`;
  out.innerHTML = html;
  refreshWowhead();
}

// ═════════════════════════════════════════════════════════════════════════════
// Raider dropdown — loot received, SR history (with BLP), ledger, adjustments
// ═════════════════════════════════════════════════════════════════════════════
function lootReceived(key) {
  const out = [];
  for (const r of sortedRaids()) for (const l of r.loot) if (normalizeName(l.recipient) === key) out.push({ ...l, raid: r });
  return out.reverse();
}

function srHistory(key) {
  const { outcome, before } = derived().blp;
  const rows = [];
  for (const r of sortedRaids()) {
    const items = raidReserves(r)[key];
    if (!items) continue;
    for (const [ik, count] of Object.entries(items)) {
      rows.push({ raid: r, itemKey: ik, count, outcome: outcome[r.id]?.[key]?.[ik] || (r.status === 'active' ? 'pending' : 'nodrop'),
        losses: before[r.id]?.[key]?.[ik] || 0 });
    }
  }
  return rows.reverse();
}

function lootChipHtml(l) {
  const col = l.sr ? C5 : C1;
  const tip = l.sr ? 'SR' : 'MS > OS';
  return `<span class="loot-item" style="border-color:${col};background:${col}18;" title="${escHtml(tip)}">${itemLinkHtml(l.itemKey, l.name)}</span>`;
}

const OUTCOME_LABEL = {
  won: ['Won', C1], lost: ['Lost roll', C5], nodrop: ['Didn\'t drop', 'var(--text-dim)'],
  absent: ['Absent', 'var(--text-dim)'], pending: ['Active', 'var(--gold)'],
};

function raiderRaidListHtml(key, s, hist, loot) {
  const histByRaid = {}; for (const x of hist) (histByRaid[x.raid.id] ||= []).push(x);
  const lootByRaid = {}; for (const l of loot) (lootByRaid[l.raid.id] ||= []).push(l);
  const rows = s.events.slice().reverse().filter(e => e.type === 'adjust' || e.present || histByRaid[e.raidId]?.length);
  if (!rows.length) return '<em class="no-loot">No raids yet</em>';
  return `<div class="raid-acc-list">${rows.map(e => {
    if (e.type === 'adjust') return `<div class="raid-acc adj"><span class="acc-date">${e.date ? fmtShort(e.date) : ''}</span>
      <span class="acc-name">Adjustment <span style="color:var(--text-dim);">— ${escHtml(e.note || '')}</span></span>
      <span class="acc-sum"><span style="color:${e.applied >= 0 ? C1 : C5};">${e.applied > 0 ? '+' : ''}${e.applied}</span>${e.applied !== e.delta ? ` <span style="color:var(--text-dim);">(of ${e.delta}, floored at 0)</span>` : ''}</span></div>`;
    const earned = e.base + e.streakBonus + e.buffBonus;
    const res = histByRaid[e.raidId] || [], won = lootByRaid[e.raidId] || [];
    const results = res.map(x => x.outcome);
    const icons = [results.includes('won') ? '<span title="Won an SR item" style="color:' + C1 + ';">✓</span>' : '',
                   results.includes('lost') ? '<span title="Lost an SR roll" style="color:' + C5 + ';">✗</span>' : ''].join('');
    const parts = [];
    if (e.present) parts.push(`<span style="color:${C1};">+${earned} SR${earned === 1 ? '' : 's'}</span>`);
    else parts.push('<span style="color:var(--text-dim);">absent</span>');
    if (e.spent) parts.push(`${e.spent} spent`);
    if (e.over) parts.push(`<span style="color:${C5};">${e.over} over</span>`);
    if (won.length) parts.push(`${won.length} loot`);
    const summary = parts.join(' · ') + (icons ? ' ' + icons : '');
    const detail = `
      <div class="acc-body">
        <div class="acc-line"><span class="acc-k">SRs earned</span><span>${e.present
          ? `+${earned} ${['attendance', e.buffBonus && 'consumes', e.streakBonus && 'streak'].filter(Boolean).join(', ')}`
          : 'none — not present'}</span></div>
        <div class="acc-line"><span class="acc-k">SRs used</span><span>${e.reserved ? `${e.reserved}${e.present ? '' : ' (not charged — absent)'}${e.over ? ` · <span style="color:${C5};">${e.status === 'active' ? `${e.over} more than available` : `${e.over} forgiven (balance can't go below 0)`}</span>` : ''}` : 'none'}</span></div>
        ${res.length ? `<div class="acc-line"><span class="acc-k">Reserves</span><span class="acc-res">${res.map(x => {
            const [lab, col] = OUTCOME_LABEL[x.outcome] || [x.outcome, 'var(--text-dim)'];
            const rm = rollMax(x.losses);
            return `<span class="acc-item">${itemLinkHtml(x.itemKey)}${x.count > 1 ? ` <span class="sr-multi">×${x.count}</span>` : ''} <span class="${rm > 100 ? 'blp-boost' : ''}" style="font-size:12px;" title="${x.losses ? `Lost ${x.losses}× before this raid` : ''}">1–${rm}</span> <span style="color:${col};font-size:12px;">${lab}</span></span>`;
          }).join('')}</span></div>` : ''}
        ${won.length ? `<div class="acc-line"><span class="acc-k">Loot</span><span class="loot-list">${won.map(lootChipHtml).join('')}</span></div>` : ''}
      </div>`;
    return `<details class="raid-acc"><summary><span class="acc-date">${fmtShort(e.date)}</span>
      <span class="acc-name">${escHtml(e.name)}${e.optional ? ' <span class="tag-opt">optional</span>' : ''}${e.status === 'active' ? ' <span class="tag-active">active</span>' : ''}</span>
      <span class="acc-sum">${summary}</span></summary>${detail}</details>`;
  }).join('')}</div>`;
}

// ── Currently equipped gear (from the most recent CLA gear listing) ──
const GEAR_SLOT_MAP = {
  Head: ['Head'], Neck: ['Neck'], Shoulder: ['Shoulders'], Shoulders: ['Shoulders'], Back: ['Cloak'], Chest: ['Chest'],
  Wrist: ['Bracers'], Hands: ['Hands'], Waist: ['Waist'], Legs: ['Legs'], Feet: ['Feet'],
  Finger: ['Ring1', 'Ring2'], Trinket: ['Trinket1', 'Trinket2'],
  'Two-Hand': ['Weapon'], 'Main Hand': ['Weapon'], 'One-Hand': ['Weapon', 'Off-Hand'],
  'Off Hand': ['Off-Hand'], Shield: ['Off-Hand'], 'Held In Off-hand': ['Off-Hand'],
  Ranged: ['Wand/Idol/Relic etc.'], Relic: ['Wand/Idol/Relic etc.'], Thrown: ['Wand/Idol/Relic etc.'],
};
function gearSlotsForItem(itemKey) { return GEAR_SLOT_MAP[getItem(itemKey)?.slot] || null; }
function currentGearHtml(playerName, slots) {
  const g = gearListingByPlayer[normalizeName(playerName)]?.slots;
  if (!g) return '<span style="color:var(--text-dim);font-style:italic;font-size:12px;">no gear data</span>';
  const names = slots.map(sl => g[sl]).filter(Boolean);
  if (!names.length) return '<span style="color:var(--text-dim);">— empty —</span>';
  return names.map(n => {
    const k = Object.keys(glossary.items).find(k => normalizeName(glossary.items[k].name) === normalizeName(n));
    return `<div class="cur-item">${k ? itemLinkHtml(k) : escHtml(n)}</div>`;
  }).join('');
}

function reopenLootRow(playerName) {
  document.querySelectorAll('.loot-row').forEach(row => {
    const nameTd = row.previousElementSibling?.querySelector('.player-name');
    if (nameTd && nameTd.textContent.includes(playerName)) {
      row.remove();
      const a = nameTd.querySelector('.loot-arrow'); if (a) a.textContent = '▸';
      setTimeout(() => nameTd.click(), 30);
    }
  });
}

function toggleLoot(td, playerName) {
  const tr = td.closest('tr');
  const arrow = td.querySelector('.loot-arrow');
  if (tr.nextElementSibling?.classList.contains('loot-row')) { tr.nextElementSibling.remove(); if (arrow) arrow.textContent = '▸'; return; }
  const key = normalizeName(playerName);
  const loot = lootReceived(key);
  const hist = srHistory(key);
  const s = srStats(playerName);
  const row = document.createElement('tr');
  row.className = 'loot-row';
  let h = `<td colspan="${tr.children.length}" class="loot-cell">`;

  const srWins = loot.filter(l => l.sr).length;
  h += `<div class="expand-section-title">Loot Received ${loot.length ? `<span style="color:var(--text-dim);letter-spacing:0.05em;">— ${loot.length} item${loot.length === 1 ? '' : 's'} · ${srWins} via SR</span>` : ''}</div>`;
  h += loot.length ? `<div class="loot-list">${loot.map(lootChipHtml).join('')}</div>` : `<em class="no-loot">No loot recorded</em>`;

  // Bad luck protection: every item this raider has lost an SR roll on and not won since
  if (srRules.blp.enabled) {
    const blp = Object.entries(derived().blp.losses[key] || {}).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1] || itemName(a[0]).localeCompare(itemName(b[0])));
    h += `<div class="expand-section-title" style="margin-top:14px;">Bad Luck Protection ${blp.length ? `<span style="color:var(--text-dim);letter-spacing:0.05em;">— ${blp.length} item${blp.length === 1 ? '' : 's'}</span>` : ''}</div>`;
    h += blp.length ? `<div class="loot-list">${blp.map(([ik, n]) => `<span class="loot-item blp-chip" title="Rolls 1–${rollMax(n)} on this item (lost ${n} SR roll${n === 1 ? '' : 's'})">${itemLinkHtml(ik)}</span>`).join('')}</div>`
      : `<em class="no-loot">No boosted rolls — every SR roll so far has been won or hasn't come up</em>`;
  }

  // Raid-by-raid history: one collapsible row per attended raid (and per adjustment).
  h += `<div class="expand-section-title" style="margin-top:14px;">Raids <span style="color:var(--text-dim);letter-spacing:0.05em;">— ${s.available} SR${s.available === 1 ? '' : 's'} available${srRules.streak.enabled && s.nextStreakIn === 1 ? ' · next raid earns the streak bonus' : ''}</span></div>`;
  h += raiderRaidListHtml(key, s, hist, loot);
  // Roster edit (Roster page only)
  if (writeToken && groupingMode === 'roster') {
    const rp = rosterPlayer(key);
    if (rp) {
      h += `<div class="expand-section-title" style="margin-top:14px;">Edit Player</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <select id="editRole_${key}" onchange="rosterEditRoleChanged('${key}')" class="roster-edit-sel">${ROLE_ORDER.map(r => `<option ${r === rp.role ? 'selected' : ''}>${r}</option>`).join('')}</select>
          <select id="editClass_${key}" class="roster-edit-sel">${(ROLE_CLASSES[rp.role] || CLASSES).map(c => `<option ${c === rp.class ? 'selected' : ''}>${c}</option>`).join('')}</select>
          <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:6px;">Alt? <input type="checkbox" id="editAlt_${key}" ${rp.isAlt ? 'checked' : ''}></label>
          <button class="small-gold-btn" onclick="rosterUpdatePlayer('${jsAttr(playerName)}', document.getElementById('editRole_${key}').value, document.getElementById('editClass_${key}').value, document.getElementById('editAlt_${key}').checked)">SAVE</button>
          <button class="ghost-btn" onclick="rosterRemovePlayer('${jsAttr(playerName)}')">Remove</button>
        </div>`;
    }
  }
  // SR adjustments
  if (writeToken) {
    const rp = rosterPlayer(key);
    h += `<div class="expand-section-title" style="margin-top:14px;">Adjust SRs</div>`;
    if (!rp) h += `<div style="font-size:12px;color:var(--text-dim);">Add this player to the roster to adjust SRs.</div>`;
    else h += `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <input type="number" id="srAdj_${key}" placeholder="±N" step="1" class="gl-input" style="max-width:80px;" onkeydown="if(event.key==='Enter')rosterAddSrAdjustment('${jsAttr(playerName)}')">
        <input type="text" id="srAdjNote_${key}" placeholder="Note (required)" class="gl-input" style="min-width:200px;" onkeydown="if(event.key==='Enter')rosterAddSrAdjustment('${jsAttr(playerName)}')">
        <button class="small-gold-btn" onclick="rosterAddSrAdjustment('${jsAttr(playerName)}')">ADJUST</button>
      </div>
      ${(rp.srAdjustments || []).length ? `<div style="margin-top:6px;font-size:12px;color:var(--text-dim);">${rp.srAdjustments.map((a, i) =>
        `<div>${a.date} · <span style="color:${a.delta > 0 ? C1 : C5};">${a.delta > 0 ? '+' : ''}${a.delta}</span> · ${escHtml(a.note || '')} <button class="x-btn" onclick="rosterRemoveSrAdjustment('${jsAttr(playerName)}', ${i})">✕</button></div>`).join('')}</div>` : ''}`;
  }
  h += `</td>`;
  row.innerHTML = h;
  tr.after(row);
  if (arrow) arrow.textContent = '▾';
  refreshWowhead();
}
function fmtShort(iso) { return formatRaidLabel(new Date(iso + 'T19:00:00Z')); }

function rosterEditRoleChanged(key) {
  const role = document.getElementById('editRole_' + key)?.value;
  const cs = document.getElementById('editClass_' + key);
  if (!cs) return;
  const cur = cs.value;
  cs.innerHTML = (ROLE_CLASSES[role] || CLASSES).map(c => `<option ${c === cur ? 'selected' : ''}>${c}</option>`).join('');
}
async function rosterUpdatePlayer(playerName, role, cls, isAlt) {
  const p = rosterPlayer(normalizeName(playerName));
  if (!p) return;
  Object.assign(p, { role, class: cls, isAlt });
  rebuildClassMap();
  await saveRosterToGitHub();
  refreshAll();
}
async function rosterAddSrAdjustment(playerName) {
  const key = normalizeName(playerName);
  const delta = parseInt(document.getElementById('srAdj_' + key)?.value, 10);
  const note = document.getElementById('srAdjNote_' + key)?.value.trim();
  if (!delta) { flash('Enter a non-zero SR adjustment, e.g. 1 or -1.', 'error'); return; }
  if (!note) { flash('Add a note so the ledger explains the adjustment.', 'error'); return; }
  const rp = rosterPlayer(key);
  if (!rp) return;
  (rp.srAdjustments ||= []).push({ date: todayMST(), delta, note });
  await saveRosterToGitHub();
  refreshAll();

function _urlSetParam(key, value) {
  const url = new URL(window.location);
  if (value) url.searchParams.set(key, value); else url.searchParams.delete(key);
  window.history.replaceState({}, '', url);
}
function _urlGetParam(key) { return new URL(window.location).searchParams.get(key) || ''; }

// Shared autocomplete (from the LC loot log): items: [{value,label}] or strings
function buildAutocomplete({ container, inputId, placeholder, items, renderOption, onSelect }) {
  const vals = items.map(i => typeof i === 'string' ? { value: i, label: i } : i);
  container.innerHTML = `<input id="${inputId}" placeholder="${placeholder}" autocomplete="off" class="gl-input" style="width:100%;" /><div id="${inputId}_drop" class="ac-drop"></div>`;
  const input = container.querySelector('#' + inputId), drop = container.querySelector('#' + inputId + '_drop');
  let active = -1;
  const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const show = f => {
    const q = strip(f);
    const m = q ? vals.filter(v => strip(v.label).includes(q)) : vals;
    if (!m.length) { drop.style.display = 'none'; return; }
    drop.innerHTML = m.slice(0, 40).map((v, i) => `<div data-i="${vals.indexOf(v)}" class="ac-opt">${renderOption ? renderOption(v) : escHtml(v.label)}</div>`).join('');
    drop.style.display = 'block'; active = -1;
  };
  const pick = i => { const v = vals[i]; input.value = v.label; input.dataset.value = v.value; drop.style.display = 'none'; onSelect?.(v); };
  input.addEventListener('input', () => { delete input.dataset.value; show(input.value); });
  input.addEventListener('focus', () => show(input.value));
  input.addEventListener('blur', () => setTimeout(() => drop.style.display = 'none', 150));
  input.addEventListener('keydown', e => {
    const opts = drop.querySelectorAll('.ac-opt');
    if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, opts.length - 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); }
    else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); pick(+opts[active].dataset.i); return; }
    else if (e.key === 'Escape') { drop.style.display = 'none'; return; }
    else return;
    opts.forEach((o, i) => o.classList.toggle('on', i === active));
  });
  drop.addEventListener('mousedown', e => { const o = e.target.closest('.ac-opt'); if (o) { e.preventDefault(); pick(+o.dataset.i); } });
  return input;
}

async function createRaid() {
  const name = document.getElementById('nrName').value.trim() || 'Raid';
  const date = document.getElementById('nrDate').value || todayMST();
  const optional = document.getElementById('nrOptional').checked;
  const link = document.getElementById('nrSoftres').value.trim();

    alert(`There's already a raid on ${fmtDate(date)} ("${existing.name}"). Attendance is counted per night, so add extra SR sheets to that raid instead.`);

  }
  let code = null;
  if (link) { code = softresCodeFromUrl(link); if (!code) { alert('That doesn\'t look like a softres.it raid link.'); return; } }
  const raid = normalizeRaid({ name, date, optional, status: 'active', createdAt: new Date().toISOString(), softres: [] });
  if (code) raid.softres.push({ id: _uid('s_'), code, url: `https://softres.it/raid/${code}`, addedAt: new Date().toISOString(), reserves: [], edits: {}, instances: [] });
  raidsData.raids.push(raid);
  await saveRaids().catch(() => {});
  if (code) { flash('Fetching softres…', 'loading'); await syncSoftres([raid]); flash(raid.softres[0].syncError ? 'Softres sync failed — see the Reserves tab' : 'Raid started', raid.softres[0].syncError ? 'error' : 'success'); }

async function saveRaidMeta(id) {

async function endRaid(id) {

  const all = Object.keys(glossary.raids);
  return [...new Set([...fromSheets, ...fromLoot, ...(raid.newContent || [])].filter(n => all.includes(n)).concat(all))];
}

function renderLootItemView(el, raid, itemKey) {
  const it = getItem(itemKey) || { name: itemName(itemKey), eligibleClasses: [] };
  const res = raidReserves(raid);
  const reservers = Object.entries(res).filter(([, m]) => m[itemKey]).map(([k, m]) => ({ key: k, count: m[itemKey] }));
  const alreadyThisRaid = new Set(raid.loot.filter(l => l.itemKey === itemKey).map(l => normalizeName(l.recipient)));
  const classes = it.eligibleClasses || [];
  const gearSlots = gearSlotsForItem(itemKey);
  const canAssign = !!writeToken;
  const assignBtn = (name, sr) => canAssign
    ? `<button class="assign-btn ${sr ? 'sr' : ''}" onclick="assignLoot('${raid.id}', '${itemKey}', '${jsAttr(name)}', ${sr})">${sr ? 'Award (SR)' : 'Award'}</button>` : '';

  // SR block
  let srHtml = '';
  if (reservers.length) {
    const rows = reservers.map(({ key, count }) => {
      const rp = rosterPlayer(key);
      const name = rp?.name || Object.values(raid.softres.map(s => effectiveReserves(s)[key]).filter(Boolean))[0]?.name || key;
      const losses = blpLossesBefore(raid.id, key, itemKey);
      const rm = rollMax(losses);
      const st = rp ? srStats(rp.name) : null;
      const ev = st?.events.find(e => e.raidId === raid.id);
      const present = attendanceOf(raid, key).present;
      const over = ev?.over > 0;
      return { key, name, count, losses, rm, present, over, ev, rp, got: alreadyThisRaid.has(key) };
    }).sort((a, b) => b.rm - a.rm || a.name.localeCompare(b.name));
    srHtml = `<div class="sr-box ${gearSlots ? 'with-cur' : ''}">
      <div class="gl-col-title">Soft reserved by ${reservers.length}</div>
      ${rows.map(r => `<div class="sr-row ${r.present ? '' : 'absent'} ${r.over ? 'over' : ''}">
        <span class="sr-name">${playerNameHtml(r.name)}${r.rp || !writeToken ? '' : ' <span class="tag-warn">not on roster</span>'}</span>
        ${r.count > 1 ? `<span class="sr-multi" title="Reserved ${r.count} times — rolls ${r.count} times">×${r.count}</span>` : '<span></span>'}
        ${gearSlots ? `<span class="sr-cur">${currentGearHtml(r.name, gearSlots)}</span>` : ''}
        <span class="sr-roll ${r.rm > 100 ? 'blp-boost' : ''}" title="${r.losses ? `Lost this item ${r.losses}× before — bad luck protection` : 'Standard roll'}">/roll ${r.rm}</span>
        <span class="sr-bal">${r.over && writeToken ? `<span class="over-chip" title="Reserved ${r.ev.reserved} SRs this raid but only had ${r.ev.reserved - r.ev.over}">⚠ OVER-RESERVED ${r.ev.reserved}/${r.ev.reserved - r.ev.over}</span>` : ''}
          ${!r.present ? '<span class="tag-warn">not marked present</span>' : ''}${r.got ? '<span class="tag-ok">✓ awarded</span>' : ''}</span>
        <span style="text-align:right;">${r.got ? '' : assignBtn(r.name, true)}</span>
      </div>`).join('')}
    </div>`;
  } else srHtml = `<div class="sr-box empty">No one soft reserved this item on this raid.</div>`;

  // Eligible by class
  const pool = lastRenderData.roles.flatMap(r => r.players);
  const eligible = pool.filter(p => {
    const cls = classMap[normalizeName(p.name)];
    return cls && (!classes.length || classes.includes(cls)) && attendanceOf(raid, normalizeName(p.name)).present;
  });
  const reserverSet = new Set(reservers.map(r => r.key));
  const others = eligible.filter(p => !reserverSet.has(normalizeName(p.name)))
    .sort((a, b) => srStats(b.name).available - srStats(a.name).available || (b.pct ?? 0) - (a.pct ?? 0));
  const th = (label, col, align = 'center', title = '') => `<th style="text-align:${align};" title="${title}">${label}</th>`;
  el.innerHTML = `
    <div class="item-head">
      <div style="font-family:'Cinzel',serif;font-size:17px;color:var(--gold-light);">${itemLinkHtml(itemKey)}</div>
      <div style="font-size:13px;">${classes.length ? classes.map(c => `<span style="color:${CLASS_COLORS[c]};">${c}</span>`).join(' · ') : '<span style="color:var(--text-dim);">All classes</span>'}</div>
    </div>
    ${it.notes ? `<div style="font-size:13px;color:var(--text-dim);font-style:italic;margin-bottom:8px;">${escHtml(it.notes)}</div>` : ''}
    ${srHtml}
    <div style="overflow-x:auto;margin-top:18px;"><table class="compact-table" style="width:100%;border-collapse:collapse;">${tableColgroup(true, !!gearSlots)}<thead>${tableHeadHtml(th, true, !!gearSlots)}</thead>
      <tbody>${others.map(p => playerRowHtml(p, lastRenderData.raids || [], { showRole: true, current: gearSlots ? currentGearHtml(p.name, gearSlots) : undefined, action: alreadyThisRaid.has(normalizeName(p.name)) ? '<span class="tag-ok">✓ awarded</span>' : assignBtn(p.name, false) })).join('')}</tbody>
    </table></div>`;
}

async function assignLoot(raidId, itemKey, playerName, sr) {
  const raid = getRaid(raidId);
  if (raid.status === 'past' && !confirm(`"${raid.name}" has ended. Add this award retroactively?`)) return;
  if (!confirm(`Award ${itemName(itemKey)} to ${playerName}${sr ? ' (won via SR)' : ''}?`)) return;
  raid.loot.push({ id: _uid('l_'), itemKey, name: itemName(itemKey), recipient: playerName, sr: !!sr, at: new Date().toISOString() });
  await saveRaids().catch(() => {});
  refreshAll();
}

function renderRaidLootLog(el, raid) {
  const res = raidReserves(raid);
  // Two lists: loot won through a soft reserve, and loot handed out MS > OS.
  // The ⇄ button moves an award to the other list if it was recorded wrong.
  const row = (l, i) => `<tr>
      <td>${itemLinkHtml(l.itemKey, l.name)}${!l.sr && res[normalizeName(l.recipient)]?.[l.itemKey] ? ' <span class="tag-warn" title="They reserved this item — was it an SR win?">reserved</span>' : ''}</td>
      <td>${playerNameHtml(l.recipient)}</td>
      <td style="text-align:right;white-space:nowrap;"><button class="ghost-btn write-gated-hide ll-move" onclick="toggleLootSr('${raid.id}', ${i})" title="${l.sr ? 'Move to MS > OS' : 'Move to SR'}">⇄ ${l.sr ? 'MS > OS' : 'SR'}</button>
        <button class="x-btn write-gated-hide" onclick="removeLoot('${raid.id}', ${i})" title="Remove">✕</button></td>
    </tr>`;
  const table = (title, sr) => {
    const list = raid.loot.map((l, i) => [l, i]).filter(([l]) => !!l.sr === sr);
    return `<div class="ll-block"><div class="ll-title">${title} <span style="color:var(--text-dim);">${list.length}</span></div>
      ${list.length ? `<table class="mini-table ll-table"><colgroup><col><col style="width:32%;"><col style="width:150px;"></colgroup><tbody>${list.map(([l, i]) => row(l, i)).join('')}</tbody></table>`
        : `<div class="gl-empty">None yet.</div>`}</div>`;
  };
  el.innerHTML = `
    ${table('SR', true)}
    ${table('MS &gt; OS', false)}
    <div class="write-gated-hide" style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;">
      <div id="llItem" style="position:relative;min-width:280px;flex:2;"></div>
      <div id="llWho" style="position:relative;min-width:160px;flex:1;"></div>
      <label class="chk"><input type="checkbox" id="llSr"> SR</label>
      <button class="small-gold-btn" onclick="addLootManual('${raid.id}')">+ ADD</button>
    </div>`;
  if (!writeToken) return;
  const itemVals = Object.entries(glossary.items).map(([k, it]) => ({ value: k, label: it.name })).sort((a, b) => a.label.localeCompare(b.label));
  buildAutocomplete({ container: document.getElementById('llItem'), inputId: 'llItemIn', placeholder: 'Item (from the glossary)', items: itemVals,
    onSelect: v => { const who = document.getElementById('llWhoIn')?.dataset.value; if (who && res[normalizeName(who)]?.[v.value]) document.getElementById('llSr').checked = true; } });
  buildAutocomplete({ container: document.getElementById('llWho'), inputId: 'llWhoIn', placeholder: 'Recipient', items: rosterData.players.map(p => p.name).sort(),
    renderOption: v => playerNameHtml(v.label),
    onSelect: v => { const ik = document.getElementById('llItemIn')?.dataset.value; if (ik && res[normalizeName(v.value)]?.[ik]) document.getElementById('llSr').checked = true; } });
}
async function addLootManual(raidId) {
  const raid = getRaid(raidId);
  const itemIn = document.getElementById('llItemIn'), whoIn = document.getElementById('llWhoIn');
  const itemKey = itemIn?.dataset.value, who = whoIn?.dataset.value || whoIn?.value.trim();
  if (!itemKey) { flash('Pick the item from the list (add it to the glossary first if it\'s missing).', 'error'); return; }
  if (!who) { flash('Pick a recipient.', 'error'); return; }
  raid.loot.push({ id: _uid('l_'), itemKey, name: itemName(itemKey), recipient: who, sr: document.getElementById('llSr').checked, at: new Date().toISOString() });
  await saveRaids().catch(() => {});
  refreshAll();
}
async function toggleLootSr(raidId, i) {
  const l = getRaid(raidId).loot[i]; if (!l) return;
  l.sr = !l.sr; await saveRaids().catch(() => {}); refreshAll();
}
async function removeLoot(raidId, i) {
  const raid = getRaid(raidId); const l = raid.loot[i]; if (!l) return;
  if (!confirm(`Remove ${l.name} → ${l.recipient}?`)) return;
  raid.loot.splice(i, 1); await saveRaids().catch(() => {}); refreshAll();
}

// ── Reserves ────────────────────────────────────────────────────
function renderRaidReserves(el, raid) {
  const sheetHtml = s => {
    const eff = Object.values(effectiveReserves(s)).sort((a, b) => a.name.localeCompare(b.name));
    const inst = s.instances.map(i => i.name).join(', ');
    return `<div class="sheet-card">
      <div class="sheet-head">
        <a href="https://softres.it/raid/${escHtml(s.code)}" target="_blank" rel="noopener" class="sheet-code">softres.it/raid/${escHtml(s.code)}</a>
        ${s.demo ? '<span class="tag-opt">demo</span>' : ''}
        <span style="color:var(--text-dim);font-size:13px;">${escHtml(inst || 'not synced yet')}${s.reserveLimit ? ` · limit ${s.reserveLimit}` : ''}${s.locked ? ' · 🔒 locked' : ''}</span>
        <span style="margin-left:auto;font-size:12px;color:${s.syncError ? C5 : 'var(--text-dim)'};" title="${escHtml(s.syncError || '')}">${s.syncError ? '⚠ sync failed ' + fmtAgo(s.syncErrorAt) : 'synced ' + fmtAgo(s.syncedAt)}</span>
        <span class="write-gated-hide" style="display:flex;gap:6px;">
          <button class="ghost-btn" onclick="refreshSheet('${raid.id}','${s.id}')" ${s.demo ? 'disabled title="Demo sheet"' : ''}>↻ Refresh</button>
          <button class="ghost-btn danger" onclick="removeSheet('${raid.id}','${s.id}')">Remove</button>
        </span>
      </div>
      ${s.syncError ? `<div class="warn-banner">${escHtml(s.syncError)}</div>` : ''}
      ${s.hidden ? `<div class="warn-banner">This softres raid hides reserves from non-managers, so the list may be empty.</div>` : ''}
      <table class="mini-table"><thead><tr><th>Character</th><th>Reserves</th><th>SRs</th><th></th></tr></thead><tbody>
      ${eff.map(r => {
        const rp = rosterPlayer(r.key);
        const counts = {}; r.items.forEach(id => counts[id] = (counts[id] || 0) + 1);
        const ev = rp ? srStats(rp.name).events.find(e => e.raidId === raid.id) : null;
        return `<tr class="${ev?.over ? 'row-over' : ''}">
          <td>${playerNameHtml(r.name)}${rp || !writeToken ? '' : ' <span class="tag-warn">not on roster</span>'}${r.edited ? ' <span class="tag-opt" title="Edited by hand — softres changes for this character are ignored until reverted">edited</span>' : ''}</td>
          <td><div class="loot-list">${Object.entries(counts).map(([id, c]) => `<span class="loot-item res-chip">${itemLinkHtml(itemKeyFor(+id))}${c > 1 ? ` <span class="sr-multi">×${c}</span>` : ''}<button class="x-btn write-gated-hide" onclick="editReserve('${raid.id}','${s.id}','${r.key}','remove',${id})" title="Remove one">✕</button></span>`).join('') || '<em class="no-loot">none</em>'}</div></td>
          <td>${rp && ev ? `${ev.over && writeToken ? `<span class="over-chip">⚠ ${ev.reserved}/${ev.reserved - ev.over}</span>` : `${ev.reserved} of ${ev.reserved + Math.max(0, ev.balance)}`}` : '—'}</td>
          <td style="white-space:nowrap;text-align:right;" class="write-gated-hide">
            <button class="ghost-btn" onclick="addReservePrompt('${raid.id}','${s.id}','${r.key}')">+ item</button>
            ${r.edited ? `<button class="ghost-btn" onclick="editReserve('${raid.id}','${s.id}','${r.key}','revert')">Revert</button>` : ''}
          </td></tr>`;
      }).join('') || '<tr><td colspan="4" class="gl-empty">No reserves yet.</td></tr>'}
      </tbody></table>
      <div class="write-gated-hide" style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap;">
        <div id="arWho_${s.id}" style="position:relative;min-width:160px;"></div>
        <div id="arItem_${s.id}" style="position:relative;min-width:260px;flex:1;"></div>

  el.innerHTML = `
    ${raid.softres.map(sheetHtml).join('')}
    <div class="write-gated-hide" style="margin-top:12px;">
      ${raid.softres.length
        ? `<details><summary class="subtle-link">+ Add another SR sheet</summary>
            <div style="display:flex;gap:8px;margin-top:8px;"><input id="addSheetUrl" class="gl-input" placeholder="softres.it link"><button class="small-gold-btn" onclick="addSheet('${raid.id}')">ADD</button></div></details>`
        : `<div class="sr-box empty">No softres sheet on this raid yet.
