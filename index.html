    const instItems = [...new Set(s.instances.flatMap(i => Object.values(glossary.raids[i.name] || {}).flat()))];
    const pool = (instItems.length ? instItems : Object.keys(glossary.items)).filter(k => itemWowheadId(k));
    buildAutocomplete({ container: document.getElementById('arWho_' + s.id), inputId: 'arWhoIn_' + s.id, placeholder: 'Character', items: rosterData.players.map(p => p.name).sort(), renderOption: v => playerNameHtml(v.label) });
    buildAutocomplete({ container: document.getElementById('arItem_' + s.id), inputId: 'arItemIn_' + s.id, placeholder: 'Item', items: pool.map(k => ({ value: k, label: itemName(k) })).sort((a, b) => a.label.localeCompare(b.label)) });
  }
}

async function addSheet(raidId) {
  const raid = getRaid(raidId);
  const code = softresCodeFromUrl(document.getElementById('addSheetUrl').value);
  if (!code) { alert('That doesn\'t look like a softres.it raid link.'); return; }
  if (raid.softres.some(s => s.code === code)) { alert('That sheet is already on this raid.'); return; }
  raid.softres.push({ id: _uid('s_'), code, url: `https://softres.it/raid/${code}`, addedAt: new Date().toISOString(), reserves: [], edits: {}, instances: [] });
  await saveRaids().catch(() => {});
  flash('Fetching softres…', 'loading');
  const r = await syncSoftres([raid]);
  flash(r.errors.length ? 'Softres sync failed — see below' : `Softres synced${r.imported.length ? ` · imported ${r.imported.map(i => i.raid).join(', ')} into the glossary` : ''}`, r.errors.length ? 'error' : 'success');
  refreshAll();
}
async function refreshSheet(raidId, sheetId) {
  const raid = getRaid(raidId); const s = raid.softres.find(x => x.id === sheetId);
  if (raid.status === 'past' && !confirm('This raid has ended — refreshing replaces its saved reserves with what softres shows now. Continue?')) return;
  flash('Fetching softres…', 'loading');
  try { await syncSoftresSheet(raid, s); await saveRaids(); flash('Softres synced'); }
  catch(e) { await saveRaids().catch(() => {}); flash('Softres sync failed: ' + e.message, 'error'); }
  refreshAll();
}
async function removeSheet(raidId, sheetId) {
  const raid = getRaid(raidId);
  if (!confirm('Remove this SR sheet and its saved reserves from the raid?')) return;
  raid.softres = raid.softres.filter(s => s.id !== sheetId);
  await saveRaids().catch(() => {}); refreshAll();
}
async function editReserve(raidId, sheetId, charKey, op, id) {
  const raid = getRaid(raidId); const s = raid.softres.find(x => x.id === sheetId);
  const cur = effectiveReserves(s)[charKey];
  if (op === 'revert') delete s.edits[charKey];
  else {
    const items = [...(cur?.items || [])];
    if (op === 'remove') { const i = items.indexOf(id); if (i >= 0) items.splice(i, 1); }
    if (op === 'add') items.push(id);
    s.edits[charKey] = { name: cur?.name || rosterPlayer(charKey)?.name || charKey, items, editedAt: new Date().toISOString() };
  }
  await saveRaids().catch(() => {}); refreshAll();
}
function addReservePrompt(raidId, sheetId, charKey) {
  const name = rosterPlayer(charKey)?.name || charKey;
  const w = document.getElementById('arWhoIn_' + sheetId); if (w) { w.value = name; w.dataset.value = name; }
  document.getElementById('arItemIn_' + sheetId)?.focus();
}
async function addReserveManual(raidId, sheetId) {
  const who = document.getElementById('arWhoIn_' + sheetId)?.value.trim();
  const ik = document.getElementById('arItemIn_' + sheetId)?.dataset.value;
  if (!who || !ik) { flash('Pick a character and an item.', 'error'); return; }
  const id = itemWowheadId(ik);
  if (!id) { flash('Only items with a Wowhead ID can be reserved.', 'error'); return; }
  await editReserve(raidId, sheetId, normalizeName(who), 'add', id);
}

// ── Attendance ──────────────────────────────────────────────────
const ATT_SOURCE_LABEL = { manual: 'Manual', cla: 'CLA', assumed: 'Assumed (active)', softres: 'From reserves' };
function renderRaidAttendance(el, raid) {
  const players = rosterData.players.filter(p => !rosterData.excluded?.includes(p.name))
    .sort((a, b) => ROLE_ORDER.indexOf(a.role) - ROLE_ORDER.indexOf(b.role) || (a.class || '').localeCompare(b.class || '') || a.name.localeCompare(b.name));
  const present = players.filter(p => attendanceOf(raid, normalizeName(p.name)).present).length;
  const basis = raidClaSet(raid) ? 'CLA' : raid.status === 'active' ? 'assumed: every active raider' : Object.keys(raid.attendance.overrides).length ? 'manual marks' : 'softres reserves';
  el.innerHTML = `<div style="display:flex;gap:12px;align-items:center;margin:6px 0 12px;flex-wrap:wrap;">
      <span style="font-family:'Cinzel',serif;color:var(--gold-light);">${present} present</span>
      <span style="color:var(--text-dim);font-size:13px;">Baseline: ${basis}. Tick boxes to override; overrides always win.</span>
    </div>
    <div class="att-grid">${players.map(p => {
      const k = normalizeName(p.name); const a = attendanceOf(raid, k);
      const ov = raid.attendance.overrides[k];
      return `<label class="att-tile ${a.present ? 'on' : ''} ${ov !== undefined ? 'ov' : ''}">
        <input type="checkbox" class="write-gated" ${a.present ? 'checked' : ''} onchange="setRaidAttendance('${raid.id}','${k}',this.checked)">
        <span>${playerNameHtml(p.name)}</span><span class="att-src">${ATT_SOURCE_LABEL[a.source] || a.source}</span>
        ${ov !== undefined ? `<button class="x-btn write-gated-hide" title="Clear override" onclick="event.preventDefault();setRaidAttendance('${raid.id}','${k}',null)">↺</button>` : ''}
      </label>`; }).join('')}</div>`;
}
let _attSaveTimer = null;
function setRaidAttendance(raidId, key, value) {
  const raid = getRaid(raidId);
  if (value === null) delete raid.attendance.overrides[key]; else raid.attendance.overrides[key] = !!value;
  invalidateDerived();
  clearTimeout(_attSaveTimer);
  _attSaveTimer = setTimeout(() => saveRaids().catch(() => {}), 700);
  refreshAll();
}

        <span class="write-gated-hide" style="margin-left:auto;display:flex;gap:6px;">
          ${sheet?.sheetId ? `<button class="ghost-btn" onclick="refetchRaidCla('${raid.id}')">↻ Re-fetch</button>` : ''}

        </span></div>

    <div class="gl-col-title">Attach the CLA ${raid.status === 'active' ? '(after the raid — this ends the raid)' : ''}</div>

        <input id="claUrlIn" class="gl-input" placeholder="Google Sheet URL">
        <input id="claGearGidIn" class="gl-input" placeholder="Issues GID">
        <input id="claBuffGidIn" class="gl-input" placeholder="Consumes GID">
        <input id="claListGidIn" class="gl-input" placeholder="Gear GID (optional)">
        <button class="small-gold-btn write-gated" onclick="attachRaidCla('${raid.id}')">ATTACH</button></div>`
      : `<textarea id="claPasteGearIn" class="gl-input" rows="3" placeholder="Paste the Gear Issues tab"></textarea>
         <textarea id="claPasteBuffIn" class="gl-input" rows="3" placeholder="Paste the Buff Consumables tab" style="margin-top:6px;"></textarea>
         <textarea id="claPasteListIn" class="gl-input" rows="3" placeholder="Paste the Gear Listing tab (optional)" style="margin-top:6px;"></textarea>
         <button class="small-gold-btn write-gated" style="margin-top:6px;" onclick="attachRaidCla('${raid.id}')">ATTACH</button>`}
  </div>`;
}

async function attachRaidCla(raidId) {
  const raid = getRaid(raidId);
  const label = raid.date; // CLA labels are the raid's ISO date
  if (claSheets.some(s => s.label === label)) { alert('A CLA with this date is already stored — remove it first.'); return; }
  if (raid.status === 'active' && !confirm('Attaching the CLA ends this raid and makes the CLA the source of attendance. Continue?')) return;
  let entry;
  if (ENABLE_APPS_SCRIPT) {
    const url = document.getElementById('claUrlIn').value.trim();
    const gearGid = document.getElementById('claGearGidIn').value.trim();
    const buffGid = document.getElementById('claBuffGidIn').value.trim();
    const gearListingGid = document.getElementById('claListGidIn').value.trim();
    const sheetId = extractSheetId(url);
    if (!sheetId || !gearGid || !buffGid) { alert('Need the Sheet URL, Issues GID and Consumes GID.'); return; }
    entry = { label, url, sheetId, gearGid, buffGid };
    if (gearListingGid) entry.gearListingGid = gearListingGid;
  } else {
    const g = document.getElementById('claPasteGearIn').value.trim(), b = document.getElementById('claPasteBuffIn').value.trim();
    const l = document.getElementById('claPasteListIn').value.trim();
    if (!g || !b) { alert('Paste the Gear Issues and Buff Consumables tabs.'); return; }
    entry = { label, csvGear: normalizeClaPaste(g), csvBuff: normalizeClaPaste(b) };
    if (l) entry.csvGearListing = normalizeClaPaste(l);
  }
  claSheets.push(entry);
  saveClaSheets();

  if (raid.status === 'active') { raid.status = 'past'; raid.endedAt = new Date().toISOString(); }
  flash('Reading CLA…', 'loading');

    flash('CLA attached, but no players were read from it — check the GIDs/paste and use Re-fetch.', 'error');
  } else flash(`CLA attached — ${claPlayersByLabel[label].size} players present`);

  await saveRaids().catch(() => {});

}
async function refetchRaidCla(raidId) {
  const raid = getRaid(raidId);
  delete _claStoredParsed[raid.claLabel];
  flash('Re-fetching CLA…', 'loading');
  await fetchData({ skipSoftres: true });
  refreshAll();
}
async function removeRaidCla(raidId) {
  const raid = getRaid(raidId);
  if (!confirm('Remove the CLA from this raid? Attendance falls back to manual marks / reserves, and its buff scores stop counting.')) return;
  const i = claSheets.findIndex(s => s.label === raid.claLabel);
  if (i >= 0) removeCla(i);
  raid.claLabel = null; raid.attendance.cla = [];
  await saveRaids().catch(() => {});
  await fetchData({ skipSoftres: true });
}

// After CLA data loads, copy each raid's CLA presence into the raid itself, so
// attendance survives even if the CLA sheet is later unreachable.
function bakeClaPresence() {
  let changed = false;
  for (const r of raidsData.raids) {
    const live = r.claLabel ? claPlayersByLabel[r.claLabel] : null;
    if (live && live.size) {
      const arr = [...live].sort();
      if (JSON.stringify(arr) !== JSON.stringify([...r.attendance.cla].sort())) { r.attendance.cla = arr; changed = true; }
    }
  }
  return changed;
}

// Item Glossary (v2: item records are shared across every boss that drops them)
// ═════════════════════════════════════════════════════════════════════════════
let _gl = { raid: '', boss: '', item: '' };
let _glDirty = false;

function _renameKey(obj, oldKey, newKey) { const o = {}; for (const [k, v] of Object.entries(obj)) o[k === oldKey ? newKey : k] = v; return o; }
function _moveKey(obj, key, dir) {
  const keys = Object.keys(obj), i = keys.indexOf(key), j = i + dir;
  if (i < 0 || j < 0 || j >= keys.length) return obj;
  [keys[i], keys[j]] = [keys[j], keys[i]];
  const o = {}; for (const k of keys) o[k] = obj[k]; return o;
}
async function _glCommit() { renderGlossaryPanel(); await saveGlossary().catch(() => {}); }

function glSelect(level, v) {
  if (_glDirty && !confirm('Discard unsaved item changes?')) return;
  _glDirty = false;
  if (level === 'raid') _gl = { raid: v, boss: Object.keys(glossary.raids[v] || {})[0] || '', item: '' };
  else if (level === 'boss') { _gl.boss = v; _gl.item = ''; }
  else _gl.item = v;
  renderGlossaryPanel();
}
function glAdd(level) {
  const input = document.getElementById('glAdd_' + level);
  let name = input?.value.trim(); if (!name) return;
  if (level === 'item') { const m = name.match(/item[=/](\d+)/i); if (m) name = m[1]; } // accept a Wowhead link
  if (level === 'raid') { if (glossary.raids[name]) return alert('Raid exists.'); glossary.raids[name] = {}; _gl = { raid: name, boss: '', item: '' }; }
  else if (level === 'boss') { const r = glossary.raids[_gl.raid]; if (r[name]) return alert('Boss exists.'); r[name] = []; _gl.boss = name; _gl.item = ''; }
  else {
    const list = glossary.raids[_gl.raid][_gl.boss];
    const asId = /^\d+$/.test(name) ? +name : null;
    const existing = Object.entries(glossary.items).find(([k, it]) => asId ? it.wowheadId === asId : normalizeName(it.name) === normalizeName(name));
    let key;
    if (existing) { key = existing[0]; }
    else { key = itemKeyFor(asId, name); glossary.items[key] = { name: asId ? `Item ${asId}` : name, wowheadId: asId, origin: 'manual', eligibleClasses: [], notes: '', icon: null }; }
    if (!list.includes(key)) list.push(key);
    _gl.item = key;
    if (asId && !existing) { // fill in name, slot, icon and classes from Wowhead
      _glCommit().then(() => enrichGlossaryItems([key])).then(() => _glCommit()).catch(() => {});
      return;
    }
  }
  _glCommit();
}
function glRename(level, old) {
  const nv = prompt(`Rename ${level}:`, level === 'item' ? itemName(old) : old)?.trim();
  if (!nv) return;
  if (level === 'raid') { if (glossary.raids[nv]) return alert('Raid exists.'); glossary.raids = _renameKey(glossary.raids, old, nv); if (_gl.raid === old) _gl.raid = nv; }
  else if (level === 'boss') { const r = glossary.raids[_gl.raid]; if (r[nv]) return alert('Boss exists.'); glossary.raids[_gl.raid] = _renameKey(r, old, nv); if (_gl.boss === old) _gl.boss = nv; }
  else { glossary.items[old].name = nv; for (const r of raidsData.raids) for (const l of r.loot) if (l.itemKey === old) l.name = nv; saveRaids().catch(() => {}); }
  _glCommit();
}
function glDelete(level, v) {
  if (level === 'raid') { if (!confirm(`Delete raid "${v}" from the glossary? (Loot history is kept.)`)) return; delete glossary.raids[v]; if (_gl.raid === v) _gl = { raid: '', boss: '', item: '' }; }
  else if (level === 'boss') { if (!confirm(`Delete boss "${v}"?`)) return; delete glossary.raids[_gl.raid][v]; if (_gl.boss === v) { _gl.boss = ''; _gl.item = ''; } }
  else {
    if (!confirm(`Remove ${itemName(v)} from ${_gl.boss}?`)) return;
    const list = glossary.raids[_gl.raid][_gl.boss]; list.splice(list.indexOf(v), 1);
    if (!itemSources(v).length) delete glossary.items[v];
    if (_gl.item === v) _gl.item = '';
  }
  _glCommit();
}
function glMove(level, v, dir) {
  if (level === 'raid') glossary.raids = _moveKey(glossary.raids, v, dir);
  else if (level === 'boss') glossary.raids[_gl.raid] = _moveKey(glossary.raids[_gl.raid], v, dir);
  else { const l = glossary.raids[_gl.raid][_gl.boss], i = l.indexOf(v), j = i + dir; if (i < 0 || j < 0 || j >= l.length) return; [l[i], l[j]] = [l[j], l[i]]; }
  _glCommit();
}
function glToggleClass(c) {
  const it = glossary.items[_gl.item]; if (!it) return;
  it.eligibleClasses ||= [];
  const i = it.eligibleClasses.indexOf(c);
  if (i >= 0) it.eligibleClasses.splice(i, 1); else it.eligibleClasses.push(c);

function glMarkDirty() { _glDirty = true; document.getElementById('glSaveBtn')?.classList.add('gloss-btn-ready'); }
async function glSaveItem() {
  const key = _gl.item, it = glossary.items[key]; if (!it) return;
  it.notes = document.getElementById('glNotes').value.trim();
  it.icon = document.getElementById('glIcon').value.trim().toLowerCase().replace(/\.jpg$/, '') || null;
  const idIn = document.getElementById('glWowheadId');
  if (idIn && !idIn.disabled) {
    const id = parseInt(idIn.value, 10);
    if (id > 0) {
      const newKey = itemKeyFor(id);
      if (glossary.items[newKey] && newKey !== key) return alert('Another glossary item already has that Wowhead ID.');
      it.wowheadId = id;
      // Re-key: glossary lists + every loot record that points at the old key
      glossary.items[newKey] = it; delete glossary.items[key];
      for (const bosses of Object.values(glossary.raids)) for (const list of Object.values(bosses)) { const i = list.indexOf(key); if (i >= 0) list[i] = newKey; }
      let touched = false;
      for (const r of raidsData.raids) for (const l of r.loot) if (l.itemKey === key) { l.itemKey = newKey; touched = true; }
      if (touched) saveRaids().catch(() => {});

  }
  _glDirty = false;
  await _glCommit();

// ── Merging (see "Merging hand-made glossary entries" in core) ──
let _glMerge = null; // { level, from, raid }
let _glSugg = [], _glBossOpts = [];
const _glWhere = k => itemSources(k).map(s => `${s.raid} → ${s.boss}`).join(', ');
const _glAwarded = k => raidsData.raids.reduce((n, r) => n + r.loot.filter(l => l.itemKey === k).length, 0);
function glStartMerge(level, v) {
  _glMerge = { level, from: v, raid: _gl.raid };
  renderGlossaryPanel();
  document.getElementById('glMergeBar')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function glMergeBarHtml() {
  const m = _glMerge; if (!m) return '';
  let what, picker;
  if (m.level === 'raid') {
    what = `raid <b>${escHtml(m.from)}</b>`;
    picker = `<select id="glMergeTo" class="roster-edit-sel">${Object.keys(glossary.raids).filter(r => r !== m.from).map(r => `<option value="${escHtml(r)}">${escHtml(r)}</option>`).join('')}</select>`;
  } else if (m.level === 'boss') {
    what = `boss <b>${escHtml(m.raid)} → ${escHtml(m.from)}</b>`;
    // Same raid first — that's almost always where the match is
    _glBossOpts = Object.entries(glossary.raids).flatMap(([r, bs]) => Object.keys(bs).filter(b => !(r === m.raid && b === m.from)).map(b => [r, b]))
      .sort((x, y) => (y[0] === m.raid) - (x[0] === m.raid));
    picker = `<select id="glMergeTo" class="roster-edit-sel">${_glBossOpts.map(([r, b], i) => `<option value="${i}">${escHtml(r)} → ${escHtml(b)}</option>`).join('')}</select>`;
  } else {
    const n = _glAwarded(m.from);
    what = `item <b>${escHtml(itemName(m.from))}</b>${n ? ` <span style="color:var(--text-dim);">(awarded ${n}×)</span>` : ''}`;
    picker = `<div id="glMergeTo" style="position:relative;min-width:300px;flex:1;"></div>`;
  }
  return `<div class="sheet-card gl-merge" id="glMergeBar">
    <div class="gl-col-title">Merge</div>
    <div class="gl-merge-row"><span>Merge ${what} into</span>${picker}
      <button class="small-gold-btn" onclick="glDoMerge()">MERGE</button><button class="ghost-btn" onclick="_glMerge=null;renderGlossaryPanel()">Cancel</button></div>
    <div class="nc-hint">${m.level === 'item' ? 'Every loot record for this item moves to the one you pick, and this entry is removed.'
      : m.level === 'boss' ? 'Its items move to the boss you pick, and this boss is removed.'
      : 'Its bosses move to the raid you pick (same-named bosses are combined), and this raid is removed.'}</div>
  </div>`;
}
async function glDoMerge() {
  const m = _glMerge; if (!m) return;
  let touched = 0, msg;
  if (m.level === 'raid') {
    const to = document.getElementById('glMergeTo')?.value; if (!to) return;
    if (!confirm(`Merge raid "${m.from}" into "${to}"?`)) return;
    touched = mergeRaidInto(m.from, to); _gl = { raid: to, boss: '', item: '' }; msg = `Merged ${m.from} into ${to}`;
  } else if (m.level === 'boss') {
    const [toRaid, toBoss] = _glBossOpts[+document.getElementById('glMergeTo')?.value] || []; if (!toBoss) return;
    if (!confirm(`Merge boss "${m.from}" into "${toRaid} → ${toBoss}"?`)) return;
    mergeBossInto(m.raid, m.from, toRaid, toBoss); _gl = { raid: toRaid, boss: toBoss, item: '' }; msg = `Merged ${m.from} into ${toBoss}`;
  } else {
    const to = document.getElementById('glMergeToIn')?.dataset.value;
    if (!to || !glossary.items[to]) { flash('Pick the item to merge into from the list.', 'error'); return; }
    const n = _glAwarded(m.from);
    if (!confirm(`Merge "${itemName(m.from)}" into "${itemName(to)}"?${n ? `\n${n} loot record${n === 1 ? '' : 's'} will move to it.` : ''}`)) return;
    touched = mergeItemInto(m.from, to); _gl.item = to; msg = `Merged into ${itemName(to)}${touched ? ` · ${touched} loot record${touched === 1 ? '' : 's'} updated` : ''}`;

}
async function glAfterMerge(touched, msg) {
  renderGlossaryPanel();
  await saveGlossary().catch(() => {});
  if (touched) await saveRaids().catch(() => {});
  flash(msg);
  refreshAll();
}
function glSuggestionsHtml() {
  _glSugg = glossaryMergeSuggestions();
  if (!_glSugg.length) return '';
  const row = (x, i) => {
    let from, to;
    if (x.level === 'item') {
      const n = _glAwarded(x.from);
      from = `${itemLinkHtml(x.from)} <span class="gl-sugg-meta">added by hand · ${escHtml(_glWhere(x.from) || 'no boss')}${n ? ` · awarded ${n}×` : ''}</span>`;
      to = `${itemLinkHtml(x.to)} <span class="gl-sugg-meta">SR sheet · ${escHtml(_glWhere(x.to))}</span>`;
    } else if (x.level === 'boss') {
      from = `${escHtml(x.from)} <span class="gl-sugg-meta">added by hand · ${glossary.raids[x.raid][x.from].length} item${glossary.raids[x.raid][x.from].length === 1 ? '' : 's'}</span>`;
      to = `${escHtml(x.to)} <span class="gl-sugg-meta">SR sheet · ${escHtml(x.raid)}</span>`;
    } else {
      from = `${escHtml(x.from)} <span class="gl-sugg-meta">added by hand</span>`;
      to = `${escHtml(x.to)} <span class="gl-sugg-meta">SR sheet</span>`;
    }
    return `<div class="gl-sugg"><span class="tag-opt">${x.level}</span><span class="gl-sugg-from">${from}</span><span class="gl-sugg-arrow">→</span><span class="gl-sugg-to">${to}</span>

  };
  return `<div class="sheet-card gl-suggest"><div class="gl-col-title">Possible matches <span style="color:var(--text-dim);">${_glSugg.length}</span>
      <span class="nc-hint">These were added by hand and look like entries from an SR sheet. Merging moves their loot history onto the SR sheet's entry.</span></div>
    ${_glSugg.map(row).join('')}</div>`;
}
async function glApplySuggestion(i) {
  const x = _glSugg[i]; if (!x) return;
  let touched = 0;
  if (x.level === 'raid') touched = mergeRaidInto(x.from, x.to);
  else if (x.level === 'boss') mergeBossInto(x.raid, x.from, x.raid, x.to);
  else touched = mergeItemInto(x.from, x.to);
  await glAfterMerge(touched, `Merged ${x.level === 'item' ? itemName(x.to) : x.from + ' → ' + x.to}${touched ? ` · ${touched} loot record${touched === 1 ? '' : 's'} updated` : ''}`);
}
async function glNotSame(i) {
  const x = _glSugg[i]; if (!x) return;
  (glossary.notSame ||= []).push(x.id);
  renderGlossaryPanel();
  await saveGlossary().catch(() => {});
}

function renderRulesPanel() {
  const panel = document.getElementById('rulesPanel'); if (!panel) return;
  const r = srRules;
  const tog = (id, on) => `<label class="switch"><input type="checkbox" id="${id}" ${on ? 'checked' : ''} onchange="rulesDirty()"><span></span></label>`;
  panel.innerHTML = `<div class="rules">
    <div class="section-title">SR Rules</div>
    <p class="rules-intro">SR balances are recalculated from the whole raid history every time the page loads, so changes here apply to <b>every</b> raid, past ones included.
      Nobody can end up below 0: if new rules mean someone spent more than they'd have earned, the extra is forgiven.</p>
    <div class="rule"><div class="rule-text"><b>Base SRs per raid attended</b><span>Every raider earns this for each raid they're present for.</span></div>
      <input id="ruPerRaid" type="number" min="0" step="1" class="gl-input rule-num" value="${r.perRaid}" oninput="rulesDirty()"></div>
    <div class="rule"><div class="rule-text"><b>Buff bonus</b><span>+1 SR on a raid where the raider's buff score (from the CLA) is at or above the threshold. Added once the CLA is attached.</span></div>
      <div class="rule-ctl">${tog('ruBuffOn', r.buff.enabled)}<input id="ruBuffTh" type="number" min="0" max="100" class="gl-input rule-num" value="${r.buff.threshold}" oninput="rulesDirty()"><span>%</span></div></div>
    <div class="rule"><div class="rule-text"><b>Attendance streak bonus</b><span>+1 SR on every Nth raid in a row (N, 2N, 3N…). Missing a regular raid resets the streak; optional raids never break it but count when attended.</span></div>
      <div class="rule-ctl">${tog('ruStreakOn', r.streak.enabled)}<span>every</span><input id="ruStreakN" type="number" min="1" class="gl-input rule-num" value="${r.streak.every}" oninput="rulesDirty()"><span>raids</span></div></div>
    <div class="rule"><div class="rule-text"><b>Bad luck protection</b><span>Each time a raider reserves an item and loses it to someone else, their roll for that item grows by this much (100 → 120 → 140…). Resets when they win it. Tracked per item.</span></div>
      <div class="rule-ctl">${tog('ruBlpOn', r.blp.enabled)}<span>+</span><input id="ruBlpStep" type="number" min="0" class="gl-input rule-num" value="${r.blp.step}" oninput="rulesDirty()"><span>per loss</span></div></div>
    <div style="display:flex;gap:8px;margin-top:18px;" class="write-gated-hide">
      <button id="ruSave" class="gloss-btn-saveable small-gold-btn" onclick="saveRulesFromForm()">SAVE RULES</button>
      <button class="ghost-btn" onclick="srRules=mergeRules(DEFAULT_SR_RULES);renderRulesPanel();rulesDirty()">Reset to defaults</button>
    </div>
    <div id="rulesPreview" class="rules-intro" style="margin-top:14px;"></div>
  </div>`;
}
function readRulesForm() {

}
function rulesDirty() {
  document.getElementById('ruSave')?.classList.add('gloss-btn-ready');

  const saved = srRules; srRules = readRulesForm(); invalidateDerived();
  const next = derived().ledger; srRules = saved; invalidateDerived();
  const cur = derived().ledger;
  const diffs = Object.keys(cur).map(k => ({ name: cur[k].name, a: cur[k].available, b: next[k]?.available ?? cur[k].available })).filter(d => d.a !== d.b);
  const el = document.getElementById('rulesPreview');
  if (el) el.innerHTML = diffs.length ? `<b>If saved:</b> ${diffs.slice(0, 30).map(d => `${playerNameHtml(d.name)} ${d.a} → <b>${d.b}</b>`).join(' · ')}${diffs.length > 30 ? ` · +${diffs.length - 30} more` : ''}` : 'No balances change with these settings.';
}

}

async function _putWf(filename, data) {
  const res = await fetch(`${_workerBase()}/${_kvKey(filename)}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Token': writeToken },
    body: JSON.stringify(data, null, 2),
  });
  if (!res.ok) throw new Error(`write ${_kvKey(filename)}: HTTP ${res.status} ${(await res.text()).slice(0, 200)}`);
}
const WF_KEYS = ['raids.json', 'roster.json', 'glossary.json', 'sr-rules.json', 'cla-sheets.json'];

function _raidArg(x) {
  if (!x) return activeRaids().slice(-1)[0] || sortedRaids().slice(-1)[0];
  const r = getRaid(x) || raidsData.raids.find(r => r.name.toLowerCase().includes(String(x).toLowerCase()));
  if (!r) throw new Error(`No raid matching "${x}" — try wfDebug.raids()`);
  return r;
}
function _playerArg(x) {
  const k = normalizeName(x || '');
  const p = rosterPlayer(k) || rosterData.players.find(p => normalizeName(p.name).startsWith(k));
  if (!p) throw new Error(`No roster player matching "${x}"`);
  return p;
}

// Demo data — Molten Core only: 8 past weekly raids (one optional, one ended without a
// CLA, the latest with an over-reserve, a double reserve and a pug). No active raid.
// Deterministic, so the same demo comes out every time.
// ═════════════════════════════════════════════════════════════════════════════
// A plausible Molten Core loadout for a class/role: best armor type they can wear in every
// armor slot, two rings, two trinkets, and a role-appropriate weapon set. Items the raider
// actually won in the demo take priority for their slot.
const DEMO_ARMOR_PREF = { Warrior: ['Plate','Mail','Leather','Cloth'], Paladin: ['Plate','Mail','Leather','Cloth'], Hunter: ['Mail','Leather','Cloth'],
  Shaman: ['Mail','Leather','Cloth'], Rogue: ['Leather','Cloth'], Druid: ['Leather','Cloth'], Mage: ['Cloth'], Priest: ['Cloth'], Warlock: ['Cloth'] };
const DEMO_WEAPONS = { // [main, off-hand?] and ranged options, by class+role (Wowhead IDs from MC)
  caster:   { sets: [[18842], [17103, 19142], [18878, 19142]], ranged: [17077] },
  healer:   { sets: [[17105, 19142], [18842]], ranged: [17077] },
  palheal:  { sets: [[17105, 17106]], ranged: [] },
  shamheal: { sets: [[17105, 17106]], ranged: [] },
  tank:     { sets: [[18832, 17066], [18805, 17106]], ranged: [17069, 17072] },
  paltank:  { sets: [[18832, 17066]], ranged: [] },
  bear:     { sets: [[17073], [18842]], ranged: [] },
  melee:    { sets: [[17076], [17104], [18822], [17074]], ranged: [17069, 17072] },
  rogue:    { sets: [[18832, 18805], [17071, 18816], [18203, 18832]], ranged: [17069, 17072] },
  hunter:   { sets: [[17074], [18822], [17104]], ranged: [17069, 17072] },
  enh:      { sets: [[17073], [17104]], ranged: [] },
  ret:      { sets: [[17076], [17073]], ranged: [] },
};
function demoWeaponKind(p) {
  const c = p.class, r = p.role;
  if (c === 'Rogue') return 'rogue';
  if (c === 'Hunter') return 'hunter';
  if (c === 'Paladin') return r === 'Healers' ? 'palheal' : r === 'Tanks' ? 'paltank' : 'ret';
  if (c === 'Shaman') return r === 'Healers' ? 'shamheal' : r === 'Physical DPS' ? 'enh' : 'caster';
  if (c === 'Druid') return r === 'Healers' ? 'healer' : r === 'Ranged DPS' ? 'caster' : 'bear';
  if (c === 'Warrior') return r === 'Tanks' ? 'tank' : 'melee';
  if (c === 'Priest') return r === 'Healers' ? 'healer' : 'caster';
  return 'caster';
}
function demoGearFor(p, wonKeys) {
  const mcKeys = [...new Set(Object.values(glossary.raids['Molten Core'] || {}).flat())];
  const canWear = k => { const e = glossary.items[k]?.eligibleClasses || []; return !e.length || e.includes(p.class); };
  const h = [...normalizeName(p.name)].reduce((a, ch) => a * 31 + ch.charCodeAt(0) >>> 0, 7); // stable per player
  const choose = list => list.length ? list[h % list.length] : null;
  const pref = DEMO_ARMOR_PREF[p.class] || ['Cloth'];
  const out = {};
  const ARMOR = { Head: 'Head', Neck: 'Neck', Shoulder: 'Shoulders', Back: 'Cloak', Chest: 'Chest', Wrist: 'Bracers', Hands: 'Hands', Waist: 'Waist', Legs: 'Legs', Feet: 'Feet' };
  for (const [slot, gearSlot] of Object.entries(ARMOR)) {
    const cands = mcKeys.filter(k => glossary.items[k].slot === slot && canWear(k));
    const mine = wonKeys.filter(k => cands.includes(k));
    let pickK = mine[mine.length - 1];
    if (!pickK) for (const t of [...pref, '']) { const c = cands.filter(k => (glossary.items[k].armorType || '') === t); if (c.length) { pickK = choose(c); break; } }
    if (!pickK) pickK = choose(cands);
    if (pickK) out[gearSlot] = glossary.items[pickK].name;
  }
  for (const [slot, a, b] of [['Finger', 'Ring1', 'Ring2'], ['Trinket', 'Trinket1', 'Trinket2']]) {
    const cands = mcKeys.filter(k => glossary.items[k].slot === slot && canWear(k));
    const mine = wonKeys.filter(k => cands.includes(k));
    const picked = [...new Set([...mine.reverse(), choose(cands), cands[(h + 1) % Math.max(1, cands.length)]].filter(Boolean))].slice(0, 2);
    if (picked[0]) out[a] = glossary.items[picked[0]].name;
    if (picked[1]) out[b] = glossary.items[picked[1]].name;
  }
  const w = DEMO_WEAPONS[demoWeaponKind(p)];
  const set = choose(w.sets) || [];
  if (set[0]) out['Weapon'] = itemName('id:' + set[0]);
  if (set[1]) out['Off-Hand'] = itemName('id:' + set[1]);
  const rng = choose(w.ranged); if (rng) out['Wand/Idol/Relic etc.'] = itemName('id:' + rng);
  return out;
}

async function generateDemoData({ overwrite = false } = {}) {
  if (!writeToken) { console.error('Save the write token first.'); return; }
  if ((rosterData.players.length || raidsData.raids.length) && !overwrite) {
    console.error('There is already data here. Use generateDemoData({ overwrite: true }) to replace it (or wipeAllData first).'); return;
  }
  if (!confirm(`Replace the data under "${KV_PREFIX}" with demo data?`)) return;
  let seed = 20260926; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const pick = a => a[Math.floor(rnd() * a.length)];

  // Raiders: real names/classes/roles from the LC dashboard (read-only), given WoW Forever
  // style surnames. Each raider's attendance odds come from their real recent LC attendance.
  const SURNAMES = ['Ashenvale','Brightblade','Stormwind','Thornhollow','Dawnforge','Ironbrand','Mistwalker','Frostmantle',
    'Emberheart','Grimshade','Silverleaf','Duskwhisper','Oakenshield','Ravencrest','Sunstrider','Gravemoor','Highpeak',
    'Wolfsbane','Starfall','Blackthorn','Stonehelm','Windrunner','Shadowmere','Goldmane','Nightbloom','Fjördmark','Kælgrim','Æstrand'];
  let base = [], gone = [], lcGear = {};
  try {
    const [lRoster, lAtt, lCla] = await Promise.all(['roster.json', 'attendance.json', 'cla-sheets.json'].map(k => fetch(`${_workerBase()}/${k}`, { cache: 'no-store' }).then(r => r.ok ? r.json() : null)));
    // Each raider's most recent gear from the LC dashboard's CLA gear listings
    const lParsed = Object.values(lCla?.parsed || {}).sort((a, b) => String(a.sheetDate || '').localeCompare(String(b.sheetDate || '')));
    for (const pd of lParsed) for (const [k, slots] of Object.entries(pd.gearListing || {})) if (slots && Object.keys(slots).length) lcGear[k] = slots;
    const recent = [...(lAtt?.raids || [])].sort((a, b) => a.date.localeCompare(b.date)).slice(-10);
    const present = (k, r) => lAtt.overrides?.[k]?.[r.date] ?? !!r.players?.[k];
    base = (lRoster?.players || []).filter(p => p.name && p.role && p.class && !p.isAlt).map(p => {
      const k = normalizeName(p.name);
      const n = recent.filter(r => present(k, r)).length;
      return { name: p.name, role: p.role, cls: p.class, rel: recent.length ? n / recent.length : 0.8 };
    });
    // Raiders who stopped showing up on the LC dashboard become the demo's inactive raiders
    gone = base.filter(p => p.rel === 0).slice(0, 2);
    base = base.filter(p => p.rel > 0).sort((a, b) => b.rel - a.rel).slice(0, 25);
    if (base.length) console.log(`Demo: using ${base.length} raiders from the LC dashboard roster.`);
  } catch(e) { console.warn('Demo: could not read the LC roster —', e.message); }
  if (base.length < 10) {
    base = [['Stonewall','Tanks','Warrior'],['Barkskin','Tanks','Druid'],['Aegis','Tanks','Paladin'],['Cleaver','Physical DPS','Warrior'],['Shiv','Physical DPS','Rogue'],
      ['Nightstep','Physical DPS','Rogue'],['Windfury','Physical DPS','Shaman'],['Claw','Physical DPS','Druid'],['Frostnova','Ranged DPS','Mage'],['Pyrelight','Ranged DPS','Mage'],
      ['Hexweaver','Ranged DPS','Warlock'],['Doomcall','Ranged DPS','Warlock'],['Deadeye','Ranged DPS','Hunter'],['Moonfire','Ranged DPS','Druid'],['Lightwell','Healers','Priest'],
      ['Mendwell','Healers','Priest'],['Chainheal','Healers','Shaman'],['Hollow','Healers','Paladin']].map(([name, role, cls]) => ({ name, role, cls, rel: 0.7 + rnd() * 0.3 }));
    console.log('Demo: using the built-in raider list.');
  }
  const used = new Set();
  if (gone.length < 2) gone = [...gone, ...[['Driftwood','Ranged DPS','Hunter'], ['Lapsed','Healers','Druid']].slice(0, 2 - gone.length).map(([name, role, cls]) => ({ name, role, cls, rel: 0 }))];
  const nActive = base.length;
  base = [...base, ...gone];
  const players = base.map((b, i) => {
    let sur; do { sur = pick(SURNAMES); } while (used.has(sur) && used.size < SURNAMES.length); used.add(sur);
    return { name: `${b.name.slice(0, 12)} ${sur.slice(0, 12)}`, role: b.role, class: b.cls, isAlt: false };
  });
  const reliab = base.map((b, i) => i >= nActive ? 0.9 : Math.max(0.35, Math.min(0.98, b.rel)));
  const stopAfter = base.map((b, i) => i >= nActive ? 3 : 99); // inactive raiders stop after the 3rd demo raid
  players[Math.min(8, players.length - 1)].srAdjustments = [{ date: '2026-08-20', delta: 2, note: 'Demo: carried over from a previous guild' }];
  // On softres, people type their names inconsistently — exercise the accent-agnostic matching.
  const softresName = (p, i) => i % 5 === 0 ? p.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/æ/gi, 'ae').replace(/ö/gi, 'o')
    : i % 7 === 0 ? p.name.replace(/a/, 'á') : p.name;
  const overReserver = players.find(p => p.role === 'Ranged DPS') || players[0];
  const doubleReserver = players.find(p => p.role === 'Physical DPS') || players[1];

  // Glossary via the real import path
  glossary = { raids: {}, items: {}, imported: {} };
  importInstanceToGlossary(DEMO_MC_INSTANCE);
  for (const [id, [type, icon]] of Object.entries(DEMO_MC_WOWHEAD)) applyWowheadInfo('id:' + id, { type, icon, classes: [] });
  rebuildItemIcons();
  const allItems = Object.keys(glossary.items);
  const forClass = cls => allItems.filter(k => { const e = glossary.items[k].eligibleClasses; return !e.length || e.includes(cls); });
  const contested = ['id:17063', 'id:17109']; // Band of Accuria, Choker of Enlightenment

  // Dates: 8 Tuesdays back from last Tuesday
  const today = todayMST();
  const d0 = new Date(today + 'T19:00:00Z');
  const lastTue = new Date(d0); lastTue.setUTCDate(d0.getUTCDate() - ((d0.getUTCDay() + 5) % 7 || 7));
  const dates = []; for (let i = 7; i >= 0; i--) { const d = new Date(lastTue); d.setUTCDate(lastTue.getUTCDate() - i * 7); dates.push(d.toISOString().slice(0, 10)); }

  const raids = [], clSheets = [], parsed = {};
  const budget = {}, wants = {};
  const bosses = DEMO_MC_INSTANCE.boss_order, bossItems = glossary.raids['Molten Core'];
  const bossPool = cls => [...new Set(bosses.flatMap(b => bossItems[b] || []))].filter(k => { const e = glossary.items[k].eligibleClasses; return !e.length || e.includes(cls); });
  const resolveDemoKey = n => players.map(p => normalizeName(p.name)).find(k => k === normalizeName(n)) || normalizeName(n);
  // A few raiders all start out chasing Band of Accuria, so bad luck protection shows up
  players.slice(0, 4).forEach(p => { wants[normalizeName(p.name)] = ['id:17063']; });
  dates.forEach((date, i) => {
    const optional = i === 5;
    const raid = normalizeRaid({ name: optional ? 'Molten Core (optional reclear)' : 'Molten Core', date, optional, status: 'past',
      createdAt: date + 'T01:00:00Z', endedAt: date + 'T06:00:00Z', softres: [], loot: [] });
    const present = players.filter((p, j) => i < stopAfter[j] && rnd() < (optional ? reliab[j] - 0.3 : reliab[j]));
    const presentKeys = present.map(p => normalizeName(p.name));
    // Reserves: each raider keeps reserving what they're chasing until they win it, and
    // fills any spare reserve with something new their class can use. One no-show reserves too.
    const reservers = [...present, ...players.filter(p => !present.includes(p) && i < stopAfter[players.indexOf(p)]).slice(0, 1)];
    const reserves = reservers.map(p => {
      const k = normalizeName(p.name);
      budget[k] = (budget[k] || 0) + (present.includes(p) ? 1 : 0);
      const n = Math.max(1, Math.min(budget[k], 2));
      const want = (wants[k] ||= []);
      const pool = bossPool(p.class).filter(x => !want.includes(x));
      while (want.length < n && pool.length) want.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
      const items = want.slice(0, n).map(x => +x.slice(3));
      if (present.includes(p)) budget[k] -= items.length;
      return { name: softresName(p, players.indexOf(p) + i), spec: null, items, note: '' };
    });
    raid.softres.push({ id: _uid('s_'), code: 'DEMO' + (i + 1), url: '', demo: true, instances: [{ slug: 'mc', name: 'Molten Core' }], reserveLimit: 2,
      reserves, edits: {}, syncedAt: date + 'T02:00:00Z' });
    // Loot: 2 items per boss, 3 from the last boss. A reserved item is favoured about half the time.
    const reservedBy = {};
    for (const r of reserves) { const rk = resolveDemoKey(r.name); if (presentKeys.includes(rk)) for (const id of new Set(r.items)) (reservedBy['id:' + id] ||= []).push(rk); }
    bosses.forEach((boss, bi) => {
      const table = [...(bossItems[boss] || [])];
      const nDrops = bi === bosses.length - 1 ? 3 : 2;
      for (let d = 0; d < nDrops && table.length; d++) {
        const reservedHere = table.filter(x => reservedBy[x]);
        const ik = reservedHere.length && rnd() < 0.5 ? pick(reservedHere) : pick(table);
        table.splice(table.indexOf(ik), 1);
        let winnerKey, sr;
        if (reservedBy[ik]) { winnerKey = pick(reservedBy[ik]); sr = true; }
        else {
          const elig = present.filter(p => { const e = glossary.items[ik].eligibleClasses; return !e.length || e.includes(p.class); });
          if (!elig.length) continue; // nobody can use it — sharded
          winnerKey = normalizeName(pick(elig).name); sr = false;
        }
        const winner = players.find(p => normalizeName(p.name) === winnerKey);
        raid.loot.push({ id: _uid('l_'), itemKey: ik, name: itemName(ik), recipient: winner.name, sr, at: date + 'T04:00:00Z' });
        if (wants[winnerKey]) wants[winnerKey] = wants[winnerKey].filter(x => x !== ik); // won it — stop chasing
      }
    });
    // CLA (all but raid 7, which was ended without one → attendance from reserves)
    if (i !== 6) {
      raid.claLabel = date; raid.attendance.cla = presentKeys;
      clSheets.push({ label: date, demo: true });
      const buffScores = {};
      for (const k of presentKeys) { const e = rnd() < 0.8 ? 100 : 50, f = rnd() < 0.8 ? 100 : 0, w = rnd() < 0.6 ? 100 : 0;
        buffScores[k] = { [date]: { total: Math.round((e + f + w) / 3), scrolls: rnd() < 0.5 ? 100 : 0, elixir: e, food: f, wepOil: w } }; }
      parsed[date] = { sheetDate: date + 'T12:00:00.000Z', claPresence: presentKeys, canonicalNames: {}, gearIssues: {}, latestIssues: {}, buffScores,
        gearListing: {} };
    }
    raids.push(raid);
  });
  // Everyone's current gear (on the last MC raid's CLA): a Molten Core piece in every slot
  // their class can wear — whatever they won themselves first, then a sensible pick.
  const lastCla = [...dates].reverse().find((d, idx) => parsed[d]);
  if (lastCla) {
    const won = {}; for (const r of raids) for (const l of r.loot) (won[normalizeName(l.recipient)] ||= []).push(l.itemKey);
    parsed[lastCla].gearListing = Object.fromEntries(players.map(p => [normalizeName(p.name), demoGearFor(p, won[normalizeName(p.name)] || [])]));

  // The most recent raid's sheet also shows the reserve warnings: one raider over-reserves,
  // one double-reserves, and a pug who isn't on the roster reserves too.

}

// Load pipeline
// ═════════════════════════════════════════════════════════════════════════════
async function fetchData(opts = {}) {
  fetchErrors.length = 0;
  resetProxyBreaker();
  setStatus('Summoning the scrolls...', 'loading');
  try {
    await fetchAllClaData();
    _storeParsedClaData();
    const claFailed = _claFailedLabels.size > 0 || _corsProxyTripped;
    if (_claNewlyParsed > 0 && writeToken && !claFailed) {
      saveClaSheetsToGitHub().catch(e => console.warn('CLA cache persist failed:', e.message));
      _claNewlyParsed = 0;
    }
    if (bakeClaPresence() && writeToken) await saveRaids().catch(() => {});
    refreshAll();
    const stamp = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const done = () => fetchErrors.length
      ? setStatus(`Updated at ${stamp()} — <span style="cursor:pointer;text-decoration:underline;" onclick="showErrors()">⚠ ${fetchErrors.length} warning(s) (click to view)</span>`, 'loading')
      : setStatus(`Updated at ${stamp()}`, 'success');
    done();
    // Officers pull fresh softres data for active raids; read-only visitors never hit softres.
    const toSync = activeRaids().filter(r => r.softres.some(s => !s.demo));
    if (!opts.skipSoftres && writeToken && toSync.length) {
      setStatus('Syncing softres…', 'loading');
      await syncSoftres(toSync);
      refreshAll();
      done();
    }
  } catch(e) {
    console.error(e);
    setStatus(`Failed to load data — ${e?.message}`, 'error');
    showErrors();
  }
}

}

<script type="text/plain" id="wcl-integration-disabled">
const ITEM_SHEET_ID = '1bt-0NVkheMGvWl2FgCcHZH86ZzQxIMuzK_cxPEAsr0A';
const ITEM_SHEET_GIDS = [170506057, 461402221, 1447687848, 962096481, 1520599598];
const WCL_CONFIG_FILE = 'wcl-config.json';
const DATA_DIR = 'data'; // subdirectory where non-config JSON files live

// ── Crypto helpers (AES-GCM via Web Crypto API) ──────────────────
async function deriveKey(password) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode(CF_WORKER_URL || 'dbs-lc-salt'), iterations: 100000, hash: 'SHA-256' },
    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}

async function encryptData(password, data) {
  const key = await deriveKey(password);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(data)));
  return { iv: Array.from(iv), data: Array.from(new Uint8Array(ciphertext)) };
}

async function decryptData(password, encrypted) {
  const key = await deriveKey(password);
  const iv = new Uint8Array(encrypted.iv);
  const data = new Uint8Array(encrypted.data);
  const dec = new TextDecoder();
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  return JSON.parse(dec.decode(plain));
}

// ── PKCE helpers ──────────────────────────────────────────────────
function generateRandomString(length = 64) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  const arr = crypto.getRandomValues(new Uint8Array(length));
  return Array.from(arr).map(b => chars[b % chars.length]).join('');
}

async function generateCodeChallenge(verifier) {
  const enc = new TextEncoder();
  const digest = await crypto.subtle.digest('SHA-256', enc.encode(verifier));
  return btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

async function startWclPkce() {
  const verifier = generateRandomString(64);
  const challenge = await generateCodeChallenge(verifier);
  localStorage.setItem('wclVerifier', verifier);
  const params = new URLSearchParams({
    client_id: WCL_CLIENT_ID,
    redirect_uri: WCL_REDIRECT_URI,
    response_type: 'code',
    code_challenge: challenge,
    code_challenge_method: 'S256',
    state: 'wclauth'
  });
  window.location.href = WCL_AUTH_URL + '?' + params.toString();
}

async function exchangeWclCode(code) {
  const verifier = localStorage.getItem('wclVerifier');
  if (!verifier) { console.warn('No PKCE verifier found in session'); return null; }
  // Route through Apps Script to avoid CORS on token endpoint
  // Encode all params as base64 JSON to keep URL short and avoid length issues
  const payload = btoa(JSON.stringify({
    grant_type: 'authorization_code',
    client_id: WCL_CLIENT_ID,
    redirect_uri: WCL_REDIRECT_URI,
    code,
    code_verifier: verifier
  }));
  const rawUrl = APPS_SCRIPT + '?action=wclAuth&payload=' + encodeURIComponent(payload);
  try {
    // Must go through corsproxy — Apps Script redirects through googleusercontent.com which has no CORS headers
    const text = await appsScriptFetch(rawUrl);
    let data;
    try { data = JSON.parse(text); } catch(e) { console.warn('Token parse error:', text); return null; }
    if (data.error) { console.warn('Token exchange error:', data); return null; }
    localStorage.removeItem('wclVerifier');
    return data;
  } catch(e) { console.warn('Token exchange failed:', e.message); return null; }
}

async function handleWclCallback() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('state') !== 'wclauth' || !params.get('code')) return false;
  setWclStatus('Exchanging auth code...', '');
  const data = await exchangeWclCode(params.get('code'));
  // Clean URL
  window.history.replaceState({}, document.title, window.location.pathname);
  if (!data?.access_token) { setWclStatus('Auth failed — try again.', 'error'); return false; }
  wclToken = data.access_token;
  wclTokenExpiry = Date.now() + ((data.expires_in || 3600) - 60) * 1000;
  sessionStorage.setItem('wclToken', wclToken);
  sessionStorage.setItem('wclTokenExpiry', String(wclTokenExpiry));
  // Also persist to localStorage so token survives page reload
  localStorage.setItem('wclToken', wclToken);
  localStorage.setItem('wclTokenExpiry', String(wclTokenExpiry));
  setWclStatus('✓ Connected to WarcraftLogs!', 'success');
  return true; // fetchWclAllStars will be called after fetchData() completes
}

let WCL_CLIENT_ID = 'a1577bef-44fb-4fb3-87f6-555c24400a38';
let WCL_ZONE_ID = 1048;        // TBC Classic zone — override via config.json wcl_zone_id
let WCL_GAME_SLUG = 'tbc-classic'; // WCL game version slug
let WCL_API_URL = 'https://classic.warcraftlogs.com/api/v2/client'; // Classic uses separate endpoint
const WCL_REDIRECT_URI = window.location.origin + window.location.pathname.replace(/[^/]*$/, '');
let WCL_REALM = 'dreamscythe';
const WCL_AUTH_URL = 'https://www.warcraftlogs.com/oauth/authorize';
const WCL_TOKEN_URL = 'https://www.warcraftlogs.com/oauth/token';
const WCL_REGION = 'US';
let wclToken = null;
let wclTokenExpiry = 0;
let wclData = {}; // normalized name -> { points, rank, outOf }

async function saveWclConfigToGitHub(password, clientId, clientSecret, realm) {
  if (!writeToken) { setWclStatus('Write token required to save credentials.', 'error'); return; }
  try {
    const encrypted = await encryptData(password, { clientId, clientSecret, realm });
    const _wbase = (u => u.startsWith('http') ? u : 'https://' + u)(CF_WORKER_URL.trim().replace(/\/+$/, ''));
    const putRes = await fetch(`${_wbase}/${WCL_CONFIG_FILE}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Token': writeToken },
      body: JSON.stringify(encrypted, null, 2),
    });
    if (putRes.ok) {
      setWclStatus('✓ Credentials encrypted and saved!', 'success');
    } else {
      setWclStatus('Failed to save to GitHub — check your GitHub token.', 'error');
    }
  } catch(e) {
    setWclStatus(`Encryption error: ${e.message}`, 'error');
  }
}

async function loadWclConfigFromRepo(password) {
  try {
    let encrypted;
    try { encrypted = await fetchFromWorker('wcl-config.json'); } catch(e) { return false; }
    const config = await decryptData(password, encrypted);
    if (!config.clientId || !config.clientSecret || !config.realm) return false;
    sessionStorage.setItem('wclClientId', config.clientId);
    sessionStorage.setItem('wclClientSecret', config.clientSecret);
    sessionStorage.setItem('wclRealm', config.realm);
    return config;
  } catch(e) {
    return false; // wrong password or no file
  }
}

function setWclStatus(msg, type = '') {
  const el = document.getElementById('wclStatus');
  if (el) { el.textContent = msg; el.style.color = type === 'error' ? 'var(--red)' : type === 'success' ? '#4caa6e' : 'var(--text-dim)'; }
  const topBtn = document.getElementById('wclConnectTopBtn');
  const connectedLabel = document.getElementById('wclConnectedLabel');
  const connected = type === 'success';
  if (topBtn) topBtn.style.display = connected ? 'none' : '';
  if (connectedLabel) connectedLabel.style.display = connected ? '' : 'none';
  // Clear status text when connected — label handles it
  if (connected && el) el.textContent = '';
  document.body.classList.toggle('wcl-hidden', !connected);
}

async function getWclToken() {
  // Check in-memory token
  if (wclToken && Date.now() < wclTokenExpiry) return wclToken;
  // Check sessionStorage first (survives PKCE redirect within same tab)
  let stored = sessionStorage.getItem('wclToken');
  let storedExpiry = parseInt(sessionStorage.getItem('wclTokenExpiry') || '0');
  // Fall back to localStorage (persists across page loads and tab closes)
  if (!stored || Date.now() >= storedExpiry) {
    stored = localStorage.getItem('wclToken');
    storedExpiry = parseInt(localStorage.getItem('wclTokenExpiry') || '0');
  }
  if (stored && Date.now() < storedExpiry) {
    wclToken = stored;
    wclTokenExpiry = storedExpiry;
    return wclToken;
  }
  return null; // Need to re-authenticate via PKCE
}
async function wclFetch(url) {
  // Apps Script redirects to googleusercontent.com — fetch the redirect target directly
  const res = await fetch(url, { redirect: 'follow' });
  return res;
}

async function wclGraphQL(query, token) {
  const q = btoa(unescape(encodeURIComponent(query)));
  const rawUrl = APPS_SCRIPT + '?action=wclQuery&q=' + encodeURIComponent(q) + '&token=' + encodeURIComponent(token);
  // Must go through corsproxy — Apps Script redirects through googleusercontent.com which has no CORS headers
  const text = await appsScriptFetch(rawUrl);
  if (text.trimStart().startsWith('<')) throw new Error('Apps Script returned HTML — check deployment');
  return JSON.parse(text);
}

async function fetchWclAllStars(realm) {
  if (!ENABLE_WCL) return;
  const token = await getWclToken();
  if (!token) {
    // Token expired or missing — show connect button, hide column, clear spinners
    setWclStatus('Not connected', '');
    if (lastRenderData?.roles) {
      lastRenderData.roles.flatMap(r => r.players).forEach(p => {
        if (p.name) updateWclCell(normalizeName(p.name), null);
      });
    }
    return;
  }
  try {

    // Build player list with their role for metric selection
    // Include ALL named players (even pct===null / inactive with no CLA) so spinners get resolved
    const players = lastRenderData.roles.flatMap(r =>
      r.players.filter(p => p.name).map(p => ({ ...p, roleName: r.name }))
    );
    console.log('Fetching WCL for', players.length, 'players');
    // Process in batches of 5 to avoid rate-limiting proxies
    const BATCH_SIZE = 3;
    for (let i = 0; i < players.length; i += BATCH_SIZE) {
      const batch = players.slice(i, i + BATCH_SIZE);
      await Promise.all(batch.map(async p => {
        // Use canonical name from CLA if available, otherwise fall back to display name
        const wclName = canonicalNames[normalizeName(p.name)] || p.name;
        const isHealer = p.roleName === 'Healers';
        const metric = isHealer ? 'hps' : 'dps';
        const charQuery = `{
          characterData {
            character(name: "${wclName}", serverSlug: "${realm}", serverRegion: "${WCL_REGION}") {
              zoneRankings(zoneID: ${WCL_ZONE_ID}, metric: ${metric})
            }
          }
        }`;
        try {
          const charData = await wclGraphQL(charQuery, token).catch(e => {
            console.warn('Char query failed for', wclName, e);
            updateWclCell(normalizeName(p.name), null, wclName);
            return null;
          });
          if (!charData) { wclData[normalizeName(p.name)] = null; updateWclCell(normalizeName(p.name), null); return; }
          const char = charData?.data?.characterData?.character;
          const rankings = char?.zoneRankings;
          if (!rankings) { console.warn('No rankings for', p.name, JSON.stringify(charData)?.slice(0, 200)); wclData[normalizeName(p.name)] = null; updateWclCell(normalizeName(p.name), null); return; }
          const key = normalizeName(p.name);
          const entry = {
            points: rankings.allStars?.[0]?.points ?? null,
            rank: rankings.allStars?.[0]?.rank ?? null,
            outOf: rankings.allStars?.[0]?.total ?? null,
            bestPerf: rankings.bestPerformanceAverage ?? null,
            medianPerf: rankings.medianPerformanceAverage ?? null,
          };
          // Sycamoore one-off: use best parse as median (healer median unreliable)
          if (normalizeName(wclName) === 'sycamoore' && entry.bestPerf !== null) {
            entry.medianPerf = entry.bestPerf;
          }
          wclData[key] = entry;
          updateWclCell(key, entry);
        } catch(e) { console.warn('WCL char error for', p.name, e); wclData[normalizeName(p.name)] = null; updateWclCell(normalizeName(p.name), null); }
      }));
      // Small delay between batches to avoid rate limiting
      if (i + BATCH_SIZE < players.length) await new Promise(r => setTimeout(r, 500));
    }

    // Ensure ALL players with spinners get a dash (including those skipped due to pct===null)
    // Mark any unresolved players as null so re-render shows — not spinner
    lastRenderData.roles.flatMap(r => r.players).forEach(p => {
      const key = normalizeName(p.name);
      if (!wclData.hasOwnProperty(key)) wclData[key] = null;
    });

    // Final re-render to update sort order if sorted by WCL (skip if in loot view)
    if (lastRenderData.roles.length && groupingMode !== 'loot') render(lastRenderData);
  } catch(e) {
    console.warn('WCL fetch failed:', e.message);
    lastRenderData.roles.flatMap(r => r.players).forEach(p => {
      wclData[normalizeName(p.name)] = null;
    });
    if (lastRenderData.roles.length && groupingMode !== 'loot') render(lastRenderData);
  }
}

function wclCellHtml(wcl, playerName) {
  const wclName = (playerName ? (canonicalNames[normalizeName(playerName)] || playerName) : '').toLowerCase();
  const href = wclName ? `https://fresh.warcraftlogs.com/character/us/dreamscythe/${encodeURIComponent(wclName)}` : null;
  const link = (inner, style) => href
    ? `<a href="${href}" target="_blank" rel="noopener" style="text-decoration:none;${style}">${inner}</a>`
    : `<span style="${style}">${inner}</span>`;
  if (wcl === null) return link('—', 'color:var(--text-dim);font-size:11px;'); // explicit failure
  if (!wcl || wcl.medianPerf === null || wcl.medianPerf === undefined) return link('—', 'color:var(--text-dim);font-size:11px;');
  const col = wclColor(wcl.medianPerf);
  return link(`${Math.round(wcl.medianPerf)}%`, `color:${col};font-family:'Cinzel',serif;font-size:12px;font-weight:600;`);
}

function updateWclCell(key, entry, playerName) {
  const name = playerName || key;
  document.querySelectorAll(`[data-wcl-key="${key}"]`).forEach(td => {
    td.innerHTML = wclCellHtml(entry, name);
  });
}

function wclColor(pct) {
  if (pct === null) return 'var(--text-dim)';
  if (pct >= 99) return '#e268a8'; // pink
  if (pct >= 95) return '#ff8000'; // orange
  if (pct >= 75) return '#a335ee'; // purple
  if (pct >= 50) return '#0070ff'; // blue
  if (pct >= 25) return '#1eff00'; // green
  return '#666666'; // grey
}
